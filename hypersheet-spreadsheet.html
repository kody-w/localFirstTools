/* ---------- sorting ---------- */
function cmpVal(a,bb){ const an=typeof a==='number', bn=typeof bb==='number'; if((a===null||a===undefined||a==='')&&(bb===null||bb===undefined||bb==='')) return 0; if(a===null||a===undefined||a==='') return 1; if(bb===null||bb===undefined||bb==='') return -1; if(an&&bn) return a-bb; if(an) return -1; if(bn) return 1; return String(a).localeCompare(String(bb)); }
function sortRange(b, keyCols){ const s=sheet(); pushUndo('sort'); const rows=[]; for(let r=b.r1;r<=b.r2;r++){ const cr=[]; for(let c=b.c1;c<=b.c2;c++){ const cell=s.cells.get(HE.key(c,r)); cr.push({raw:cell?cell.raw:'', fmt:cell?cell.fmt:null, st:(s.styles&&s.styles.get(HE.key(c,r)))?JSON.parse(JSON.stringify(s.styles.get(HE.key(c,r)))):null, val:cellValue(s,c,r)}); } rows.push(cr); }
  rows.sort((A,B)=>{ for(const kc of keyCols){ const ki=kc.col-b.c1; const d=cmpVal(A[ki].val,B[ki].val)*(kc.asc?1:-1); if(d!==0) return d; } return 0; });
  for(let i=0;i<rows.length;i++){ const r=b.r1+i; for(let j=0;j<rows[i].length;j++){ const c=b.c1+j; model.setCell(s.name,c,r,rows[i][j].raw,{noRecalc:true}); const cc=s.cells.get(HE.key(c,r)); if(cc&&rows[i][j].fmt) cc.fmt=rows[i][j].fmt; if(rows[i][j].st){ if(!s.styles)s.styles=new Map(); s.styles.set(HE.key(c,r),rows[i][j].st);} else if(s.styles){ s.styles.delete(HE.key(c,r)); } } }
  model.recalcAll(); afterMutation(); }
function autoSortRange(){ let b=selBounds(); if(b.c1===b.c2&&b.r1===b.r2){ b=usedRangeAround(state.active.c,state.active.r); } return b; }
function usedRangeAround(c,r){ const s=sheet(); let c1=c,c2=c,r1=r,r2=r; const has=(cc,rr)=>{ const v=cellValue(s,cc,rr); return v!==null&&v!==undefined&&v!==''; }; while(c1>0&&has(c1-1,r)) c1--; while(c2<COLS-1&&has(c2+1,r)) c2++; while(r1>0&&has(c,r1-1)) r1--; while(r2<ROWS-1&&has(c,r2+1)) r2++; return {c1,r1,c2,r2}; }
function openSortDialog(){ let b=autoSortRange(); const body=`<div class="field"><label><input type="checkbox" id="sHdr" checked> My data has headers</label></div>
   <div id="sLevels"></div><button class="btn" id="sAdd" style="margin-top:6px">+ Add level</button>`;
  const md=openModal('Custom Sort', body, [ {label:'Cancel',act:closeModal}, {label:'Sort',primary:true,act:()=>{ const hdr=md.querySelector('#sHdr').checked; const lv=[...md.querySelectorAll('.sLevel')].map(el=>({col:+el.querySelector('.sCol').value, asc:el.querySelector('.sOrd').value==='asc'})); const rb={c1:b.c1,c2:b.c2,r1:hdr?b.r1+1:b.r1,r2:b.r2}; sortRange(rb,lv); closeModal(); } } ], false);
  const levels=md.querySelector('#sLevels'); function addLevel(){ const el=document.createElement('div'); el.className='sLevel row'; el.style.marginBottom='6px'; el.innerHTML=`<select class="sCol">${colOptions(b.c1,b.c2,b.c1)}</select><select class="sOrd"><option value="asc">A → Z</option><option value="desc">Z → A</option></select><span class="del" style="color:#c0392b;cursor:pointer;flex:none">✕</span>`; el.querySelector('.del').onclick=()=>el.remove(); levels.appendChild(el); }
  addLevel(); md.querySelector('#sAdd').onclick=addLevel; }

function toggleFilter(){ const s=sheet(); if(s.filter&&s.filter.active){ pushUndo('clear filter'); (s.filter.hidden||[]).forEach(r=>{ delete s.hiddenRows[r]; }); s.filter=null; invalidateOv(s); afterMutation(); } else { openFilterDialog(); } }

/* ---------- CSV / JSON import-export ---------- */
function csvEscape(v){ v=v==null?'':String(v); if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }

function parseCSV(text){ const rows=[]; let row=[], field='', inq=false; for(let i=0;i<text.length;i++){ const ch=text[i]; if(inq){ if(ch==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inq=false; } else field+=ch; } else { if(ch==='"') inq=true; else if(ch===','){ row.push(field); field=''; } else if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=''; } else if(ch==='\r'){} else field+=ch; } } if(field!==''||row.length){ row.push(field); rows.push(row); } return rows; }
function importCSVText(text){ const rows=parseCSV(text); pushUndo('import csv'); const ns=model.addSheet('Import'); rows.forEach((r,ri)=>r.forEach((v,ci)=>{ if(ci<COLS&&ri<ROWS) model.setCell(ns.name,ci,ri,v,{noRecalc:true}); })); model.recalcAll(); state.activeSheet=ns.name; setSelection(0,0,0,0,0,0); afterMutation(); toast('CSV imported'); }

function importJSONText(text){ try{ const data=JSON.parse(text); pushUndo('import json'); loadWorkbook(data); afterMutation(); toast('Workbook imported'); }catch(e){ toast('Invalid JSON'); } }
function importFile(kind){ const inp=document.createElement('input'); inp.type='file'; inp.accept=kind==='csv'?'.csv,text/csv':(kind==='xlsx'?'.xlsx':'.json,application/json'); inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const rd=new FileReader(); if(kind==='xlsx'){ rd.onload=()=>importXLSX(rd.result); rd.readAsArrayBuffer(f); return; } rd.onload=()=>{ if(kind==='csv') importCSVText(rd.result); else importJSONText(rd.result); }; rd.readAsText(f); }; inp.click(); }
function importXLSX(arrbuf){ loadFflate(fflate=>{ try{
  const files=fflate.unzipSync(new Uint8Array(arrbuf)); const dec=new TextDecoder();
  const read=(p)=>files[p]?dec.decode(files[p]):null;
  const DP=new DOMParser();

  let shared=[]; const ssx=read('xl/sharedStrings.xml'); if(ssx){ const sd=DP.parseFromString(ssx,'application/xml'); shared=[...sd.getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')); }
  // workbook + rels → ordered sheet name/target
  const wbx=read('xl/workbook.xml'); const relx=read('xl/_rels/workbook.xml.rels'); if(!wbx){ toast('Not a valid xlsx'); return; }

  const relMap={}; if(reld){ [...reld.getElementsByTagName('Relationship')].forEach(r=>{ relMap[r.getAttribute('Id')]=r.getAttribute('Target'); }); }
  const sheetDefs=[...wbd.getElementsByTagName('sheet')].map((sh,i)=>{ const rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'); let tgt=relMap[rid]||('worksheets/sheet'+(i+1)+'.xml'); if(tgt.indexOf('/')!==0) tgt='xl/'+tgt.replace(/^\/?xl\//,''); return {name:sh.getAttribute('name')||('Sheet'+(i+1)), path:tgt}; });

    });

function downloadFile(name,type,content){ const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),2000); }

/* ================================================================
 * Chunk E2 — data validation + conditional formatting

function rangeContains(rg,c,r){ return c>=rg.c1&&c<=rg.c2&&r>=rg.r1&&r<=rg.r2; }

  if(rule.type==='list'){ const vals=dvListValues(s,rule).map(x=>x.toLowerCase()); return {ok: vals.includes(String(raw).trim().toLowerCase()), msg:rule.errorMsg||('Value must be one of: '+dvListValues(s,rule).join(', '))}; }
  if(rule.type==='whole'||rule.type==='decimal'){ if(!isNum) return {ok:false,msg:rule.errorMsg||'Enter a number'}; if(rule.type==='whole'&&num!==Math.trunc(num)) return {ok:false,msg:rule.errorMsg||'Enter a whole number'}; const a=parseFloat(rule.a), b=parseFloat(rule.b); let ok=true; switch(rule.op){ case 'between': ok=num>=a&&num<=b; break; case 'notBetween': ok=num<a||num>b; break; case '>': ok=num>a; break; case '<': ok=num<a; break; case '>=': ok=num>=a; break; case '<=': ok=num<=a; break; case '=': ok=num===a; break; default: ok=true; } return {ok, msg:rule.errorMsg||'Number out of allowed range'}; }
  if(rule.type==='textLen'){ const L=String(raw).length; const a=parseFloat(rule.a),b=parseFloat(rule.b); let ok=true; switch(rule.op){ case 'between': ok=L>=a&&L<=b; break; case '<=': ok=L<=a; break; case '>=': ok=L>=a; break; default: ok=true; } return {ok,msg:rule.errorMsg||'Text length not allowed'}; }
  return {ok:true}; }

function openDataValidation(){ const b=selBounds(); const body=`<div class="field"><label>Allow</label><select id="dvType"><option value="list">List</option><option value="whole">Whole number</option><option value="decimal">Decimal</option><option value="textLen">Text length</option></select></div>

/* ---------- conditional formatting ---------- */
function cfStats(s,rule){ if(rule._tok===state._drawToken && rule._stats) return rule._stats; let mn=Infinity,mx=-Infinity,vals=[]; const rg=rule.range; for(let r=rg.r1;r<=rg.r2;r++) for(let c=rg.c1;c<=rg.c2;c++){ const v=cellValue(s,c,r); if(typeof v==='number'){ vals.push(v); if(v<mn)mn=v; if(v>mx)mx=v; } } rule._stats={mn,mx,vals}; rule._tok=state._drawToken; return rule._stats; }
function lerpColor(a,b,t){ const pa=hx(a), pb=hx(b); const r=Math.round(pa[0]+(pb[0]-pa[0])*t), g=Math.round(pa[1]+(pb[1]-pa[1])*t), bl=Math.round(pa[2]+(pb[2]-pa[2])*t); return `rgb(${r},${g},${bl})`; }
function hx(c){ c=c.replace('#',''); if(c.length===3) c=c.split('').map(x=>x+x).join(''); return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]; }

condOverrideFn=condOverride;
function cfEval(s,rule,c,r,v){ const t=rule.type;
  if(t==='colorscale'){ if(typeof v!=='number') return null; const st=cfStats(s,rule); if(!isFinite(st.mn)||st.mn===st.mx) return {bg:rule.colors?rule.colors[0]:'#63be7b'}; const p=(v-st.mn)/(st.mx-st.mn); const cols=rule.colors||['#f8696b','#ffeb84','#63be7b']; if(cols.length===3){ return {bg: p<0.5?lerpColor(cols[0],cols[1],p*2):lerpColor(cols[1],cols[2],(p-0.5)*2)}; } return {bg:lerpColor(cols[0],cols[1],p)}; }
  if(t==='databar'){ if(typeof v!=='number') return null; const st=cfStats(s,rule); const lo=Math.min(0,st.mn), hi=Math.max(0,st.mx); if(hi===lo) return null; const pct=(v-lo)/(hi-lo); return {bar:{color:rule.color||'#5b9bd5',pct:Math.max(0,Math.min(1,pct)),neg:v<0}}; }
  if(t==='iconset'){ if(typeof v!=='number') return null; const st=cfStats(s,rule); if(!isFinite(st.mn)) return null; const p=(v-st.mn)/((st.mx-st.mn)||1); const set=rule.icons||['🔴','🟡','🟢']; const ch=p>=0.67?set[2]:p>=0.34?set[1]:set[0]; return {icon:{ch}}; }

  let cond=false; const a=parseFloat(rule.a), b=parseFloat(rule.b); const num=typeof v==='number'?v:parseFloat(v);
  switch(t){ case 'greater': cond=num>a; break; case 'less': cond=num<a; break; case 'between': cond=num>=a&&num<=b; break; case 'equal': cond=(typeof v==='number'?num===a:String(v)===rule.a); break; case 'contains': cond=v!=null&&String(v).toLowerCase().includes(String(rule.a).toLowerCase()); break; case 'duplicate': { const st=cfStats(s,rule); cond=st.vals.filter(x=>x===v).length>1; break; } default: cond=false; }
  if(cond) return {bg:rule.bg||'#ffc7ce', color:rule.color||'#9c0006'}; return null; }
function openConditionalFormatting(){ const b=selBounds(); const body=`<div class="field"><label>Rule type</label><select id="cfType">

  const md=openModal('Conditional Formatting — '+A1(b.c1)+(b.r1+1)+':'+A1(b.c2)+(b.r2+1), body, [ {label:'Cancel',act:closeModal}, {label:'Clear Rules',act:()=>{ const s=sheet(); pushUndo('clear cf'); s.condFormats=(s.condFormats||[]).filter(rl=>!(rl.range.c1===b.c1&&rl.range.r1===b.r1&&rl.range.c2===b.c2&&rl.range.r2===b.r2)); afterMutation(); closeModal(); }}, {label:'Apply',primary:true,act:()=>{ const s=sheet(); pushUndo('cond format'); if(!s.condFormats)s.condFormats=[]; const type=md.querySelector('#cfType').value; const rule={ range:{c1:b.c1,r1:b.r1,c2:b.c2,r2:b.r2}, type, a:md.querySelector('#cfA').value, b:md.querySelector('#cfB').value, bg:md.querySelector('#cfBg').value, color:md.querySelector('#cfColor').value }; if(type==='databar') rule.color=md.querySelector('#cfBar').value; if(type==='colorscale') rule.colors=['#f8696b','#ffeb84','#63be7b']; if(type==='iconset') rule.icons=['🔴','🟡','🟢']; s.condFormats.push(rule); afterMutation(); closeModal(); } } ]);

function chartPlacement(s,rg,w,h){

  const wrap=document.getElementById('gridwrap'); const VWpx=(wrap?wrap.clientWidth:1200)-14;

}
function insertChart(type){ const s=sheet(); const b=selBounds(); let rg; if(b.c1===b.c2&&b.r1===b.r2){ rg=usedRangeAround(state.active.c,state.active.r); } else rg={c1:b.c1,r1:b.r1,c2:b.c2,r2:b.r2}; pushUndo('insert chart'); if(!s.charts)s.charts=[]; const id='ch'+Date.now()+Math.floor(Math.random()*1000); const W=430,H=290; const p=chartPlacement(s,rg,W,H); s.charts.push({id,type,range:rg,x:p.x,y:p.y,w:W,h:H,title:type.charAt(0).toUpperCase()+type.slice(1)+' Chart'}); state._chartsDirty=true; afterMutation(); toast('Chart inserted'); }

function drawChart(chart,canvas){ const s=model.getSheet(chart._sheet||state.activeSheet)||sheet(); const data=extractChartData(s,chart.range); const cx=canvas.getContext('2d'); const DPR=window.devicePixelRatio||1; const W=canvas.clientWidth,H=canvas.clientHeight; canvas.width=W*DPR; canvas.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); cx.clearRect(0,0,W,H); cx.fillStyle='#fff'; cx.fillRect(0,0,W,H);

function drawLegend(cx,W,H,items){ cx.textAlign='left'; cx.textBaseline='middle'; cx.font='10px '+FONT_STACK; let x=44,y=H-9; items.forEach(it=>{ const w=cx.measureText(it.name).width+22; if(x+w>W-6){ return; } cx.fillStyle=it.color; cx.fillRect(x,y-4,10,8); cx.fillStyle='#41474e'; cx.fillText(it.name,x+13,y); x+=w; }); }

  let rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
  sheets.forEach((s,i)=>{ rels+=`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`; }); rels+='</Relationships>'; parts['xl/_rels/workbook.xml.rels']=rels;
  sheets.forEach((s,i)=>{ parts['xl/worksheets/sheet'+(i+1)+'.xml']=sheetXml(s); });
  return parts; }
function loadFflate(cb){ if(window.fflate){ cb(window.fflate); return; } const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js'; sc.onload=()=>cb(window.fflate); sc.onerror=()=>{ toast('Offline: XLSX lib unavailable — exporting CSV'); exportCSV(); }; document.head.appendChild(sc); }
function exportXLSX(){ loadFflate(fflate=>{ try{ const parts=buildXlsxParts(); const enc=new TextEncoder(); const zipObj={}; Object.keys(parts).forEach(k=>{ zipObj[k]=enc.encode(parts[k]); }); const zipped=fflate.zipSync(zipObj,{level:6}); downloadBlob('hypersheet.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', zipped); toast('XLSX exported'); }catch(e){ console.error(e); toast('XLSX export failed'); } }); }
function downloadBlob(name,type,bytes){ const blob=new Blob([bytes],{type}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),2000); }

function boot(){ let loaded=false; try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const data=JSON.parse(raw); if(data&&data.sheets&&data.sheets.length){ loadWorkbook(data); loaded=true; } } }catch(e){ console.warn('load failed',e); }
  if(!loaded){ buildDemo(); }
  if(!state.activeSheet && model.sheets[0]) state.activeSheet=model.sheets[0].name;
  document.getElementById('overlay').style.display='none';
  wireInteractions(); wireRibbonTabs(); buildRibbon(); renderTabs(); layout(); render(); syncFormulaBar();
  toast('HyperSheet ready — try editing a cell, or press F1-free: just start typing');
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
