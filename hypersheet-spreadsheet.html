<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HyperSheet — a from-scratch spreadsheet with a real calc engine</title>
<meta name="description" content="HyperSheet: a self-contained, offline spreadsheet with a from-scratch formula engine (200+ Excel functions), canvas-rendered million-cell grid, dynamic arrays, charts, pivot tables, conditional formatting and XLSX/CSV/JSON export.">
<!-- spreadsheet, productivity, data, formulas, tables, business -->
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#1f2328; --muted:#6b7280; --line:#d7dae0;
  --line2:#e7e9ee; --accent:#137a4b; --accent2:#0f6b41; --accent-soft:#e5f3ec;
  --sel:#137a4b; --sel-fill:rgba(19,122,75,.10); --head:#f0f2f5; --headink:#41474e;
  --danger:#c0392b; --spill:#7c4dff; --active-tab:#137a4b;
  --font:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);font-size:13px;color:var(--ink);background:var(--bg);overflow:hidden;user-select:none}
button{font-family:inherit;font-size:12px}
.app{display:flex;flex-direction:column;height:100vh;width:100vw}
/* ---------- Ribbon ---------- */
.ribbon{background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.ribbon-tabs{display:flex;gap:2px;padding:4px 8px 0;background:var(--accent);align-items:center}
.ribbon-tabs .brand{color:#fff;font-weight:700;letter-spacing:.4px;margin-right:14px;font-size:14px;display:flex;align-items:center;gap:7px}
.ribbon-tabs .brand svg{width:18px;height:18px}
.rtab{color:#dff0e7;padding:5px 12px;cursor:pointer;border-radius:6px 6px 0 0;font-size:12.5px}
.rtab:hover{background:rgba(255,255,255,.12)}
.rtab.active{background:var(--panel);color:var(--accent2);font-weight:600}
.ribbon-body{display:flex;gap:0;padding:5px 6px;min-height:56px;align-items:stretch;overflow-x:auto}
.rgroup{display:flex;flex-direction:column;border-right:1px solid var(--line2);padding:0 8px;justify-content:space-between}
.rgroup-row{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.rgroup-label{font-size:10px;color:var(--muted);text-align:center;padding-top:3px}
.tbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;background:none;padding:4px 7px;border-radius:5px;cursor:pointer;color:var(--ink);white-space:nowrap}
.tbtn:hover{background:var(--accent-soft);border-color:#cfe3d8}
.tbtn.active{background:var(--accent-soft);border-color:var(--accent)}
.tbtn svg{width:15px;height:15px;fill:currentColor}
.tbtn.big{flex-direction:column;font-size:11px;padding:4px 9px}
.tbtn.big svg{width:19px;height:19px}
.tbtn.icon{padding:4px 6px}
.sep{width:1px;background:var(--line2);margin:2px 3px}
select,input[type=text],input[type=number]{font-family:inherit;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:3px 5px;background:#fff;color:var(--ink)}
select:focus,input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
/* ---------- Formula bar ---------- */
.fbar{display:flex;align-items:center;gap:6px;padding:3px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.namebox{width:120px;font-family:var(--mono);font-size:12px;text-align:left}
.fx{color:var(--muted);font-style:italic;font-weight:600;padding:0 4px}
.fwrap{position:relative;flex:1;display:flex}
#formulaInput{flex:1;font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:4px;padding:4px 7px;min-height:26px}
.fhighlight{position:absolute;left:8px;top:5px;font-family:var(--mono);font-size:13px;pointer-events:none;white-space:pre;color:transparent}
/* ---------- Grid ---------- */
.gridwrap{flex:1;position:relative;overflow:hidden;background:var(--panel)}
#grid{position:absolute;top:0;left:0;display:block}
#vscroll{position:absolute;top:0;right:0;width:14px;bottom:14px;overflow-y:scroll;overflow-x:hidden}
#vscroll>div{width:1px}
#hscroll{position:absolute;left:0;bottom:0;right:14px;height:14px;overflow-x:scroll;overflow-y:hidden}
#hscroll>div{height:1px}
.corner-sq{position:absolute;right:0;bottom:0;width:14px;height:14px;background:var(--head);border-left:1px solid var(--line);border-top:1px solid var(--line)}
#cellEditor{position:absolute;display:none;border:2px solid var(--accent);font-family:var(--mono);font-size:13px;padding:1px 3px;z-index:20;background:#fff;outline:none;overflow:hidden;white-space:pre;line-height:normal}
/* ---------- Autocomplete ---------- */
.acbox{position:absolute;z-index:60;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.16);max-height:240px;overflow:auto;min-width:280px;display:none}
.acitem{padding:5px 9px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.acitem .fn{font-family:var(--mono);font-weight:600;color:var(--accent2)}
.acitem .sig{font-size:11px;color:var(--muted)}
.acitem.sel{background:var(--accent-soft)}
/* ---------- Status bar ---------- */
.status{display:flex;align-items:center;gap:14px;padding:3px 10px;background:var(--head);border-top:1px solid var(--line);font-size:12px;color:var(--headink);flex:none}
.status .stat{font-variant-numeric:tabular-nums}
.status .spring{flex:1}
.status .zoom{display:flex;align-items:center;gap:5px}
/* ---------- Sheet tabs ---------- */
.tabs{display:flex;align-items:center;gap:2px;padding:2px 6px;background:var(--head);border-top:1px solid var(--line);flex:none;overflow-x:auto}
.tab{display:flex;align-items:center;gap:6px;padding:4px 12px;border:1px solid var(--line);border-bottom:none;border-radius:6px 6px 0 0;background:#e9ecf1;cursor:pointer;position:relative;white-space:nowrap}
.tab.active{background:#fff;font-weight:600;color:var(--accent2)}
.tab .swatch{width:9px;height:9px;border-radius:2px}
.tab .x{opacity:.4;font-size:11px;padding:0 2px;border-radius:3px}
.tab .x:hover{opacity:1;background:#0002}
.tab-add{padding:4px 9px;border:none;background:none;cursor:pointer;font-size:16px;color:var(--muted);border-radius:5px}
.tab-add:hover{background:#0001}
/* ---------- Context menu ---------- */
.ctx{position:fixed;z-index:100;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:4px;min-width:200px;display:none}
.ctx .ci{padding:6px 12px;border-radius:5px;cursor:pointer;display:flex;justify-content:space-between;gap:20px;align-items:center}
.ctx .ci:hover{background:var(--accent-soft)}
.ctx .ci .k{color:var(--muted);font-size:11px}
.ctx .sep{height:1px;background:var(--line2);margin:4px 6px}
.ctx .ci.danger{color:var(--danger)}
/* ---------- Modal dialogs ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,25,30,.35);z-index:200;display:none;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(680px,94vw);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:min(900px,96vw)}
.modal h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line2);font-size:15px;display:flex;justify-content:space-between;align-items:center}
.modal .body{padding:16px 18px;overflow:auto}
.modal .foot{padding:12px 18px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:8px}
.modal .x{cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
.btn{padding:7px 14px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:500}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent2)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-family:inherit;font-size:13px}
.row{display:flex;gap:12px}
.row>*{flex:1}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent2);font-size:11px;font-weight:600}
.list{border:1px solid var(--line);border-radius:8px;max-height:200px;overflow:auto}
.list .li{padding:7px 10px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center;gap:10px}
.list .li:last-child{border-bottom:none}
.list .li .del{color:var(--danger);cursor:pointer;font-size:12px}
table.grid-lite{border-collapse:collapse;width:100%;font-size:12px}
table.grid-lite th,table.grid-lite td{border:1px solid var(--line2);padding:4px 7px;text-align:left}
table.grid-lite th{background:var(--head)}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.swatches .sw{width:22px;height:22px;border-radius:5px;cursor:pointer;border:2px solid transparent}
.swatches .sw.sel{border-color:var(--ink)}
.dragfields{display:flex;flex-wrap:wrap;gap:5px;min-height:38px;border:1px dashed var(--line);border-radius:8px;padding:6px}
.chip{background:var(--accent-soft);color:var(--accent2);padding:3px 9px;border-radius:16px;font-size:12px;cursor:grab;display:inline-flex;gap:6px;align-items:center}
.chip .rm{cursor:pointer;opacity:.6}
.toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);background:#1f2328;color:#fff;padding:9px 16px;border-radius:8px;z-index:300;opacity:0;transition:opacity .2s;font-size:12.5px}
.toast.show{opacity:.96}
.help kbd{background:var(--head);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:11px}
.muted{color:var(--muted)}
#chartLayer{position:absolute;inset:0;pointer-events:none;z-index:15}
.floatchart{position:absolute;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.14);pointer-events:auto}
.floatchart .fc-head{display:flex;justify-content:space-between;align-items:center;padding:3px 8px;cursor:move;border-bottom:1px solid var(--line2);font-size:11px;font-weight:600}
.floatchart .fc-head .tools span{cursor:pointer;padding:0 4px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <div class="ribbon">
    <div class="ribbon-tabs" id="ribbonTabs">
      <div class="brand"><svg viewBox="0 0 24 24" fill="#fff"><path d="M3 3h18v18H3V3zm2 2v4h6V5H5zm8 0v4h6V5h-6zM5 11v4h6v-4H5zm8 0v4h6v-4h-6zM5 17v2h6v-2H5zm8 0v2h6v-2h-6z"/></svg>HyperSheet</div>
      <div class="rtab active" data-tab="home">Home</div>
      <div class="rtab" data-tab="insert">Insert</div>
      <div class="rtab" data-tab="data">Data</div>
      <div class="rtab" data-tab="formulas">Formulas</div>
      <div class="rtab" data-tab="view">View</div>
    </div>
    <div class="ribbon-body" id="ribbonBody"></div>
  </div>
  <div class="fbar">
    <input class="namebox" id="nameBox" title="Name box — type a cell/range/name and Enter to navigate" value="A1">
    <span class="fx">fx</span>
    <div class="fwrap">
      <div class="fhighlight" id="fHighlight"></div>
      <input id="formulaInput" spellcheck="false" autocomplete="off" placeholder="Enter a value or =formula">
    </div>
  </div>
  <div class="gridwrap" id="gridwrap">
    <canvas id="grid"></canvas>
    <canvas id="chartLayer"></canvas>
    <input id="cellEditor" spellcheck="false" autocomplete="off">
    <div id="vscroll"><div id="vspacer"></div></div>
    <div id="hscroll"><div id="hspacer"></div></div>
    <div class="corner-sq"></div>
    <div class="acbox" id="acbox"></div>
  </div>
  <div class="tabs" id="sheetTabs"></div>
  <div class="status">
    <span class="stat" id="statMode">Ready</span>
    <span class="spring"></span>
    <span class="stat" id="statSel"></span>
    <span class="zoom">Zoom <input type="range" id="zoom" min="60" max="200" value="100" style="width:110px"> <span id="zoomv">100%</span></span>
  </div>
</div>
<div class="ctx" id="ctxMenu"></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<script>
/* ================================================================
 * HyperSheet formula engine (self-contained, from scratch).
 * Exposes window.HyperEngine. Node-tested to 275 assertions.
 * ================================================================ */
/* HyperEngine — a from-scratch spreadsheet calculation engine.
 * Tokenizer + Pratt parser -> AST, evaluator, dependency graph, 200+ functions.
 * UMD: attaches to window.HyperEngine in browser, module.exports in node. */
(function (global) {
  'use strict';

  /* ============================ ERROR VALUES ============================ */
  function CellError(type) { this.type = type; }
  CellError.prototype.toString = function () { return this.type; };
  CellError.prototype.isError = true;
  var ERR = {
    DIV0: new CellError('#DIV/0!'),
    VALUE: new CellError('#VALUE!'),
    REF: new CellError('#REF!'),
    NAME: new CellError('#NAME?'),
    NA: new CellError('#N/A'),
    NUM: new CellError('#NUM!'),
    NULL: new CellError('#NULL!'),
    SPILL: new CellError('#SPILL!'),
    CALC: new CellError('#CALC!'),
    CIRC: new CellError('#CIRC!')
  };
  var ERR_BY_TEXT = {};
  Object.keys(ERR).forEach(function (k) { ERR_BY_TEXT[ERR[k].type] = ERR[k]; });
  function isErr(v) { return v instanceof CellError; }

  /* ============================ DATE SYSTEM ============================ */
  /* Excel 1900 date system. Serial 1 = 1900-01-01. Excel erroneously treats
   * 1900 as a leap year (serial 60 = the non-existent 1900-02-29). We REPLICATE
   * that bug for compatibility: for serials >= 61 we subtract one extra day so
   * dates line up with Excel. Epoch used: 1899-12-30 (== serial 0) in UTC. */
  var MS_PER_DAY = 86400000;
  var EXCEL_EPOCH = Date.UTC(1899, 11, 31); // 1899-12-31: realDays base; +1 shift applied for serial>=60 (phantom 1900-02-29)
  function serialToDate(serial) {
    var s = serial;
    if (s >= 60) s -= 0; // 60 maps to 1900-02-29 region; handled below
    // Because our epoch is 1899-12-30, serial 60 => 1900-02-28+... Excel shows 2/29.
    return new Date(EXCEL_EPOCH + Math.round(s * MS_PER_DAY));
  }
  function dateToSerial(y, m, d, hh, mm, ss) {
    var t = Date.UTC(y, m - 1, d, hh || 0, mm || 0, ss || 0);
    var serial = (t - EXCEL_EPOCH) / MS_PER_DAY;

    if (serial >= 60) serial += 1;
    return serial;
  }
  function serialParts(serial) {
    var whole = Math.floor(serial + 1e-9);
    var adj = whole;
    if (whole > 60) adj = whole - 1; // undo Excel phantom leap day for real calendar

    var d = new Date(EXCEL_EPOCH + adj * MS_PER_DAY);

  /* ============================ COERCION ============================ */
  var BLANK = null;
  function isBlank(v) { return v === null || v === undefined || v === ''; }
  function numClean(n) { // remove float noise
    if (!isFinite(n)) return n;
    var r = parseFloat(n.toPrecision(15));
    return Object.is(r, -0) ? 0 : r;
  }
  function toNum(v) {
    if (typeof v === 'number') return v;
    if (typeof v === 'boolean') return v ? 1 : 0;
    if (isBlank(v)) return 0;
    if (isErr(v)) return v;
    if (typeof v === 'string') {
      var s = v.trim();
      if (s === '') return 0;
      if (/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(s)) return parseFloat(s);

    }
    return ERR.VALUE;
  }
  function toStr(v) {
    if (v === true) return 'TRUE';
    if (v === false) return 'FALSE';
    if (isBlank(v)) return '';

    var m;
    // ISO / common formats

    if (m) return dateToSerial(+m[1], +m[2], +m[3], +(m[4]||0), +(m[5]||0), +(m[6]||0));
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:[ ](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);

  global.__HE = global.__HE || {};
  Object.assign(global.__HE, {
    CellError: CellError, ERR: ERR, ERR_BY_TEXT: ERR_BY_TEXT, isErr: isErr,
    MS_PER_DAY: MS_PER_DAY, EXCEL_EPOCH: EXCEL_EPOCH, serialToDate: serialToDate,
    dateToSerial: dateToSerial, serialParts: serialParts, timeParts: timeParts,

/* ============================ REFERENCES + TOKENIZER ============================ */
(function (global) {
  'use strict';
  var HE = global.__HE;
  var ERR = HE.ERR;

  function letterToCol(s) { var c = 0; s = s.toUpperCase(); for (var i = 0; i < s.length; i++) c = c * 26 + (s.charCodeAt(i) - 64); return c - 1; }

  function parseCol(t) { var m = t.match(/^(\$?)([A-Za-z]{1,3})$/); return { col: letterToCol(m[2]), abs: m[1] === '$' }; }
  function parseRow(t) { var m = t.match(/^(\$?)(\d+)$/); return { row: parseInt(m[2], 10) - 1, abs: m[1] === '$' }; }

  function splitSheetColon(spec) { // split "A:B" honoring quotes
    var out = [], cur = '', q = false;
    for (var i = 0; i < spec.length; i++) { var ch = spec[i]; if (ch === "'") { q = !q; cur += ch; } else if (ch === ':' && !q) { out.push(cur); cur = ''; } else cur += ch; }

  function unquoteSheet(s) { s = s.trim(); if (s[0] === "'" && s[s.length - 1] === "'") return s.slice(1, -1).replace(/''/g, "'"); return s; }

  function parseA1Part(a1) {
    var parts = a1.split(':');
    var cellRe = /^\$?[A-Za-z]{1,3}\$?\d+$/, colRe = /^\$?[A-Za-z]{1,3}$/, rowRe = /^\$?\d+$/;
    if (parts.length === 1) {
      if (!cellRe.test(parts[0])) return null;
      var c = parseCell(parts[0]);
      return { c1: c.col, r1: c.row, c1abs: c.colAbs, r1abs: c.rowAbs, c2: c.col, r2: c.row, c2abs: c.colAbs, r2abs: c.rowAbs, wholeCol: false, wholeRow: false };
    }
    var A = parts[0], B = parts[1];

    s.color=sd.color||null; s.frozenRows=sd.frozenRows||0; s.frozenCols=sd.frozenCols||0;
    s.colWidths=sd.colWidths||{}; s.rowHeights=sd.rowHeights||{}; s.hiddenCols=sd.hiddenCols||{}; s.hiddenRows=sd.hiddenRows||{};
    s.condFormats=sd.condFormats||[]; s.dataValidations=sd.dataValidations||[]; s.merges=sd.merges||[]; s.charts=sd.charts||[];
    s.styles=new Map(); (sd.styles||[]).forEach(([k,st])=>s.styles.set(Number(k),st));
    (sd.cells||[]).forEach(([k,raw,fmt])=>{ const c=Number(k); model.setCell(s.name, HE.keyCol(c), HE.keyRow(c), raw, {noRecalc:true}); const cell=s.cells.get(c); if(cell&&fmt) cell.fmt=fmt; });
    invalidateOv(s);
  });
  (data.names||[]).forEach(def=>{ model.names[def.name.toUpperCase()]=compileName(def); });
  model.recalcAll();
  state.activeSheet = data.active && model.getSheet(data.active) ? data.active : (model.sheets[0]&&model.sheets[0].name);
  if(data.sel) state.sel=Object.assign({c1:0,r1:0,c2:0,r2:0},data.sel);
  state.active={c:state.sel.c1,r:state.sel.r1}; state.ranges=[];
}

/* ---------- undo/redo ---------- */
const undoStack=[], redoStack=[]; let undoLabel='';

function undo(){ if(!undoStack.length){ toast('Nothing to undo'); return;} redoStack.push(JSON.stringify(serializeWorkbook())); loadWorkbook(JSON.parse(undoStack.pop())); afterMutation(); toast('Undo'); }

/* ================================================================
 * Chunk B — canvas grid renderer (virtualized, frozen panes)
 * ================================================================ */
const FONT_STACK="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif";
const C_GRID='#e4e7ec', C_HEAD='#f0f2f5', C_HEADINK='#41474e', C_HEADSEL='#d5e8dd',
      C_SEL='#137a4b', C_SELFILL='rgba(19,122,75,.10)', C_INK='#1f2328', C_ERR='#c0392b',
      C_SPILL='#7c4dff', C_HEADLINE='#c9ced6';
let VW=0,VH=0,dpr=1,ctx=null,cv=null,chartCtx=null;
let condOverrideFn=null;      // set by conditional-formatting chunk
let renderChartsFn=null;      // set by charts chunk
let validationBadgeFn=null;   // set by data-validation chunk
let mergeAtFn=null;           // set by merge feature: (s,c,r)->{ac,ar,c1,r1,c2,r2}|null

function fontStr(st){ let f=''; if(st&&st.italic) f+='italic '; if(st&&st.bold) f+='700 '; f+=(st&&st.fontSize?st.fontSize:13)+"px "+FONT_STACK; return f; }

function layout(){
  const wrap=document.getElementById('gridwrap');
  VW=wrap.clientWidth-14; VH=wrap.clientHeight-14;
  dpr=window.devicePixelRatio||1;
  cv=document.getElementById('grid');
  cv.width=Math.max(1,Math.floor(VW*dpr)); cv.height=Math.max(1,Math.floor(VH*dpr));
  cv.style.width=VW+'px'; cv.style.height=VH+'px';
  ctx=cv.getContext('2d');
  const cl=document.getElementById('chartLayer');
  cl.width=Math.max(1,Math.floor(VW*dpr)); cl.height=Math.max(1,Math.floor(VH*dpr));
  cl.style.width=VW+'px'; cl.style.height=VH+'px'; chartCtx=cl.getContext('2d');
  const s=sheet(); if(!s) return; const Z=state.zoom;
  document.getElementById('vspacer').style.height=Math.max(1,Math.round(totalH(s)*Z))+'px';
  document.getElementById('hspacer').style.width=Math.max(1,Math.round(totalW(s)*Z))+'px';
}

function sxCol(s,c){ return HDRW + colX(s,c) - (c<s.frozenCols?0:state.scroll.x); }
function syRow(s,r){ return HDRH + rowY(s,r) - (r<s.frozenRows?0:state.scroll.y); }
function colFromScreenX(s,cssX){ const bx=cssX/state.zoom; if(bx<HDRW) return -1; const fw=colX(s,s.frozenCols); let c; if(bx<HDRW+fw) c=colAtX(s,bx-HDRW); else c=colAtX(s,(bx-HDRW)+state.scroll.x); return Math.max(0,Math.min(COLS-1,c)); }
function rowFromScreenY(s,cssY){ const by=cssY/state.zoom; if(by<HDRH) return -1; const fh=rowY(s,s.frozenRows); let r; if(by<HDRH+fh) r=rowAtY(s,by-HDRH); else r=rowAtY(s,(by-HDRH)+state.scroll.y); return Math.max(0,Math.min(ROWS-1,r)); }
function pointToCell(cssX,cssY){ const s=sheet(); const bx=cssX/state.zoom, by=cssY/state.zoom;
  if(bx<HDRW && by<HDRH) return {type:'corner'};
  if(by<HDRH) return {type:'colheader', c:colFromScreenX(s,cssX)};
  if(bx<HDRW) return {type:'rowheader', r:rowFromScreenY(s,cssY)};
  return {type:'cell', c:colFromScreenX(s,cssX), r:rowFromScreenY(s,cssY)};
}

function computeCols(s, contentX0, screenX0, limitX){ let c=colAtX(s,contentX0); let sx=screenX0-(contentX0-colX(s,c)); const out=[]; let guard=0; while(c<COLS && sx<limitX && guard<5000){ const w=colW(s,c); if(w>0){ out.push({c,x:sx,w}); sx+=w; } c++; guard++; } return out; }
function computeRows(s, contentY0, screenY0, limitY){ let r=rowAtY(s,contentY0); let sy=screenY0-(contentY0-rowY(s,r)); const out=[]; let guard=0; while(r<ROWS && sy<limitY && guard<5000){ const h=rowH(s,r); if(h>0){ out.push({r,y:sy,h}); sy+=h; } r++; guard++; } return out; }

function drawCell(s,c,r,x,y,w,h){
  if(mergeAtFn){ const mk=mergeAtFn(s,c,r); if(mk){ if(mk.ac!==c||mk.ar!==r){ const st0=styleOf(s,mk.ac,mk.ar); ctx.fillStyle=(st0&&st0.bg)?st0.bg:'#fff'; ctx.fillRect(x,y,w,h); return; } for(let cc=c+1;cc<=mk.c2;cc++) w+=colW(s,cc); for(let rr=r+1;rr<=mk.r2;rr++) h+=rowH(s,rr); } }
  const st=styleOf(s,c,r);
  const v=cellValue(s,c,r);
  let bg=st&&st.bg?st.bg:null, color=st&&st.color?st.color:null, bar=null, icon=null;
  if(condOverrideFn){ const o=condOverrideFn(s,c,r,v); if(o){ if(o.bg) bg=o.bg; if(o.color) color=o.color; if(o.bar) bar=o.bar; if(o.icon) icon=o.icon; } }
  if(bg){ ctx.fillStyle=bg; ctx.fillRect(x,y,w,h); }
  if(bar){ const inw=w-6, bw=Math.max(0, inw*Math.min(1,bar.pct)); ctx.fillStyle=bar.color; if(bar.neg){ ctx.fillRect(x+3+inw-bw,y+3,bw,h-6);} else ctx.fillRect(x+3,y+3,bw,h-6); }
  // gridlines
  if(!state.hideGridlines){ ctx.fillStyle=C_GRID; ctx.fillRect(x+w-1,y,1,h); ctx.fillRect(x,y+h-1,w,1); }
  // explicit borders
  if(st&&st.borders){ ctx.fillStyle=st.borderColor||'#3a3f45'; const b=st.borders; if(b.top) ctx.fillRect(x,y,w,1); if(b.bottom) ctx.fillRect(x,y+h-1,w,1); if(b.left) ctx.fillRect(x,y,1,h); if(b.right) ctx.fillRect(x+w-1,y,1,h); }
  const _fc=s.cells.get(HE.key(c,r));
  const disp=(state.showFormulas && _fc && _fc.ast)? _fc.raw : displayText(s,c,r);
  if(icon){ ctx.save(); ctx.font='11px '+FONT_STACK; ctx.textBaseline='middle'; ctx.textAlign='left'; ctx.fillStyle=icon.color||'#555'; ctx.fillText(icon.ch, x+3, y+h/2+1); ctx.restore(); }
  if(disp!==''){
    ctx.save(); ctx.beginPath(); ctx.rect(x+1,y,w-2,h); ctx.clip();
    ctx.font=fontStr(st); ctx.textBaseline='middle';
    ctx.fillStyle=HE.isErr(v)?C_ERR:(color||C_INK);
    const align=(st&&st.align)?st.align:displayAlignDefault(v);
    const ty=y+h/2+0.5; const padL=x+4+(icon?15:0);
    let tx;
    if(align==='right'){ ctx.textAlign='right'; tx=x+w-4; }
    else if(align==='center'){ ctx.textAlign='center'; tx=x+w/2; }
    else { ctx.textAlign='left'; tx=padL; }
    // overflow-marker for too-narrow numbers
    const tw=ctx.measureText(disp).width;
    if(typeof v==='number' && tw>w-6 && (!st||!st.wrap)){ ctx.fillStyle=C_ERR; ctx.textAlign='right'; ctx.fillText('#'.repeat(Math.max(2,Math.floor((w-6)/6))), x+w-4, ty); }
    else { ctx.fillText(disp, tx, ty); if(st&&st.underline){ const uw=Math.min(tw,w-6); let ux=(align==='right')?x+w-4-uw:(align==='center'?x+w/2-uw/2:padL); ctx.fillRect(ux, ty+7, uw, 1);} }
    ctx.restore();
  }
  if(validationBadgeFn) validationBadgeFn(s,c,r,x,y,w,h);
}

// A neighbour is "spill-open" for text overflow when it has no display value and is not merged.
function overflowEmpty(s,c,r){
  if(c<0||c>s.maxCol) return false;
  if(mergeAtFn){ const mk=mergeAtFn(s,c,r); if(mk) return false; }
  return displayText(s,c,r)==='';
}
// Excel-style overflow: long TEXT paints across empty adjacent cells. Numbers show #### (handled in drawCell),
// wrap-text and merged cells opt out. Drawn as a post-pass so text sits above neighbour gridlines.
function drawOverflowText(s,c,r,x,y,w,h){
  if(mergeAtFn){ const mk=mergeAtFn(s,c,r); if(mk) return; }
  const st=styleOf(s,c,r);
  if(st&&st.wrap) return;
  const _fc=s.cells.get(HE.key(c,r));
  const v=cellValue(s,c,r);
  if(typeof v==='number' || HE.isErr(v) || v===null || v==='' || typeof v==='boolean') return;
  const disp=(state.showFormulas && _fc && _fc.ast)? _fc.raw : displayText(s,c,r);
  if(disp==='') return;
  ctx.save();
  ctx.font=fontStr(st); ctx.textBaseline='middle';
  const tw=ctx.measureText(disp).width;
  if(tw<=w-6){ ctx.restore(); return; }
  const align=(st&&st.align)?st.align:displayAlignDefault(v);
  let color=st&&st.color?st.color:null;
  if(condOverrideFn){ const o=condOverrideFn(s,c,r,v); if(o&&o.color) color=o.color; }
  const need=tw-(w-6);
  let clipX2=x+1, clipW=w-2;
  if(align==='right'){
    let ext=0,cc=c-1; while(overflowEmpty(s,cc,r)&&ext<need){ ext+=colW(s,cc); cc--; }
    clipX2=x+1-ext; clipW=w-2+ext;
  } else if(align==='center'){
    let extR=0,cc=c+1; while(overflowEmpty(s,cc,r)&&extR<need/2){ extR+=colW(s,cc); cc++; }
    let extL=0,cd=c-1; while(overflowEmpty(s,cd,r)&&extL<need/2){ extL+=colW(s,cd); cd--; }
    clipX2=x+1-extL; clipW=w-2+extL+extR;
  } else {
    let ext=0,cc=c+1; while(overflowEmpty(s,cc,r)&&ext<need){ ext+=colW(s,cc); cc++; }
    clipW=w-2+ext;
  }
  if(clipW<=w-2){ ctx.restore(); return; } // no empty room to spill into → stays clipped
  ctx.beginPath(); ctx.rect(clipX2,y,clipW,h); ctx.clip();
  ctx.fillStyle=color||C_INK;
  const ty=y+h/2+0.5;
  if(align==='right'){ ctx.textAlign='right'; ctx.fillText(disp,x+w-4,ty); }
  else if(align==='center'){ ctx.textAlign='center'; ctx.fillText(disp,x+w/2,ty); }
  else { ctx.textAlign='left'; ctx.fillText(disp,x+4,ty); }
  if(st&&st.underline){ let uw=Math.min(tw,clipW); let ux=(align==='right')?x+w-4-uw:(align==='center'?x+w/2-uw/2:x+4); ctx.fillRect(ux, ty+7, uw, 1); }
  ctx.restore();
}

function drawRegion(cols,rows,clipX,clipY,clipR,clipB){
  if(!cols.length||!rows.length) return;
  const s=sheet();
  ctx.save(); ctx.beginPath(); ctx.rect(clipX,clipY,clipR-clipX,clipB-clipY); ctx.clip();
  for(let ri=0;ri<rows.length;ri++){ const R=rows[ri]; for(let ci=0;ci<cols.length;ci++){ const C=cols[ci]; drawCell(s,C.c,R.r,C.x,R.y,C.w,R.h); } }
  // Excel-style text overflow pass (paints over empty neighbours' gridlines)
  for(let ri=0;ri<rows.length;ri++){ const R=rows[ri]; for(let ci=0;ci<cols.length;ci++){ const C=cols[ci]; drawOverflowText(s,C.c,R.r,C.x,R.y,C.w,R.h); } }
  ctx.restore();
}

function selBounds(){ const s=state.sel; return {c1:Math.min(s.c1,s.c2),c2:Math.max(s.c1,s.c2),r1:Math.min(s.r1,s.r2),r2:Math.max(s.r1,s.r2)}; }

function drawOverlays(s,cols,rows,bw,bh){
  ctx.save(); ctx.beginPath(); ctx.rect(HDRW,HDRH,bw-HDRW,bh-HDRH); ctx.clip();
  // spill borders
  for(let ri=0;ri<rows.length;ri++){ for(let ci=0;ci<cols.length;ci++){ const c=cols[ci].c, r=rows[ri].r; const cell=s.cells.get(HE.key(c,r)); if(cell&&cell.spill){ const x=sxCol(s,c), y=syRow(s,r); const x2=sxCol(s,c+cell.spill.cols-1)+colW(s,c+cell.spill.cols-1), y2=syRow(s,r+cell.spill.rows-1)+rowH(s,r+cell.spill.rows-1); ctx.save(); ctx.strokeStyle=C_SPILL; ctx.lineWidth=1; ctx.setLineDash([3,2]); ctx.strokeRect(x+.5,y+.5,x2-x-1,y2-y-1); ctx.restore(); } } }
  // extra ranges
  ctx.fillStyle=C_SELFILL;
  for(const rg of state.ranges){ const c1=Math.min(rg.c1,rg.c2),c2=Math.max(rg.c1,rg.c2),r1=Math.min(rg.r1,rg.r2),r2=Math.max(rg.r1,rg.r2); const x=sxCol(s,c1),y=syRow(s,r1),x2=sxCol(s,c2)+colW(s,c2),y2=syRow(s,r2)+rowH(s,r2); ctx.fillRect(x,y,x2-x,y2-y); }
  // main selection
  const b=selBounds();
  const x1=sxCol(s,b.c1), y1=syRow(s,b.r1), x2=sxCol(s,b.c2)+colW(s,b.c2), y2=syRow(s,b.r2)+rowH(s,b.r2);
  ctx.fillStyle=C_SELFILL; ctx.fillRect(x1,y1,x2-x1,y2-y1);
  // active cell drawn white
  const ax=sxCol(s,state.active.c), ay=syRow(s,state.active.r), aw=colW(s,state.active.c), ah=rowH(s,state.active.r);
  ctx.fillStyle='#fff'; ctx.fillRect(ax,ay,aw,ah); drawCell(s,state.active.c,state.active.r,ax,ay,aw,ah); drawOverflowText(s,state.active.c,state.active.r,ax,ay,aw,ah);
  // selection border
  ctx.strokeStyle=C_SEL; ctx.lineWidth=2; ctx.strokeRect(x1+1,y1+1,x2-x1-2,y2-y1-2);
  // fill handle
  if(!state.editing){ ctx.fillStyle=C_SEL; ctx.fillRect(x2-3,y2-3,6,6); ctx.fillStyle='#fff'; ctx.fillRect(x2-3,y2-3,6,6); ctx.fillStyle=C_SEL; ctx.fillRect(x2-4,y2-4,7,7); }
  // fill preview
  if(state.fillPreview){ const p=state.fillPreview; const px=sxCol(s,p.c1),py=syRow(s,p.r1),px2=sxCol(s,p.c2)+colW(s,p.c2),py2=syRow(s,p.r2)+rowH(s,p.r2); ctx.strokeStyle=C_SEL; ctx.setLineDash([4,3]); ctx.lineWidth=1; ctx.strokeRect(px+.5,py+.5,px2-px-1,py2-py-1); ctx.setLineDash([]); }
  ctx.restore();
}

function drawHeaders(s,cols,rows,bw,bh){
  const b=selBounds();
  // column headers
  ctx.save(); ctx.beginPath(); ctx.rect(HDRW,0,bw-HDRW,HDRH); ctx.clip();
  ctx.font='11px '+FONT_STACK; ctx.textBaseline='middle'; ctx.textAlign='center';
  for(const C of cols){ const sel=C.c>=b.c1&&C.c<=b.c2; ctx.fillStyle=sel?C_HEADSEL:C_HEAD; ctx.fillRect(C.x,0,C.w,HDRH); ctx.fillStyle=C_HEADLINE; ctx.fillRect(C.x+C.w-1,0,1,HDRH); ctx.fillStyle=sel?C_SEL:C_HEADINK; ctx.fillText(A1(C.c), C.x+C.w/2, HDRH/2+1); if(sel){ ctx.fillStyle=C_SEL; ctx.fillRect(C.x,HDRH-2,C.w,2);} }
  ctx.restore();
  // row headers
  ctx.save(); ctx.beginPath(); ctx.rect(0,HDRH,HDRW,bh-HDRH); ctx.clip();
  ctx.font='11px '+FONT_STACK; ctx.textBaseline='middle'; ctx.textAlign='right';
  for(const R of rows){ const sel=R.r>=b.r1&&R.r<=b.r2; ctx.fillStyle=sel?C_HEADSEL:C_HEAD; ctx.fillRect(0,R.y,HDRW,R.h); ctx.fillStyle=C_HEADLINE; ctx.fillRect(0,R.y+R.h-1,HDRW,1); ctx.fillStyle=sel?C_SEL:C_HEADINK; ctx.fillText(String(R.r+1), HDRW-6, R.y+R.h/2+1); if(sel){ ctx.fillStyle=C_SEL; ctx.fillRect(HDRW-2,R.y,2,R.h);} }
  ctx.restore();
  // corner
  ctx.fillStyle=C_HEAD; ctx.fillRect(0,0,HDRW,HDRH); ctx.fillStyle=C_HEADLINE; ctx.fillRect(HDRW-1,0,1,HDRH); ctx.fillRect(0,HDRH-1,HDRW,1);
  ctx.beginPath(); ctx.strokeStyle='#9aa1ab'; ctx.lineWidth=1; ctx.moveTo(HDRW-4,7); ctx.lineTo(HDRW-4,HDRH-4); ctx.lineTo(7,HDRH-4); ctx.stroke();
}

function draw(){
  const s=sheet(); if(!s||!ctx) return; const Z=state.zoom;
  state._drawToken=(state._drawToken||0)+1;
  if(state.scroll.x<0) state.scroll.x=0; if(state.scroll.y<0) state.scroll.y=0;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,VW,VH);
  ctx.setTransform(dpr*Z,0,0,dpr*Z,0,0);
  const bw=VW/Z, bh=VH/Z;
  const fw=colX(s,s.frozenCols), fh=rowY(s,s.frozenRows);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,bw,bh);
  const scrolledCols=computeCols(s, fw+state.scroll.x, HDRW+fw, bw);
  const scrolledRows=computeRows(s, fh+state.scroll.y, HDRH+fh, bh);
  const frozCols=[]; { let sx=HDRW; for(let c=0;c<s.frozenCols;c++){ const w=colW(s,c); if(w>0){frozCols.push({c,x:sx,w}); sx+=w;} } }
  const frozRows=[]; { let sy=HDRH; for(let r=0;r<s.frozenRows;r++){ const h=rowH(s,r); if(h>0){frozRows.push({r,y:sy,h}); sy+=h;} } }
  drawRegion(scrolledCols,scrolledRows, HDRW+fw, HDRH+fh, bw, bh);
  if(s.frozenRows) drawRegion(scrolledCols,frozRows, HDRW+fw, HDRH, bw, HDRH+fh);
  if(s.frozenCols) drawRegion(frozCols,scrolledRows, HDRW, HDRH+fh, HDRW+fw, bh);
  if(s.frozenRows&&s.frozenCols) drawRegion(frozCols,frozRows, HDRW, HDRH, HDRW+fw, HDRH+fh);
  const allCols=frozCols.concat(scrolledCols), allRows=frozRows.concat(scrolledRows);
  // frozen divider lines
  if(s.frozenCols){ ctx.fillStyle='#9aa1ab'; ctx.fillRect(HDRW+fw-1,0,1.5,bh); }
  if(s.frozenRows){ ctx.fillStyle='#9aa1ab'; ctx.fillRect(0,HDRH+fh-1,bw,1.5); }
  drawOverlays(s,allCols,allRows,bw,bh);
  drawHeaders(s,allCols,allRows,bw,bh);
  if(renderChartsFn) renderChartsFn();
  state._visCols=allCols; state._visRows=allRows;
}

let rafPending=false;
function render(){ if(rafPending) return; rafPending=true; requestAnimationFrame(()=>{ rafPending=false; layout(); draw(); }); }
function renderNow(){ layout(); draw(); }

/* ---------- sheet tabs ---------- */
function renderTabs(){
  const host=document.getElementById('sheetTabs'); host.innerHTML='';
  model.sheets.forEach(s=>{
    const t=document.createElement('div'); t.className='tab'+(s.name===state.activeSheet?' active':''); t.dataset.name=s.name; t.draggable=true;
    if(s.color){ const sw=document.createElement('span'); sw.className='swatch'; sw.style.background=s.color; t.appendChild(sw); }
    const lbl=document.createElement('span'); lbl.textContent=s.name; t.appendChild(lbl);
    const x=document.createElement('span'); x.className='x'; x.textContent='✕'; x.title='Delete sheet'; x.onclick=(e)=>{ e.stopPropagation(); deleteSheet(s.name); };
    t.appendChild(x);
    t.onclick=()=>{ activateSheet(s.name); };
    t.ondblclick=()=>{ renameSheetPrompt(s.name); };
    t.oncontextmenu=(e)=>{ e.preventDefault(); sheetContextMenu(e,s.name); };
    t.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain',s.name); state._dragTab=s.name; });
    t.addEventListener('dragover',e=>e.preventDefault());
    t.addEventListener('drop',e=>{ e.preventDefault(); reorderSheet(state._dragTab, s.name); });
    host.appendChild(t);
  });
  const add=document.createElement('button'); add.className='tab-add'; add.textContent='＋'; add.title='Add sheet'; add.onclick=()=>addSheetUI(); host.appendChild(add);
}

/* ---------- formula bar sync ---------- */
function syncFormulaBar(){
  const s=sheet(); const a=state.active;
  document.getElementById('nameBox').value=selNameLabel();
  const raw=rawInput(s,a.c,a.r);
  const fi=document.getElementById('formulaInput'); fi.value=raw;
  highlightFormula(fi.value);
  updateStatusBar();
}
function selNameLabel(){ const b=selBounds(); if(b.c1===b.c2&&b.r1===b.r2) return A1(state.active.c)+(state.active.r+1); return A1(b.c1)+(b.r1+1)+':'+A1(b.c2)+(b.r2+1); }

function updateStatusBar(){
  const s=sheet(); const b=selBounds(); let sum=0,cnt=0,num=0,mn=Infinity,mx=-Infinity;
  const cellsSpan=(b.c2-b.c1+1)*(b.r2-b.r1+1);
  if(cellsSpan<=200000){ for(let r=b.r1;r<=b.r2;r++) for(let c=b.c1;c<=b.c2;c++){ const v=cellValue(s,c,r); if(v===null||v===undefined||v==='') continue; cnt++; if(typeof v==='number'){ num++; sum+=v; if(v<mn)mn=v; if(v>mx)mx=v; } } }
  const el=document.getElementById('statSel');
  if(num>0){ const avg=sum/num; el.textContent=`Sum: ${fmtStat(sum)}   Avg: ${fmtStat(avg)}   Min: ${fmtStat(mn)}   Max: ${fmtStat(mx)}   Count: ${cnt}   Numerical: ${num}`; }
  else if(cnt>0){ el.textContent=`Count: ${cnt}`; }
  else el.textContent='';
}
function fmtStat(n){ if(!isFinite(n)) return '—'; const r=Math.round(n*1e6)/1e6; return r.toLocaleString('en-US',{maximumFractionDigits:6}); }

/* ---------- formula-bar colored reference highlighting ---------- */
const REF_COLORS=['#137a4b','#1a56db','#b45309','#7c3aed','#be185d','#0f766e','#a16207'];
function highlightFormula(text){
  const host=document.getElementById('fHighlight'); if(!host) return;
  if(text[0]!=='='){ host.innerHTML=''; return; }
  let html=''; let refIdx=0; const seen={};
  try{
    const toks=HE.tokenize(text.slice(1));
    html='<span style="color:#9aa1ab">=</span>';
    for(const t of toks){ if(t.t==='eof') break;
      if(t.t==='ref'){ const raw=t.raw!==undefined?t.raw:HE.formatRef(t.v); const kk=String(raw).toUpperCase(); if(seen[kk]===undefined){ seen[kk]=REF_COLORS[refIdx%REF_COLORS.length]; refIdx++; } html+=`<span style="color:${seen[kk]};font-weight:700">${escapeHtml(String(raw))}</span>`; }
      else if(t.t==='func') html+=`<span style="color:#7c3aed">${escapeHtml(String(t.v))}</span>`;
      else if(t.t==='num') html+=`<span style="color:#0b7285">${escapeHtml(HE.toStr(t.v))}</span>`;
      else if(t.t==='str') html+=`<span style="color:#b45309">${escapeHtml('"'+String(t.v)+'"')}</span>`;
      else if(t.t==='bool') html+=`<span style="color:#0b7285">${t.v?'TRUE':'FALSE'}</span>`;
      else if(t.t==='err') html+=`<span style="color:#c0392b">${escapeHtml(t.v.type)}</span>`;
      else if(t.t==='name') html+=`<span style="color:#0f766e">${escapeHtml(String(t.v))}</span>`;
      else if(t.t==='lparen') html+='('; else if(t.t==='rparen') html+=')';
      else if(t.t==='comma') html+=','; else if(t.t==='semi') html+=';';
      else if(t.t==='lbrace') html+='{'; else if(t.t==='rbrace') html+='}';
      else html+=escapeHtml(String(t.v));
    }
  }catch(e){ html=escapeHtml(text); }
  host.innerHTML=html;
}
function escapeHtml(s){ return s.replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }

/* ================================================================
 * Chunk C — interaction: selection, keyboard, editor, autocomplete
 * ================================================================ */
function clampC(c){ return Math.max(0,Math.min(COLS-1,c)); }
function clampR(r){ return Math.max(0,Math.min(ROWS-1,r)); }
function setSelection(c1,r1,c2,r2,ac,ar){ c1=clampC(c1);c2=clampC(c2);r1=clampR(r1);r2=clampR(r2); state.sel={c1,r1,c2,r2}; state.active={c:ac==null?c1:clampC(ac), r:ar==null?r1:clampR(ar)}; state.ranges=[]; }
function extendTo(c,r){ state.sel.c2=clampC(c); state.sel.r2=clampR(r); }
function forEachSelCell(fn){ const b=selBounds(); for(let r=b.r1;r<=b.r2;r++) for(let c=b.c1;c<=b.c2;c++) fn(c,r); for(const rg of state.ranges){ const c1=Math.min(rg.c1,rg.c2),c2=Math.max(rg.c1,rg.c2),r1=Math.min(rg.r1,rg.r2),r2=Math.max(rg.r1,rg.r2); for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++) fn(c,r); } }
function selCellsArr(){ const out=[], seen=new Set(); forEachSelCell((c,r)=>{ const k=c+','+r; if(!seen.has(k)){seen.add(k); out.push({c,r});} }); return out; }
function selectAll(){ setSelection(0,0,COLS-1,ROWS-1,0,0); render(); syncFormulaBar(); }
function selectCols(c,shift,ctrl){ if(ctrl){ state.ranges.push({c1:c,r1:0,c2:c,r2:ROWS-1}); } else if(shift){ state.sel={c1:state.active.c,r1:0,c2:c,r2:ROWS-1}; } else { setSelection(c,0,c,ROWS-1,c,0); } }
function selectRows(r,shift,ctrl){ if(ctrl){ state.ranges.push({c1:0,r1:r,c2:COLS-1,r2:r}); } else if(shift){ state.sel={c1:0,r1:state.active.r,c2:COLS-1,r2:r}; } else { setSelection(0,r,COLS-1,r,0,r); } }

function ensureVisible(c,r){ const s=sheet(); const Z=state.zoom; const vw=VW/Z, vh=VH/Z; const fw=colX(s,s.frozenCols), fh=rowY(s,s.frozenRows);
  if(c>=s.frozenCols){ const cx=colX(s,c)-fw, cw=colW(s,c); const avail=vw-HDRW-fw; if(cx<state.scroll.x) state.scroll.x=cx; else if(cx+cw>state.scroll.x+avail) state.scroll.x=cx+cw-avail; }
  if(r>=s.frozenRows){ const cy=rowY(s,r)-fh, ch=rowH(s,r); const avail=vh-HDRH-fh; if(cy<state.scroll.y) state.scroll.y=cy; else if(cy+ch>state.scroll.y+avail) state.scroll.y=cy+ch-avail; }
  if(state.scroll.x<0)state.scroll.x=0; if(state.scroll.y<0)state.scroll.y=0; syncScrollbars(); }
function syncScrollbars(){ const Z=state.zoom; const vs=document.getElementById('vscroll'), hs=document.getElementById('hscroll'); if(vs) vs.scrollTop=Math.round(state.scroll.y*Z); if(hs) hs.scrollLeft=Math.round(state.scroll.x*Z); }

function moveActive(dc,dr,extend){ const s=sheet();
  if(extend){ let nc=clampC(state.sel.c2+dc), nr=clampR(state.sel.r2+dr); state.sel.c2=nc; state.sel.r2=nr; ensureVisible(nc,nr); }
  else { let nc=clampC(state.active.c+dc), nr=clampR(state.active.r+dr); setSelection(nc,nr,nc,nr); ensureVisible(nc,nr); }
  render(); syncFormulaBar(); }
function jumpActive(dc,dr,extend){ const s=sheet(); let c=state.active.c, r=state.active.r; const has=(cc,rr)=>{ const v=cellValue(s,cc,rr); return v!==null&&v!==undefined&&v!==''; };
  let nc=c,nr=r; const stepC=Math.sign(dc), stepR=Math.sign(dr);
  const move=()=>{ nc=clampC(nc+stepC); nr=clampR(nr+stepR); };
  if(has(c,r)){ // if current filled, jump to last filled in run, else to next filled
    if(has(clampC(c+stepC),clampR(r+stepR))){ while((stepC?nc>0&&nc<COLS-1:true)&&(stepR?nr>0&&nr<ROWS-1:true)){ const pc=nc,pr=nr; move(); if(!has(nc,nr)){ nc=pc;nr=pr; break; } } }
    else { while(true){ const pc=nc,pr=nr; move(); if(has(nc,nr)) break; if((stepC&&(nc<=0||nc>=COLS-1))||(stepR&&(nr<=0||nr>=ROWS-1))) break; } }
  } else { while(true){ const pc=nc,pr=nr; move(); if(has(nc,nr)) break; if((stepC&&(nc<=0||nc>=COLS-1))||(stepR&&(nr<=0||nr>=ROWS-1))) break; } }
  if(extend){ state.sel.c2=nc; state.sel.r2=nr; state.active={c:nc,r:nr}; } else setSelection(nc,nr,nc,nr);
  ensureVisible(nc,nr); render(); syncFormulaBar(); }

/* ---------- editor ---------- */
function editorEl(){ return document.getElementById('cellEditor'); }
function beginEdit(initial, fromBar){ const s=sheet(); const a=state.active; const ed=editorEl();
  state.editing=true; state._editAnchor={c:a.c,r:a.r}; state._pointMode=false;
  const Z=state.zoom; const x=sxCol(s,a.c)*Z, y=syRow(s,a.r)*Z; const w=Math.max(colW(s,a.c)*Z, 60), h=rowH(s,a.r)*Z;
  ed.style.display='block'; ed.style.left=x+'px'; ed.style.top=y+'px'; ed.style.minWidth=w+'px'; ed.style.height=h+'px'; ed.style.fontSize=(13*Z)+'px';
  ed.value = initial!==undefined?initial: rawInput(s,a.c,a.r);
  if(!fromBar){ ed.focus(); const L=ed.value.length; ed.setSelectionRange(L,L); }
  document.getElementById('formulaInput').value=ed.value; highlightFormula(ed.value);
  document.getElementById('statMode').textContent='Enter'; render();
}
function commitEdit(dc,dr){ if(!state.editing) return; const ed=editorEl(); const s=sheet(); const a=state._editAnchor||state.active; const val=ed.value;
  hideAutocomplete(); ed.style.display='none'; state.editing=false; document.getElementById('statMode').textContent='Ready';
  const prev=rawInput(s,a.c,a.r);
  if(val!==prev){ if(val!==''&&typeof dvValidate==='function'){ const res=dvValidate(s,a.c,a.r,val); if(res&&res.ok===false){ alert(res.msg||'The value you entered is not valid for this cell.'); state.editing=true; document.getElementById('statMode').textContent='Enter'; ed.style.display='block'; ed.focus(); return; } } pushUndo('edit'); model.setCell(s.name,a.c,a.r,val); }
  if(dc||dr){ let nc=clampC(a.c+dc), nr=clampR(a.r+dr); setSelection(nc,nr,nc,nr); ensureVisible(nc,nr); }
  else setSelection(a.c,a.r,a.c,a.r);
  afterMutation(); }
function cancelEdit(){ if(!state.editing) return; const ed=editorEl(); hideAutocomplete(); ed.style.display='none'; state.editing=false; document.getElementById('statMode').textContent='Ready'; syncFormulaBar(); render(); }
function editorWantsRef(){ if(!state.editing) return false; const ed=editorEl(); const t=ed.value; if(t[0]!=='=') return false; const upto=t.slice(0,ed.selectionStart); return /[=+\-*/^(,:&<>% ]$/.test(upto)||upto==='='; }
function insertRefAtCaret(ref){ const ed=editorEl(); const p=ed.selectionStart; ed.value=ed.value.slice(0,p)+ref+ed.value.slice(ed.selectionEnd); const np=p+ref.length; ed.setSelectionRange(np,np); ed.focus(); document.getElementById('formulaInput').value=ed.value; highlightFormula(ed.value); }
function cycleRefAtCaret(){ const ed=editorEl(); const t=ed.value; let p=ed.selectionStart; const re=/\$?[A-Za-z]{1,3}\$?[0-9]{1,7}/g; let m; while((m=re.exec(t))){ if(p>=m.index && p<=m.index+m[0].length){ const cycled=HE.cycleAbsRef(m[0]); ed.value=t.slice(0,m.index)+cycled+t.slice(m.index+m[0].length); const np=m.index+cycled.length; ed.setSelectionRange(np,np); document.getElementById('formulaInput').value=ed.value; highlightFormula(ed.value); return; } } }

/* ---------- autocomplete ---------- */
let ALLFUNCS=null, acItems=[], acSel=0;
function funcList(){ if(!ALLFUNCS){ ALLFUNCS=Object.keys(HE.FUNCTIONS||{}).concat(Object.keys(HE.MACROS||{})); ALLFUNCS=Array.from(new Set(ALLFUNCS)).sort(); } return ALLFUNCS; }
const SIGS=HE.SIGNATURES||{};
function sigOf(name){ return SIGS[name]||(name+'( … )'); }
function maybeAutocomplete(ed){ const t=ed.value; if(t[0]!=='='){ hideAutocomplete(); return; } const p=ed.selectionStart; const before=t.slice(0,p); const m=before.match(/([A-Za-z][A-Za-z0-9_.]*)$/); if(!m){ hideAutocomplete(); return; } const frag=m[1].toUpperCase(); const list=funcList().filter(f=>f.startsWith(frag)).slice(0,12); if(!list.length){ hideAutocomplete(); return; } showAutocomplete(list, ed); }
function showAutocomplete(list, ed){ const box=document.getElementById('acbox'); acItems=list; acSel=0; box.innerHTML=list.map((f,i)=>`<div class="acitem${i===0?' sel':''}" data-i="${i}"><span class="fn">${f}</span><span class="sig">${escapeHtml(sigOf(f))}</span></div>`).join(''); box.style.display='block'; const edr=ed.getBoundingClientRect(), wr=document.getElementById('gridwrap').getBoundingClientRect(); box.style.left=(edr.left-wr.left)+'px'; box.style.top=(edr.bottom-wr.top+2)+'px'; box.querySelectorAll('.acitem').forEach(it=>{ it.onmousedown=(e)=>{ e.preventDefault(); acSel=+it.dataset.i; acAccept(); }; }); }
function hideAutocomplete(){ const box=document.getElementById('acbox'); if(box) box.style.display='none'; acItems=[]; }
function acVisible(){ const box=document.getElementById('acbox'); return box&&box.style.display==='block'&&acItems.length; }
function acMove(d){ acSel=(acSel+d+acItems.length)%acItems.length; const box=document.getElementById('acbox'); box.querySelectorAll('.acitem').forEach((it,i)=>it.classList.toggle('sel',i===acSel)); }
function acAccept(){ const name=acItems[acSel]; const ed=editorEl(); const p=ed.selectionStart; const before=ed.value.slice(0,p); const m=before.match(/([A-Za-z][A-Za-z0-9_.]*)$/); const start=p-(m?m[1].length:0); ed.value=ed.value.slice(0,start)+name+'('+ed.value.slice(p); const np=start+name.length+1; ed.setSelectionRange(np,np); hideAutocomplete(); document.getElementById('formulaInput').value=ed.value; highlightFormula(ed.value); ed.focus(); }

/* ---------- clipboard ---------- */
function copySelection(cut){ const s=sheet(); const b=selBounds(); const cells=[]; for(let r=b.r1;r<=b.r2;r++){ const row=[]; for(let c=b.c1;c<=b.c2;c++){ const cell=s.cells.get(HE.key(c,r)); const st=styleOf(s,c,r); row.push({ raw: cell?cell.raw:'', fmt: cell?cell.fmt:null, style: st?JSON.parse(JSON.stringify(st)):null }); } cells.push(row); }
  state.clipboard={cut:!!cut, w:b.c2-b.c1+1, h:b.r2-b.r1+1, origin:{c:b.c1,r:b.r1}, cells, sheet:s.name};
  // system clipboard as TSV
  const tsv=cells.map(row=>row.map(cc=>{ const c=cc; let v=c.raw; return String(v==null?'':v).replace(/\t/g,' ').replace(/\n/g,' '); }).join('\t')).join('\n');
  try{ navigator.clipboard.writeText(tsv); }catch(e){}
  state._cutMark = cut? {c1:b.c1,r1:b.r1,c2:b.c2,r2:b.r2}: null;
  toast(cut?'Cut':'Copied'); render(); }
function pasteClipboard(){ const cb=state.clipboard; const s=sheet(); const a=state.active; if(!cb){ return; }
  pushUndo('paste'); const dRow=a.r-cb.origin.r, dCol=a.c-cb.origin.c;
  for(let r=0;r<cb.h;r++) for(let c=0;c<cb.w;c++){ const src=cb.cells[r][c]; const tc=a.c+c, tr=a.r+r; if(tc>=COLS||tr>=ROWS) continue; let raw=src.raw; if(typeof raw==='string' && raw[0]==='='){ raw=HE.translateFormula(raw, dCol, dRow); } model.setCell(s.name,tc,tr,raw==null?'':raw,{noRecalc:true}); const cell=s.cells.get(HE.key(tc,tr)); if(cell&&src.fmt) cell.fmt=src.fmt; if(src.style){ ensureStyle(s,tc,tr); s.styles.set(HE.key(tc,tr), JSON.parse(JSON.stringify(src.style))); } else { if(s.styles) s.styles.delete(HE.key(tc,tr)); } }
  if(cb.cut){ const src=model.getSheet(cb.sheet); if(src){ for(let r=0;r<cb.h;r++) for(let c=0;c<cb.w;c++){ model.setCell(src.name,cb.origin.c+c,cb.origin.r+r,'',{noRecalc:true}); if(src.styles) src.styles.delete(HE.key(cb.origin.c+c,cb.origin.r+r)); } } state.clipboard=null; state._cutMark=null; }
  model.recalcAll(); setSelection(a.c,a.r,a.c+cb.w-1,a.r+cb.h-1,a.c,a.r); afterMutation(); toast('Pasted'); }
function pasteTSV(text){ const s=sheet(); const a=state.active; const rows=text.replace(/\r/g,'').split('\n'); if(rows.length&&rows[rows.length-1]==='') rows.pop(); pushUndo('paste'); rows.forEach((line,ri)=>{ line.split('\t').forEach((val,ci)=>{ const tc=a.c+ci, tr=a.r+ri; if(tc<COLS&&tr<ROWS) model.setCell(s.name,tc,tr,val,{noRecalc:true}); }); }); model.recalcAll(); afterMutation(); toast('Pasted'); }
function clearSelection(){ const s=sheet(); pushUndo('clear'); forEachSelCell((c,r)=>{ model.setCell(s.name,c,r,'',{noRecalc:true}); if(s.styles) s.styles.delete(HE.key(c,r)); }); model.recalcAll(); afterMutation(); }
function clearContentsOnly(){ const s=sheet(); pushUndo('clear'); forEachSelCell((c,r)=>model.setCell(s.name,c,r,'',{noRecalc:true})); model.recalcAll(); afterMutation(); }

function autoSum(){ const s=sheet(); const a=state.active; let r=a.r-1, cnt=0; while(r>=0){ const v=cellValue(s,a.c,r); if(typeof v==='number'){ cnt++; r--; } else break; } if(cnt>=1){ beginEdit('=SUM('+A1(a.c)+(a.r-cnt+1)+':'+A1(a.c)+(a.r)+')'); return; } let c=a.c-1, cn=0; while(c>=0){ const v=cellValue(s,a.r? a.r:0? a.r:a.r,c); const vv=cellValue(s,c,a.r); if(typeof vv==='number'){ cn++; c--; } else break; } if(cn>=1){ beginEdit('=SUM('+A1(a.c-cn)+(a.r+1)+':'+A1(a.c-1)+(a.r+1)+')'); return; } beginEdit('=SUM()'); }

/* ---------- fill ---------- */
function computeFillValues(srcRaws, n, reverse){ const vals=srcRaws.map(x=>x); const parseNum=v=>{ const f=parseFloat(v); return (v!==''&&v!=null&&!isNaN(f)&&/^-?\d*\.?\d+$/.test(String(v).trim()))?f:null; };
  const WD=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'], WDS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const MO=['January','February','March','April','May','June','July','August','September','October','November','December'], MOS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function seqOf(list){ const idxs=srcRaws.map(v=>list.findIndex(x=>x.toLowerCase()===String(v).trim().toLowerCase())); if(idxs.some(i=>i<0)) return null; return idxs; }
  for(const list of [WD,WDS,MO,MOS]){ const idxs=seqOf(list); if(idxs){ const step=idxs.length>1?(idxs[idxs.length-1]-idxs[0])/(idxs.length-1):1; const out=[]; let last=idxs[idxs.length-1]; for(let i=0;i<n;i++){ last=Math.round(last+ (reverse?-step:step)); out.push(list[((last%list.length)+list.length)%list.length]); } return out; } }
  const nums=srcRaws.map(parseNum); if(nums.every(x=>x!==null)){ let step=1; if(nums.length>=2){ step=(nums[nums.length-1]-nums[0])/(nums.length-1); } const out=[]; let last=nums[nums.length-1]; for(let i=0;i<n;i++){ last=last+(reverse?-step:step); out.push(String(Math.round(last*1e10)/1e10)); } return out; }
  const m=String(srcRaws[srcRaws.length-1]).match(/^(.*?)(\d+)$/); if(m){ let base=parseInt(m[2],10); const out=[]; for(let i=0;i<n;i++){ base+=reverse?-1:1; out.push(m[1]+base); } return out; }
  const out=[]; for(let i=0;i<n;i++) out.push(srcRaws[i%srcRaws.length]); return out; }
function applyFill(preview){ const s=sheet(); const src=selBounds(); const p=preview; pushUndo('fill');
  if(p.dir==='down'||p.dir==='up'){ for(let c=src.c1;c<=src.c2;c++){ const raws=[]; for(let r=src.r1;r<=src.r2;r++) raws.push(rawInput(s,c,r)); if(p.dir==='down'){ const tRows=p.r2-src.r2; const vals=computeFillValues(raws,tRows,false); for(let i=0;i<tRows;i++){ const tr=src.r2+1+i; let raw=vals[i]; const srcRaw=raws[i%raws.length]; if(typeof srcRaw==='string'&&srcRaw[0]==='='){ raw=HE.translateFormula(srcRaw,0,(tr-(src.r1+i%raws.length))); } model.setCell(s.name,c,tr,raw,{noRecalc:true}); copyStyle(s,c,src.r1+(i%raws.length),c,tr); } } else { const tRows=src.r1-p.r1; const vals=computeFillValues(raws.slice().reverse(),tRows,true); for(let i=0;i<tRows;i++){ const tr=src.r1-1-i; model.setCell(s.name,c,tr,vals[i],{noRecalc:true}); } } } }
  else { for(let r=src.r1;r<=src.r2;r++){ const raws=[]; for(let c=src.c1;c<=src.c2;c++) raws.push(rawInput(s,c,r)); if(p.dir==='right'){ const tCols=p.c2-src.c2; const vals=computeFillValues(raws,tCols,false); for(let i=0;i<tCols;i++){ const tc=src.c2+1+i; let raw=vals[i]; const srcRaw=raws[i%raws.length]; if(typeof srcRaw==='string'&&srcRaw[0]==='='){ raw=HE.translateFormula(srcRaw,(tc-(src.c1+i%raws.length)),0); } model.setCell(s.name,tc,r,raw,{noRecalc:true}); copyStyle(s,src.c1+(i%raws.length),r,tc,r); } } else { const tCols=src.c1-p.c1; const vals=computeFillValues(raws.slice().reverse(),tCols,true); for(let i=0;i<tCols;i++){ const tc=src.c1-1-i; model.setCell(s.name,tc,r,vals[i],{noRecalc:true}); } } } }
  model.recalcAll(); setSelection(p.c1,p.r1,p.c2,p.r2,src.c1,src.r1); afterMutation(); }
function copyStyle(s,fc,fr,tc,tr){ const st=styleOf(s,fc,fr); const fmt=(s.cells.get(HE.key(fc,fr))||{}).fmt; if(st){ ensureStyle(s,tc,tr); s.styles.set(HE.key(tc,tr),JSON.parse(JSON.stringify(st))); } const tcell=s.cells.get(HE.key(tc,tr)); if(tcell&&fmt) tcell.fmt=fmt; }

/* ---------- sheet operations ---------- */
function activateSheet(name){ if(state.editing) commitEdit(0,0); state.activeSheet=name; state.scroll={x:0,y:0}; setSelection(0,0,0,0,0,0); renderTabs(); render(); syncFormulaBar(); persist(); }
function addSheetUI(){ pushUndo('add sheet'); const s=model.addSheet(); state.activeSheet=s.name; setSelection(0,0,0,0,0,0); afterMutation(); }
function deleteSheet(name){ if(model.sheets.length<=1){ toast('Cannot delete the last sheet'); return; } if(!confirm('Delete sheet "'+name+'"?')) return; pushUndo('delete sheet'); model.removeSheet(name); if(state.activeSheet===name) state.activeSheet=model.sheets[0].name; afterMutation(); }
function renameSheetPrompt(name){ const nn=prompt('Rename sheet:', name); if(nn&&nn!==name){ pushUndo('rename sheet'); if(model.renameSheet(name,nn)){ if(state.activeSheet===name) state.activeSheet=nn; afterMutation(); } else toast('Name in use'); } }
function reorderSheet(from,to){ if(!from||from===to) return; const fi=model.sheetIndex(from), ti=model.sheetIndex(to); if(fi<0||ti<0) return; pushUndo('reorder'); const sh=model.sheets.splice(fi,1)[0]; model.sheets.splice(ti,0,sh); afterMutation(); }
function sheetContextMenu(e,name){ showContextMenu(e.clientX,e.clientY,[
  {label:'Rename', act:()=>renameSheetPrompt(name)},
  {label:'Delete', danger:true, act:()=>deleteSheet(name)},
  {sep:true},
  {label:'Tab Color…', act:()=>colorSheetPrompt(name)},
  {label:'Duplicate', act:()=>duplicateSheet(name)}
]); }
function colorSheetPrompt(name){ const colors=['#137a4b','#1a56db','#b45309','#7c3aed','#be185d','#0f766e','#c0392b',null]; const s=model.getSheet(name); const i=colors.indexOf(s.color); s.color=colors[(i+1)%colors.length]; renderTabs(); persist(); }
function duplicateSheet(name){ const src=model.getSheet(name); pushUndo('duplicate'); const ns=model.addSheet(name+' copy'); src.cells.forEach((cell,k)=>{ model.setCell(ns.name,HE.keyCol(k),HE.keyRow(k),cell.raw,{noRecalc:true}); }); ns.styles=new Map(); if(src.styles) src.styles.forEach((v,k)=>ns.styles.set(k,JSON.parse(JSON.stringify(v)))); ns.colWidths=Object.assign({},src.colWidths); ns.rowHeights=Object.assign({},src.rowHeights); model.recalcAll(); state.activeSheet=ns.name; afterMutation(); }

/* ---------- name box navigation ---------- */
function navigateNameBox(txt){ txt=txt.trim(); if(!txt) return; const nm=model.names[txt.toUpperCase()]; if(nm&&nm.def&&nm.def.type==='ref'){ txt=nm.def.text; }
  const ref=HE.parseRefToken(txt.replace(/\$/g,'')); if(ref){ if(ref.sheet && model.getSheet(ref.sheet)) state.activeSheet=ref.sheet; const c1=ref.c1==null?0:ref.c1, r1=ref.r1==null?0:ref.r1, c2=ref.c2==null?c1:ref.c2, r2=ref.r2==null?r1:ref.r2; setSelection(c1,r1,c2,r2,c1,r1); ensureVisible(c1,r1); renderTabs(); render(); syncFormulaBar(); } else { toast('Unknown reference'); } }

/* ---------- context menu helper ---------- */
function showContextMenu(x,y,items){ const m=document.getElementById('ctxMenu'); m.innerHTML=''; items.forEach(it=>{ if(it.sep){ const d=document.createElement('div'); d.className='sep'; m.appendChild(d); return; } const el=document.createElement('div'); el.className='ci'+(it.danger?' danger':''); el.innerHTML=`<span>${it.label}</span>`+(it.key?`<span class="k">${it.key}</span>`:''); el.onclick=()=>{ hideContextMenu(); it.act&&it.act(); }; m.appendChild(el); }); m.style.display='block'; const mw=m.offsetWidth, mh=m.offsetHeight; m.style.left=Math.min(x,window.innerWidth-mw-6)+'px'; m.style.top=Math.min(y,window.innerHeight-mh-6)+'px'; }
function hideContextMenu(){ document.getElementById('ctxMenu').style.display='none'; }

/* ================================================================
 * Chunk C2 — event wiring
 * ================================================================ */
function overlayOpen(){ const o=document.getElementById('overlay'); return o&&o.classList.contains('open'); }
function colBorderHit(s,cssX){ const Z=state.zoom; for(const C of (state._visCols||[])){ const edge=(C.x+C.w)*Z; if(Math.abs(cssX-edge)<5) return C.c; } return -1; }
function rowBorderHit(s,cssY){ const Z=state.zoom; for(const R of (state._visRows||[])){ const edge=(R.y+R.h)*Z; if(Math.abs(cssY-edge)<5) return R.r; } return -1; }
function fillHandleHit(cssX,cssY){ const s=sheet(); const b=selBounds(); const Z=state.zoom; const x2=(sxCol(s,b.c2)+colW(s,b.c2))*Z, y2=(syRow(s,b.r2)+rowH(s,b.r2))*Z; return Math.abs(cssX-x2)<6 && Math.abs(cssY-y2)<6; }

function wireInteractions(){
  const wrap=document.getElementById('gridwrap');
  const ed=editorEl();
  wrap.addEventListener('mousedown', onGridDown);
  window.addEventListener('mousemove', onGridMove);
  window.addEventListener('mouseup', onGridUp);
  wrap.addEventListener('dblclick', onGridDbl);
  wrap.addEventListener('contextmenu', onGridCtx);
  wrap.addEventListener('wheel', onWheel, {passive:false});
  document.getElementById('vscroll').addEventListener('scroll', ()=>{ if(state._syncing) return; state.scroll.y=document.getElementById('vscroll').scrollTop/state.zoom; render(); });
  document.getElementById('hscroll').addEventListener('scroll', ()=>{ if(state._syncing) return; state.scroll.x=document.getElementById('hscroll').scrollLeft/state.zoom; render(); });
  document.addEventListener('keydown', onDocKey);
  document.addEventListener('mousedown', (e)=>{ const m=document.getElementById('ctxMenu'); if(m.style.display==='block' && !m.contains(e.target)) hideContextMenu(); });
  ed.addEventListener('keydown', onEditorKey);
  ed.addEventListener('input', ()=>{ document.getElementById('formulaInput').value=ed.value; highlightFormula(ed.value); maybeAutocomplete(ed); });
  const fi=document.getElementById('formulaInput');
  fi.addEventListener('focus', ()=>{ if(!state.editing) beginEdit(fi.value,true); });
  fi.addEventListener('input', ()=>{ if(state.editing){ ed.value=fi.value; highlightFormula(fi.value); } });
  fi.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); commitEdit(0,1); } else if(e.key==='Escape'){ e.preventDefault(); cancelEdit(); } else if(e.key==='Tab'){ e.preventDefault(); commitEdit(1,0); } });
  const nb=document.getElementById('nameBox');
  nb.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ navigateNameBox(nb.value); nb.blur(); } });
  const zoom=document.getElementById('zoom');
  zoom.addEventListener('input', ()=>{ state.zoom=zoom.value/100; document.getElementById('zoomv').textContent=zoom.value+'%'; syncScrollbars(); render(); });
  document.addEventListener('paste',(e)=>{ if(state.editing||overlayOpen()) return; const t=(e.clipboardData||window.clipboardData).getData('text'); if(t&&!state.clipboard){ e.preventDefault(); pasteTSV(t); } });
  window.addEventListener('resize', ()=>render());
  if(window.ResizeObserver){ new ResizeObserver(()=>render()).observe(wrap); }
}

function evtCss(e){ const r=document.getElementById('gridwrap').getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
function onGridDown(e){ if(e.button===2) return; const {x:cssX,y:cssY}=evtCss(e); if(cssX>VW||cssY>VH) return; const s=sheet(); const pt=pointToCell(cssX,cssY);
  if((pt.type==='colheader'||pt.type==='corner')){ const hc=colBorderHit(s,cssX); if(hc>=0){ pushUndo('resize col'); state.drag={mode:'resizeCol',c:hc,startX:e.clientX,startW:colW(s,hc)}; return; } }
  if((pt.type==='rowheader'||pt.type==='corner')){ const hr=rowBorderHit(s,cssY); if(hr>=0){ pushUndo('resize row'); state.drag={mode:'resizeRow',r:hr,startY:e.clientY,startH:rowH(s,hr)}; return; } }
  if(!state.editing && fillHandleHit(cssX,cssY)){ state.drag={mode:'fill'}; return; }
  if(state.editing){ if(pt.type==='cell' && editorWantsRef()){ insertRefAtCaret(A1(pt.c)+(pt.r+1)); return; } commitEdit(0,0); }
  if(pt.type==='corner'){ selectAll(); return; }
  if(pt.type==='colheader'){ selectCols(pt.c,e.shiftKey,e.ctrlKey||e.metaKey); state.active={c:pt.c,r:0}; state.drag={mode:'colsel',start:pt.c}; render(); syncFormulaBar(); return; }
  if(pt.type==='rowheader'){ selectRows(pt.r,e.shiftKey,e.ctrlKey||e.metaKey); state.active={c:0,r:pt.r}; state.drag={mode:'rowsel',start:pt.r}; render(); syncFormulaBar(); return; }
  if(pt.type==='cell'){ if(e.shiftKey){ extendTo(pt.c,pt.r); state.active=state.active; } else if(e.ctrlKey||e.metaKey){ state.ranges.push(Object.assign({},state.sel)); setSelection(pt.c,pt.r,pt.c,pt.r); } else { setSelection(pt.c,pt.r,pt.c,pt.r); } state.drag={mode:'select',startC:pt.c,startR:pt.r}; render(); syncFormulaBar(); }
}
function onGridMove(e){ const d=state.drag; if(!d){ const {x:cssX,y:cssY}=evtCss(e); const s=sheet(); let cur='default'; if(cssX<=VW&&cssY<=VH){ if((cssY< HDRH*state.zoom) && colBorderHit(s,cssX)>=0) cur='col-resize'; else if((cssX< HDRW*state.zoom)&&rowBorderHit(s,cssY)>=0) cur='row-resize'; else if(fillHandleHit(cssX,cssY)) cur='crosshair'; } document.getElementById('grid').style.cursor=cur; return; }
  const {x:cssX,y:cssY}=evtCss(e); const s=sheet();
  if(d.mode==='resizeCol'){ let nw=Math.max(16,Math.round(d.startW+(e.clientX-d.startX)/state.zoom)); s.colWidths[d.c]=nw; invalidateOv(s); render(); return; }
  if(d.mode==='resizeRow'){ let nh=Math.max(10,Math.round(d.startH+(e.clientY-d.startY)/state.zoom)); s.rowHeights[d.r]=nh; invalidateOv(s); render(); return; }
  const pt=pointToCell(Math.min(cssX,VW-1),Math.min(cssY,VH-1));
  if(d.mode==='fill'){ const b=selBounds(); let p=null; const c=pt.c,r=pt.r; if(r>b.r2) p={c1:b.c1,r1:b.r1,c2:b.c2,r2:r,dir:'down'}; else if(r<b.r1) p={c1:b.c1,r1:r,c2:b.c2,r2:b.r2,dir:'up'}; else if(c>b.c2) p={c1:b.c1,r1:b.r1,c2:c,r2:b.r2,dir:'right'}; else if(c<b.c1) p={c1:c,r1:b.r1,c2:b.c2,r2:b.r2,dir:'left'}; state.fillPreview=p; render(); return; }
  if(d.mode==='select'){ setSelection(d.startC,d.startR,pt.c,pt.r,d.startC,d.startR); render(); syncFormulaBar(); return; }
  if(d.mode==='colsel'){ state.sel={c1:d.start,r1:0,c2:pt.c,r2:ROWS-1}; state.active={c:d.start,r:0}; render(); syncFormulaBar(); return; }
  if(d.mode==='rowsel'){ state.sel={c1:0,r1:d.start,c2:COLS-1,r2:pt.r}; state.active={c:0,r:d.start}; render(); syncFormulaBar(); return; }
}
function onGridUp(e){ const d=state.drag; if(!d){ return; } if(d.mode==='fill'&&state.fillPreview){ applyFill(state.fillPreview); state.fillPreview=null; } if(d.mode==='resizeCol'||d.mode==='resizeRow'){ persist(); } document.getElementById('grid').style.cursor='default'; state.drag=null; }
function onGridDbl(e){ const {x:cssX,y:cssY}=evtCss(e); const s=sheet(); const pt=pointToCell(cssX,cssY); if(pt.type==='colheader'){ const hc=colBorderHit(s,cssX); if(hc>=0){ autoFitCol(hc); return; } } if(pt.type==='rowheader'){ const hr=rowBorderHit(s,cssY); if(hr>=0){ return; } } if(pt.type==='cell'){ const s2=sheet(); const rule=dvRuleAt(s2,pt.c,pt.r); if(rule&&rule.type==='list'){ setSelection(pt.c,pt.r,pt.c,pt.r); render(); dvOpenDropdown(); } else beginEdit(); } }
function onWheel(e){ if(overlayOpen()) return; if(e.ctrlKey||e.metaKey){ e.preventDefault(); const z=Math.max(0.4,Math.min(2, state.zoom*(e.deltaY<0?1.1:0.9))); state.zoom=z; document.getElementById('zoom').value=Math.round(z*100); document.getElementById('zoomv').textContent=Math.round(z*100)+'%'; syncScrollbars(); render(); return; } e.preventDefault(); const vs=document.getElementById('vscroll'), hs=document.getElementById('hscroll'); if(e.shiftKey){ hs.scrollLeft+=e.deltaY; } else { vs.scrollTop+=e.deltaY; hs.scrollLeft+=e.deltaX; } }
function onEditorKey(e){ if(acVisible()){ if(e.key==='ArrowDown'){ acMove(1); e.preventDefault(); return; } if(e.key==='ArrowUp'){ acMove(-1); e.preventDefault(); return; } if(e.key==='Enter'||e.key==='Tab'){ acAccept(); e.preventDefault(); return; } if(e.key==='Escape'){ hideAutocomplete(); e.preventDefault(); return; } }
  if(e.key==='Enter'){ e.preventDefault(); commitEdit(0,e.shiftKey?-1:1); } else if(e.key==='Tab'){ e.preventDefault(); commitEdit(e.shiftKey?-1:1,0); } else if(e.key==='Escape'){ e.preventDefault(); cancelEdit(); } else if(e.key==='F4'){ e.preventDefault(); cycleRefAtCaret(); } }
function autoFitCol(c){ const s=sheet(); const meas=document.createElement('canvas').getContext('2d'); let max=40; const b=s.maxRow; for(let r=0;r<=b;r++){ const disp=displayText(s,c,r); if(!disp) continue; const st=styleOf(s,c,r); meas.font=fontStr(st); const w=meas.measureText(disp).width+12; if(w>max) max=w; } pushUndo('autofit'); s.colWidths[c]=Math.min(400,Math.ceil(max)); invalidateOv(s); afterMutation(); }

function onDocKey(e){ const t=e.target; if(overlayOpen()) return; if(t.id==='nameBox'||t.id==='formulaInput'||t===editorEl()) return; if(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT') return;
  const k=e.key, ext=e.shiftKey, meta=e.ctrlKey||e.metaKey;
  if(meta){ const lk=k.toLowerCase(); if(lk==='c'){ copySelection(false); e.preventDefault(); return; } if(lk==='x'){ copySelection(true); e.preventDefault(); return; } if(lk==='v'){ if(state.clipboard){ pasteClipboard(); e.preventDefault(); } return; } if(lk==='z'){ e.preventDefault(); undo(); return; } if(lk==='y'){ e.preventDefault(); redo(); return; } if(lk==='b'){ e.preventDefault(); toggleStyleProp(selCellsArr(),'bold'); return; } if(lk==='i'){ e.preventDefault(); toggleStyleProp(selCellsArr(),'italic'); return; } if(lk==='u'){ e.preventDefault(); toggleStyleProp(selCellsArr(),'underline'); return; } if(lk==='a'){ e.preventDefault(); selectAll(); return; } if(lk==='s'){ e.preventDefault(); persistNow(); toast('Saved locally'); return; } if(lk==='f'){ e.preventDefault(); if(typeof openFindReplace==='function') openFindReplace(); return; } }
  if(e.altKey && k==='='){ e.preventDefault(); autoSum(); return; }
  switch(k){
    case 'ArrowUp': e.preventDefault(); meta?jumpActive(0,-1,ext):moveActive(0,-1,ext); return;
    case 'ArrowDown': e.preventDefault(); meta?jumpActive(0,1,ext):moveActive(0,1,ext); return;
    case 'ArrowLeft': e.preventDefault(); meta?jumpActive(-1,0,ext):moveActive(-1,0,ext); return;
    case 'ArrowRight': e.preventDefault(); meta?jumpActive(1,0,ext):moveActive(1,0,ext); return;
    case 'Enter': e.preventDefault(); moveActive(0,ext?-1:1,false); return;
    case 'Tab': e.preventDefault(); moveActive(ext?-1:1,0,false); return;
    case 'F2': e.preventDefault(); beginEdit(); return;
    case 'Delete': case 'Backspace': e.preventDefault(); clearContentsOnly(); return;
    case 'Home': e.preventDefault(); if(meta){ setSelection(0,0,0,0,0,0); ensureVisible(0,0); } else { setSelection(0,state.active.r,0,state.active.r,0,state.active.r); } render(); syncFormulaBar(); return;
    case 'PageDown': e.preventDefault(); moveActive(0,25,ext); return;
    case 'PageUp': e.preventDefault(); moveActive(0,-25,ext); return;
    case 'Escape': state.ranges=[]; render(); return;
  }
  if(k.length===1 && !e.ctrlKey && !e.metaKey && !e.altKey){ beginEdit(k); e.preventDefault(); }
}
function onGridCtx(e){ e.preventDefault(); const {x:cssX,y:cssY}=evtCss(e); const pt=pointToCell(cssX,cssY); if(pt.type==='cell'){ const b=selBounds(); if(!(pt.c>=b.c1&&pt.c<=b.c2&&pt.r>=b.r1&&pt.r<=b.r2)){ setSelection(pt.c,pt.r,pt.c,pt.r); render(); syncFormulaBar(); } }
  const items=[ {label:'Cut',key:'Ctrl+X',act:()=>copySelection(true)}, {label:'Copy',key:'Ctrl+C',act:()=>copySelection(false)}, {label:'Paste',key:'Ctrl+V',act:()=>state.clipboard&&pasteClipboard()}, {sep:true},
    {label:'Insert Rows',act:()=>insertRows()}, {label:'Insert Columns',act:()=>insertCols()}, {label:'Delete Rows',act:()=>deleteRows()}, {label:'Delete Columns',act:()=>deleteCols()}, {sep:true},
    {label:'Clear Contents',act:()=>clearContentsOnly()}, {label:'Clear All',act:()=>clearSelection()}, {sep:true},
    {label:'Format Cells…',act:()=>openFormatDialog()}, {label:'Define Name…',act:()=>openNameManager()} ];
  if(pt.type==='colheader'){ items.unshift({label:'Hide Column',act:()=>hideSelectedCols()},{label:'Unhide',act:()=>unhideAll()},{sep:true}); }
  showContextMenu(e.clientX,e.clientY,items); }

/* ================================================================
 * Chunk D — structural ops, formatting, merges, ribbon
 * ================================================================ */
function shiftPair(a,b,at,delta){ if(a===null||b===null||a===undefined) return {a,b,dead:false};
  if(delta>0){ return {a:a>=at?a+delta:a, b:b>=at?b+delta:b, dead:false}; }
  const count=-delta, delEnd=at+count-1; function one(v){ if(v>delEnd) return v-count; if(v>=at) return 'in'; return v; }
  let na=one(a), nb=one(b); if(na==='in'&&nb==='in') return {dead:true}; if(na==='in') na=at; if(nb==='in') nb=at; if(na>nb){ const t=na;na=nb;nb=t; } return {a:na,b:nb,dead:false}; }
function adjustFormula(raw, kind, at, delta){ if(typeof raw!=='string'||raw[0]!=='=') return raw; let toks; try{toks=HE.tokenize(raw.slice(1));}catch(e){return raw;} for(let i=0;i<toks.length;i++){ const t=toks[i]; if(t.t!=='ref') continue; const ref=t.v; if(ref.sheet) continue; if(kind==='row'){ if(ref.r1===null) continue; const p=shiftPair(ref.r1,ref.r2,at,delta); if(p.dead){ toks[i]={t:'err',v:HE.ERR.REF}; continue; } ref.r1=p.a; ref.r2=p.b; } else { if(ref.c1===null) continue; const p=shiftPair(ref.c1,ref.c2,at,delta); if(p.dead){ toks[i]={t:'err',v:HE.ERR.REF}; continue; } ref.c1=p.a; ref.c2=p.b; } } return '='+HE.serializeTokens(toks); }
function shiftIndexMap(map,at,delta){ const nm={}; Object.keys(map).forEach(k=>{ let i=+k; if(delta>0){ if(i>=at) i+=delta; nm[i]=map[k]; } else { const count=-delta; if(i>=at&&i<at+count) return; if(i>=at+count) i-=count; nm[i]=map[k]; } }); return nm; }
function structuralOp(kind,at,count,insert){ const s=sheet(); pushUndo(insert?('Insert '+kind+'s'):('Delete '+kind+'s'));
  const snap=[]; s.cells.forEach((cell,k)=>{ snap.push({c:HE.keyCol(k),r:HE.keyRow(k),raw:cell.raw,fmt:cell.fmt||null,st:(s.styles&&s.styles.get(k))||null}); });
  s.cells=new Map(); s.spill=new Map(); s.styles=new Map(); s.maxRow=-1; s.maxCol=-1;
  const delta=insert?count:-count;
  for(const e of snap){ let nc=e.c, nr=e.r; if(kind==='row'){ if(insert){ if(e.r>=at) nr=e.r+count; } else { if(e.r>=at&&e.r<at+count) continue; if(e.r>=at+count) nr=e.r-count; } } else { if(insert){ if(e.c>=at) nc=e.c+count; } else { if(e.c>=at&&e.c<at+count) continue; if(e.c>=at+count) nc=e.c-count; } } let raw=e.raw; if(typeof raw==='string'&&raw[0]==='=') raw=adjustFormula(raw,kind,at,delta); model.setCell(s.name,nc,nr,raw,{noRecalc:true}); const cc=s.cells.get(HE.key(nc,nr)); if(cc&&e.fmt) cc.fmt=e.fmt; if(e.st) s.styles.set(HE.key(nc,nr),e.st); }
  if(kind==='row') s.rowHeights=shiftIndexMap(s.rowHeights,at,delta); else s.colWidths=shiftIndexMap(s.colWidths,at,delta);
  if(kind==='row') s.hiddenRows=shiftIndexMap(s.hiddenRows,at,delta); else s.hiddenCols=shiftIndexMap(s.hiddenCols,at,delta);
  // shift merges & conditional formats & validations ranges
  (s.merges||[]).forEach(m=>{ if(kind==='row'){ const p=shiftPair(m.r1,m.r2,at,delta); if(!p.dead){ m.r1=p.a; m.r2=p.b; } } else { const p=shiftPair(m.c1,m.c2,at,delta); if(!p.dead){ m.c1=p.a; m.c2=p.b; } } });
  model.recalcAll(); invalidateOv(s); afterMutation(); }
function insertRows(){ const b=selBounds(); structuralOp('row',b.r1,b.r2-b.r1+1,true); }
function deleteRows(){ const b=selBounds(); structuralOp('row',b.r1,b.r2-b.r1+1,false); }
function insertCols(){ const b=selBounds(); structuralOp('col',b.c1,b.c2-b.c1+1,true); }
function deleteCols(){ const b=selBounds(); structuralOp('col',b.c1,b.c2-b.c1+1,false); }
function hideSelectedCols(){ const s=sheet(); const b=selBounds(); pushUndo('hide cols'); for(let c=b.c1;c<=b.c2;c++) s.hiddenCols[c]=true; invalidateOv(s); afterMutation(); }
function hideSelectedRows(){ const s=sheet(); const b=selBounds(); pushUndo('hide rows'); for(let r=b.r1;r<=b.r2;r++) s.hiddenRows[r]=true; invalidateOv(s); afterMutation(); }
function unhideAll(){ const s=sheet(); pushUndo('unhide'); s.hiddenCols={}; s.hiddenRows={}; invalidateOv(s); afterMutation(); }

/* ---------- merges ---------- */
function mergeAt(s,c,r){ const ms=s.merges||[]; for(const m of ms){ if(c>=m.c1&&c<=m.c2&&r>=m.r1&&r<=m.r2) return {ac:m.c1,ar:m.r1,c1:m.c1,r1:m.r1,c2:m.c2,r2:m.r2}; } return null; }
mergeAtFn=mergeAt;
function mergeCenter(){ const s=sheet(); const b=selBounds(); if(b.c1===b.c2&&b.r1===b.r2){ return; } pushUndo('merge');
  // remove overlapping merges
  s.merges=(s.merges||[]).filter(m=>!(m.c1<=b.c2&&m.c2>=b.c1&&m.r1<=b.r2&&m.r2>=b.r1));
  s.merges.push({c1:b.c1,r1:b.r1,c2:b.c2,r2:b.r2});
  const st=ensureStyle(s,b.c1,b.r1); st.align='center'; afterMutation(); }
function unmerge(){ const s=sheet(); const b=selBounds(); pushUndo('unmerge'); s.merges=(s.merges||[]).filter(m=>!(m.c1<=b.c2&&m.c2>=b.c1&&m.r1<=b.r2&&m.r2>=b.r1)); afterMutation(); }
function toggleMerge(){ const s=sheet(); const b=selBounds(); const has=(s.merges||[]).some(m=>m.c1===b.c1&&m.r1===b.r1&&m.c2===b.c2&&m.r2===b.r2); if(has) unmerge(); else mergeCenter(); }

/* ---------- number formats ---------- */
const NUMFMTS={ 'General':'General','Number':'#,##0.00','Currency':'$#,##0.00','Accounting':'_($* #,##0.00_);_($* (#,##0.00);_($* "-"??_);_(@_)','Percent':'0.00%','Comma':'#,##0.00','Scientific':'0.00E+00','Short Date':'yyyy-mm-dd','Long Date':'dddd, mmmm d, yyyy','Time':'hh:mm:ss','Fraction':'# ?/?','Text':'@' };
function applyFormatPreset(name){ setStyleProp(selCellsArr(),'fmt', NUMFMTS[name]||'General'); }
function applyFormatString(fmt){ setStyleProp(selCellsArr(),'fmt', fmt); }
function togglePercent(){ setStyleProp(selCellsArr(),'fmt','0.00%'); }
function adjustDecimals(delta){ const s=sheet(); const cells=selCellsArr(); pushUndo('decimals'); cells.forEach(({c,r})=>{ const st=ensureStyle(s,c,r); let fmt=st.fmt||cellFormat(s,c,r); if(fmt==='General'||fmt==='@') fmt='0'; const m=fmt.match(/^(.*?0)(\.0*)?(.*)$/); let intp=m?m[1]:'0', dec=m&&m[2]?m[2].slice(1):'', tail=m?m[3]:''; let n=dec.length+delta; if(n<0)n=0; st.fmt=intp+(n>0?'.'+'0'.repeat(n):'')+tail; }); persist(); render(); }

/* ---------- borders ---------- */
function applyBorder(type){ const s=sheet(); const b=selBounds(); pushUndo('border'); const setB=(c,r,sides)=>{ const st=ensureStyle(s,c,r); if(type==='none'){ delete st.borders; return; } st.borders=Object.assign({},st.borders); sides.forEach(sd=>st.borders[sd]=true); };
  for(let r=b.r1;r<=b.r2;r++) for(let c=b.c1;c<=b.c2;c++){ let sides=[]; if(type==='all') sides=['top','bottom','left','right']; else if(type==='outer'){ if(r===b.r1)sides.push('top'); if(r===b.r2)sides.push('bottom'); if(c===b.c1)sides.push('left'); if(c===b.c2)sides.push('right'); } else if(type==='top'&&r===b.r1) sides=['top']; else if(type==='bottom'&&r===b.r2) sides=['bottom']; else if(type==='left'&&c===b.c1) sides=['left']; else if(type==='right'&&c===b.c2) sides=['right']; else if(type==='none') sides=[]; setB(c,r,sides); }
  persist(); render(); }

function openSwatchPopover(anchorEl, cb){ closePopover(); const pop=document.createElement('div'); pop.className='ctx'; pop.style.display='block'; pop.style.minWidth='0'; pop.style.padding='8px'; pop.innerHTML='<div class="swatches">'+PALETTE.map(c=>`<span class="sw" data-c="${c}" style="background:${c};border-color:${c==='#ffffff'?'#ccc':'transparent'}"></span>`).join('')+'</div><div style="margin-top:8px;display:flex;gap:6px;align-items:center"><input type="color" id="_customclr" style="width:40px;height:26px;padding:0"><button class="btn" id="_clrnone">No Fill</button></div>';

function togState(tog){ if(!tog) return false; const cells=selCellsArr(); const s=sheet(); if(tog==='bold'||tog==='italic'||tog==='underline') return cells.some(({c,r})=>{ const st=styleOf(s,c,r); return st&&st[tog]; }); if(tog==='_iter') return model.iterative; if(tog==='_showf') return !!state.showFormulas; if(tog==='_grid') return !!state.hideGridlines; if(tog==='_filter') return !!(s.filter&&s.filter.active); return false; }
function buildRibbon(){ const tab=state.ribbonTab; const body=document.getElementById('ribbonBody'); body.innerHTML=''; const groups=RIBBON()[tab]||[];

function rowHeightPrompt(){ const s=sheet(); const b=selBounds(); const v=prompt('Row height (px):', rowH(s,b.r1)); if(v){ pushUndo('row height'); for(let r=b.r1;r<=b.r2;r++) s.rowHeights[r]=Math.max(8,+v); invalidateOv(s); afterMutation(); } }
