<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A deterministic procedural universe generator. Fly from galactic scale to planetary surfaces with consistent, seed-based generation.">
    <meta name="keywords" content="canvas, interactive, procedural, universe, galaxy, space, deterministic, offline">
    <meta name="theme-color" content="#000005">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%2300ffff' d='m16 0 4 12 12 4-12 4-4 12-4-12L0 16l12-4z'/%3E%3C/svg%3E">
    <title>Deterministic Universe Explorer</title>
    <!-- Self-contained, offline, seed-addressed procedural space exploration. -->
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; }
        body { overflow: hidden; background: #000005; font-family: 'Segoe UI', monospace; color: #fff; }
        #canvas-container { position: fixed; inset: 0; }
        canvas { display: block; width: 100%; height: 100%; }
        #ui { position: fixed; top: 20px; left: 20px; width: 300px; pointer-events: none; }
        .panel {
            background: rgba(0, 10, 20, 0.88); border: 1px solid #00ffff;
            padding: 15px; border-radius: 4px; margin-bottom: 10px;
            pointer-events: auto; backdrop-filter: blur(5px);
        }
        h1 {
            font-size: 24px; margin: 0 0 10px; text-transform: uppercase;
            letter-spacing: 4px; text-shadow: 0 0 10px #00ffff;
        }
        h2 { margin: 0 0 8px; font-size: 17px; color: #00ffff; overflow-wrap: anywhere; }
        .data-row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 5px; font-size: 12px; color: #a9bac5; }
        .data-val { color: #fff; font-weight: bold; font-family: monospace; text-align: right; }
        #obj-stats { font-size: 12px; line-height: 1.6; color: #b6c8d3; min-height: 38px; }
        #choice-label { margin: 12px 0 5px; font-size: 10px; letter-spacing: 1px; color: #a9bac5; }
        #choices, .button-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
        .button-row { margin-top: 12px; }
        button, .file-button {
            background: rgba(0, 255, 255, 0.08); border: 1px solid #00aeb8; border-radius: 0;
            color: #71ffff; padding: 9px 7px; cursor: pointer; min-width: 0; min-height: 44px;
            font-family: inherit; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
            overflow-wrap: anywhere; text-align: center;
        }
        button:active:not(:disabled), .file-button:active { background: rgba(0, 255, 255, 0.22); }
        button[aria-pressed="true"] { border-color: #00ffff; background: rgba(0, 255, 255, 0.18); box-shadow: inset 0 0 12px #00ffff18; }
        button:disabled { opacity: 0.45; cursor: default; }
        button small { display: block; font-size: 9px; color: #bbd5df; margin-top: 3px; text-transform: none; }
        :focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
        #breadcrumbs { position: fixed; top: 20px; right: 20px; display: flex; gap: 8px; pointer-events: none; }
        .crumb { background: #000a; border: 1px solid #384753; padding: 6px 9px; font-size: 11px; color: #92a2b0; }
        .crumb.active { border-color: #00ffff; color: #00ffff; }
        .crumb.future { opacity: 0.4; }
        details { margin-top: 12px; font-size: 11px; color: #a9bac5; }
        summary { cursor: pointer; color: #71ffff; padding: 4px 0; }
        #seed-form { display: flex; gap: 6px; margin-top: 8px; }
        input { min-width: 0; width: 100%; color: #fff; background: #00131e; border: 1px solid #44717d; padding: 8px; font: inherit; }
        #seed-form button { min-width: 55px; }
        .file-button { display: grid; place-items: center; position: relative; }
        #import-file { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .file-button:focus-within { outline: 2px solid #fff; outline-offset: 3px; }
        #share-link { display: block; color: #71ffff; padding: 12px 0 4px; }
        #status { font-size: 11px; line-height: 1.5; color: #ffd59b; margin: 8px 0 0; }
        #status:empty { display: none; }
        [hidden] { display: none !important; }
        @media (max-width: 640px) {
            #ui { inset: 12px; width: auto; display: flex; flex-direction: column; justify-content: space-between; }
            .panel { padding: 12px; margin: 0; }
            h1 { font-size: 22px; margin-bottom: 8px; }
            #breadcrumbs { top: 140px; left: 12px; right: 12px; gap: 5px; justify-content: center; }
            .crumb { flex: 1; text-align: center; font-size: 10px; padding: 5px 3px; }
            #obj-stats { font-size: 11px; min-height: 32px; }
            #choice-label { margin-top: 8px; }
            .button-row { margin-top: 8px; }
            details { margin-top: 8px; }
            #info-panel { max-height: calc(100dvh - 180px); overflow-y: auto; }
        }
        @media (max-height: 600px) {
            #ui { top: 10px; bottom: 10px; left: 10px; width: 260px; overflow-y: auto; display: block; }
            .panel { margin-bottom: 8px; padding: 10px; }
            #breadcrumbs { top: 10px; left: auto; right: 10px; }
            #info-panel { max-height: none; overflow: visible; }
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas aria-label="Procedural universe" role="img">Your browser needs Canvas support to display this universe.</canvas>
    </div>
    <main id="ui">
        <section id="overview-panel" class="panel" aria-label="Universe coordinates">
            <h1>Omni-Verse</h1>
            <div class="data-row"><span>Universe Seed</span><span id="seed-val" class="data-val">1337</span></div>
            <div class="data-row"><span>Current Scale</span><span id="scale-val" class="data-val">GALAXY</span></div>
            <div class="data-row"><span>Coordinates</span><span id="coords-val" class="data-val">0, 0, 0</span></div>
        </section>
        <section id="info-panel" class="panel" aria-label="Selected object">
            <h2 id="obj-name"></h2>
            <div id="obj-stats"></div>
            <div id="choice-label">SELECT A STAR</div>
            <div id="choices" aria-label="Destinations"></div>
            <div class="button-row">
                <button id="action-btn" type="button">Enter System</button>
                <button id="back-btn" type="button" disabled>Back</button>
            </div>
            <details id="universe-controls">
                <summary>Seed &amp; travel data</summary>
                <form id="seed-form">
                    <input id="seed-input" aria-label="Universe seed (0 to 4294967295)" inputmode="numeric" pattern="[0-9]+" required>
                    <button type="submit">Go</button>
                </form>
                <div class="button-row">
                    <button id="export-btn" type="button">Export JSON</button>
                    <label class="file-button">Import JSON<input id="import-file" type="file" accept=".json,application/json" aria-label="Import universe JSON"></label>
                </div>
                <a id="share-link" href="#">Permalink to this exact view</a>
            </details>
            <p id="status" role="status" aria-live="polite"></p>
        </section>
    </main>
    <nav id="breadcrumbs" aria-label="Exploration depth">
        <span class="crumb" id="crumb-galaxy">GALAXY</span>
        <span class="crumb" id="crumb-system">SYSTEM</span>
        <span class="crumb" id="crumb-orbit">ORBIT</span>
        <span class="crumb" id="crumb-surface">SURFACE</span>
    </nav>
    <script>
        (() => {
            'use strict';
            const $ = id => document.getElementById(id);
            const canvas = document.querySelector('#canvas-container canvas');
            const ctx = canvas.getContext('2d');
            if (!ctx) {
                $('status').textContent = 'Canvas is unavailable. Please open this file in a browser with Canvas support.';
                return;
            }
            const TAU = Math.PI * 2;
            const LEVELS = ['galaxy', 'system', 'orbit', 'surface'];
            const SYLLABLES = ['al', 'ar', 'bel', 'cen', 'cy', 'del', 'el', 'io', 'ka', 'ly', 'mir', 'na', 'or', 'pha', 'qua', 'ri', 'sol', 'ta', 'ul', 've', 'xi', 'zen'];
            const BIOMES = [
                { type: 'Oceanic', hue: 197, low: [14, 63, 117], high: [68, 137, 83], ground: [67, 111, 77], sky: [51, 101, 135] },
                { type: 'Rocky', hue: 29, low: [79, 49, 39], high: [205, 164, 112], ground: [151, 105, 73], sky: [111, 77, 65] },
                { type: 'Ice', hue: 198, low: [35, 101, 140], high: [210, 242, 255], ground: [153, 203, 222], sky: [62, 111, 143] },
                { type: 'Lava', hue: 14, low: [35, 23, 30], high: [121, 51, 39], ground: [77, 43, 42], sky: [104, 40, 42] }
            ];
            const validSeed = value => /^\d{1,10}$/.test(String(value)) && Number(value) <= 4294967295;
            const seedText = new URLSearchParams(location.search).get('seed');
            const seed = validSeed(seedText) ? Number(seedText) : 1337;
            let state;
            let hitTargets = [];
            const textures = new Map();
            let width = 0, height = 0;

            function hash(text) {
                let n = 2166136261;
                for (let i = 0; i < text.length; i++) n = Math.imul(n ^ text.charCodeAt(i), 16777619);
                n = Math.imul(n ^ (n >>> 16), 2246822507);
                n = Math.imul(n ^ (n >>> 13), 3266489909);
                return (n ^ (n >>> 16)) >>> 0;
            }
            function random(label) {
                let n = hash(seed + ':' + label);
                return () => {
                    n = (n + 0x6d2b79f5) >>> 0;
                    let t = Math.imul(n ^ (n >>> 15), n | 1);
                    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                };
            }
            function name(label) {
                const rng = random('name:' + label);
                let result = '';
                const count = 2 + Math.floor(rng() * 2);
                for (let i = 0; i < count; i++) result += SYLLABLES[Math.floor(rng() * SYLLABLES.length)];
                return result[0].toUpperCase() + result.slice(1);
            }
            const galaxyName = name('galaxy') + ' Galaxy';
            const stars = Array.from({ length: 2 }, (_, s) => {
                const rng = random('star:' + s);
                return {
                    id: 's' + s, name: name('s' + s), hue: (35 + rng() * 200 + s * 110) % 360,
                    temperature: Math.floor(3500 + rng() * 9000),
                    coords: [0, 1, 2].map(() => Math.floor(rng() * 1600 - 800)).join(', '),
                    planets: Array.from({ length: 2 }, (_, p) => {
                        const key = 's' + s + '/p' + p;
                        const prng = random('planet:' + key);
                        return {
                            id: 'p' + p, key, name: name(key), region: name('site:' + key) + ' Basin',
                            biome: BIOMES[(hash(seed + ':biome:' + s) + p) % BIOMES.length],
                            radius: Math.floor(3200 + prng() * 6500), distance: (0.5 + p * 1.6 + prng()).toFixed(2),
                            phase: (p * 1.1 + 0.15 + prng() * 0.16) * Math.PI,
                            rotation: prng() * TAU, rings: p === 1,
                            latitude: (prng() * 120 - 60).toFixed(2),
                            longitude: (prng() * 360 - 180).toFixed(2),
                            salt: hash(seed + ':terrain:' + key)
                        };
                    })
                };
            });

            function parseRoute(fragment) {
                if (!fragment || fragment === '#galaxy') return { level: 'galaxy', star: 0, planet: 0 };
                let match = /^#galaxy\/s([01])$/.exec(fragment);
                if (match) return { level: 'galaxy', star: Number(match[1]), planet: 0 };
                match = /^#(system|orbit|surface)\/s([01])\/p([01])$/.exec(fragment);
                return match ? { level: match[1], star: Number(match[2]), planet: Number(match[3]) } : null;
            }
            function route(target) {
                return '#' + target.level + '/s' + target.star + (target.level === 'galaxy' ? '' : '/p' + target.planet);
            }
            function travel(target) {
                const fragment = route(target);
                if (location.hash !== fragment) history.pushState(null, '', fragment);
                state = target;
                update();
            }
            function restore() {
                const parsed = parseRoute(location.hash);
                if (!parsed) $('status').textContent = 'Unknown location. Returned to the galaxy.';
                state = parsed || { level: 'galaxy', star: 0, planet: 0 };
                const fragment = route(state);
                if (location.hash !== fragment) history.replaceState(null, '', fragment);
                update();
            }
            function choose(index) {
                if (state.level === 'galaxy') travel({ level: 'galaxy', star: index, planet: 0 });
                else if (state.level === 'system') travel({ ...state, planet: index });
            }
            function back() {
                const depth = LEVELS.indexOf(state.level);
                if (depth > 0) travel({ ...state, level: LEVELS[depth - 1], planet: depth === 1 ? 0 : state.planet });
            }
            function update() {
                const star = stars[state.star];
                const planet = star.planets[state.planet];
                const depth = LEVELS.indexOf(state.level);
                const names = [galaxyName, star.name + ' System', planet.name, planet.region];
                $('obj-name').textContent = names[depth];
                $('seed-val').textContent = String(seed);
                $('seed-input').value = String(seed);
                $('scale-val').textContent = LEVELS[depth].toUpperCase();
                $('coords-val').textContent = ['0, 0, 0', star.coords, planet.distance + ' AU', planet.latitude + ', ' + planet.longitude][depth];
                const descriptions = [
                    'Spiral galaxy / 2 charted stars\nSelected: ' + star.name,
                    star.temperature + ' K star / 2 charted planets\nSelected: ' + planet.name + ' / ' + planet.biome.type,
                    planet.biome.type + ' / radius ' + planet.radius + ' km\nLanding site: ' + planet.region,
                    'Survey on ' + planet.name + ' / ' + planet.biome.type + '\nLanding coordinates locked to seed'
                ];
                $('obj-stats').textContent = descriptions[depth];
                $('obj-stats').style.whiteSpace = 'pre-line';
                $('choice-label').hidden = depth > 1;
                $('choice-label').textContent = depth === 0 ? 'SELECT A STAR' : 'SELECT A PLANET';
                $('choices').hidden = depth > 1;
                $('choices').replaceChildren();
                if (depth < 2) {
                    const objects = depth === 0 ? stars : star.planets;
                    objects.forEach((object, index) => {
                        const button = document.createElement('button');
                        button.type = 'button';
                        button.setAttribute(depth === 0 ? 'data-star-id' : 'data-planet-id', object.id);
                        button.setAttribute('aria-pressed', String(index === (depth === 0 ? state.star : state.planet)));
                        button.append(document.createTextNode(object.name));
                        const sub = document.createElement('small');
                        sub.textContent = depth === 0 ? 'Star ' + (index + 1) : object.biome.type;
                        button.append(sub);
                        button.addEventListener('click', () => choose(index));
                        $('choices').append(button);
                    });
                }
                $('action-btn').textContent = ['Enter System', 'Enter Orbit', 'Land on Surface', 'Surface Reached'][depth];
                $('action-btn').disabled = depth === 3;
                $('back-btn').disabled = depth === 0;
                LEVELS.forEach((level, index) => {
                    const crumb = $('crumb-' + level);
                    crumb.className = 'crumb' + (index === depth ? ' active' : index > depth ? ' future' : '');
                    if (index === depth) crumb.setAttribute('aria-current', 'location');
                    else crumb.removeAttribute('aria-current');
                });
                $('share-link').href = location.href;
                canvas.setAttribute('aria-label', LEVELS[depth] + ': ' + names[depth] + '. Seed ' + seed + '. Select destinations using the object panel.');
                draw();
            }

            const clamp = (n, low = 0, high = 1) => Math.max(low, Math.min(high, n));
            const mix = (a, b, t) => a.map((n, i) => n + (b[i] - n) * t);
            const rgb = color => 'rgb(' + color.map(n => Math.round(clamp(n, 0, 255))).join(',') + ')';
            function lattice(x, y, z, salt) {
                let n = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1442695041) ^ salt;
                n = Math.imul(n ^ (n >>> 13), 1274126177);
                return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
            }
            function noise(x, y, z, salt) {
                const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
                const smooth = t => t * t * (3 - 2 * t);
                const fx = smooth(x - ix), fy = smooth(y - iy), fz = smooth(z - iz);
                const lerp = (a, b, t) => a + (b - a) * t;
                const plane = k => lerp(
                    lerp(lattice(ix, iy, k, salt), lattice(ix + 1, iy, k, salt), fx),
                    lerp(lattice(ix, iy + 1, k, salt), lattice(ix + 1, iy + 1, k, salt), fx), fy);
                return lerp(plane(iz), plane(iz + 1), fz);
            }
            function terrainNoise(x, y, z, salt) {
                return noise(x, y, z, salt) * 0.58 + noise(x * 2, y * 2, z * 2, salt + 1) * 0.28 + noise(x * 4, y * 4, z * 4, salt + 2) * 0.14;
            }
            function disc(x, y, radius, fill) {
                ctx.fillStyle = fill;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, TAU);
                ctx.fill();
            }
            function halo(x, y, radius, hue, opacity = 0.5) {
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
                gradient.addColorStop(0, 'hsla(' + hue + ',90%,70%,' + opacity + ')');
                gradient.addColorStop(0.25, 'hsla(' + hue + ',85%,55%,' + opacity * 0.4 + ')');
                gradient.addColorStop(1, 'hsla(' + hue + ',90%,40%,0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
            }
            function frame() {
                if (width <= 640 && height > 600) {
                    const top = $('breadcrumbs').getBoundingClientRect().bottom + 12;
                    const bottom = $('info-panel').getBoundingClientRect().top - 12;
                    return { x: 12, y: top, w: width - 24, h: Math.max(130, bottom - top), cx: width / 2, cy: (top + Math.max(top + 130, bottom)) / 2 };
                }
                const left = $('ui').getBoundingClientRect().right + 24;
                const w = Math.max(180, width - left - 24);
                return { x: left, y: 80, w, h: Math.max(180, height - 125), cx: left + w / 2, cy: 80 + Math.max(180, height - 125) / 2 };
            }
            function drawBackground(key) {
                ctx.fillStyle = '#000005';
                ctx.fillRect(0, 0, width, height);
                const rng = random('sky:' + key);
                for (let i = 0; i < 4; i++) halo(rng() * width, rng() * height, width * 0.45, 180 + rng() * 100, 0.07);
                for (let i = 0; i < 850; i++) {
                    const x = rng() * width, y = rng() * height, r = rng();
                    disc(x, y, 0.25 + r * 1.1, 'hsla(' + (190 + rng() * 80) + ',45%,85%,' + (0.2 + r * 0.7) + ')');
                    if (r > 0.99) halo(x, y, 7, 195, 0.25);
                }
            }
            function marker(x, y, radius, label, selected, index) {
                ctx.save();
                ctx.strokeStyle = selected ? '#65ffff' : '#9eb6c5';
                ctx.lineWidth = selected ? 1.4 : 0.7;
                ctx.setLineDash([3, 4]);
                ctx.beginPath();
                ctx.arc(x, y, radius + 7, 0, TAU);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.font = '11px monospace';
                ctx.textAlign = 'center';
                ctx.fillStyle = selected ? '#9affff' : '#c9dbe5';
                ctx.fillText(label, clamp(x, 65, width - 65), y + radius + 24);
                ctx.restore();
                hitTargets.push({ x, y, radius: Math.max(22, radius + 8), index });
            }
            function drawGalaxy(f) {
                const rng = random('galaxy-particles');
                const radius = Math.min(f.w * 0.48, f.h * 0.76);
                const rotation = random('galaxy-rotation')() * 0.8 - 0.4;
                ctx.save();
                ctx.translate(f.cx, f.cy);
                ctx.rotate(rotation);
                ctx.scale(1, 0.53);
                halo(0, 0, radius * 0.9, 225, 0.2);
                ctx.globalCompositeOperation = 'screen';
                for (let i = 0; i < 10000; i++) {
                    const distance = Math.pow(rng(), 0.65) * radius;
                    const angle = (i % 4) * TAU / 4 + distance / radius * 6 + (rng() - 0.5) * 0.65;
                    const spread = rng() * radius * 0.045;
                    const x = Math.cos(angle) * distance + (rng() - 0.5) * spread;
                    const y = Math.sin(angle) * distance + (rng() - 0.5) * spread;
                    disc(x, y, 0.35 + rng() * 1.25, 'hsla(' + (195 + rng() * 70) + ',65%,' + (65 + rng() * 30) + '%,' + (0.25 + rng() * 0.65) + ')');
                }
                halo(0, 0, radius * 0.3, 42, 0.9);
                halo(0, 0, radius * 0.09, 50, 1);
                ctx.restore();
                stars.forEach((star, i) => {
                    const a = i === 0 ? 0.5 : 3.8;
                    const x = Math.cos(a) * radius * (0.5 + i * 0.2);
                    const y = Math.sin(a) * radius * (0.5 + i * 0.2) * 0.53;
                    const sx = f.cx + x * Math.cos(rotation) - y * Math.sin(rotation);
                    const sy = f.cy + x * Math.sin(rotation) + y * Math.cos(rotation);
                    halo(sx, sy, 25, star.hue, 0.75);
                    disc(sx, sy, 3.2, '#fff');
                    marker(sx, sy, 6, star.name, state.star === i, i);
                });
            }
            function planetTexture(planet) {
                if (textures.has(planet.key)) return textures.get(planet.key);
                const image = document.createElement('canvas');
                image.width = image.height = 320;
                const context = image.getContext('2d');
                const pixels = context.createImageData(320, 320);
                const biome = planet.biome;
                for (let y = 0; y < 320; y++) {
                    for (let x = 0; x < 320; x++) {
                        const nx = (x + 0.5) / 160 - 1, ny = (y + 0.5) / 160 - 1;
                        const r2 = nx * nx + ny * ny;
                        if (r2 > 1) continue;
                        const nz = Math.sqrt(1 - r2);
                        const longitude = Math.atan2(nx, nz) + planet.rotation;
                        const latitude = Math.asin(ny);
                        const wx = Math.cos(latitude) * Math.cos(longitude) * 3.5 + 10;
                        const wy = ny * 3.5 + 10;
                        const wz = Math.cos(latitude) * Math.sin(longitude) * 3.5 + 10;
                        const n = terrainNoise(wx, wy, wz, planet.salt);
                        let color = mix(biome.low, biome.high, clamp((n - 0.25) * 2));
                        if (biome.type === 'Oceanic') {
                            color = n < 0.51 ? mix([7, 28, 72], biome.low, clamp(n * 1.8)) :
                                n < 0.54 ? [191, 176, 120] : mix(biome.high, [137, 146, 104], clamp((n - 0.54) * 4));
                        } else if (biome.type === 'Lava' && Math.abs(n - 0.5) < 0.025) {
                            color = mix([238, 49, 10], [255, 201, 49], 1 - Math.abs(n - 0.5) / 0.025);
                        }
                        if (biome.type === 'Ice' || biome.type === 'Oceanic') {
                            const polar = clamp((Math.abs(ny) - 0.78 + (n - 0.5) * 0.2) * 6);
                            color = mix(color, [225, 244, 250], polar);
                            const clouds = noise(wx * 2 + 30, wy * 2, wz * 2, planet.salt + 10);
                            color = mix(color, [218, 234, 239], clamp((clouds - 0.65) * 3) * 0.75);
                        }
                        const light = clamp(-nx * 0.47 - ny * 0.3 + nz * 0.8, 0.07, 1);
                        const edge = Math.pow(1 - nz, 3) * 0.18;
                        const offset = (y * 320 + x) * 4;
                        for (let c = 0; c < 3; c++) pixels.data[offset + c] = clamp(color[c] * light + [35, 110, 150][c] * edge, 0, 255);
                        pixels.data[offset + 3] = 255;
                    }
                }
                context.putImageData(pixels, 0, 0);
                textures.set(planet.key, image);
                return image;
            }
            function globe(planet, x, y, radius) {
                halo(x, y, radius * 1.2, planet.biome.hue, 0.25);
                ctx.drawImage(planetTexture(planet), x - radius, y - radius, radius * 2, radius * 2);
                ctx.strokeStyle = 'rgba(126,218,255,0.3)';
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, TAU);
                ctx.stroke();
            }
            function drawSystem(f, star) {
                const radius = Math.min(f.w * 0.44, f.h * 0.76);
                const rng = random('system:' + star.id);
                for (let i = 0; i < 1400; i++) {
                    const a = rng() * TAU, r = radius * (0.73 + rng() * 0.07);
                    disc(f.cx + Math.cos(a) * r, f.cy + Math.sin(a) * r * 0.48, 0.3 + rng() * 0.7, '#8995ab55');
                }
                star.planets.forEach((planet, i) => {
                    const distance = radius * (0.5 + i * 0.47);
                    ctx.strokeStyle = i === state.planet ? '#36c6dc66' : '#58768766';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.ellipse(f.cx, f.cy, distance, distance * 0.48, 0, 0, TAU);
                    ctx.stroke();
                    const x = f.cx + Math.cos(planet.phase) * distance;
                    const y = f.cy + Math.sin(planet.phase) * distance * 0.48;
                    const size = Math.max(11, Math.min(25, radius * 0.065 + i * 3));
                    globe(planet, x, y, size);
                    marker(x, y, size, planet.name, state.planet === i, i);
                });
                const size = Math.max(15, radius * 0.09);
                halo(f.cx, f.cy, size * 5, star.hue, 0.85);
                const gradient = ctx.createRadialGradient(f.cx - size * 0.3, f.cy - size * 0.3, 0, f.cx, f.cy, size);
                gradient.addColorStop(0, '#fffef3');
                gradient.addColorStop(0.55, 'hsl(' + star.hue + ',95%,82%)');
                gradient.addColorStop(1, 'hsl(' + star.hue + ',85%,50%)');
                disc(f.cx, f.cy, size, gradient);
                for (let i = 0; i < 350; i++) {
                    const a = rng() * TAU, r = Math.sqrt(rng()) * size;
                    disc(f.cx + Math.cos(a) * r, f.cy + Math.sin(a) * r, rng() * 1.6, '#fff5');
                }
            }
            function rings(x, y, radius, planet, front) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(-0.3);
                for (let i = 0; i < 28; i++) {
                    ctx.strokeStyle = 'hsla(' + planet.biome.hue + ',40%,' + (55 + i % 5 * 6) + '%,' + (0.15 + (i % 3) * 0.08) + ')';
                    ctx.lineWidth = Math.max(1, radius * 0.006);
                    const r = radius * (1.3 + i * 0.015);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, r, r * 0.28, 0, front ? 0 : Math.PI, front ? Math.PI : TAU);
                    ctx.stroke();
                }
                ctx.restore();
            }
            function drawOrbit(f, planet) {
                const radius = Math.min(f.w * (planet.rings ? 0.28 : 0.36), f.h * 0.39);
                if (planet.rings) rings(f.cx, f.cy, radius, planet, false);
                globe(planet, f.cx, f.cy, radius);
                if (planet.rings) rings(f.cx, f.cy, radius, planet, true);
                const moonX = f.cx + radius * 1.35, moonY = f.cy - radius * 1.05;
                halo(moonX, moonY, radius * 0.19, 210, 0.15);
                const moon = ctx.createRadialGradient(moonX - 4, moonY - 5, 0, moonX, moonY, radius * 0.1);
                moon.addColorStop(0, '#bccbd3');
                moon.addColorStop(1, '#1a2734');
                disc(moonX, moonY, radius * 0.1, moon);
                ctx.strokeStyle = '#73ffff88';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(f.cx + radius * 0.3, f.cy + radius * 0.25);
                ctx.lineTo(f.cx + radius * 0.65, f.cy + radius * 0.85);
                ctx.lineTo(f.cx + radius * 1.1, f.cy + radius * 0.85);
                ctx.stroke();
                disc(f.cx + radius * 0.3, f.cy + radius * 0.25, 3, '#9fffff');
                ctx.font = '10px monospace';
                ctx.fillStyle = '#9bffff';
                ctx.textAlign = 'center';
                ctx.fillText('LANDING VECTOR', f.cx, f.cy + radius + 28);
            }
            function drawSurface(f, planet) {
                const biome = planet.biome;
                const rng = random('surface:' + planet.key);
                const horizon = f.y + f.h * 0.43;
                const sky = ctx.createLinearGradient(0, 0, 0, horizon + 40);
                sky.addColorStop(0, '#00000500');
                sky.addColorStop(0.45, rgb(biome.sky.map(n => n * 0.18)));
                sky.addColorStop(1, rgb(biome.sky));
                ctx.fillStyle = sky;
                ctx.fillRect(0, 0, width, height);
                const sunX = f.x + f.w * 0.77, sunY = f.y + f.h * 0.19;
                const sunR = Math.min(f.w, f.h) * 0.043;
                halo(sunX, sunY, sunR * 6, stars[state.star].hue, 0.65);
                disc(sunX, sunY, sunR, '#fff1c8');
                disc(f.x + f.w * 0.2, f.y + f.h * 0.12, sunR * 1.5, '#98b7d155');
                for (let layer = 0; layer < 4; layer++) {
                    ctx.fillStyle = rgb(mix(biome.sky, biome.ground.map(n => n * 0.45), (layer + 1) / 5));
                    ctx.beginPath();
                    ctx.moveTo(0, horizon + 60);
                    for (let i = 0; i <= 100; i++) {
                        const n = terrainNoise(i * 0.16, layer * 8, 3, planet.salt);
                        ctx.lineTo(i / 100 * width, horizon - (n * 0.8 + 0.1) * f.h * (0.17 + layer * 0.025) + layer * 15);
                    }
                    ctx.lineTo(width, height);
                    ctx.lineTo(0, height);
                    ctx.fill();
                }
                const elevation = (x, z) => (terrainNoise(x * 0.12 + 30, z * 0.12, 0, planet.salt) - 0.45) * 5;
                const focal = f.w * 0.9;
                const project = (x, z) => ({ x: f.cx + x * focal / (z + 5), y: horizon + (4.2 - elevation(x, z)) * focal / (z + 5) });
                for (let row = 40; row > 0; row--) {
                    const zFar = 1 + Math.pow(row / 40, 1.8) * 65;
                    const zNear = 1 + Math.pow((row - 1) / 40, 1.8) * 65;
                    for (let col = 0; col < 64; col++) {
                        const x = (col - 32) * 2.5;
                        const a = project(x, zFar), b = project(x + 2.5, zFar);
                        const c = project(x + 2.5, zNear), d = project(x, zNear);
                        const n = noise(x * 0.17 + 20, zFar * 0.17, 0, planet.salt + 20);
                        let color = biome.ground.map(channel => channel * (0.45 + n * 0.8));
                        if (biome.type === 'Oceanic' && elevation(x, zFar) < 0) color = [18, 83 + n * 28, 115 + n * 25];
                        if (biome.type === 'Lava' && Math.abs(n - 0.5) < 0.055) color = [235, 65 + n * 95, 18];
                        if (biome.type === 'Ice' && n > 0.6) color = [193, 225, 235];
                        color = mix(color, biome.sky, clamp(zFar / 100) * 0.65);
                        ctx.fillStyle = rgb(color);
                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y);
                        ctx.closePath(); ctx.fill();
                        ctx.fillStyle = rgb(color.map(channel => channel * 0.94));
                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y);
                        ctx.closePath(); ctx.fill();
                    }
                }
                const details = Array.from({ length: 110 }, () => ({ x: (rng() - 0.5) * 65, z: 3 + rng() * 42, size: 0.15 + rng() * 0.65 })).sort((a, b) => b.z - a.z);
                details.forEach(detail => {
                    const point = project(detail.x, detail.z);
                    const size = detail.size * focal / (detail.z + 5);
                    if (point.x < 0 || point.x > width) return;
                    const crystal = biome.type === 'Ice' || biome.type === 'Oceanic';
                    ctx.fillStyle = rgb(biome.ground.map(n => n * 0.35));
                    ctx.beginPath();
                    ctx.moveTo(point.x - size, point.y);
                    ctx.lineTo(point.x - size * 0.6, point.y - size);
                    ctx.lineTo(point.x + size * 0.15, point.y - size * (crystal ? 3 : 1.3));
                    ctx.lineTo(point.x + size, point.y - size * 0.4);
                    ctx.lineTo(point.x + size * 0.8, point.y + size * 0.3);
                    ctx.closePath(); ctx.fill();
                    ctx.fillStyle = crystal ? (biome.type === 'Ice' ? '#9de0efaa' : '#538955') : rgb(biome.ground);
                    ctx.beginPath();
                    ctx.moveTo(point.x + size * 0.15, point.y - size * (crystal ? 3 : 1.3));
                    ctx.lineTo(point.x + size, point.y - size * 0.4);
                    ctx.lineTo(point.x + size * 0.8, point.y + size * 0.3);
                    ctx.lineTo(point.x, point.y);
                    ctx.closePath(); ctx.fill();
                });
                const beaconY = f.y + f.h * 0.79;
                halo(f.cx, beaconY, 24, 180, 0.35);
                ctx.fillStyle = '#031a25';
                ctx.fillRect(f.cx - 6, beaconY - 18, 12, 22);
                ctx.fillStyle = '#87ffff';
                ctx.fillRect(f.cx - 4, beaconY - 17, 8, 12);
                disc(f.cx, beaconY - 23, 5, '#b6ffff');
                ctx.fillStyle = '#254a58';
                ctx.fillRect(f.cx - 5, beaconY + 2, 3, 7);
                ctx.fillRect(f.cx + 2, beaconY + 2, 3, 7);
            }
            function draw() {
                if (!state) return;
                const rect = canvas.getBoundingClientRect();
                width = rect.width;
                height = rect.height;
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                // Reset all drawing state as well as pixels, so revisiting a route is exact.
                canvas.width = Math.round(width * dpr);
                canvas.height = Math.round(height * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                hitTargets = [];
                const f = frame();
                const star = stars[state.star], planet = star.planets[state.planet];
                const key = state.level === 'galaxy' ? 'galaxy' : state.level + ':' + star.id + (state.level === 'system' ? '' : ':' + planet.id);
                drawBackground(key);
                if (state.level === 'galaxy') drawGalaxy(f);
                else if (state.level === 'system') drawSystem(f, star);
                else if (state.level === 'orbit') drawOrbit(f, planet);
                else drawSurface(f, planet);
                ctx.strokeStyle = '#00ffff50';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(f.x, f.y + 14); ctx.lineTo(f.x, f.y); ctx.lineTo(f.x + 14, f.y);
                ctx.moveTo(f.x + f.w - 14, f.y + f.h); ctx.lineTo(f.x + f.w, f.y + f.h); ctx.lineTo(f.x + f.w, f.y + f.h - 14);
                ctx.stroke();
                ctx.font = '10px monospace';
                ctx.textAlign = 'left';
                ctx.fillStyle = '#91cbd6';
                ctx.fillText('SEED LOCKED / ' + state.level.toUpperCase(), f.x + 8, f.y + f.h - 7);
            }

            $('action-btn').addEventListener('click', () => {
                const depth = LEVELS.indexOf(state.level);
                if (depth < 3) travel({ ...state, level: LEVELS[depth + 1] });
            });
            $('back-btn').addEventListener('click', back);
            canvas.addEventListener('click', event => {
                const rect = canvas.getBoundingClientRect();
                const target = hitTargets.find(item => Math.hypot(event.clientX - rect.left - item.x, event.clientY - rect.top - item.y) <= item.radius);
                if (target) choose(target.index);
            });
            document.addEventListener('keydown', event => {
                if (event.key === 'Escape' && document.activeElement.tagName !== 'INPUT') back();
            });
            window.addEventListener('resize', draw);
            window.addEventListener('popstate', restore);
            window.addEventListener('hashchange', restore);
            $('universe-controls').addEventListener('toggle', draw);
            $('seed-form').addEventListener('submit', event => {
                event.preventDefault();
                const value = $('seed-input').value.trim();
                if (!validSeed(value)) {
                    $('status').textContent = 'Enter a whole-number seed from 0 to 4294967295.';
                    return;
                }
                const url = new URL(location.href);
                url.searchParams.set('seed', String(Number(value)));
                url.hash = '#galaxy/s0';
                location.assign(url.href);
            });
            $('export-btn').addEventListener('click', () => {
                const data = JSON.stringify({ version: 1, seed, location: route(state) }, null, 2);
                const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
                const link = document.createElement('a');
                link.href = url;
                link.download = 'universe-' + seed + '.json';
                link.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            });
            $('import-file').addEventListener('change', async event => {
                const file = event.target.files[0];
                if (!file) return;
                try {
                    if (file.size > 65536) throw new Error('Travel data must be smaller than 64 KB.');
                    const data = JSON.parse(await file.text());
                    if (!data || data.version !== 1 || typeof data.seed !== 'number' || !Number.isInteger(data.seed) ||
                        !validSeed(data.seed) || typeof data.location !== 'string' || !parseRoute(data.location)) {
                        throw new Error('Invalid travel data. Import a version 1 universe export.');
                    }
                    const url = new URL(location.href);
                    url.searchParams.set('seed', String(data.seed));
                    url.hash = route(parseRoute(data.location));
                    location.assign(url.href);
                } catch (error) {
                    $('status').textContent = 'Import failed: ' + error.message;
                }
                event.target.value = '';
            });

            state = parseRoute(location.hash);
            if (!state) {
                $('status').textContent = 'Unknown location. Returned to the galaxy.';
                state = { level: 'galaxy', star: 0, planet: 0 };
            }
            if (seedText !== null && !validSeed(seedText)) $('status').textContent = 'Invalid seed. Showing universe 1337.';
            const initialURL = new URL(location.href);
            initialURL.searchParams.set('seed', String(seed));
            initialURL.hash = route(state);
            history.replaceState(null, '', initialURL.href);
            update();
        })();
    </script>
</body>
</html>
