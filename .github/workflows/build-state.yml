name: Build Static Data Covenant snapshots

# Article XXIV (the Static Data Covenant, kody-w/RAR CONSTITUTION.md): pages read
# committed static data, never the GitHub API. Several pages here discovered this
# repo's own file tree/root/artifacts listing, or a couple of foreign repos'
# agent-library listings, from api.github.com at every visitor's page load
# (unauthenticated, 60/hr per IP). This workflow keeps scripts/harvest_static_data.py's
# committed state/ snapshots — in the identical API response shapes those pages used
# to fetch live — true on every push.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'state/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate state/ snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/harvest_static_data.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || { git commit -m "chore: refresh Static Data Covenant snapshots [skip ci]"; git push; }
