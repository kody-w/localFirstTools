name: Build Static Data Snapshots

# Article XXIV (the Static Data Covenant, kody-w/RAR CONSTITUTION.md): pages
# read committed static data, never api.github.com from the visitor's browser.
# Several pages (steamdeck-game-store.html, complete-retroplay-console(-ios),
# github-sync-manager.html, vibe-terminal.html, index_sorting.html) discover
# this repo's own root contents, artifacts/ directory, or full recursive tree
# from these committed snapshots. This workflow keeps them true on every push,
# in the same JSON shapes as the GitHub REST API responses they replace.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'state/tree.json'
      - 'state/root_contents.json'
      - 'state/artifacts_contents.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-static-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate state snapshots
        run: python3 scripts/harvest_static_data.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/tree.json state/root_contents.json state/artifacts_contents.json
          git diff --cached --quiet || { git commit -m "chore: refresh static data snapshots [skip ci]"; git push; }
