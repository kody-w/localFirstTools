<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="description" content="Interactive quantum garden of floating islands experience">
    <meta name="keywords" content="3d,canvas,animation,creative">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎨%3C/text%3E%3C/svg%3E">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Garden of Floating Islands</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e6ff;
            overflow: hidden;
            position: relative;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #canvas-container canvas {
            display: block;
            touch-action: none;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .ui-panel {
            pointer-events: all;
            background: rgba(10, 14, 39, 0.85);
            border: 2px solid rgba(99, 227, 208, 0.3);
            border-radius: 12px;
            padding: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        #top-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            flex-wrap: wrap;
        }

        #info-section {
            flex: 1;
            min-width: 200px;
        }

        #info-section h1 {
            font-size: 1.5rem;
            color: #63e3d0;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(99, 227, 208, 0.6);
        }

        #stats {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #b8c5ff;
        }

        #controls-section {
            min-width: 250px;
        }

        #controls-section h3 {
            color: #9f7aea;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .control-key {
            color: #fbbf24;
            font-weight: bold;
        }

        #bottom-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            pointer-events: auto;
        }

        .action-button {
            background: linear-gradient(135deg, #9f7aea 0%, #6366f1 100%);
            border: 2px solid rgba(159, 122, 234, 0.5);
            border-radius: 8px;
            padding: 12px 20px;
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(159, 122, 234, 0.3);
            font-weight: 600;
        }

        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(159, 122, 234, 0.5);
            border-color: rgba(159, 122, 234, 0.8);
        }

        .action-button:active {
            transform: translateY(0);
        }

        .action-button.secondary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .action-button.secondary:hover {
            box-shadow: 0 6px 25px rgba(16, 185, 129, 0.5);
        }

        #seed-inventory {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.15) 0%, rgba(245, 158, 11, 0.15) 100%);
            border: 2px solid rgba(251, 191, 36, 0.4);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 1.1rem;
            color: #fbbf24;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }

        #connection-status {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 2px solid;
        }

        #connection-status.connected {
            background: rgba(16, 185, 129, 0.2);
            border-color: #10b981;
            color: #10b981;
        }

        #connection-status.disconnected {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #ef4444;
        }

        #peer-list {
            margin-top: 10px;
            padding: 10px;
            background: rgba(99, 227, 208, 0.1);
            border-radius: 8px;
            font-size: 0.85rem;
            max-height: 150px;
            overflow-y: auto;
        }

        .peer-item {
            padding: 5px;
            margin: 3px 0;
            background: rgba(99, 227, 208, 0.2);
            border-radius: 4px;
        }

        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: none;
            gap: 10px;
            justify-content: space-between;
            align-items: flex-end;
        }

        #joystick {
            width: 120px;
            height: 120px;
            background: rgba(10, 14, 39, 0.7);
            border: 3px solid rgba(99, 227, 208, 0.4);
            border-radius: 50%;
            position: relative;
            pointer-events: auto;
            touch-action: none;
        }

        #joystick-knob {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #63e3d0 0%, #3b82f6 100%);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(99, 227, 208, 0.6);
        }

        #mobile-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
            touch-action: none;
        }

        .mobile-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #9f7aea 0%, #6366f1 100%);
            border: 3px solid rgba(159, 122, 234, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(159, 122, 234, 0.4);
        }

        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #modal-overlay.visible {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1f3a 0%, #2d3250 100%);
            border: 3px solid rgba(99, 227, 208, 0.5);
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            color: #63e3d0;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(99, 227, 208, 0.5);
        }

        .modal-content textarea {
            width: 100%;
            min-height: 200px;
            background: rgba(10, 14, 39, 0.8);
            border: 2px solid rgba(99, 227, 208, 0.3);
            border-radius: 8px;
            color: #e0e6ff;
            padding: 12px;
            font-family: monospace;
            font-size: 0.9rem;
            resize: vertical;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: #63e3d0;
            text-shadow: 0 0 20px rgba(99, 227, 208, 0.8);
            z-index: 200;
            max-width: 90vw;
            text-align: center;
            background: rgba(10, 14, 39, 0.95);
            border-radius: 12px;
            padding: 20px;
        }

        @media (max-width: 768px), (pointer: coarse) {
            #top-panel {
                flex-direction: column;
            }

            #controls-section {
                display: none;
            }

            #bottom-panel {
                bottom: 165px;
                gap: 6px;
            }

            #bottom-panel .action-button,
            #seed-inventory {
                padding: 8px;
                font-size: 0.8rem;
            }

            #mobile-controls {
                display: flex;
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(10, 14, 39, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(99, 227, 208, 0.5);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 227, 208, 0.7);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="loading-message" class="loading" role="status">Loading Quantum Garden…</div>

    <div id="ui-overlay">
        <div id="top-panel">
            <div id="info-section" class="ui-panel">
                <h1>🏝️ Quantum Garden</h1>
                <div id="stats">
                    <div>Position: <span id="player-pos">0, 0, 0</span></div>
                    <div>Islands Discovered: <span id="islands-count">0</span></div>
                    <div>Plants Growing: <span id="plants-count">0</span></div>
                    <div>Online Players: <span id="online-count">0</span></div>
                    <div id="save-status" role="status"></div>
                </div>
            </div>

            <div id="controls-section" class="ui-panel">
                <h3>Controls</h3>
                <div class="control-row">
                    <span class="control-key">WASD</span>
                    <span>Move</span>
                </div>
                <div class="control-row">
                    <span class="control-key">SPACE</span>
                    <span>Jump</span>
                </div>
                <div class="control-row">
                    <span class="control-key">CLICK / P</span>
                    <span>Plant Seed</span>
                </div>
                <div class="control-row">
                    <span class="control-key">MOUSE / DRAG</span>
                    <span>Look Around</span>
                </div>
            </div>
        </div>

        <div id="bottom-panel">
            <div id="seed-inventory">🌱 Seeds: <span id="seed-count">10</span></div>
            <button class="action-button secondary" id="collect-btn">Collect Seed</button>
            <button class="action-button" id="export-btn">Export World</button>
            <button class="action-button" id="import-btn">Import World</button>
        </div>

        <div id="mobile-controls">
            <div id="joystick">
                <div id="joystick-knob"></div>
            </div>
            <div id="mobile-actions">
                <button class="mobile-button" id="mobile-jump" aria-label="Jump">⬆️</button>
                <button class="mobile-button" id="mobile-plant" aria-label="Plant seed">🌱</button>
            </div>
        </div>
    </div>

    <div id="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title">Modal</h2>
            <div id="modal-body"></div>
            <div class="modal-buttons">
                <button class="action-button" id="modal-close">Close</button>
                <button class="action-button secondary" id="modal-action" style="display: none;">Action</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js" crossorigin="anonymous"></script>
    <script>
        'use strict';

        const {
            AmbientLight, BufferAttribute, BufferGeometry, Color, DirectionalLight,
            Mesh, MeshBasicMaterial, MeshStandardMaterial, PerspectiveCamera,
            PointLight, Points, PointsMaterial, Scene, SphereGeometry, Vector3,
            WebGLRenderer
        } = window.THREE || {};

        // ===== QUANTUM GARDEN APPLICATION =====

        /**
         * Main application class for the Quantum Garden of Floating Islands
         * Manages 3D scene, player movement, networking, and game state
         */
        class QuantumGarden {
            constructor() {
                // Core Three.js components
                this.scene = null;
                this.camera = null;
                this.renderer = null;

                // Game state
                this.player = {
                    position: new Vector3(0, 17, 0),
                    velocity: new Vector3(0, 0, 0),
                    rotation: { x: -0.2, y: 0 },
                    seeds: 10,
                    isGrounded: false,
                    currentIsland: null
                };

                // World objects
                this.islands = [];
                this.plants = [];
                this.particles = [];
                this.particleMesh = null;
                this.waterfalls = [];

                // Input state
                this.keys = {};
                this.mouse = { x: 0, y: 0, deltaX: 0, deltaY: 0, locked: false };
                this.touch = { active: false, startX: 0, startY: 0, currentX: 0, currentY: 0 };

                // Networking (P2P multiplayer)
                this.peer = null;
                this.connections = new Map();
                this.peerId = null;

                // Animation
                this.clock = { startTime: Date.now(), oldTime: Date.now(), elapsedTime: 0 };
                this.animationId = null;

                // Settings
                this.settings = {
                    renderDistance: 200,
                    particleCount: 500,
                    gravity: -0.3,
                    jumpForce: 0.5,
                    moveSpeed: 0.2,
                    mouseSensitivity: 0.002
                };

                this.init();
            }

            /**
             * Initialize the application
             */
            init() {
                this.setupScene();
                this.createParticleField();
                if (!this.loadState()) {
                    this.generateWorld();
                }
                this.setupControls();
                this.setupUI();
                this.initNetworking();
                this.animate();
                this.saveTimer = setInterval(() => this.saveState(), 10000);

                console.log('🏝️ Quantum Garden initialized');
            }

            /**
             * Setup Three.js scene, camera, and renderer
             */
            setupScene() {
                // Create scene with quantum-themed background
                this.scene = new Scene();
                this.scene.background = new Color(0x0a0e27);

                // Setup camera
                this.camera = new PerspectiveCamera(
                    75,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    this.settings.renderDistance
                );
                this.camera.position.copy(this.player.position);
                this.camera.rotation.order = 'YXZ';

                // Setup renderer with proper canvas sizing
                const container = document.getElementById('canvas-container');
                this.renderer = new WebGLRenderer({ antialias: true, alpha: false });
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setClearColor(0x0a0e27, 1);
                this.renderer.outputEncoding = THREE.sRGBEncoding;
                this.renderer.domElement.tabIndex = 0;
                container.appendChild(this.renderer.domElement);

                // Add ambient lighting for visibility
                const ambient = new AmbientLight(0x63e3d0, 0.4);
                this.scene.add(ambient);

                // Add directional light for depth
                const dirLight = new DirectionalLight(0x9f7aea, 0.8);
                dirLight.position.set(50, 100, 50);
                this.scene.add(dirLight);

                // Handle window resize
                window.addEventListener('resize', () => this.onResize());
            }

            /**
             * Generate the quantum world with islands, plants, and effects
             */
            generateWorld(includePlants = true) {
                // Create central starting island
                this.createIsland(new Vector3(0, 0, 0), 15, 'central');

                // Generate ring of surrounding islands
                const islandCount = 8;
                const radius = 40;
                for (let i = 0; i < islandCount; i++) {
                    const angle = (i / islandCount) * Math.PI * 2;
                    const x = Math.cos(angle) * radius;
                    const z = Math.sin(angle) * radius;
                    const y = THREE.MathUtils.randFloat(-10, 10);
                    const size = THREE.MathUtils.randFloat(8, 12);
                    this.createIsland(new Vector3(x, y, z), size, 'ring');
                }

                // Generate distant islands
                for (let i = 0; i < 12; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = THREE.MathUtils.randFloat(60, 120);
                    const x = Math.cos(angle) * dist;
                    const z = Math.sin(angle) * dist;
                    const y = THREE.MathUtils.randFloat(-20, 20);
                    const size = THREE.MathUtils.randFloat(6, 10);
                    this.createIsland(new Vector3(x, y, z), size, 'distant');
                }

                // Add initial plants to some islands
                (includePlants ? this.islands.slice(0, 5) : []).forEach(island => {
                    const plantCount = Math.floor(Math.random() * 3) + 1;
                    for (let i = 0; i < plantCount; i++) {
                        const offsetX = THREE.MathUtils.randFloatSpread(island.size * 0.6);
                        const offsetZ = THREE.MathUtils.randFloatSpread(island.size * 0.6);
                        const plantPos = new Vector3(
                            island.position.x + offsetX,
                            island.position.y + Math.sqrt(
                                island.size * island.size - offsetX * offsetX - offsetZ * offsetZ
                            ),
                            island.position.z + offsetZ
                        );
                        this.createPlant(plantPos, Math.random());
                    }
                });

                this.createWaterfalls();
            }

            createWaterfalls() {
                this.islands.slice(0, 6).forEach((island, idx) => {
                    if (idx % 2 === 0) {
                        this.createWaterfall(island);
                    }
                });
            }

            /**
             * Create a floating island with gravity zone
             */
            createIsland(position, size, type, color = null) {
                const island = {
                    position: position.clone(),
                    size: size,
                    type: type,
                    mesh: null,
                    gravityZone: size * 2, // Gravity influence radius
                    gravityStrength: 0.02,
                    rotation: { y: Math.random() * 0.001 }
                };

                // Create visual representation (simple colored sphere for performance)
                const geometry = new SphereGeometry(size, 16, 16);
                const material = new MeshStandardMaterial({
                    color: color === null
                        ? new Color().setHSL(0.5 + Math.random() * 0.1, 0.7, 0.4)
                        : new Color(color),
                    wireframe: false
                });
                const mesh = new Mesh(geometry, material);
                mesh.position.copy(position);
                this.scene.add(mesh);
                island.mesh = mesh;

                // Add glow effect with point light
                const light = new PointLight(0x63e3d0, 0.5, size * 3);
                light.position.copy(position);
                this.scene.add(light);
                island.light = light;

                this.islands.push(island);
                return island;
            }

            /**
             * Create a bioluminescent plant
             */
            createPlant(position, growthStage = 0, saved = {}) {
                const plant = {
                    position: position.clone(),
                    growthStage: growthStage, // 0 to 1
                    targetGrowth: 1,
                    growthSpeed: 0.001,
                    color: saved.color === undefined
                        ? new Color().setHSL(0.3 + Math.random() * 0.3, 0.9, 0.6)
                        : new Color(saved.color),
                    mesh: null,
                    light: null,
                    createdAt: saved.createdAt ?? Date.now(),
                    ownerId: saved.ownerId ?? this.peerId ?? 'local',
                    island: this.islands.find(island =>
                        Math.abs(position.distanceTo(island.position) - island.size) < 1
                    ) || null
                };

                // Create visual (sphere that grows)
                const size = 0.5 + growthStage * 2;
                const geometry = new SphereGeometry(1, 8, 8);
                const material = new MeshBasicMaterial({
                    color: plant.color,
                    transparent: true,
                    opacity: 0.7 + growthStage * 0.3
                });
                const mesh = new Mesh(geometry, material);
                mesh.scale.setScalar(size);
                mesh.position.copy(position);
                this.scene.add(mesh);
                plant.mesh = mesh;

                // Add glowing point light
                const light = new PointLight(plant.color, growthStage * 2, 10);
                light.position.copy(position);
                this.scene.add(light);
                plant.light = light;

                this.plants.push(plant);
                this.updateStats();

                // Broadcast to network
                if (saved.broadcast !== false) this.broadcastPlant(plant);

                return plant;
            }

            /**
             * Create upward-flowing crystalline waterfall
             */
            createWaterfall(island) {
                const waterfall = {
                    island: island,
                    particles: [],
                    mesh: null,
                    active: true
                };

                // Create particle stream flowing upward
                const particleCount = 50;
                const positions = new Float32Array(particleCount * 3);

                for (let i = 0; i < particleCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = island.size * 0.7;
                    const x = island.position.x + Math.cos(angle) * radius;
                    const y = island.position.y + Math.random() * 30;
                    const z = island.position.z + Math.sin(angle) * radius;

                    positions[i * 3] = x;
                    positions[i * 3 + 1] = y;
                    positions[i * 3 + 2] = z;
                }

                // Store particle data for animation
                waterfall.positions = positions;
                const geometry = new BufferGeometry();
                geometry.setAttribute('position',
                    new BufferAttribute(positions, 3).setUsage(THREE.DynamicDrawUsage));
                waterfall.mesh = new Points(geometry, new PointsMaterial({
                    color: 0x63e3d0,
                    size: 0.4,
                    transparent: true,
                    opacity: 0.8,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                }));
                waterfall.mesh.frustumCulled = false;
                this.scene.add(waterfall.mesh);

                this.waterfalls.push(waterfall);
            }

            /**
             * Create bioluminescent particle field
             */
            createParticleField() {
                const count = this.settings.particleCount;
                const positions = new Float32Array(count * 3);
                const colors = new Float32Array(count * 3);

                for (let i = 0; i < count; i++) {
                    const particle = {
                        position: new Vector3(
                            THREE.MathUtils.randFloatSpread(200),
                            THREE.MathUtils.randFloatSpread(100),
                            THREE.MathUtils.randFloatSpread(200)
                        ),
                        velocity: new Vector3(
                            THREE.MathUtils.randFloatSpread(0.02),
                            THREE.MathUtils.randFloatSpread(0.02),
                            THREE.MathUtils.randFloatSpread(0.02)
                        ),
                        color: new Color().setHSL(Math.random(), 0.8, 0.6),
                        size: Math.random() * 0.3 + 0.1,
                        life: Math.random()
                    };

                    this.particles.push(particle);
                    particle.position.toArray(positions, i * 3);
                    particle.color.toArray(colors, i * 3);
                }

                const geometry = new BufferGeometry();
                geometry.setAttribute('position',
                    new BufferAttribute(positions, 3).setUsage(THREE.DynamicDrawUsage));
                geometry.setAttribute('color', new BufferAttribute(colors, 3));
                this.particleMesh = new Points(geometry, new PointsMaterial({
                    size: 0.2,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.8,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                }));
                this.particleMesh.frustumCulled = false;
                this.scene.add(this.particleMesh);
            }

            /**
             * Setup keyboard, mouse, and touch controls
             */
            setupControls() {
                // Keyboard
                window.addEventListener('keydown', (e) => {
                    if (e.code === 'Escape') this.hideModal();
                    if (document.getElementById('modal-overlay').classList.contains('visible') ||
                        ['INPUT', 'TEXTAREA', 'SELECT', 'BUTTON'].includes(e.target.tagName) ||
                        e.target.isContentEditable) return;

                    this.keys[e.code] = true;
                    if (e.code === 'Space') {
                        e.preventDefault();
                        if (!e.repeat) this.jump();
                    } else if (e.code === 'KeyP' && !e.repeat) {
                        this.plantSeed();
                    }
                });

                window.addEventListener('keyup', (e) => {
                    this.keys[e.code] = false;
                });
                window.addEventListener('blur', () => this.resetInput());

                // Mouse look (pointer lock)
                const canvas = this.renderer.domElement;
                canvas.addEventListener('click', (e) => {
                    if (this.touch.moved || e.pointerType === 'touch') return;
                    if (this.mouse.locked || this.pointerLockUnavailable) {
                        this.plantSeed();
                        return;
                    }
                    try {
                        if (!canvas.requestPointerLock) {
                            this.pointerLockUnavailable = true;
                            return;
                        }
                        const request = canvas.requestPointerLock();
                        if (request && request.catch) {
                            request.catch(() => { this.pointerLockUnavailable = true; });
                        }
                    } catch {
                        this.pointerLockUnavailable = true;
                    }
                });

                document.addEventListener('pointerlockchange', () => {
                    this.mouse.locked = document.pointerLockElement === canvas;
                    this.touch.active = false;
                    if (!this.mouse.locked) this.resetInput();
                });
                document.addEventListener('pointerlockerror', () => {
                    this.pointerLockUnavailable = true;
                });

                document.addEventListener('mousemove', (e) => {
                    if (this.mouse.locked) {
                        this.mouse.deltaX = e.movementX;
                        this.mouse.deltaY = e.movementY;
                        this.updateCameraRotation();
                    }
                });

                // Drag look also works on touchscreens and without pointer-lock permission.
                canvas.addEventListener('pointerdown', (e) => {
                    if (this.mouse.locked || e.button !== 0) return;
                    this.touch.active = true;
                    this.touch.moved = false;
                    this.touch.pointerId = e.pointerId;
                    this.touch.currentX = e.clientX;
                    this.touch.currentY = e.clientY;
                    canvas.setPointerCapture(e.pointerId);
                });
                canvas.addEventListener('pointermove', (e) => {
                    if (!this.touch.active || e.pointerId !== this.touch.pointerId) return;
                    this.mouse.deltaX = e.clientX - this.touch.currentX;
                    this.mouse.deltaY = e.clientY - this.touch.currentY;
                    if (Math.abs(this.mouse.deltaX) + Math.abs(this.mouse.deltaY) > 1) {
                        this.touch.moved = true;
                    }
                    this.touch.currentX = e.clientX;
                    this.touch.currentY = e.clientY;
                    this.updateCameraRotation();
                });
                canvas.addEventListener('pointerup', (e) => {
                    if (e.pointerId === this.touch.pointerId) this.touch.active = false;
                });
                canvas.addEventListener('pointercancel', (e) => {
                    if (e.pointerId !== this.touch.pointerId) return;
                    this.touch.active = false;
                    this.touch.moved = true;
                });

                // Touch controls for mobile
                this.setupTouchControls();
            }

            resetInput() {
                this.keys = {};
                this.touch.active = false;
                this.joystickPointer = null;
                const knob = document.getElementById('joystick-knob');
                knob.style.left = '50%';
                knob.style.top = '50%';
            }

            /**
             * Setup mobile touch controls (joystick and buttons)
             */
            setupTouchControls() {
                const joystick = document.getElementById('joystick');
                const knob = document.getElementById('joystick-knob');
                const jumpBtn = document.getElementById('mobile-jump');
                const plantBtn = document.getElementById('mobile-plant');

                const moveJoystick = (e) => {
                    const rect = joystick.getBoundingClientRect();
                    const deltaX = e.clientX - rect.left - rect.width / 2;
                    const deltaY = e.clientY - rect.top - rect.height / 2;
                    const scale = Math.min(1, 35 / (Math.hypot(deltaX, deltaY) || 1));
                    knob.style.left = `calc(50% + ${deltaX * scale}px)`;
                    knob.style.top = `calc(50% + ${deltaY * scale}px)`;

                    // Simulate WASD keys
                    this.keys.KeyW = deltaY < -10;
                    this.keys.KeyS = deltaY > 10;
                    this.keys.KeyA = deltaX < -10;
                    this.keys.KeyD = deltaX > 10;
                };

                joystick.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    this.joystickPointer = e.pointerId;
                    joystick.setPointerCapture(e.pointerId);
                    moveJoystick(e);
                });
                joystick.addEventListener('pointermove', (e) => {
                    if (e.pointerId === this.joystickPointer) moveJoystick(e);
                });
                const stopJoystick = (e) => {
                    if (e.pointerId !== this.joystickPointer) return;
                    this.joystickPointer = null;
                    for (const key of ['KeyW', 'KeyA', 'KeyS', 'KeyD']) delete this.keys[key];
                    knob.style.left = '50%';
                    knob.style.top = '50%';
                };
                joystick.addEventListener('pointerup', stopJoystick);
                joystick.addEventListener('pointercancel', stopJoystick);
                joystick.addEventListener('lostpointercapture', stopJoystick);

                jumpBtn.addEventListener('click', () => this.jump());
                plantBtn.addEventListener('click', () => this.plantSeed());
            }

            /**
             * Setup UI event listeners
             */
            setupUI() {
                document.getElementById('collect-btn').addEventListener('click', () => {
                    this.collectSeed();
                });

                document.getElementById('export-btn').addEventListener('click', () => {
                    this.exportWorld();
                });

                document.getElementById('import-btn').addEventListener('click', () => {
                    this.showImportModal();
                });

                document.getElementById('modal-close').addEventListener('click', () => {
                    this.hideModal();
                });

                this.updateStats();
            }

            /**
             * Initialize P2P networking with PeerJS
             */
            initNetworking() {
                // Simplified peer networking (would use real PeerJS in production)
                this.peerId = 'player_' + Math.random().toString(36).substr(2, 9);
                console.log('🌐 Peer ID:', this.peerId);

                // Simulate connection status
                setTimeout(() => {
                    this.updateConnectionStatus();
                }, 1000);
            }

            /**
             * Main animation loop
             */
            animate() {
                this.animationId = requestAnimationFrame(() => this.animate());

                const currentTime = Date.now();
                const deltaTime = Math.min(0.05, Math.max(0, (currentTime - this.clock.oldTime) / 1000));
                this.clock.oldTime = currentTime;
                this.clock.elapsedTime = (currentTime - this.clock.startTime) / 1000;

                // Update game systems
                this.updateIslands(deltaTime);
                this.updatePlayer(deltaTime);
                this.updatePhysics(deltaTime);
                this.updatePlants(deltaTime);
                this.updateParticles(deltaTime);
                this.updateWaterfalls(deltaTime);
                this.updateCamera();

                // Render scene
                this.renderer.render(this.scene, this.camera);
            }

            /**
             * Update player movement and input
             */
            updatePlayer(deltaTime) {
                const speed = this.settings.moveSpeed;
                const frameScale = deltaTime * 60;
                const forward = new Vector3(0, 0, -1);
                const right = new Vector3(1, 0, 0);

                // Rotate movement vectors by camera rotation
                const yaw = this.player.rotation.y;
                const cosYaw = Math.cos(yaw);
                const sinYaw = Math.sin(yaw);

                forward.set(-sinYaw, 0, -cosYaw);
                right.set(cosYaw, 0, -sinYaw);

                // Apply movement from input
                const movement = new Vector3(0, 0, 0);

                if (this.keys.KeyW) movement.add(forward);
                if (this.keys.KeyS) movement.sub(forward);
                if (this.keys.KeyD) movement.add(right);
                if (this.keys.KeyA) movement.sub(right);

                if (movement.length() > 0) {
                    movement.normalize().multiplyScalar(speed);
                    this.player.velocity.x = movement.x;
                    this.player.velocity.z = movement.z;
                } else {
                    // Apply friction when not moving
                    const friction = Math.pow(0.8, frameScale);
                    this.player.velocity.x *= friction;
                    this.player.velocity.z *= friction;
                }

                // Update position
                this.player.position.addScaledVector(this.player.velocity, frameScale);

                // Update stats display
                this.updateStats();
            }

            /**
             * Update physics (gravity, collision detection)
             */
            updatePhysics(deltaTime) {
                // Find nearest island for gravity
                let nearestIsland = null;
                let nearestDist = Infinity;

                this.islands.forEach(island => {
                    const dist = this.player.position.distanceTo(island.mesh.position);
                    if (dist < island.gravityZone && dist < nearestDist) {
                        nearestDist = dist;
                        nearestIsland = island;
                    }
                });

                this.player.currentIsland = nearestIsland;

                if (nearestIsland) {
                    const center = nearestIsland.mesh.position;
                    // Apply gravity toward island center
                    const toIsland = new Vector3()
                        .subVectors(center, this.player.position)
                        .normalize()
                        .multiplyScalar(nearestIsland.gravityStrength * deltaTime * 60);

                    this.player.velocity.add(toIsland);

                    // Check ground collision
                    const distToSurface = this.player.position.distanceTo(center) - nearestIsland.size;
                    if (distToSurface <= 1) {
                        this.player.isGrounded = true;
                        // Push player to surface
                        const normal = new Vector3()
                            .subVectors(this.player.position, center)
                            .normalize();
                        if (normal.lengthSq() === 0) normal.set(0, 1, 0);
                        this.player.position.copy(center)
                            .addScaledVector(normal, nearestIsland.size + 1);

                        // Cancel velocity toward island
                        const velocityToward = this.player.velocity.dot(normal);
                        if (velocityToward < 0) {
                            this.player.velocity.addScaledVector(normal, -velocityToward);
                        }
                    } else {
                        this.player.isGrounded = false;
                    }
                } else {
                    // No island nearby, apply default gravity
                    this.player.velocity.y += this.settings.gravity * deltaTime;
                    this.player.isGrounded = false;
                }

                // Respawn if fallen too far
                if (this.player.position.y < -100) {
                    this.respawnPlayer();
                }
            }

            /**
             * Update plant growth
             */
            updatePlants(deltaTime) {
                this.plants.forEach((plant, index) => {
                    // Grow toward target
                    if (plant.growthStage < plant.targetGrowth) {
                        plant.growthStage = Math.min(
                            plant.targetGrowth,
                            plant.growthStage + plant.growthSpeed * deltaTime * 60
                        );

                        // Update visual
                        if (plant.mesh) {
                            const scale = 0.5 + plant.growthStage * 2;
                            plant.mesh.scale.setScalar(scale);
                            plant.mesh.material.opacity = 0.7 + plant.growthStage * 0.3;
                        }

                        if (plant.light) {
                            plant.light.intensity = plant.growthStage * 2;
                        }
                    }

                    // Pulse glow effect
                    if (plant.light) {
                        const pulse = Math.sin(this.clock.elapsedTime * 2 + index) * 0.3 + 0.7;
                        plant.light.intensity = plant.growthStage * 2 * pulse;
                    }

                    // Gentle floating animation
                    if (plant.mesh) {
                        const islandOffset = plant.island
                            ? plant.island.mesh.position.y - plant.island.position.y : 0;
                        plant.mesh.position.y = plant.position.y + islandOffset +
                            Math.sin(this.clock.elapsedTime * 2 + index) * 0.1;
                        if (plant.light) plant.light.position.copy(plant.mesh.position);
                    }
                });
            }

            /**
             * Update particle field animation
             */
            updateParticles(deltaTime) {
                const positions = this.particleMesh.geometry.getAttribute('position');
                this.particles.forEach((particle, index) => {
                    // Move particle
                    particle.position.addScaledVector(particle.velocity, deltaTime * 60);

                    // Wrap around world bounds
                    if (Math.abs(particle.position.x) > 100) particle.position.x *= -1;
                    if (Math.abs(particle.position.y) > 50) particle.position.y *= -1;
                    if (Math.abs(particle.position.z) > 100) particle.position.z *= -1;

                    // Pulse life
                    particle.life = (particle.life + 0.6 * deltaTime) % 1;
                    particle.position.toArray(positions.array, index * 3);
                });
                positions.needsUpdate = true;
            }

            /**
             * Update upward-flowing waterfalls
             */
            updateWaterfalls(deltaTime) {
                this.waterfalls.forEach(waterfall => {
                    if (!waterfall.active) return;

                    const particleCount = waterfall.positions.length / 3;

                    for (let i = 0; i < particleCount; i++) {
                        // Move particles upward
                        waterfall.positions[i * 3 + 1] += 30 * deltaTime;

                        // Reset if too high
                        if (waterfall.positions[i * 3 + 1] > waterfall.island.position.y + 30) {
                            const angle = Math.random() * Math.PI * 2;
                            const radius = waterfall.island.size * 0.7;
                            waterfall.positions[i * 3] = waterfall.island.position.x + Math.cos(angle) * radius;
                            waterfall.positions[i * 3 + 1] = waterfall.island.position.y;
                            waterfall.positions[i * 3 + 2] = waterfall.island.position.z + Math.sin(angle) * radius;
                        }
                    }
                    waterfall.mesh.geometry.getAttribute('position').needsUpdate = true;
                });
            }

            /**
             * Update island animations (rotation, floating)
             */
            updateIslands(deltaTime) {
                this.islands.forEach((island, index) => {
                    // Gentle rotation
                    if (island.mesh) {
                        island.mesh.rotation.y += island.rotation.y * deltaTime * 60;
                    }

                    // Floating animation
                    const floatOffset = Math.sin(this.clock.elapsedTime * 0.5 + index) * 0.5;
                    if (island.mesh) {
                        island.mesh.position.y = island.position.y + floatOffset;
                    }
                    if (island.light) {
                        island.light.position.y = island.position.y + floatOffset;
                    }
                });
            }

            /**
             * Update camera position and rotation to follow player
             */
            updateCamera() {
                this.camera.position.copy(this.player.position);
                this.camera.rotation.x = this.player.rotation.x;
                this.camera.rotation.y = this.player.rotation.y;
            }

            /**
             * Update camera rotation from mouse movement
             */
            updateCameraRotation() {
                this.player.rotation.y -= this.mouse.deltaX * this.settings.mouseSensitivity;
                this.player.rotation.x -= this.mouse.deltaY * this.settings.mouseSensitivity;

                // Clamp pitch
                this.player.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, this.player.rotation.x));

                // Reset deltas
                this.mouse.deltaX = 0;
                this.mouse.deltaY = 0;
            }

            /**
             * Make player jump (if grounded)
             */
            jump() {
                if (this.player.isGrounded && this.player.currentIsland) {
                    const jumpDir = new Vector3()
                        .subVectors(this.player.position, this.player.currentIsland.mesh.position)
                        .normalize()
                        .multiplyScalar(this.settings.jumpForce);

                    this.player.velocity.add(jumpDir);
                    this.player.isGrounded = false;
                }
            }

            /**
             * Plant a seed at the targeted location
             */
            plantSeed() {
                if (this.player.seeds <= 0) {
                    console.log('No seeds available!');
                    return;
                }

                // Raycast to find planting location (simplified)
                if (this.player.currentIsland) {
                    const forward = new Vector3(
                        -Math.sin(this.player.rotation.y),
                        0,
                        -Math.cos(this.player.rotation.y)
                    ).multiplyScalar(5);

                    const plantPos = this.player.position.clone().add(forward);

                    // Store the surface position relative to the island's non-animated center.
                    plantPos.y -= this.player.currentIsland.mesh.position.y -
                        this.player.currentIsland.position.y;
                    const toIsland = new Vector3()
                        .subVectors(this.player.currentIsland.position, plantPos)
                        .normalize();
                    plantPos.copy(this.player.currentIsland.position)
                        .add(toIsland.multiplyScalar(-this.player.currentIsland.size));

                    this.createPlant(plantPos, 0);
                    this.player.seeds--;
                    this.updateStats();
                    this.saveState();

                    console.log('🌱 Planted seed!');
                }
            }

            /**
             * Collect a seed (increase seed count)
             */
            collectSeed() {
                this.player.seeds++;
                this.updateStats();
                this.saveState();
                console.log('🌱 Collected seed!');
            }

            /**
             * Respawn player at starting position
             */
            respawnPlayer() {
                const island = this.islands.find(island => island.type === 'central') || this.islands[0];
                if (island) {
                    this.player.position.copy(island.mesh.position);
                    this.player.position.y += island.size + 2;
                } else {
                    this.player.position.set(0, 17, 0);
                }
                this.player.velocity.set(0, 0, 0);
                this.player.currentIsland = null;
                this.player.isGrounded = false;
                console.log('🔄 Respawned');
            }

            /**
             * Update UI stats display
             */
            updateStats() {
                document.getElementById('player-pos').textContent =
                    `${Math.floor(this.player.position.x)}, ${Math.floor(this.player.position.y)}, ${Math.floor(this.player.position.z)}`;
                document.getElementById('islands-count').textContent = this.islands.length;
                document.getElementById('plants-count').textContent = this.plants.length;
                document.getElementById('seed-count').textContent = this.player.seeds;
                document.getElementById('online-count').textContent = this.connections.size;
            }

            /**
             * Update network connection status display
             */
            updateConnectionStatus() {
                // Simplified for demo (would show real peer count in production)
                const status = document.getElementById('connection-status');
                if (!status) return;

                if (this.connections.size > 0) {
                    status.className = 'connected';
                    status.textContent = `🌐 Connected (${this.connections.size})`;
                } else {
                    status.className = 'disconnected';
                    status.textContent = '🌐 Solo Mode';
                }
            }

            /**
             * Broadcast plant creation to connected peers
             */
            broadcastPlant(plant) {
                if (this.connections.size === 0) return;
                const message = {
                    type: 'plant_created',
                    data: {
                        position: { x: plant.position.x, y: plant.position.y, z: plant.position.z },
                        color: plant.color.getHex(),
                        growthStage: plant.growthStage,
                        createdAt: plant.createdAt,
                        ownerId: plant.ownerId
                    }
                };

                // Would send via PeerJS in production
                console.log('📡 Broadcasting plant:', message);
            }

            /**
             * Shared format for local saves and portable JSON exports
             */
            getWorldState() {
                return {
                    version: '1.0',
                    timestamp: Date.now(),
                    player: {
                        position: { x: this.player.position.x, y: this.player.position.y, z: this.player.position.z },
                        rotation: { ...this.player.rotation },
                        seeds: this.player.seeds
                    },
                    islands: this.islands.map(island => ({
                        position: { x: island.position.x, y: island.position.y, z: island.position.z },
                        size: island.size,
                        type: island.type,
                        color: island.mesh.material.color.getHex()
                    })),
                    plants: this.plants.map(plant => ({
                        position: { x: plant.position.x, y: plant.position.y, z: plant.position.z },
                        growthStage: plant.growthStage,
                        color: plant.color.getHex(),
                        createdAt: plant.createdAt,
                        ownerId: plant.ownerId
                    }))
                };
            }

            exportWorld() {
                const json = JSON.stringify(this.getWorldState(), null, 2);
                this.showModal('Export World', `
                    <p style="margin-bottom: 15px; color: #b8c5ff;">Copy this JSON data to save your world:</p>
                    <textarea id="export-data" readonly aria-label="Exported world JSON" style="width: 100%; min-height: 300px;"></textarea>
                `);
                document.getElementById('export-data').value = json;

                console.log('📤 Exported world state');
                return json;
            }

            /**
             * Show import modal
             */
            showImportModal() {
                this.showModal('Import World', `
                    <p style="margin-bottom: 15px; color: #b8c5ff;">Paste JSON world data below:</p>
                    <textarea id="import-data" aria-label="World JSON to import" style="width: 100%; min-height: 300px;" placeholder="Paste JSON here..."></textarea>
                    <p id="import-error" role="alert" style="margin-top: 12px; color: #fbbf24;"></p>
                `, () => {
                    const data = document.getElementById('import-data').value;
                    this.importWorld(data);
                });
            }

            /**
             * Import world state from JSON
             */
            importWorld(jsonData) {
                try {
                    const worldState = this.validateWorldState(JSON.parse(jsonData));
                    this.restoreWorld(worldState);
                    this.saveState();
                    this.hideModal();
                    console.log('📥 Imported world state');
                    return true;
                } catch (error) {
                    const message = 'Import failed. Use a valid Quantum Garden 1.0 export; your current world is unchanged.';
                    const errorDisplay = document.getElementById('import-error');
                    if (errorDisplay) errorDisplay.textContent = message;
                    console.warn('Failed to import world:', error);
                    return false;
                }
            }

            validateWorldState(state, allowLegacy = false) {
                const positionValid = value => value &&
                    ['x', 'y', 'z'].every(axis => Number.isFinite(value[axis]));
                const colorValid = value => value === undefined ||
                    (Number.isInteger(value) && value >= 0 && value <= 0xffffff);
                const legacy = allowLegacy && state && state.version === undefined &&
                    state.islands === undefined;

                if (!state || (state.version !== '1.0' && !legacy)) {
                    throw new Error('Unsupported world version');
                }
                if (!state.player || !positionValid(state.player.position) ||
                    !Number.isSafeInteger(state.player.seeds) || state.player.seeds < 0) {
                    throw new Error('Invalid player state');
                }
                const rotation = state.player.rotation;
                if (rotation !== undefined && (!rotation ||
                    !Number.isFinite(rotation.x) || !Number.isFinite(rotation.y))) {
                    throw new Error('Invalid camera rotation');
                }
                if (!legacy && (!Array.isArray(state.islands) || state.islands.length === 0 ||
                    !state.islands.every(island => island && positionValid(island.position) &&
                        Number.isFinite(island.size) && island.size > 0 &&
                        typeof island.type === 'string' && colorValid(island.color)))) {
                    throw new Error('Invalid islands');
                }
                if (!Array.isArray(state.plants) || !state.plants.every(plant =>
                    plant && positionValid(plant.position) && Number.isFinite(plant.growthStage) &&
                    plant.growthStage >= 0 && plant.growthStage <= 1 && colorValid(plant.color) &&
                    (plant.createdAt === undefined || Number.isFinite(plant.createdAt)) &&
                    (plant.ownerId === undefined || typeof plant.ownerId === 'string'))) {
                    throw new Error('Invalid plants');
                }
                return state;
            }

            restoreWorld(state) {
                this.clearWorld();
                if (state.islands) {
                    state.islands.forEach(island => this.createIsland(
                        new Vector3().copy(island.position), island.size, island.type,
                        island.color ?? null
                    ));
                    this.createWaterfalls();
                } else {
                    // Older local saves omitted islands; migrate them without adding duplicate plants.
                    this.generateWorld(false);
                }
                state.plants.forEach(plant => this.createPlant(
                    new Vector3().copy(plant.position), plant.growthStage,
                    { ...plant, broadcast: false }
                ));
                this.player.position.copy(state.player.position);
                this.player.seeds = state.player.seeds;
                this.player.rotation = state.player.rotation
                    ? { ...state.player.rotation } : { x: -0.2, y: 0 };
                this.player.velocity.set(0, 0, 0);
                this.resetInput();
                this.updateCamera();
                this.updateStats();
            }

            disposeObject(object) {
                if (!object) return;
                this.scene.remove(object);
                object.traverse(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) {
                        const materials = Array.isArray(child.material) ? child.material : [child.material];
                        materials.forEach(material => material.dispose());
                    }
                });
            }

            /**
             * Clear all world objects except particles
             */
            clearWorld() {
                // Remove islands
                this.islands.forEach(island => {
                    this.disposeObject(island.mesh);
                    this.disposeObject(island.light);
                });
                this.islands = [];

                // Remove plants
                this.plants.forEach(plant => {
                    this.disposeObject(plant.mesh);
                    this.disposeObject(plant.light);
                });
                this.plants = [];

                // Remove waterfalls
                this.waterfalls.forEach(waterfall => this.disposeObject(waterfall.mesh));
                this.waterfalls = [];
                this.player.currentIsland = null;
                this.player.isGrounded = false;
            }

            /**
             * Save state to localStorage
             */
            saveState() {
                try {
                    localStorage.setItem('quantum_garden_state', JSON.stringify(this.getWorldState()));
                    document.getElementById('save-status').textContent = '';
                    return true;
                } catch (error) {
                    document.getElementById('save-status').textContent =
                        'Local save unavailable — use Export World to keep a copy.';
                    console.warn('Could not save garden:', error);
                    return false;
                }
            }

            /**
             * Load state from localStorage
             */
            loadState() {
                try {
                    const saved = localStorage.getItem('quantum_garden_state');
                    if (!saved) return false;
                    const state = this.validateWorldState(JSON.parse(saved), true);
                    this.restoreWorld(state);
                    return true;
                } catch (error) {
                    document.getElementById('save-status').textContent =
                        'Saved world unavailable — use Export World to keep your new garden.';
                    console.warn('Could not load garden:', error);
                    return false;
                }
            }

            /**
             * Show modal dialog
             */
            showModal(title, bodyHTML, actionCallback = null) {
                this.resetInput();
                if (document.pointerLockElement) document.exitPointerLock();
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-body').innerHTML = bodyHTML;
                document.getElementById('modal-overlay').classList.add('visible');

                const actionBtn = document.getElementById('modal-action');
                if (actionCallback) {
                    actionBtn.style.display = 'block';
                    actionBtn.textContent = 'Import';
                    actionBtn.onclick = actionCallback;
                } else {
                    actionBtn.style.display = 'none';
                }
                document.querySelector('#modal-body textarea')?.focus();
            }

            /**
             * Hide modal dialog
             */
            hideModal() {
                document.getElementById('modal-overlay').classList.remove('visible');
                this.renderer.domElement.focus();
            }

            /**
             * Handle window resize
             */
            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }

            /**
             * Cleanup and destroy
             */
            destroy() {
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }

                this.saveState();
                clearInterval(this.saveTimer);

                // Clean up Three.js resources
                this.scene.traverse(obj => {
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) {
                        if (Array.isArray(obj.material)) {
                            obj.material.forEach(mat => mat.dispose());
                        } else {
                            obj.material.dispose();
                        }
                    }
                });

                this.renderer.dispose();
                this.renderer.domElement.remove();

                console.log('🏝️ Quantum Garden destroyed');
            }
        }

        // ===== APPLICATION START =====

        // Initialize application when page loads
        let app = null;

        window.addEventListener('load', () => {
            const loading = document.getElementById('loading-message');
            if (!window.THREE) {
                loading.textContent = 'The 3D library could not load. Check your internet connection and reload to enter the garden.';
                return;
            }
            try {
                app = new QuantumGarden();
                loading.remove();
            } catch (error) {
                loading.textContent = 'The garden could not start. Enable WebGL in your browser and reload.';
                console.warn('Could not start Quantum Garden:', error);
            }
        });

        // pagehide also covers mobile navigation and does not destroy a back/forward-cache entry.
        window.addEventListener('pagehide', () => {
            if (app) {
                app.resetInput();
                app.saveState();
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && app) {
                app.resetInput();
                app.saveState();
            }
        });
    </script>
</body>
</html>
