<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Siege on the Hill — Wooden Catapult</title>
  <style>
    :root {
      --bg-panel: rgba(24, 18, 14, 0.72);
      --border-panel: rgba(214, 174, 108, 0.32);
      --text-main: #f5ead6;
      --text-muted: #c8b698;
      --accent: #e09132;
      --accent-hot: #ef5b25;
      --accent-glow: rgba(224, 145, 50, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1b1614;
      font-family: "Georgia", "Palatino Linotype", "Book Antiqua", serif;
      color: var(--text-main);
    }

    #scene {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }

    /* Top HUD */
    .hud-top {
      position: fixed;
      top: 16px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      gap: 12px;
      z-index: 10;
    }

    .title-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-panel);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 10px;
      padding: 10px 15px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      pointer-events: auto;
    }

    .title-card h1 {
      font-size: 16px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f7dba7;
      font-weight: 700;
    }

    .title-card p {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .status-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-panel);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 10px;
      padding: 10px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      min-width: 210px;
      pointer-events: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .status-row strong {
      color: var(--text-main);
      font-weight: 600;
    }

    .meter-track {
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #d9532f, #e8a23b, #6fb364);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .status-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Bottom Control Bar */
    .hud-controls {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--bg-panel);
      border: 1px solid var(--border-panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: 10px 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      max-width: calc(100vw - 24px);
      z-index: 10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .control-group label {
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      font-size: 10px;
    }

    .control-group .val {
      min-width: 36px;
      text-align: right;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 96px;
      height: 5px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f5c97b;
      border: 2px solid #4a2d13;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    .ammo-group {
      display: flex;
      gap: 4px;
      background: rgba(0, 0, 0, 0.25);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn {
      border: 1px solid rgba(214, 174, 108, 0.3);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(245, 201, 123, 0.6);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-ammo {
      border: none;
      background: transparent;
      padding: 5px 9px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .btn-ammo.active {
      background: rgba(224, 145, 50, 0.28);
      color: #ffe3ae;
      box-shadow: inset 0 0 0 1px rgba(245, 201, 123, 0.45);
    }

    .btn-fire {
      background: linear-gradient(180deg, #e78f32, #b84b18);
      border-color: #f6c278;
      color: #fff7e6;
      padding: 7px 16px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .btn-fire:hover {
      background: linear-gradient(180deg, #f39d3d, #c9551e);
    }

    .btn-toggle.active {
      background: rgba(111, 179, 100, 0.25);
      border-color: rgba(145, 214, 134, 0.65);
      color: #dcf7d7;
    }

    .divider {
      width: 1px;
      height: 22px;
      background: rgba(214, 174, 108, 0.22);
    }

    .victory-banner {
      position: fixed;
      top: 86px;
      left: 50%;
      transform: translateX(-50%) translateY(-16px);
      background: rgba(28, 19, 13, 0.86);
      border: 1px solid rgba(245, 201, 123, 0.6);
      border-radius: 12px;
      padding: 12px 24px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
      z-index: 12;
    }

    .victory-banner.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .victory-banner h2 {
      font-size: 18px;
      color: #ffd98a;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .victory-banner p {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    @media (max-width: 780px) {
      .hud-controls {
        gap: 8px;
        padding: 8px 10px;
      }
      .divider {
        display: none;
      }
      input[type="range"] {
        width: 72px;
      }
      .title-card p {
        display: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="hud-top">
    <div class="title-card">
      <h1>Siege on the Hill</h1>
      <p>Drag near catapult to aim &amp; fire &middot; Space to launch &middot; R to rebuild</p>
    </div>

    <div class="status-card">
      <div class="status-row">
        <span>Castle Integrity</span>
        <strong id="integrityText">100%</strong>
      </div>
      <div class="meter-track">
        <div class="meter-fill" id="integrityBar"></div>
      </div>
      <div class="status-meta">
        <span>Shots: <strong id="shotsText">0</strong></span>
        <span>Wind: <strong id="windText">0.0</strong></span>
      </div>
    </div>
  </div>

  <div class="victory-banner" id="victoryBanner">
    <h2>The Keep Has Fallen!</h2>
    <p>Press Rebuild Castle or R to raise the fortress anew.</p>
  </div>

  <div class="hud-controls">
    <div class="control-group">
      <label for="angleRange">Angle</label>
      <input id="angleRange" type="range" min="22" max="68" value="44" />
      <span class="val" id="angleVal">44&deg;</span>
    </div>

    <div class="control-group">
      <label for="powerRange">Power</label>
      <input id="powerRange" type="range" min="48" max="100" value="78" />
      <span class="val" id="powerVal">78%</span>
    </div>

    <div class="divider"></div>

    <div class="ammo-group" role="group" aria-label="Ammunition">
      <button class="btn btn-ammo active" data-ammo="boulder">Boulder</button>
      <button class="btn btn-ammo" data-ammo="fire">Flaming Pitch</button>
      <button class="btn btn-ammo" data-ammo="iron">Iron Shot</button>
    </div>

    <div class="divider"></div>

    <button class="btn btn-fire" id="fireBtn">Fire</button>
    <button class="btn btn-toggle active" id="autoBtn">Auto-Siege: On</button>
    <button class="btn" id="resetBtn">Rebuild</button>
    <button class="btn" id="soundBtn" title="Toggle Sound">Sound: Off</button>
  </div>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('scene');
      const ctx = canvas.getContext('2d');

      // Logical virtual world coordinates (1600 x 900 scaled to fill viewport cleanly)
      const WORLD_W = 1600;
      const WORLD_H = 900;
      let scale = 1;
      let offsetX = 0;
      let offsetY = 0;

      // Global simulation state
      const state = {
        time: 0,
        wind: 14, // px/s^2 horizontal acceleration
        targetWind: 14,
        shotsFired: 0,
        angleDeg: 44,
        powerPct: 78,
        ammo: 'boulder',
        autoSiege: true,
        autoTimer: 1.35,
        soundEnabled: false,
        shakeTime: 0,
        shakeMag: 0,
        castleCollapsed: false,
        dragging: false,
        dragStart: { x: 0, y: 0 },
        dragCurrent: { x: 0, y: 0 }
      };

      const AMMO_TYPES = {
        boulder: {
          name: 'Boulder',
          radius: 15,
          mass: 1.0,
          speedMul: 1.0,
          damageRadius: 68,
          damagePower: 1.05,
          fire: false
        },
        fire: {
          name: 'Flaming Pitch',
          radius: 14,
          mass: 0.9,
          speedMul: 1.03,
          damageRadius: 86,
          damagePower: 0.95,
          fire: true
        },
        iron: {
          name: 'Iron Shot',
          radius: 12,
          mass: 1.45,
          speedMul: 1.09,
          damageRadius: 56,
          damagePower: 1.65,
          fire: false
        }
      };

      // ========================
      // 1. PROCEDURAL AUDIO ENGINE
      // ========================
      const AudioEngine = (() => {
        let actx = null;

        function ensureContext() {
          if (!state.soundEnabled) return null;
          if (!actx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return null;
            actx = new Ctx();
          }
          if (actx.state === 'suspended') {
            actx.resume().catch(() => {});
          }
          return actx;
        }

        function createNoiseBuffer(c, duration) {
          const len = Math.floor(c.sampleRate * duration);
          const buf = c.createBuffer(1, len, c.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < len; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          return buf;
        }

        function playCreak() {
          const c = ensureContext();
          if (!c) return;
          const now = c.currentTime;
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(95, now);
          osc.frequency.exponentialRampToValueAtTime(145, now + 0.16);
          osc.frequency.exponentialRampToValueAtTime(82, now + 0.34);

          const filter = c.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 340;
          filter.Q.value = 4.5;

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.06, now + 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);

          osc.connect(filter).connect(gain).connect(c.destination);
          osc.start(now);
          osc.stop(now + 0.38);
        }

        function playLaunch(isFire) {
          const c = ensureContext();
          if (!c) return;
          const now = c.currentTime;

          // Heavy timber thwack against crossbar
          const osc = c.createOscillator();
          const g = c.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(170, now);
          osc.frequency.exponentialRampToValueAtTime(42, now + 0.22);
          g.gain.setValueAtTime(0.32, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.connect(g).connect(c.destination);
          osc.start(now);
          osc.stop(now + 0.25);

          // Rope twang + whoosh
          const noise = c.createBufferSource();
          noise.buffer = createNoiseBuffer(c, 0.45);
          const bp = c.createBiquadFilter();
          bp.type = 'bandpass';
          bp.frequency.setValueAtTime(isFire ? 650 : 420, now);
          bp.frequency.exponentialRampToValueAtTime(160, now + 0.42);
          bp.Q.value = 1.6;
          const ng = c.createGain();
          ng.gain.setValueAtTime(0.01, now);
          ng.gain.linearRampToValueAtTime(0.18, now + 0.05);
          ng.gain.exponentialRampToValueAtTime(0.001, now + 0.44);
          noise.connect(bp).connect(ng).connect(c.destination);
          noise.start(now);
          noise.stop(now + 0.45);
        }

        function playImpact(strength, isStone, isFire) {
          const c = ensureContext();
          if (!c) return;
          const now = c.currentTime;
          const amp = Math.min(1, 0.4 + strength * 0.6);

          // Low boom
          const osc = c.createOscillator();
          const g = c.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(isStone ? 120 : 88, now);
          osc.frequency.exponentialRampToValueAtTime(28, now + 0.42);
          g.gain.setValueAtTime(0.35 * amp, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.connect(g).connect(c.destination);
          osc.start(now);
          osc.stop(now + 0.46);

          // Crashing stone / dirt burst
          const noise = c.createBufferSource();
          noise.buffer = createNoiseBuffer(c, 0.7);
          const lp = c.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.setValueAtTime(isStone ? 2200 : 850, now);
          lp.frequency.exponentialRampToValueAtTime(180, now + 0.65);
          const ng = c.createGain();
          ng.gain.setValueAtTime(0.28 * amp, now);
          ng.gain.exponentialRampToValueAtTime(0.001, now + 0.68);
          noise.connect(lp).connect(ng).connect(c.destination);
          noise.start(now);
          noise.stop(now + 0.7);

          // Fire flare crackle
          if (isFire) {
            const fnoise = c.createBufferSource();
            fnoise.buffer = createNoiseBuffer(c, 0.6);
            const hp = c.createBiquadFilter();
            hp.type = 'highpass';
            hp.frequency.value = 1400;
            const fg = c.createGain();
            fg.gain.setValueAtTime(0.14 * amp, now);
            fg.gain.exponentialRampToValueAtTime(0.001, now + 0.58);
            fnoise.connect(hp).connect(fg).connect(c.destination);
            fnoise.start(now);
            fnoise.stop(now + 0.6);
          }
        }

        return { ensureContext, playCreak, playLaunch, playImpact };
      })();

      // ========================
      // 2. WORLD, SKY & TERRAIN
      // ========================
      const CASTLE_PLATEAU_Y = 516;
      const CASTLE_LEFT_X = 1095;
      const CASTLE_RIGHT_X = 1465;
      const CATAPULT_X = 246;

      function smoothstep(edge0, edge1, x) {
        const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
        return t * t * (3 - 2 * t);
      }

      // Deterministic ground elevation across the virtual 1600x900 canvas
      function getTerrainY(x) {
        // Left plateau for catapult around x=110..360 -> y ~ 706
        // Valley dip around x=660 -> y ~ 766
        // Steep castle hill rising x=820..1120 to flat plateau at y=516 (x=1100..1465)
        // Slight drop off on far right x=1470..1600 -> y ~ 595
        const baseLeft = 706 + Math.sin(x * 0.007) * 6;
        const valley = 62 * Math.exp(-Math.pow((x - 650) / 205, 2));
        const hillRise = smoothstep(790, 1110, x);
        const rightDrop = smoothstep(1455, 1620, x);
        let y = baseLeft + valley;
        y = y * (1 - hillRise) + CASTLE_PLATEAU_Y * hillRise;
        y += rightDrop * 96;
        // Flatten catapult pad slightly
        const padBlend = Math.exp(-Math.pow((x - CATAPULT_X) / 105, 2));
        y = y * (1 - padBlend * 0.85) + 706 * (padBlend * 0.85);
        return y;
      }

      // Clouds, birds, trees, grass tufts
      const clouds = Array.from({ length: 8 }, (_, i) => ({
        x: i * 230 + Math.random() * 120,
        y: 78 + (i % 4) * 52 + Math.random() * 24,
        w: 150 + Math.random() * 140,
        h: 38 + Math.random() * 24,
        speed: 5 + Math.random() * 8,
        alpha: 0.42 + Math.random() * 0.35
      }));

      const birds = Array.from({ length: 6 }, (_, i) => ({
        x: 350 + i * 190 + Math.random() * 80,
        y: 150 + Math.random() * 160,
        speed: 28 + Math.random() * 22,
        wingPhase: Math.random() * Math.PI * 2,
        scale: 0.65 + Math.random() * 0.5
      }));

      const distantTrees = [];
      for (let x = 420; x <= 930; x += 26) {
        if (Math.abs(x - 650) < 42) continue; // leave valley path clear
        if (Math.sin(x * 1.7) > -0.15) {
          distantTrees.push({
            x: x + Math.sin(x * 3.1) * 7,
            h: 22 + (Math.abs(Math.sin(x * 0.91)) * 22),
            shade: Math.abs(Math.cos(x * 0.43))
          });
        }
      }

      const grassTufts = Array.from({ length: 70 }, (_, i) => {
        const x = 10 + (i / 70) * 1580 + Math.sin(i * 7.3) * 8;
        return {
          x,
          h: 8 + (i % 5) * 3,
          lean: Math.sin(i * 2.4) * 4,
          hueShift: (i % 3) - 1
        };
      });

      function updateEnvironment(dt) {
        // Gentle drifting wind
        if (Math.random() < dt * 0.14) {
          state.targetWind = (Math.random() - 0.42) * 42;
        }
        state.wind += (state.targetWind - state.wind) * Math.min(1, dt * 0.4);

        for (const c of clouds) {
          c.x += (c.speed + state.wind * 0.35) * dt;
          if (c.x - c.w > WORLD_W + 80) c.x = -c.w - 60;
          if (c.x + c.w < -120) c.x = WORLD_W + c.w;
        }

        for (const b of birds) {
          b.x += (b.speed + state.wind * 0.25) * dt;
          b.y += Math.sin(state.time * 1.4 + b.wingPhase) * 6 * dt;
          b.wingPhase += dt * 7.5;
          if (b.x > WORLD_W + 60) {
            b.x = -60;
            b.y = 110 + Math.random() * 190;
          }
        }
      }

      function drawSkyAndMountains() {
        // Golden-hour medieval sunset sky
        const sky = ctx.createLinearGradient(0, 0, 0, WORLD_H * 0.85);
        sky.addColorStop(0.0, '#1e2845');
        sky.addColorStop(0.28, '#4d3b5c');
        sky.addColorStop(0.56, '#b55d4c');
        sky.addColorStop(0.80, '#e89b54');
        sky.addColorStop(1.0, '#f7cf86');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, WORLD_W, WORLD_H);

        // Low warm sun behind the valley
        const sunX = 760;
        const sunY = 475;
        const sunGlow = ctx.createRadialGradient(sunX, sunY, 18, sunX, sunY, 340);
        sunGlow.addColorStop(0, 'rgba(255, 245, 200, 0.95)');
        sunGlow.addColorStop(0.18, 'rgba(255, 212, 130, 0.55)');
        sunGlow.addColorStop(0.55, 'rgba(240, 134, 72, 0.16)');
        sunGlow.addColorStop(1, 'rgba(240, 134, 72, 0)');
        ctx.fillStyle = sunGlow;
        ctx.beginPath();
        ctx.arc(sunX, sunY, 340, 0, Math.PI * 2);
        ctx.fill();

        // Sun disc
        ctx.fillStyle = 'rgba(255, 246, 214, 0.92)';
        ctx.beginPath();
        ctx.arc(sunX, sunY, 44, 0, Math.PI * 2);
        ctx.fill();

        // Subtle atmospheric sun rays
        ctx.save();
        ctx.translate(sunX, sunY);
        ctx.fillStyle = 'rgba(255, 224, 155, 0.045)';
        for (let i = 0; i < 6; i++) {
          const ang = -Math.PI * 0.85 + i * 0.28 + Math.sin(state.time * 0.15 + i) * 0.02;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(ang - 0.06) * 900, Math.sin(ang - 0.06) * 900);
          ctx.lineTo(Math.cos(ang + 0.06) * 900, Math.sin(ang + 0.06) * 900);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();

        // Soft drifting clouds lit from underneath
        for (const c of clouds) {
          ctx.save();
          ctx.globalAlpha = c.alpha;
          const cg = ctx.createLinearGradient(c.x, c.y - c.h, c.x, c.y + c.h * 0.6);
          cg.addColorStop(0, '#463854');
          cg.addColorStop(0.65, '#a85f57');
          cg.addColorStop(1, '#f4bc78');
          ctx.fillStyle = cg;

          ctx.beginPath();
          ctx.ellipse(c.x, c.y, c.w * 0.5, c.h * 0.55, 0, 0, Math.PI * 2);
          ctx.ellipse(c.x - c.w * 0.26, c.y + 6, c.w * 0.34, c.h * 0.42, 0, 0, Math.PI * 2);
          ctx.ellipse(c.x + c.w * 0.28, c.y + 8, c.w * 0.32, c.h * 0.4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Far mountain ridge
        ctx.beginPath();
        ctx.moveTo(0, WORLD_H);
        for (let x = 0; x <= WORLD_W; x += 40) {
          const y = 550
            - Math.sin(x * 0.0042 + 0.7) * 72
            - Math.sin(x * 0.011) * 34
            - Math.cos(x * 0.0023) * 45;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(WORLD_W, WORLD_H);
        ctx.closePath();
        const farGrad = ctx.createLinearGradient(0, 420, 0, 740);
        farGrad.addColorStop(0, '#5a435d');
        farGrad.addColorStop(1, '#9d6860');
        ctx.fillStyle = farGrad;
        ctx.fill();

        // Mid rolling hills
        ctx.beginPath();
        ctx.moveTo(0, WORLD_H);
        for (let x = 0; x <= WORLD_W; x += 30) {
          const y = 638
            - Math.sin(x * 0.0052 + 2.1) * 48
            - Math.cos(x * 0.0095) * 20;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(WORLD_W, WORLD_H);
        ctx.closePath();
        const midGrad = ctx.createLinearGradient(0, 560, 0, 820);
        midGrad.addColorStop(0, '#444b3e');
        midGrad.addColorStop(1, '#2d372c');
        ctx.fillStyle = midGrad;
        ctx.fill();

        // Distant birds
        ctx.strokeStyle = 'rgba(42, 26, 28, 0.65)';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        for (const b of birds) {
          const flap = Math.sin(b.wingPhase) * 5 * b.scale;
          const s = 8 * b.scale;
          ctx.beginPath();
          ctx.moveTo(b.x - s, b.y + flap);
          ctx.quadraticCurveTo(b.x - s * 0.4, b.y - 3 * b.scale, b.x, b.y);
          ctx.quadraticCurveTo(b.x + s * 0.4, b.y - 3 * b.scale, b.x + s, b.y + flap);
          ctx.stroke();
        }
      }

      function drawTerrain() {
        // Main hill & valley silhouette
        ctx.beginPath();
        ctx.moveTo(0, WORLD_H);
        for (let x = 0; x <= WORLD_W; x += 12) {
          ctx.lineTo(x, getTerrainY(x));
        }
        ctx.lineTo(WORLD_W, WORLD_H);
        ctx.closePath();

        const hillGrad = ctx.createLinearGradient(0, 500, 0, WORLD_H);
        hillGrad.addColorStop(0.0, '#4d6338');
        hillGrad.addColorStop(0.28, '#384b29');
        hillGrad.addColorStop(0.65, '#27341e');
        hillGrad.addColorStop(1.0, '#181e14');
        ctx.fillStyle = hillGrad;
        ctx.fill();

        // Rocky crag face under the castle hill
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(930, getTerrainY(930));
        for (let x = 930; x <= WORLD_W; x += 14) {
          ctx.lineTo(x, getTerrainY(x));
        }
        ctx.lineTo(WORLD_W, WORLD_H);
        ctx.lineTo(880, WORLD_H);
        ctx.closePath();
        ctx.clip();

        // Cliff strata & boulders
        const rockPolys = [
          [[970, 620], [1065, 540], [1165, 535], [1220, 650], [1040, 720]],
          [[1180, 545], [1325, 540], [1425, 575], [1495, 710], [1240, 730]],
          [[1020, 700], [1260, 660], [1540, 720], [1580, 890], [920, 890]]
        ];
        const rockColors = ['#58524b', '#49433d', '#3a3530'];
        rockPolys.forEach((pts, idx) => {
          ctx.beginPath();
          pts.forEach(([px, py], i) => (i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py)));
          ctx.closePath();
          ctx.fillStyle = rockColors[idx];
          ctx.fill();
          ctx.strokeStyle = 'rgba(20, 16, 13, 0.35)';
          ctx.lineWidth = 2;
          ctx.stroke();
        });

        // Warm sunlit rim highlights on cliff edges
        ctx.strokeStyle = 'rgba(235, 175, 110, 0.24)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(975, 618);
        ctx.lineTo(1068, 542);
        ctx.lineTo(1162, 538);
        ctx.moveTo(1188, 548);
        ctx.lineTo(1322, 544);
        ctx.stroke();
        ctx.restore();

        // Winding dirt siege road up toward the hill
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(395, getTerrainY(395) + 4);
        ctx.quadraticCurveTo(645, getTerrainY(645) + 18, 880, getTerrainY(880) + 12);
        ctx.quadraticCurveTo(995, getTerrainY(995) + 8, 1090, getTerrainY(1090) + 6);
        ctx.strokeStyle = 'rgba(138, 112, 78, 0.55)';
        ctx.lineWidth = 18;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.strokeStyle = 'rgba(182, 148, 102, 0.35)';
        ctx.lineWidth = 7;
        ctx.stroke();
        ctx.restore();

        // Sunlit top grass rim
        ctx.beginPath();
        for (let x = 0; x <= WORLD_W; x += 12) {
          const y = getTerrainY(x);
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = 'rgba(162, 186, 94, 0.42)';
        ctx.lineWidth = 4;
        ctx.stroke();

        // Pine trees nestled in the valley slope
        for (const t of distantTrees) {
          const ty = getTerrainY(t.x) + 3;
          ctx.fillStyle = '#2d231a';
          ctx.fillRect(t.x - 2, ty - 7, 4, 8);
          ctx.fillStyle = t.shade > 0.5 ? '#263822' : '#1e2e1b';
          for (let tier = 0; tier < 3; tier++) {
            const w = (t.h * 0.44) * (1 - tier * 0.22);
            const base = ty - 6 - tier * (t.h * 0.25);
            const top = base - t.h * 0.38;
            ctx.beginPath();
            ctx.moveTo(t.x, top);
            ctx.lineTo(t.x - w, base);
            ctx.lineTo(t.x + w, base);
            ctx.closePath();
            ctx.fill();
          }
        }

        // Foreground swaying grass tufts
        const sway = Math.sin(state.time * 2.2) * 2.5 + state.wind * 0.14;
        for (const g of grassTufts) {
          const gy = getTerrainY(g.x);
          if (g.x > CASTLE_LEFT_X - 10 && g.x < CASTLE_RIGHT_X + 10) continue;
          ctx.strokeStyle = g.hueShift > 0 ? '#5c7538' : '#465e2c';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(g.x, gy + 2);
          ctx.quadraticCurveTo(g.x + g.lean + sway * 0.5, gy - g.h * 0.5, g.x + g.lean + sway, gy - g.h);
          ctx.stroke();
        }
      }

      // ========================
      // 3. CASTLE & PARTICLES
      // ========================
      let castleBlocks = [];
      let totalInitialHp = 1;
      const particles = [];
      const shockwaves = [];
      const groundCraters = [];

      function addCameraShake(mag, duration) {
        state.shakeMag = Math.max(state.shakeMag, mag);
        state.shakeTime = Math.max(state.shakeTime, duration);
      }

      function buildCastle() {
        castleBlocks = [];
        groundCraters.length = 0;
        state.castleCollapsed = false;
        document.getElementById('victoryBanner').classList.remove('show');

        const base = CASTLE_PLATEAU_Y;
        const rowH = 26;

        function pushBlock(opts) {
          const b = {
            x: opts.x,
            y: opts.y,
            w: opts.w,
            h: opts.h,
            vy: 0,
            hp: opts.hp || 100,
            maxHp: opts.hp || 100,
            kind: opts.kind || 'stone', // stone, merlon, roof, gate
            tone: opts.tone !== undefined ? opts.tone : (Math.random() - 0.5) * 18,
            hasWindow: !!opts.hasWindow,
            hasFlag: !!opts.hasFlag,
            flagColor: opts.flagColor || '#b82924',
            scorched: 0,
            burning: 0,
            alive: true,
            supportGroup: opts.supportGroup || 'wall'
          };
          castleBlocks.push(b);
        }

        // Left Watchtower (x: 1112..1184, 5 rows + merlons + roof)
        const ltX = 1112;
        const ltW = 72;
        for (let r = 0; r < 5; r++) {
          const y = base - (r + 1) * rowH;
          if (r % 2 === 0) {
            pushBlock({ x: ltX, y, w: 36, h: rowH, hp: 115, hasWindow: r === 2 });
            pushBlock({ x: ltX + 36, y, w: 36, h: rowH, hp: 115, hasWindow: r === 4 });
          } else {
            pushBlock({ x: ltX, y, w: 22, h: rowH, hp: 105 });
            pushBlock({ x: ltX + 22, y, w: 28, h: rowH, hp: 115, hasWindow: r === 3 });
            pushBlock({ x: ltX + 50, y, w: 22, h: rowH, hp: 105 });
          }
        }
        // Left tower parapet merlons & conical roof
        const ltTop = base - 5 * rowH;
        pushBlock({ x: ltX - 4, y: ltTop - 16, w: 18, h: 16, hp: 55, kind: 'merlon' });
        pushBlock({ x: ltX + 27, y: ltTop - 16, w: 18, h: 16, hp: 55, kind: 'merlon' });
        pushBlock({ x: ltX + 58, y: ltTop - 16, w: 18, h: 16, hp: 55, kind: 'merlon' });
        pushBlock({ x: ltX - 6, y: ltTop - 74, w: ltW + 12, h: 58, hp: 85, kind: 'roof', hasFlag: true, flagColor: '#c9342b' });

        // Curtain Wall (x: 1184..1372, 3 rows, with arched gate in middle)
        const cwX = 1184;
        const segW = 47;
        for (let r = 0; r < 3; r++) {
          const y = base - (r + 1) * rowH;
          for (let c = 0; c < 4; c++) {
            const bx = cwX + c * segW;
            const isGate = r < 2 && c === 1;
            if (isGate && r === 1) continue; // single 2-row tall gate block
            if (isGate && r === 0) {
              pushBlock({ x: bx, y: base - rowH * 2, w: segW, h: rowH * 2, hp: 140, kind: 'gate' });
            } else {
              pushBlock({ x: bx, y, w: segW, h: rowH, hp: 110, hasWindow: r === 2 && (c === 0 || c === 3) });
            }
          }
        }
        // Curtain wall merlons
        const cwTop = base - 3 * rowH;
        for (let i = 0; i < 4; i++) {
          pushBlock({ x: cwX + 6 + i * 47, y: cwTop - 15, w: 20, h: 15, hp: 50, kind: 'merlon' });
        }

        // Central Keep rising behind/above curtain wall (x: 1226..1336, rows 3..6)
        const kpX = 1226;
        const kpW = 110;
        for (let r = 3; r < 7; r++) {
          const y = base - (r + 1) * rowH;
          if (r % 2 === 1) {
            pushBlock({ x: kpX, y, w: 55, h: rowH, hp: 130, hasWindow: r === 5 });
            pushBlock({ x: kpX + 55, y, w: 55, h: rowH, hp: 130, hasWindow: r === 5 });
          } else {
            pushBlock({ x: kpX, y, w: 32, h: rowH, hp: 120 });
            pushBlock({ x: kpX + 32, y, w: 46, h: rowH, hp: 135, hasWindow: r === 4 || r === 6 });
            pushBlock({ x: kpX + 78, y, w: 32, h: rowH, hp: 120 });
          }
        }
        const kpTop = base - 7 * rowH;
        pushBlock({ x: kpX - 4, y: kpTop - 18, w: 20, h: 18, hp: 60, kind: 'merlon' });
        pushBlock({ x: kpX + 27, y: kpTop - 18, w: 20, h: 18, hp: 60, kind: 'merlon' });
        pushBlock({ x: kpX + 61, y: kpTop - 18, w: 20, h: 18, hp: 60, kind: 'merlon' });
        pushBlock({ x: kpX + 94, y: kpTop - 18, w: 20, h: 18, hp: 60, kind: 'merlon' });
        pushBlock({ x: kpX - 8, y: kpTop - 92, w: kpW + 16, h: 74, hp: 100, kind: 'roof', hasFlag: true, flagColor: '#d99b26' });

        // Right Watchtower (x: 1372..1444, 5 rows + merlons + roof)
        const rtX = 1372;
        const rtW = 72;
        for (let r = 0; r < 5; r++) {
          const y = base - (r + 1) * rowH;
          if (r % 2 === 0) {
            pushBlock({ x: rtX, y, w: 36, h: rowH, hp: 115, hasWindow: r === 4 });
            pushBlock({ x: rtX + 36, y, w: 36, h: rowH, hp: 115, hasWindow: r === 2 });
          } else {
            pushBlock({ x: rtX, y, w: 22, h: rowH, hp: 105 });
            pushBlock({ x: rtX + 22, y, w: 28, h: rowH, hp: 115, hasWindow: r === 3 });
            pushBlock({ x: rtX + 50, y, w: 22, h: rowH, hp: 105 });
          }
        }
        const rtTop = base - 5 * rowH;
        pushBlock({ x: rtX - 4, y: rtTop - 16, w: 18, h: 16, hp: 55, kind: 'merlon' });
        pushBlock({ x: rtX + 27, y: rtTop - 16, w: 18, h: 16, hp: 55, kind: 'merlon' });
        pushBlock({ x: rtX + 58, y: rtTop - 16, w: 18, h: 16, hp: 55, kind: 'merlon' });
        pushBlock({ x: rtX - 6, y: rtTop - 74, w: rtW + 12, h: 58, hp: 85, kind: 'roof', hasFlag: true, flagColor: '#c9342b' });

        totalInitialHp = castleBlocks.reduce((acc, b) => acc + b.maxHp, 0);
        updateIntegrityHUD();
      }

      function getCastleIntegrityPct() {
        let cur = 0;
        for (const b of castleBlocks) {
          if (b.alive) cur += Math.max(0, b.hp);
        }
        return Math.round((cur / totalInitialHp) * 100);
      }

      function updateIntegrityHUD() {
        const pct = getCastleIntegrityPct();
        const textEl = document.getElementById('integrityText');
        const barEl = document.getElementById('integrityBar');
        if (textEl) textEl.textContent = pct + '%';
        if (barEl) barEl.style.width = pct + '%';

        if (pct <= 18 && !state.castleCollapsed) {
          state.castleCollapsed = true;
          document.getElementById('victoryBanner').classList.add('show');
        }
      }

      function spawnDebris(x, y, count, kind, speedScale = 1) {
        for (let i = 0; i < count; i++) {
          const ang = -Math.PI * 0.1 - Math.random() * Math.PI * 0.85;
          const spd = (70 + Math.random() * 240) * speedScale;
          const isRoof = kind === 'roof';
          particles.push({
            type: 'chunk',
            x: x + (Math.random() - 0.5) * 20,
            y: y + (Math.random() - 0.5) * 16,
            vx: Math.cos(ang) * spd + (Math.random() - 0.5) * 60,
            vy: Math.sin(ang) * spd - 40,
            size: 4 + Math.random() * 9,
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 11,
            color: isRoof
              ? (Math.random() > 0.4 ? '#3d4759' : '#2d3544')
              : (Math.random() > 0.35 ? '#8d857b' : '#6f685f'),
            life: 1.4 + Math.random() * 1.4,
            maxLife: 2.8
          });
        }
      }

      function spawnDust(x, y, count, dark = false) {
        for (let i = 0; i < count; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 18 + Math.random() * 95;
          particles.push({
            type: 'smoke',
            x: x + (Math.random() - 0.5) * 24,
            y: y + (Math.random() - 0.5) * 18,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 30 - Math.random() * 35,
            size: 12 + Math.random() * 26,
            grow: 22 + Math.random() * 26,
            color: dark ? 'rgba(42, 36, 34,' : 'rgba(186, 174, 158,',
            life: 0.75 + Math.random() * 0.9,
            maxLife: 1.65
          });
        }
      }

      function spawnFireBurst(x, y, count) {
        for (let i = 0; i < count; i++) {
          const ang = -Math.PI * Math.random();
          const spd = 45 + Math.random() * 190;
          particles.push({
            type: 'ember',
            x: x + (Math.random() - 0.5) * 18,
            y: y + (Math.random() - 0.5) * 14,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 45,
            size: 2.5 + Math.random() * 5,
            life: 0.45 + Math.random() * 0.75,
            maxLife: 1.2
          });
        }
      }

      function applyExplosion(x, y, radius, power, isFire, hitStone) {
        shockwaves.push({ x, y, r: 8, maxR: radius * 1.15, alpha: 0.8, isFire });
        addCameraShake(Math.min(18, 6 + power * 7), 0.34);
        AudioEngine.playImpact(power, hitStone, isFire);

        if (hitStone) {
          spawnDebris(x, y, Math.round(14 * power), 'stone', 1.0);
          spawnDust(x, y, 12, isFire);
        } else {
          spawnDust(x, y, 10, false);
          if (groundCraters.length < 24) {
            groundCraters.push({ x, y: getTerrainY(x), r: 10 + power * 8, scorch: isFire });
          }
        }
        if (isFire) {
          spawnFireBurst(x, y, 26);
          spawnDust(x, y - 6, 8, true);
        }

        let anyDestroyed = false;
        for (const b of castleBlocks) {
          if (!b.alive) continue;
          const cx = b.x + b.w * 0.5;
          const cy = b.y + b.h * 0.5;
          const dist = Math.hypot(cx - x, cy - y);
          if (dist < radius + Math.max(b.w, b.h) * 0.55) {
            const falloff = Math.max(0.15, 1 - dist / (radius + 36));
            const dmg = 110 * power * falloff;
            b.hp -= dmg;
            if (isFire) {
              b.scorched = Math.min(1, b.scorched + 0.55 * falloff);
              b.burning = Math.max(b.burning, 4.5 + Math.random() * 4.5);
            } else {
              b.scorched = Math.min(0.65, b.scorched + 0.18 * falloff);
            }
            if (b.hp <= 0) {
              b.alive = false;
              anyDestroyed = true;
              spawnDebris(cx, cy, b.kind === 'roof' ? 16 : 9, b.kind, 0.9);
              spawnDust(cx, cy, 4, isFire);
            }
          }
        }
        if (anyDestroyed || hitStone) {
          updateIntegrityHUD();
        }
      }

      function updateCastleAndParticles(dt) {
        // Gravity settling for unsupported castle blocks (bottom-up sort)
        const aliveBlocks = castleBlocks.filter(b => b.alive);
        aliveBlocks.sort((a, b) => (b.y + b.h) - (a.y + a.h));

        for (const b of aliveBlocks) {
          // Burning damage over time
          if (b.burning > 0) {
            b.burning -= dt;
            b.hp -= dt * 7.5;
            if (Math.random() < dt * 7) {
              particles.push({
                type: 'ember',
                x: b.x + Math.random() * b.w,
                y: b.y + Math.random() * b.h * 0.5,
                vx: state.wind * 0.6 + (Math.random() - 0.5) * 24,
                vy: -45 - Math.random() * 55,
                size: 2.2 + Math.random() * 3.5,
                life: 0.4 + Math.random() * 0.45,
                maxLife: 0.85
              });
            }
            if (Math.random() < dt * 3.2) {
              particles.push({
                type: 'smoke',
                x: b.x + b.w * 0.5 + (Math.random() - 0.5) * 14,
                y: b.y,
                vx: state.wind * 0.7,
                vy: -38 - Math.random() * 20,
                size: 9 + Math.random() * 10,
                grow: 18,
                color: 'rgba(35, 30, 28,',
                life: 0.9,
                maxLife: 0.9
              });
            }
            if (b.hp <= 0) {
              b.alive = false;
              spawnDebris(b.x + b.w * 0.5, b.y + b.h * 0.5, 8, b.kind, 0.7);
              updateIntegrityHUD();
              continue;
            }
          }

          // Compute support floor below this block
          let supportY = CASTLE_PLATEAU_Y;
          for (const other of aliveBlocks) {
            if (other === b || !other.alive) continue;
            const overlapX = Math.min(b.x + b.w, other.x + other.w) - Math.max(b.x, other.x);
            if (overlapX > 8 && other.y >= b.y + b.h - 6) {
              if (other.y < supportY) {
                supportY = other.y;
              }
            }
          }

          if (b.y + b.h < supportY - 0.5) {
            b.vy += 680 * dt;
            b.y += b.vy * dt;
            if (b.y + b.h >= supportY) {
              const impactVel = b.vy;
              b.y = supportY - b.h;
              b.vy = 0;
              if (impactVel > 135) {
                b.hp -= (impactVel - 110) * 0.36;
                spawnDust(b.x + b.w * 0.5, supportY, 3, false);
                if (b.hp <= 0) {
                  b.alive = false;
                  spawnDebris(b.x + b.w * 0.5, b.y + b.h * 0.5, 8, b.kind, 0.75);
                }
                updateIntegrityHUD();
              }
            }
          } else {
            b.vy = 0;
          }
        }

        // Update particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life -= dt;
          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          if (p.type === 'chunk') {
            p.vy += 760 * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.rot += p.vrot * dt;
            const gy = getTerrainY(p.x);
            if (p.y > gy - p.size * 0.4) {
              p.y = gy - p.size * 0.4;
              p.vy *= -0.35;
              p.vx *= 0.68;
              p.vrot *= 0.6;
            }
          } else if (p.type === 'smoke') {
            p.vx += state.wind * 0.45 * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.size += p.grow * dt;
          } else if (p.type === 'ember') {
            p.vx += state.wind * 0.9 * dt;
            p.vy += 120 * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
          }
        }

        // Update shockwaves
        for (let i = shockwaves.length - 1; i >= 0; i--) {
          const s = shockwaves[i];
          s.r += (s.maxR - s.r) * Math.min(1, dt * 11) + 40 * dt;
          s.alpha -= dt * 2.4;
          if (s.alpha <= 0) shockwaves.splice(i, 1);
        }
      }

      function drawPennant(x, y, color) {
        const wave = Math.sin(state.time * 6.5 + x * 0.05) * 4;
        const windDir = state.wind >= -4 ? 1 : -1;
        const len = 26 + Math.min(10, Math.abs(state.wind) * 0.2);

        // Pole
        ctx.strokeStyle = '#33261d';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y - 28);
        ctx.stroke();

        // Fluttering cloth
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x, y - 27);
        ctx.quadraticCurveTo(x + windDir * len * 0.5, y - 26 + wave, x + windDir * len, y - 22 - wave * 0.6);
        ctx.lineTo(x, y - 16);
        ctx.closePath();
        ctx.fill();

        // Gold trim stripe
        ctx.strokeStyle = 'rgba(248, 212, 118, 0.7)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      function drawCastle() {
        // Subtle foundation stone plinth
        ctx.fillStyle = '#4e4841';
        ctx.fillRect(CASTLE_LEFT_X + 8, CASTLE_PLATEAU_Y - 3, 344, 14);
        ctx.fillStyle = '#3a3530';
        ctx.fillRect(CASTLE_LEFT_X + 4, CASTLE_PLATEAU_Y + 6, 352, 8);

        // Ground scorch/crater marks
        for (const c of groundCraters) {
          ctx.save();
          ctx.fillStyle = c.scorch ? 'rgba(28, 18, 12, 0.55)' : 'rgba(42, 34, 24, 0.42)';
          ctx.beginPath();
          ctx.ellipse(c.x, c.y + 2, c.r * 1.4, c.r * 0.42, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        for (const b of castleBlocks) {
          if (!b.alive) continue;
          const dmgRatio = 1 - Math.max(0, b.hp) / b.maxHp;

          if (b.kind === 'roof') {
            // Steep medieval conical/pitched slate roof
            const cx = b.x + b.w * 0.5;
            const roofGrad = ctx.createLinearGradient(b.x, b.y, b.x + b.w, b.y + b.h);
            roofGrad.addColorStop(0, '#4f5d73');
            roofGrad.addColorStop(0.55, '#374254');
            roofGrad.addColorStop(1, '#252c38');
            ctx.fillStyle = roofGrad;
            ctx.beginPath();
            ctx.moveTo(cx, b.y);
            ctx.lineTo(b.x + b.w, b.y + b.h);
            ctx.lineTo(b.x, b.y + b.h);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(20, 22, 28, 0.55)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Sunlit left slope highlight
            ctx.strokeStyle = 'rgba(244, 189, 122, 0.35)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx, b.y + 2);
            ctx.lineTo(b.x + 3, b.y + b.h - 2);
            ctx.stroke();

            if (b.hasFlag) {
              drawPennant(cx, b.y + 2, b.flagColor);
            }
            continue;
          }

          // Stone masonry block
          const baseL = 132 + b.tone - b.scorched * 58;
          const rCol = Math.max(36, Math.round(baseL + 10));
          const gCol = Math.max(34, Math.round(baseL + 2));
          const bCol = Math.max(32, Math.round(baseL - 8));

          const grad = ctx.createLinearGradient(b.x, b.y, b.x + b.w, b.y + b.h);
          grad.addColorStop(0, `rgb(${rCol + 16}, ${gCol + 12}, ${bCol + 6})`);
          grad.addColorStop(0.5, `rgb(${rCol}, ${gCol}, ${bCol})`);
          grad.addColorStop(1, `rgb(${rCol - 24}, ${gCol - 24}, ${bCol - 20})`);

          ctx.fillStyle = grad;
          ctx.fillRect(b.x, b.y, b.w, b.h);

          // Mortar outline + warm sunlit left rim
          ctx.strokeStyle = 'rgba(36, 30, 26, 0.55)';
          ctx.lineWidth = 1.2;
          ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);

          ctx.strokeStyle = 'rgba(250, 204, 142, 0.22)';
          ctx.beginPath();
          ctx.moveTo(b.x + 1.5, b.y + b.h - 1.5);
          ctx.lineTo(b.x + 1.5, b.y + 1.5);
          ctx.lineTo(b.x + b.w - 1.5, b.y + 1.5);
          ctx.stroke();

          // Arched portcullis gate
          if (b.kind === 'gate') {
            const gx = b.x + 8;
            const gw = b.w - 16;
            const gh = b.h - 10;
            const gy = b.y + 10;
            ctx.fillStyle = '#1b1411';
            ctx.beginPath();
            ctx.moveTo(gx, b.y + b.h);
            ctx.lineTo(gx, gy + gw * 0.5);
            ctx.arc(gx + gw * 0.5, gy + gw * 0.5, gw * 0.5, Math.PI, 0);
            ctx.lineTo(gx + gw, b.y + b.h);
            ctx.closePath();
            ctx.fill();

            // Iron portcullis bars
            ctx.strokeStyle = '#5a5048';
            ctx.lineWidth = 1.5;
            for (let i = 1; i <= 3; i++) {
              const bx = gx + (gw / 4) * i;
              ctx.beginPath();
              ctx.moveTo(bx, gy + 5);
              ctx.lineTo(bx, b.y + b.h);
              ctx.stroke();
            }
            for (let j = 1; j <= 3; j++) {
              const by = gy + (gh / 4) * j;
              ctx.beginPath();
              ctx.moveTo(gx + 1, by);
              ctx.lineTo(gx + gw - 1, by);
              ctx.stroke();
            }
          }

          // Warm torchlit arched window
          if (b.hasWindow) {
            const wx = b.x + b.w * 0.5;
            const wy = b.y + b.h * 0.55;
            const flicker = 0.85 + Math.sin(state.time * 9 + b.x) * 0.15;
            ctx.fillStyle = `rgba(255, 198, 92, ${0.88 * flicker})`;
            ctx.beginPath();
            ctx.arc(wx, wy - 2, 4.5, Math.PI, 0);
            ctx.lineTo(wx + 4.5, wy + 7);
            ctx.lineTo(wx - 4.5, wy + 7);
            ctx.closePath();
            ctx.fill();

            // Window glow halo
            const wg = ctx.createRadialGradient(wx, wy, 1, wx, wy, 15);
            wg.addColorStop(0, `rgba(255, 185, 76, ${0.42 * flicker})`);
            wg.addColorStop(1, 'rgba(255, 160, 50, 0)');
            ctx.fillStyle = wg;
            ctx.beginPath();
            ctx.arc(wx, wy, 15, 0, Math.PI * 2);
            ctx.fill();
          }

          // Crack lines on damaged masonry
          if (dmgRatio > 0.22) {
            ctx.strokeStyle = 'rgba(22, 17, 14, 0.78)';
            ctx.lineWidth = dmgRatio > 0.55 ? 2 : 1.2;
            ctx.beginPath();
            ctx.moveTo(b.x + b.w * 0.25, b.y + 2);
            ctx.lineTo(b.x + b.w * 0.48, b.y + b.h * 0.45);
            ctx.lineTo(b.x + b.w * 0.36, b.y + b.h - 2);
            if (dmgRatio > 0.5) {
              ctx.moveTo(b.x + b.w * 0.48, b.y + b.h * 0.45);
              ctx.lineTo(b.x + b.w * 0.82, b.y + b.h * 0.68);
            }
            ctx.stroke();
          }

          // Active fire glow on burning block
          if (b.burning > 0) {
            const fg = ctx.createRadialGradient(
              b.x + b.w * 0.5, b.y + 4, 2,
              b.x + b.w * 0.5, b.y + 4, 24
            );
            fg.addColorStop(0, 'rgba(255, 224, 110, 0.7)');
            fg.addColorStop(0.5, 'rgba(240, 102, 28, 0.4)');
            fg.addColorStop(1, 'rgba(240, 80, 20, 0)');
            ctx.fillStyle = fg;
            ctx.beginPath();
            ctx.arc(b.x + b.w * 0.5, b.y + 4, 24, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function drawParticlesAndShockwaves() {
        // Shockwaves
        for (const s of shockwaves) {
          ctx.save();
          ctx.strokeStyle = s.isFire
            ? `rgba(255, 172, 74, ${s.alpha})`
            : `rgba(245, 232, 210, ${s.alpha * 0.75})`;
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // Particles
        for (const p of particles) {
          const t = Math.max(0, p.life / p.maxLife);
          if (p.type === 'smoke') {
            ctx.fillStyle = `${p.color} ${(t * 0.46).toFixed(3)})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          } else if (p.type === 'chunk') {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.globalAlpha = Math.min(1, t * 2);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.moveTo(-p.size * 0.5, -p.size * 0.4);
            ctx.lineTo(p.size * 0.55, -p.size * 0.3);
            ctx.lineTo(p.size * 0.4, p.size * 0.5);
            ctx.lineTo(-p.size * 0.45, p.size * 0.35);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          } else if (p.type === 'ember') {
            ctx.fillStyle = t > 0.45
              ? `rgba(255, 224, 112, ${t})`
              : `rgba(235, 88, 28, ${t})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * (0.4 + t * 0.6), 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // ========================
      // 4. WOODEN CATAPULT & PROJECTILES
      // ========================
      const GRAVITY = 580;
      const projectiles = [];

      const catapult = {
        x: CATAPULT_X,
        y: getTerrainY(CATAPULT_X),
        phase: 'idle', // idle | windup | firing | recover
        phaseTime: 0,
        armAngle: -2.42, // radians; cocked back (~ -138 deg), stop bar at -0.58 rad (~ -33 deg)
        recoilX: 0,
        recoilVx: 0,
        wheelAngle: 0,
        loaded: true,
        pendingShot: null
      };

      function getPivotPos() {
        return {
          x: catapult.x + catapult.recoilX + 12,
          y: catapult.y - 34
        };
      }

      function getLaunchOrigin() {
        const pivot = getPivotPos();
        const armLen = 98;
        const releaseAng = -0.62;
        return {
          x: pivot.x + Math.cos(releaseAng) * armLen,
          y: pivot.y + Math.sin(releaseAng) * armLen
        };
      }

      function computeLaunchVelocity(angleDeg, powerPct, ammoKey) {
        const spec = AMMO_TYPES[ammoKey] || AMMO_TYPES.boulder;
        const rad = (angleDeg * Math.PI) / 180;
        const speed = (480 + powerPct * 5.05) * spec.speedMul;
        return {
          vx: Math.cos(rad) * speed,
          vy: -Math.sin(rad) * speed
        };
      }

      function triggerCatapultFire() {
        if (catapult.phase !== 'idle') return false;
        catapult.phase = 'windup';
        catapult.phaseTime = 0;
        catapult.pendingShot = {
          angleDeg: state.angleDeg,
          powerPct: state.powerPct,
          ammo: state.ammo
        };
        AudioEngine.playCreak();
        return true;
      }

      function releaseProjectile(shot) {
        const spec = AMMO_TYPES[shot.ammo] || AMMO_TYPES.boulder;
        const origin = getLaunchOrigin();
        const vel = computeLaunchVelocity(shot.angleDeg, shot.powerPct, shot.ammo);

        projectiles.push({
          x: origin.x,
          y: origin.y,
          vx: vel.vx,
          vy: vel.vy,
          r: spec.radius,
          ammo: shot.ammo,
          spec,
          rot: 0,
          vrot: 7 + Math.random() * 6,
          trail: [],
          alive: true
        });

        state.shotsFired += 1;
        const shotsEl = document.getElementById('shotsText');
        if (shotsEl) shotsEl.textContent = String(state.shotsFired);

        catapult.loaded = false;
        catapult.recoilVx = -115;
        addCameraShake(4.2, 0.16);
        AudioEngine.playLaunch(spec.fire);
        spawnDust(catapult.x - 18, catapult.y - 4, 6, false);
        spawnDust(catapult.x + 36, catapult.y - 4, 5, false);
      }

      function updateCatapultAndProjectiles(dt) {
        catapult.y = getTerrainY(catapult.x);

        // Spring-damper recoil on the wooden carriage
        const springK = 68;
        const damping = 9.5;
        catapult.recoilVx += (-springK * catapult.recoilX - damping * catapult.recoilVx) * dt;
        const prevRecoil = catapult.recoilX;
        catapult.recoilX += catapult.recoilVx * dt;
        catapult.wheelAngle += (catapult.recoilX - prevRecoil) / 22;

        // Arm animation state machine
        const cockedAng = -2.42;
        const tensionAng = -2.58;
        const stopAng = -0.58;

        if (catapult.phase === 'windup') {
          catapult.phaseTime += dt;
          const t = Math.min(1, catapult.phaseTime / 0.24);
          catapult.armAngle = cockedAng + (tensionAng - cockedAng) * (t * t);
          if (t >= 1) {
            catapult.phase = 'firing';
            catapult.phaseTime = 0;
          }
        } else if (catapult.phase === 'firing') {
          catapult.phaseTime += dt;
          const t = Math.min(1, catapult.phaseTime / 0.11);
          const easeOut = 1 - Math.pow(1 - t, 3);
          catapult.armAngle = tensionAng + (stopAng - tensionAng) * easeOut;
          if (t >= 1) {
            if (catapult.pendingShot) {
              releaseProjectile(catapult.pendingShot);
              catapult.pendingShot = null;
            }
            catapult.phase = 'recover';
            catapult.phaseTime = 0;
          }
        } else if (catapult.phase === 'recover') {
          catapult.phaseTime += dt;
          if (catapult.phaseTime < 0.22) {
            // Brief bounce against padded crossbar
            const b = Math.sin((catapult.phaseTime / 0.22) * Math.PI);
            catapult.armAngle = stopAng - b * 0.14;
          } else {
            const t = Math.min(1, (catapult.phaseTime - 0.22) / 0.62);
            const ease = t * t * (3 - 2 * t);
            catapult.armAngle = stopAng + (cockedAng - stopAng) * ease;
            if (t >= 1) {
              catapult.armAngle = cockedAng;
              catapult.loaded = true;
              catapult.phase = 'idle';
              catapult.phaseTime = 0;
            }
          }
        }

        // Update flying projectiles
        for (let i = projectiles.length - 1; i >= 0; i--) {
          const p = projectiles[i];
          if (!p.alive) {
            projectiles.splice(i, 1);
            continue;
          }

          p.vx += state.wind * dt;
          p.vy += GRAVITY * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.rot += p.vrot * dt;

          p.trail.push({ x: p.x, y: p.y });
          if (p.trail.length > 26) p.trail.shift();

          if (p.spec.fire) {
            if (Math.random() < 0.85) {
              particles.push({
                type: 'ember',
                x: p.x + (Math.random() - 0.5) * 8,
                y: p.y + (Math.random() - 0.5) * 8,
                vx: -p.vx * 0.08 + (Math.random() - 0.5) * 35,
                vy: -p.vy * 0.08 - 18,
                size: 2.5 + Math.random() * 4,
                life: 0.35 + Math.random() * 0.3,
                maxLife: 0.65
              });
            }
            if (Math.random() < 0.55) {
              particles.push({
                type: 'smoke',
                x: p.x,
                y: p.y,
                vx: state.wind * 0.3,
                vy: -22,
                size: 7 + Math.random() * 6,
                grow: 16,
                color: 'rgba(46, 40, 38,',
                life: 0.55,
                maxLife: 0.55
              });
            }
          }

          // Check collision with castle blocks
          let hitBlock = false;
          for (const b of castleBlocks) {
            if (!b.alive) continue;
            const closestX = Math.max(b.x, Math.min(p.x, b.x + b.w));
            const closestY = Math.max(b.y, Math.min(p.y, b.y + b.h));
            const dx = p.x - closestX;
            const dy = p.y - closestY;
            if (dx * dx + dy * dy <= p.r * p.r) {
              hitBlock = true;
              break;
            }
          }

          if (hitBlock) {
            applyExplosion(p.x, p.y, p.spec.damageRadius, p.spec.damagePower, p.spec.fire, true);
            p.alive = false;
            continue;
          }

          // Check collision with terrain
          const gy = getTerrainY(p.x);
          if (p.y + p.r >= gy) {
            applyExplosion(p.x, gy - 2, p.spec.damageRadius * 0.85, p.spec.damagePower * 0.85, p.spec.fire, false);
            p.alive = false;
            continue;
          }

          // Out of bounds cleanup
          if (p.x > WORLD_W + 220 || p.x < -220 || p.y > WORLD_H + 120) {
            p.alive = false;
          }
        }
      }

      function drawProjectileBody(x, y, r, ammoKey, rot) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);

        if (ammoKey === 'fire') {
          // Glowing flaming pitch orb
          const glow = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 2.1);
          glow.addColorStop(0, 'rgba(255, 240, 150, 0.95)');
          glow.addColorStop(0.45, 'rgba(245, 118, 28, 0.65)');
          glow.addColorStop(1, 'rgba(245, 80, 15, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(0, 0, r * 2.1, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#3b2416';
          ctx.beginPath();
          ctx.arc(0, 0, r * 0.86, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ff9824';
          ctx.beginPath();
          ctx.arc(-2, -2, r * 0.56, 0, Math.PI * 2);
          ctx.fill();
        } else if (ammoKey === 'iron') {
          // Cast iron cannonball
          const ig = ctx.createRadialGradient(-r * 0.35, -r * 0.35, 1, 0, 0, r);
          ig.addColorStop(0, '#7c8591');
          ig.addColorStop(0.45, '#3b4048');
          ig.addColorStop(1, '#181a1e');
          ctx.fillStyle = ig;
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Chiseled stone boulder
          const sg = ctx.createRadialGradient(-r * 0.3, -r * 0.3, 2, 0, 0, r * 1.15);
          sg.addColorStop(0, '#b5aca0');
          sg.addColorStop(0.55, '#7e766c');
          sg.addColorStop(1, '#4b453e');
          ctx.fillStyle = sg;
          ctx.beginPath();
          for (let k = 0; k < 8; k++) {
            const a = (k / 8) * Math.PI * 2;
            const rad = r * (0.88 + (k % 2) * 0.14);
            const px = Math.cos(a) * rad;
            const py = Math.sin(a) * rad;
            if (k === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = 'rgba(30, 26, 22, 0.55)';
          ctx.lineWidth = 1.4;
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawTrajectoryPreview() {
        const origin = getLaunchOrigin();
        const vel = computeLaunchVelocity(state.angleDeg, state.powerPct, state.ammo);
        const dtStep = 0.065;
        let x = origin.x;
        let y = origin.y;
        let vx = vel.vx;
        let vy = vel.vy;

        ctx.save();
        const maxSteps = state.dragging ? 24 : 15;
        for (let i = 1; i <= maxSteps; i++) {
          vx += state.wind * dtStep;
          vy += GRAVITY * dtStep;
          x += vx * dtStep;
          y += vy * dtStep;
          if (y > getTerrainY(x)) break;

          const alpha = (1 - i / (maxSteps + 1)) * (state.dragging ? 0.78 : 0.36);
          ctx.fillStyle = state.ammo === 'fire'
            ? `rgba(255, 190, 96, ${alpha})`
            : `rgba(248, 234, 204, ${alpha})`;
          ctx.beginPath();
          ctx.arc(x, y, state.dragging ? 3.5 : 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawWoodBeam(x1, y1, x2, y2, thickness, lightColor, darkColor) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const len = Math.hypot(dx, dy);
        const ang = Math.atan2(dy, dx);

        ctx.save();
        ctx.translate(x1, y1);
        ctx.rotate(ang);
        const grad = ctx.createLinearGradient(0, -thickness * 0.5, 0, thickness * 0.5);
        grad.addColorStop(0, lightColor || '#9a6838');
        grad.addColorStop(0.55, darkColor || '#6f4722');
        grad.addColorStop(1, '#492d14');
        ctx.fillStyle = grad;
        ctx.fillRect(0, -thickness * 0.5, len, thickness);

        // Subtle wood grain line
        ctx.strokeStyle = 'rgba(38, 22, 10, 0.35)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(4, -thickness * 0.14);
        ctx.lineTo(len - 4, -thickness * 0.14);
        ctx.moveTo(6, thickness * 0.18);
        ctx.lineTo(len - 6, thickness * 0.18);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(26, 15, 7, 0.65)';
        ctx.lineWidth = 1.2;
        ctx.strokeRect(0, -thickness * 0.5, len, thickness);
        ctx.restore();
      }

      function drawSpokedWheel(cx, cy, radius, rot) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rot);

        // Iron tire rim
        ctx.strokeStyle = '#33302e';
        ctx.lineWidth = 4.5;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.stroke();

        // Wooden felloe
        ctx.strokeStyle = '#7b4f26';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(0, 0, radius - 3.5, 0, Math.PI * 2);
        ctx.stroke();

        // 8 wooden spokes
        ctx.strokeStyle = '#68401e';
        ctx.lineWidth = 3.2;
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(a) * (radius - 4), Math.sin(a) * (radius - 4));
          ctx.stroke();
        }

        // Hub & iron pin
        ctx.fillStyle = '#4e2f16';
        ctx.beginPath();
        ctx.arc(0, 0, 6.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#77716a';
        ctx.beginPath();
        ctx.arc(0, 0, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawCatapult() {
        const cx = catapult.x + catapult.recoilX;
        const gy = catapult.y;

        // Ground shadow beneath catapult & ammo pile
        ctx.fillStyle = 'rgba(15, 12, 8, 0.42)';
        ctx.beginPath();
        ctx.ellipse(cx + 2, gy + 4, 88, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        // Small wooden ammo stack to the left of the catapult
        const pileX = catapult.x - 104;
        const pileY = getTerrainY(pileX);
        drawProjectileBody(pileX - 13, pileY - 9, 10, 'boulder', 0.4);
        drawProjectileBody(pileX + 7, pileY - 9, 10, 'boulder', 1.2);
        drawProjectileBody(pileX - 3, pileY - 23, 10, 'boulder', 2.1);

        // Far-side wheels (darker depth)
        ctx.save();
        ctx.globalAlpha = 0.72;
        drawSpokedWheel(cx - 48, gy - 17, 19, catapult.wheelAngle);
        drawSpokedWheel(cx + 50, gy - 17, 19, catapult.wheelAngle);
        ctx.restore();

        // Rear upright & back bracing
        drawWoodBeam(cx - 56, gy - 26, cx + 18, gy - 96, 11, '#84562c', '#5b391a');
        drawWoodBeam(cx + 56, gy - 26, cx + 22, gy - 96, 12, '#8b5b2f', '#5f3b1b');

        // Pivoting Throwing Arm (drawn between far & near uprights)
        const pivot = getPivotPos();
        const armLen = 100;
        const tipX = pivot.x + Math.cos(catapult.armAngle) * armLen;
        const tipY = pivot.y + Math.sin(catapult.armAngle) * armLen;

        // Tension rope from rear winch to arm
        const winchX = cx - 44;
        const winchY = gy - 32;
        const attachX = pivot.x + Math.cos(catapult.armAngle) * 66;
        const attachY = pivot.y + Math.sin(catapult.armAngle) * 66;
        ctx.strokeStyle = '#c8aa76';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.moveTo(winchX, winchY);
        ctx.lineTo(attachX, attachY);
        ctx.stroke();

        // Main throwing timber beam
        drawWoodBeam(
          pivot.x - Math.cos(catapult.armAngle) * 14,
          pivot.y - Math.sin(catapult.armAngle) * 14,
          tipX,
          tipY,
          11,
          '#b07842',
          '#7b4f26'
        );

        // Wooden spoon/cup at tip of arm
        ctx.save();
        ctx.translate(tipX, tipY);
        ctx.rotate(catapult.armAngle + Math.PI * 0.5);
        ctx.fillStyle = '#5c3818';
        ctx.strokeStyle = '#2d1a0a';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(0, -4, 17, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.lineTo(-14, -10);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Iron strap around cup
        ctx.strokeStyle = '#4a4a4d';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-12, 5);
        ctx.lineTo(12, 5);
        ctx.stroke();
        ctx.restore();

        // Loaded projectile sitting inside the cup
        if (catapult.loaded) {
          const spec = AMMO_TYPES[state.ammo] || AMMO_TYPES.boulder;
          const cupOffsetX = Math.cos(catapult.armAngle - 0.16) * 10;
          const cupOffsetY = Math.sin(catapult.armAngle - 0.16) * 10;
          drawProjectileBody(tipX + cupOffsetX, tipY + cupOffsetY, spec.radius * 0.92, state.ammo, state.time * 0.4);
        }

        // Twisted torsion rope skein at pivot
        ctx.save();
        ctx.translate(pivot.x, pivot.y);
        ctx.fillStyle = '#bfa06e';
        ctx.strokeStyle = '#6f5633';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        for (let k = -6; k <= 6; k += 4) {
          ctx.beginPath();
          ctx.moveTo(-9, k);
          ctx.lineTo(9, k - 3);
          ctx.stroke();
        }
        ctx.restore();

        // Near-side heavy oak base rail
        drawWoodBeam(cx - 72, gy - 26, cx + 74, gy - 26, 15, '#a8723e', '#744a23');

        // Near-side A-frame uprights & padded crossbar stop
        drawWoodBeam(cx - 50, gy - 26, cx + 24, gy - 98, 12, '#a8723e', '#734922');
        drawWoodBeam(cx + 60, gy - 26, cx + 26, gy - 98, 13, '#b17944', '#7b4f26');

        // Crossbar stop beam + leather pad
        ctx.fillStyle = '#4d2f15';
        ctx.fillRect(cx + 15, gy - 103, 22, 13);
        ctx.fillStyle = '#c49b63';
        ctx.fillRect(cx + 17, gy - 101, 6, 9);

        // Rear ratchet winch drum
        ctx.fillStyle = '#4a4540';
        ctx.beginPath();
        ctx.arc(winchX, winchY, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#9a8f82';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(winchX, winchY);
        ctx.lineTo(winchX - 10, winchY - 12);
        ctx.stroke();

        // Iron rivets / corner plates
        ctx.fillStyle = '#3b3c40';
        const rivets = [
          [cx - 50, gy - 26], [cx + 58, gy - 26],
          [cx + 24, gy - 95], [cx - 64, gy - 26], [cx + 66, gy - 26]
        ];
        for (const [rx, ry] of rivets) {
          ctx.beginPath();
          ctx.arc(rx, ry, 3.2, 0, Math.PI * 2);
          ctx.fill();
        }

        // Near-side spoked wheels
        drawSpokedWheel(cx - 44, gy - 16, 21, catapult.wheelAngle);
        drawSpokedWheel(cx + 54, gy - 16, 21, catapult.wheelAngle);
      }

      function drawProjectiles() {
        for (const p of projectiles) {
          if (!p.alive) continue;

          // Motion trail
          if (p.trail.length > 1) {
            ctx.save();
            ctx.lineCap = 'round';
            for (let i = 1; i < p.trail.length; i++) {
              const frac = i / p.trail.length;
              ctx.strokeStyle = p.spec.fire
                ? `rgba(255, 165, 62, ${frac * 0.55})`
                : `rgba(245, 232, 206, ${frac * 0.32})`;
              ctx.lineWidth = p.r * 0.9 * frac;
              ctx.beginPath();
              ctx.moveTo(p.trail[i - 1].x, p.trail[i - 1].y);
              ctx.lineTo(p.trail[i].x, p.trail[i].y);
              ctx.stroke();
            }
            ctx.restore();
          }

          drawProjectileBody(p.x, p.y, p.r, p.ammo, p.rot);
        }
      }

      // ========================
      // 5. INPUT, HUD & MAIN LOOP
      // ========================
      const angleRange = document.getElementById('angleRange');
      const powerRange = document.getElementById('powerRange');
      const angleVal = document.getElementById('angleVal');
      const powerVal = document.getElementById('powerVal');
      const windText = document.getElementById('windText');
      const fireBtn = document.getElementById('fireBtn');
      const autoBtn = document.getElementById('autoBtn');
      const resetBtn = document.getElementById('resetBtn');
      const soundBtn = document.getElementById('soundBtn');
      const ammoButtons = Array.from(document.querySelectorAll('.btn-ammo'));

      function syncSlidersFromState() {
        angleRange.value = String(Math.round(state.angleDeg));
        powerRange.value = String(Math.round(state.powerPct));
        angleVal.textContent = Math.round(state.angleDeg) + '\u00b0';
        powerVal.textContent = Math.round(state.powerPct) + '%';
      }

      function setAmmo(ammoKey) {
        state.ammo = ammoKey;
        ammoButtons.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.ammo === ammoKey);
        });
      }

      angleRange.addEventListener('input', () => {
        state.angleDeg = Number(angleRange.value);
        syncSlidersFromState();
      });

      powerRange.addEventListener('input', () => {
        state.powerPct = Number(powerRange.value);
        syncSlidersFromState();
      });

      ammoButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          setAmmo(btn.dataset.ammo);
        });
      });

      fireBtn.addEventListener('click', () => {
        AudioEngine.ensureContext();
        triggerCatapultFire();
      });

      autoBtn.addEventListener('click', () => {
        state.autoSiege = !state.autoSiege;
        autoBtn.textContent = state.autoSiege ? 'Auto-Siege: On' : 'Auto-Siege: Off';
        autoBtn.classList.toggle('active', state.autoSiege);
        if (state.autoSiege) state.autoTimer = 0.8;
      });

      resetBtn.addEventListener('click', () => {
        buildCastle();
      });

      soundBtn.addEventListener('click', () => {
        state.soundEnabled = !state.soundEnabled;
        soundBtn.textContent = state.soundEnabled ? 'Sound: On' : 'Sound: Off';
        soundBtn.classList.toggle('active', state.soundEnabled);
        if (state.soundEnabled) AudioEngine.ensureContext();
      });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          AudioEngine.ensureContext();
          triggerCatapultFire();
        } else if (e.key === 'r' || e.key === 'R') {
          buildCastle();
        } else if (e.key === 'a' || e.key === 'A') {
          autoBtn.click();
        }
      });

      // Screen <-> World coordinate mapping (cover-style crop with safe bottom/top framing)
      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        canvas.width = Math.floor(vw * dpr);
        canvas.height = Math.floor(vh * dpr);
        canvas.style.width = vw + 'px';
        canvas.style.height = vh + 'px';

        // Fit entire 1600x900 horizontal span cleanly while filling viewport
        const scaleX = vw / WORLD_W;
        const scaleY = vh / WORLD_H;
        scale = Math.max(scaleX, scaleY);
        // On tall/narrow screens, bias slightly toward showing both catapult and castle
        if (vw / vh < 1.35) {
          scale = scaleX;
        }
        offsetX = (vw - WORLD_W * scale) * 0.5;
        offsetY = (vh - WORLD_H * scale) * 0.5;
      }

      function clientToWorld(clientX, clientY) {
        return {
          x: (clientX - offsetX) / scale,
          y: (clientY - offsetY) / scale
        };
      }

      canvas.addEventListener('pointerdown', (e) => {
        const pt = clientToWorld(e.clientX, e.clientY);
        state.dragging = true;
        state.dragStart = pt;
        state.dragCurrent = pt;
        canvas.setPointerCapture(e.pointerId);
      });

      canvas.addEventListener('pointermove', (e) => {
        if (!state.dragging) return;
        const pt = clientToWorld(e.clientX, e.clientY);
        state.dragCurrent = pt;

        // Slingshot-style drag: pull left/down from start (or aim directly from catapult)
        const dx = state.dragStart.x - pt.x;
        const dy = pt.y - state.dragStart.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 14) {
          const ang = (Math.atan2(dy, dx) * 180) / Math.PI;
          state.angleDeg = Math.max(22, Math.min(68, ang));
          state.powerPct = Math.max(48, Math.min(100, 48 + (dist / 240) * 52));
          syncSlidersFromState();
        }
      });

      canvas.addEventListener('pointerup', (e) => {
        if (!state.dragging) return;
        state.dragging = false;
        try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
        const dist = Math.hypot(state.dragStart.x - state.dragCurrent.x, state.dragCurrent.y - state.dragStart.y);
        if (dist > 18) {
          AudioEngine.ensureContext();
          triggerCatapultFire();
        }
      });

      window.addEventListener('resize', resizeCanvas);

      function updateAutoSiege(dt) {
        if (!state.autoSiege || state.dragging) return;
        if (catapult.phase !== 'idle') return;

        state.autoTimer -= dt;
        if (state.autoTimer <= 0) {
          if (state.castleCollapsed) {
            buildCastle();
            state.autoTimer = 1.4;
            return;
          }

          // Pick a lively, varied siege shot aimed at the castle on the hill
          const ammoPool = ['boulder', 'fire', 'boulder', 'iron', 'fire'];
          const chosenAmmo = ammoPool[state.shotsFired % ammoPool.length];
          setAmmo(chosenAmmo);

          // Compensate slightly for wind so shots reliably strike the castle
          const windComp = -state.wind * 0.14;
          state.angleDeg = Math.max(28, Math.min(60, 42 + (Math.random() - 0.35) * 12));
          state.powerPct = Math.max(64, Math.min(92, 76 + windComp + (Math.random() - 0.5) * 10));
          syncSlidersFromState();

          triggerCatapultFire();
          state.autoTimer = 2.6 + Math.random() * 1.1;
        }
      }

      let lastTime = performance.now();
      function frame(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        state.time += dt;

        updateEnvironment(dt);
        updateAutoSiege(dt);
        updateCatapultAndProjectiles(dt);
        updateCastleAndParticles(dt);

        if (state.shakeTime > 0) {
          state.shakeTime = Math.max(0, state.shakeTime - dt);
          if (state.shakeTime === 0) state.shakeMag = 0;
        }

        // Update wind readout
        const wDir = state.wind >= 1 ? '\u2192' : state.wind <= -1 ? '\u2190' : '\u00b7';
        windText.textContent = `${wDir} ${Math.abs(state.wind * 0.3).toFixed(1)}`;

        // Render
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        // Background fill for letterboxed edges on ultra-tall screens
        ctx.fillStyle = '#1b1614';
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        let shakeX = 0;
        let shakeY = 0;
        if (state.shakeTime > 0) {
          const decay = Math.min(1, state.shakeTime / 0.25);
          shakeX = (Math.random() - 0.5) * 2 * state.shakeMag * decay;
          shakeY = (Math.random() - 0.5) * 2 * state.shakeMag * decay;
        }

        ctx.save();
        ctx.translate(offsetX + shakeX, offsetY + shakeY);
        ctx.scale(scale, scale);

        drawSkyAndMountains();
        drawTerrain();
        drawCastle();
        drawTrajectoryPreview();
        drawCatapult();
        drawProjectiles();
        drawParticlesAndShockwaves();

        // Subtle drag-aim indicator line
        if (state.dragging) {
          ctx.save();
          ctx.strokeStyle = 'rgba(255, 224, 152, 0.55)';
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 6]);
          ctx.beginPath();
          ctx.moveTo(state.dragStart.x, state.dragStart.y);
          ctx.lineTo(state.dragCurrent.x, state.dragCurrent.y);
          ctx.stroke();
          ctx.restore();
        }

        ctx.restore();
        requestAnimationFrame(frame);
      }

      // Initialize world & kick off animation
      resizeCanvas();
      buildCastle();
      syncSlidersFromState();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
