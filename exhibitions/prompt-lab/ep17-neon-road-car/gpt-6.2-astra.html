<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Night Meridian</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b20}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas aria-label="A silver sports car races along a neon highway beneath a ringed planet."></canvas>
<script>
"use strict";
const canvas=document.querySelector("canvas"), c=canvas.getContext("2d");
const sky=document.createElement("canvas"), tau=2*Math.PI;
let W,H,Y,S,dpr;
function gradient(g,...colors){
  colors.forEach((v,i)=>g.addColorStop(i/(colors.length-1),v));return g;
}
function paint(path,fill,stroke,width=1){
  const p=new Path2D(path);
  if(fill){c.fillStyle=fill;c.fill(p)}
  if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke(p)}
}
function resize(){
  W=innerWidth;H=innerHeight;Y=H*.47;S=Math.min(W*.0022,H*.00163);
  dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
  sky.width=canvas.width;sky.height=Math.ceil(Y*dpr)+2;
  const b=sky.getContext("2d");b.scale(dpr,dpr);
  b.fillStyle=gradient(b.createLinearGradient(0,0,0,Y),"#06091c","#191938","#51304f","#f18475");
  b.fillRect(0,0,W,Y+2);
  let seed=8123;
  const rand=()=>((seed=Math.imul(seed,1664525)+1013904223>>>0)/4294967296);
  for(let i=0;i<W*.45;i++){
    const x=rand()*W,y=rand()*Y,r=rand();
    b.fillStyle=`rgba(211,232,255,${.16+r*.68})`;b.fillRect(x,y,r*1.6+.3,r*1.6+.3);
  }
  const r=Math.min(W*.104,H*.128);
  b.save();b.translate(W*.67,Y*.52);b.rotate(-.23);
  const halo=gradient(b.createRadialGradient(0,0,r*.6,0,0,r*2.7),"#fc93982e","#e8708c10","#ed678a00");
  b.fillStyle=halo;b.fillRect(-3*r,-3*r,6*r,6*r);
  function rings(front){
    for(let i=0;i<15;i++){
      b.beginPath();b.ellipse(0,0,r*(1.29+i*.039),r*(.18+i*.009),0,front?0:Math.PI,front?Math.PI:tau);
      b.strokeStyle=i===12?"#fed0b5":`rgba(242,163,168,${.16+.38*Math.abs(Math.sin(i*1.8))})`;
      b.lineWidth=r*.014;b.stroke();
    }
  }
  rings(false);b.save();b.beginPath();b.arc(0,0,r,0,tau);b.clip();
  b.fillStyle=gradient(b.createLinearGradient(-r,-r,r*.7,r),"#fff0c8","#ffa998","#b85f87","#583657");
  b.fillRect(-r,-r,2*r,2*r);
  for(let i=0;i<95;i++){
    const y=rand()*r*2-r;b.fillStyle=`rgba(129,56,94,${rand()*.16})`;b.fillRect(-r,y,r*2,rand()*r*.065);
  }
  b.restore();rings(true);b.restore();
  for(let layer=0;layer<3;layer++){
    b.beginPath();b.moveTo(-2,Y+2);
    for(let x=-2;x<W+19;x+=16){
      const ridge=.5+.3*Math.sin(x/(100+layer*31)+layer*2)+.2*Math.sin(x/47+layer);
      b.lineTo(x,Y-H*(.025+ridge*.11+rand()*.021)*(1-layer*.29));
    }
    b.lineTo(W+19,Y+2);b.closePath();b.fillStyle=["#694560","#443553","#272542"][layer];b.fill();
  }
  for(let x=0;x<W;){
    const w=2+rand()*9,h=4+rand()*H*.025;b.fillStyle="#26213c";b.fillRect(x,Y-h,w,h+1);
    if(rand()>.5){b.fillStyle="#ffc1a8";b.fillRect(x+1,Y-h+2,1,1)}
    x+=w+rand()*4;
  }
}
  function highway(t){
    const depth=H-Y, v=W*(.60+.026*Math.sin(t*.23)), spread=Math.max(W*.79,H*.70);
    const x=(u,k)=>v+u*(W*.46-v+k*spread);
    c.fillStyle=gradient(c.createLinearGradient(0,Y,0,H),"#ad737c","#483450","#17152c","#0b1021");
    c.fillRect(0,Y,W,depth);
    function band(k,j,u=0,e=1){
      return `M${x(u,k)} ${Y+depth*u}L${x(e,k)} ${Y+depth*e}L${x(e,j)} ${Y+depth*e}L${x(u,j)} ${Y+depth*u}Z`;
    }
    paint(band(-1,1),gradient(c.createLinearGradient(0,Y,0,H),"#94697b","#323048","#202238","#161a2c"));
    for(const k of [-1,1]){
      const warm=k<0;
      paint(band(k*.965,k*1.04),warm?"#fa608231":"#50e7f32e");
      paint(band(k*.994,k*1.008),warm?"#ff7899":"#7ef4ff");
      paint(band(k*1.07,k*1.074),warm?"#dd6686":"#67a6bf");
    }
    for(let n=64;n>=0;n--){
      const z=n+1-(t*2.9%1),u=.99/z,e=.99/(z+.38);
      for(const k of [-.333,.333])paint(band(k,k+.008,e,u),"#dbc4c4a0");
      if(u<1.4){
        for(const k of [-1,1]){
          const bx=x(u,k*1.11),by=Y+depth*u,bh=H*.21*u;
          c.fillStyle="#151529";c.fillRect(bx-bh*.04,by-bh,bh*.08,bh);
          c.fillStyle=k<0?"#ff799a":"#a1faff";c.fillRect(bx-bh*.025,by-bh,bh*.05,bh*.39);
        }
      }
    }
    for(let i=0;i<240;i++){
      const k=Math.sin(i*356.7)*1.3,z=.82+((i*1.618-t*2.9)%25+25)%25,u=1/z;
      c.fillStyle=i%4?"#c5c8e014":"#f5c7bc27";c.fillRect(x(u,k),Y+depth*u,Math.max(1,18*u),Math.max(.4,1.3*u));
    }
  }
  function car(t){
    c.save();c.translate(W*(.47+.012*Math.sin(t*.67)),H*.739);c.scale(S,S);
    c.lineJoin="round";c.lineCap="round";
    function pool(x,y,w,h,ink){
      c.save();c.translate(x,y);c.scale(w,h);
      c.fillStyle=gradient(c.createRadialGradient(0,0,0,0,0,1),ink,ink.slice(0,7)+"00");
      c.fillRect(-1,-1,2,2);c.restore();
    }
    pool(-12,39,188,36,"#030615ff");pool(-65,58,115,23,"#ff296c81");pool(96,26,81,18,"#3dd6ff65");
    c.translate(0,Math.sin(t*12)*.55);c.rotate(Math.sin(t*.67)*.009);
    function metal(y,h,...colors){return gradient(c.createLinearGradient(0,y,0,y+h),...colors)}
    function wheel(x,y,r){
      c.save();c.translate(x,y);c.transform(.55,-.24,0,1,0,0);
      for(const [a,ink] of [[1,"#070b15"],[.78,"#1d283c"],[.64,"#8793ae"],[.55,"#151b2d"]]){
        c.fillStyle=ink;c.beginPath();c.arc(0,0,r*a,0,tau);c.fill();
      }
      c.rotate(t*13);
      for(let i=0;i<7;i++){c.rotate(tau/7);paint(`M-2 0L-3 ${-r*.56}L2 ${-r*.49}L3 -4Z`,"#96a6b9")}
      c.restore();
    }
    wheel(171,-4,18);wheel(89,25,26);
    paint("M-151 12L-116 13L-117 40Q-133 43 -146 37Z","#080b14");
    const body="M-157 2Q-156 -8 -139 -16L-92 -28L-56 -52Q-42 -61 -13 -64L47 -68Q67 -68 82 -59L114 -41L159 -37Q175 -35 181 -25L183 -10L177 -4Q178 -28 167 -23Q157 -19 155 2L108 29Q109 0 94 -1Q77 -1 72 36L60 42L-133 32L-154 23Z";
    paint(body,metal(-68,110,"#decdea","#64768f","#c1a8ca","#f5baca","#65697f","#19203a"),"#171929",1.3);
    paint("M-91 -28L-54 -51Q-39 -60 -14 -61L35 -63L24 -56L-7 -27Z",metal(-62,38,"#c898b5","#565977","#172941"));
    for(let i=0;i<6;i++)paint(`M${-77+i*5} ${-32-i*4}l${71-i*2} -1`,null,"#ccd2e088",1.3);
    paint("M34 -56L48 -64Q65 -64 78 -56L108 -40L78 -36L7 -27Z",metal(-64,39,"#192037","#3f526d","#8fb7ca"),"#d1bdce",1.1);
    paint("M54 -62L59 -62L84 -38L79 -37Z","#283044");
    paint("M-144 -12L-92 -27L-8 -25L-31 -14L-96 -9Z","#786780");
    paint("M-20 -16L5 -25L75 -35L103 -34L71 -19L47 -8Z","#f0c1d0");
    paint("M74 -17L114 -36L161 -34L174 -28L124 -19L107 -6Z","#8096ac");
    paint("M109 11L152 -10L147 -2L110 22Z","#17263b");
    paint("M109 26L153 3",null,"#86dded",1.8);
    paint("M80 -31L80 -37L92 -40L99 -38L96 -34Z","#b6cadd","#45546a",1);
    paint("M-154 -6Q-133 -10 -105 -8L53 -2L70 -10L66 22L55 36L-131 27L-154 18Z",metal(-9,46,"#50445d","#171827","#33364a","#13192b"));
    paint("M-153 -4L-128 -5L52 2L65 -3L61 10L47 14L-148 6Z","#210f22");
    c.shadowBlur=10*S;c.shadowColor="#ff285a";
    paint("M-149 -2L-116 -1L-101 4L-145 2ZM-98 0L13 5L12 7L-94 3ZM18 4L56 4L63 0L59 7L49 10L16 8Z","#ff646e");
    c.shadowBlur=0;paint("M-145 -2L-118 -1M22 5L54 6",null,"#ffdbbd",1.4);
    paint("M-129 17L-87 19L-77 25L21 29L33 23L56 22L48 35L-122 26Z","#080e1b");
    for(let i=0;i<8;i++)paint(`M${-70+i*12} 24l-3 6`,null,"#50566c",1.8);
    paint("M-64 11L-22 13L-23 23L-65 21Z","#aba6aa","#121423",1);
    c.save();c.translate(-61,19);c.rotate(.05);c.fillStyle="#282439";c.font="bold 8px monospace";c.fillText("VESPER",0,0);c.restore();
    paint("M-124 -8l2 -10h7l-2 10ZM34 -2l3 -13h7l-4 12Z","#242435");
    paint("M-155 -20L-141 -23L56 -16L68 -18L62 -12L46 -10L-151 -17Z",metal(-23,14,"#d4c2d4","#5f5269","#292838"),"#312a40");
    c.restore();
  }
const reduced=matchMedia("(prefers-reduced-motion: reduce)");
let elapsed=0,previous=0;
function draw(){
  c.setTransform(dpr,0,0,dpr,0,0);
  c.drawImage(sky,0,0,W,Y+1);highway(elapsed);car(elapsed);
}
function frame(now){
  if(previous&&!reduced.matches)elapsed+=Math.min(.08,(now-previous)/1000);
  previous=now;
  if(!reduced.matches)draw();
  requestAnimationFrame(frame);
}
function fit(){resize();draw()}
addEventListener("resize",fit);fit();requestAnimationFrame(frame);
</script>
</body>
</html>
