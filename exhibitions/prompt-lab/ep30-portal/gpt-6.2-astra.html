<body>
<canvas id="scene" tabindex="0" aria-label="The Caldera Gate. Drag or use arrow keys to orbit, scroll or pinch to zoom. Plus and minus zoom; Home restores the opening view."></canvas>
<footer id="hint"><span class="mouse">Drag to orbit &nbsp;/&nbsp; Scroll to zoom</span><span class="touch">Drag to orbit &nbsp;/&nbsp; Pinch to zoom</span></footer>

<script id="landscape" type="text/plain">
precision highp float;
uniform sampler2D grain;
uniform vec2 res;
uniform vec3 eye,aim;
uniform float clock,ignition;
const float PI=3.14159265, TAU=6.28318531;
const vec3 sun=vec3(-.669,.562,.486);
float sat(float x){return clamp(x,0.,1.);}
float hash(float n){return fract(sin(mod(n,691.17)*78.233)*43758.5453);}
float N(vec2 p){vec2 i=floor(p),f=fract(p);return texture2D(grain,(i+.5+f*f*(3.-2.*f))/256.).r;}
float rock(vec3 p){return N(p.xz+p.y*vec2(.41,.83));}
float fb(vec2 p){return .51*N(p)+.265*N(p*2.08+15.2)+.14*N(p*4.31-7.9)+.085*N(p*9.15);}
float crag(vec2 p){return 1.-abs(2.*fb(p)-1.);}
float ground(vec2 p){
 float r=length(p);float base=fb(p*.33)*.46+N(p*2.4)*.06-.30;
 float mass=fb(p*.041)*.62+crag(p*.076)*.38;
 return base+smoothstep(14.,42.,r)*(mass-.36)*21.
 +smoothstep(43.,80.,r)*(pow(crag(p*.032+8.),4.)*11.+fb(p*.092)*6.);
}
vec3 horizon(vec3 d,bool farSide){
 float h=sat(d.y),s=dot(d,farSide?normalize(vec3(-.15,.095,-1.)):sun);
 vec3 air=farSide?mix(vec3(1.,.51,.24),vec3(.29,.32,.49),smoothstep(-.05,.44,h)):mix(vec3(.60,.66,.65),vec3(.20,.33,.41),sqrt(h));
 vec2 c=d.xz/max(.065,d.y+.085);
 float wisps=fb(c*vec2(1.7,3.8)+vec2(18.,7.));
 air=mix(air,farSide?vec3(.98,.73,.53):vec3(.84,.84,.78),smoothstep(.38,.72,wisps)*smoothstep(-.04,.17,d.y)*.86);
 air+=vec3(1.,.77,.49)*pow(max(0.,s),farSide?165.:22.)*(farSide?.29:.27);
 if(farSide){
  vec3 center=normalize(vec3(-.12,.092,-1.));float radius=.057;
  vec3 rel=d-center*dot(d,center);vec2 uv=vec2(dot(rel,normalize(cross(center,vec3(0,1,0)))),rel.y)/radius;
  float rr=length(uv);if(dot(d,center)>.9&&rr<1.){
   vec3 norm=vec3(uv,sqrt(max(0.,1.-rr*rr)));float lam=sat(dot(norm,normalize(vec3(-.85,.3,.44))));
   float bands=fb(vec2(uv.x*2.+N(uv*5.)*.9,uv.y*20.+uv.x*.8));
   vec3 moon=mix(vec3(.57,.31,.23),vec3(.99,.84,.65),bands)*(.36+.83*lam);
   air=mix(air,moon,.77*(1.-smoothstep(.985,1.,rr)));
  }
 }
 return air;
}
float remoteHeight(vec2 p){
 float coast=abs(p.x+5.*sin(p.y*.062)+1.)*.27+abs(p.y)*.05;
 return (coast-2.)*(.40+.56*crag(p*.061))+smoothstep(18.,62.,abs(p.y))*(pow(crag(p*.054+5.),4.)*5.7+fb(p*.13)*1.6)-1.9;
}
vec3 beyond(vec3 o,vec3 d){
 vec3 sky=horizon(d,true);float t=.05,prev=t;bool hit=false;
 for(int i=0;i<108;i++){vec3 p=o+t*d;float h=p.y-max(-.65,remoteHeight(p.xz));
  if(h<.018+t*.0015){hit=true;break;}prev=t;t+=clamp(h*.63,.14,6.)+t*.005;if(t>186.)break;}
 if(!hit)return sky;
 for(int i=0;i<4;i++){float m=(prev+t)*.5;vec3 p=o+m*d;if(p.y<max(-.65,remoteHeight(p.xz))+.015)t=m;else prev=m;}
 vec3 p=o+d*t;float e=.07+t*.001,h=remoteHeight(p.xz);
 vec3 n=normalize(vec3(h-remoteHeight(p.xz+vec2(e,0)),e,h-remoteHeight(p.xz+vec2(0,e))));
 float strata=fb(vec2(p.x*.6+p.z*.22,p.y*3.1)+N(p.xz*.19));
 vec3 col=mix(vec3(.18,.16,.22),vec3(.64,.39,.255),strata)*(.52+.92*sat(dot(n,normalize(vec3(-.6,.6,-.52)))));
 if(h<-.62){float rip=N(p.xz*vec2(2.,11.));col=mix(vec3(.24,.31,.32),horizon(reflect(d,normalize(vec3(.008,1.,(rip-.5)*.045))),true),.50+.32*pow(1.-abs(d.y),5.));}
 return mix(col,vec3(.82,.59,.52),1.-exp(-t*.012));
}
</script>
<script id="masonry" type="text/plain">
float box3(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}
vec2 closer(vec2 a,vec2 b){return a.x<b.x?a:b;}
const float CY=4.72, AP=3.12;
vec2 gate(vec3 p){
 vec2 s=p.xy-vec2(0,CY);float r=length(s),a=atan(s.x,s.y),az=abs(p.z);
 float whole=max(max(AP-r,r-4.58),az-1.08);
 if(whole>.6)return vec2(whole,1.);
 float angle=a/TAU*25.+.5,id=floor(angle),v=hash(id+43.);
 float seam=(.012-abs(fract(angle+.5)-.5))*r*.2513;
 float outer=4.24+.19*v+.12*cos(5.*a)+.15*pow(max(0.,cos(a)),25.);
 float z=.77+.13*v;
 float block=max(max(AP+.09-r,r-outer),az-z);
 block=max(block,(r-outer+az-z+.13)*.707);
 block=max(block,(AP+.09-r+az-z+.09)*.707);
 block=max(block,seam);
 // Raised archivolts follow each wedge; the polished throat is bedded deeper.
 float ribs=max(abs(r-(outer-.20))-.076,az-z-.068);
 ribs=max(ribs,(abs(r-(outer-.20))-.076+az-z-.068+.037)*.707);
 block=min(block,max(seam+.009,ribs));
 float fillet=max(max(AP-r,r-(AP+.27)),az-.68);
 fillet=max(fillet,(AP-r+az-.68+.065)*.707);
 fillet=max(fillet,seam*.55);
 block=min(block,max(max(AP+.14-r,r-outer+.09),az-z+.11));
 return closer(vec2(block,1.+v*.20),vec2(fillet,2.));
}
vec2 works(vec3 p){
 vec2 hit=gate(p);
 // Battered abutments: fewer and narrower headers in successive courses.
 vec3 q=vec3(abs(p.x)-3.76,p.y,p.z);
 float c=clamp(floor((q.y+.12)/.77),0.,5.),y=(c+.5)*.77-.12;
 float w=1.30-.108*c,z=1.63-.12*c;
 vec3 d=abs(vec3(q.x,q.y-y,q.z))-vec3(w,.374,z);
 float pier=max(max(d.x,max(d.y,d.z)),max(d.x+d.z+.22,max(d.x+d.y+.07,d.z+d.y+.065))*.707);
 hit=closer(hit,vec2(pier,1.04+.029*c));
 float cap=box3(vec3(q.x,q.y-4.50,q.z),vec3(.91,.18,1.18))-.035;
 hit=closer(hit,vec2(cap,1.14));
 // A pair of broken survey stelae survive on the flank of the landing.
 vec3 fin=p-vec3(p.x<0.?-6.45:6.93,0.,p.x<0.?-2.8:-4.12);
 float fh=p.x<0.?6.75:4.92;
 float batter=clamp(fin.y/fh,0.,1.);fin.x+=.23*batter*batter;
 vec2 section=abs(fin.xz)-vec2(.85-.27*batter,.75-.21*batter);
 float shaft=max(max(section.x,section.y),(section.x+section.y+.31)*.707);
 shaft=max(shaft,fin.y-fh+fin.x*.48+fin.z*.35);
 shaft=max(shaft,dot(fin,vec3(-.66,.47,.30))-fh*.46);
 float split=.015-abs(fin.x+.10+.048*sin(fin.y*3.)+.09*fin.z);
 shaft=max(shaft,min(split,fin.y-fh*.65));
 hit=closer(hit,vec2(shaft,2.));
 float footing=box3(vec3(fin.x,fin.y-.31,fin.z),vec3(1.02,.37,.96))-.042;
 hit=closer(hit,vec2(footing,1.12));
 // Jointed flagstone terraces create a traversable processional stair on both faces.
 float row=clamp(floor((abs(p.z)-1.45)/.72)+1.,0.,6.);
 float top=1.19-row*.177;
 float lead=1.45+row*.72;
 float along=mod(p.x+row*.91,1.82)-.91;
 float tread=max(max(abs(p.x)-(5.43-.12*row),abs(p.z)-lead),p.y-top);
 tread=max(tread,(abs(p.z)-lead+p.y-top+.045)*.707);
 tread=max(tread,.011-min(.91-abs(along),abs(abs(p.z)-lead)));
 // A buried continuous core prevents a joint being mistaken for open space.
 float core=max(max(abs(p.x)-(5.39-.12*row),abs(p.z)-lead+.035),p.y-top+.065);
 // Use a continuous lower bound approaching the next riser from below.
 float nextRise=max(max(abs(p.z)-(lead-.72),abs(p.x)-5.44),p.y-top-.177);
 if(row>.5) tread=min(tread,nextRise+.035);
 hit=closer(hit,vec2(min(core,tread),3.+row*.015));
 return hit;
}
vec2 column(vec3 p){
 float region=max(max(9.4-abs(p.x),length(p.xz)-26.),p.y-6.1);
 if(region>1.)return vec2(region,4.);
 vec2 k=p.xz/.64;vec2 a=mod(k,vec2(1.732,3.))-vec2(.866,1.5);
 vec2 b=mod(k-vec2(.866,1.5),vec2(1.732,3.))-vec2(.866,1.5);
 vec2 u=dot(a,a)<dot(b,b)?a:b;vec2 cell=(k-u)*.64;
 float field=fb(cell*.112+23.),id=N(cell*13.);
 float h=(field-.43)*19.+id*.92+.45;
 float border=max(8.7-abs(p.x),length(p.xz)-26.);
 h=min(min(h,(abs(cell.x)-9.6)*.66),1.25+3.8*smoothstep(18.,26.,length(cell)));
 float plane=max(abs(u.x),dot(abs(u),vec2(.5,.866)))-.845;
 float cap=p.y-h+dot(u,vec2(.16,-.09));
 float d=max(max(plane*.64,cap),border);
 d=max(d,(plane*.64+cap+.09+.07*id)*.707);
 // A taller adjacent joint can enter the ray before this column's cap.
 float cellExit=max(.033,-plane*.64+.018);
 d=min(d,max(max(cellExit,region),p.y-min(6.1,2.1+3.8*smoothstep(17.,25.,length(cell)))));
 return vec2(d,4.+.16*id);
}
vec2 debris(vec3 p){
 vec2 tile=floor((p.xz+1.35)/2.7),v=texture2D(grain,(tile+vec2(71.5,12.5))/256.).gb;
 vec2 uv=mod(p.xz+1.35,2.7)-1.35-(v-.5)*.8;
 float size=.085+.78*pow(v.y,3.);
 float h=p.y+.14;vec3 q=vec3(uv.x,h,uv.y);
 float shape=max(max(abs(q.x)*.93+abs(q.z)*.34,abs(q.z)*1.24),max(dot(q,vec3(.62,1.38,.29)),dot(q,vec3(-.69,1.65,-.41))));
 return vec2(max(shape-size,max(length(p.xz)-21.,5.6-length(p.xz)))*.55,4.+v.x*.16);
}
vec2 objects(vec3 p){return closer(closer(works(p),column(p)),debris(p));}
vec2 stoneTrace(vec3 o,vec3 d,float limit){
 float t=.05;vec2 h;
 for(int i=0;i<122;i++){
  vec3 p=o+t*d;if(length(p.xz)>31.&&dot(p.xz,d.xz)>0.)break;
  h=objects(p);
  if(h.x<.002+t*.00038)return vec2(t,h.y);
  t+=max(.009,h.x*.83);if(t>limit||p.y>12.&&d.y>0.)break;
 }return vec2(240.,0.);
}
float landTrace(vec3 o,vec3 d){
 float t=.03;
 for(int i=0;i<102;i++){vec3 p=o+t*d;float h=p.y-ground(p.xz);if(h<.006+t*.0009)return t;
  t+=clamp(h*(t<23.?.74:.46),.055,4.7);if(t>155.||p.y>42.&&d.y>0.)break;}
 return 240.;
}
vec3 stoneNormal(vec3 p,float e){
 vec2 k=vec2(1,-1);return normalize(k.xyy*objects(p+k.xyy*e).x+k.yyx*objects(p+k.yyx*e).x+k.yxy*objects(p+k.yxy*e).x+k.xxx*objects(p+k.xxx*e).x);
}
float shade(vec3 p,vec3 n){
 float t=.06,s=1.;vec3 o=p+n*.053;
 for(int i=0;i<27;i++){vec3 h=o+t*sun;float dist=objects(h).x;
 s=min(s,11.*dist/t);t+=clamp(dist,.08,1.9);if(t>17.||s<.04)break;}return sat(s);
}
</script>
<script id="photography" type="text/plain">
float joints(vec2 uv){
 vec2 i=floor(uv),f=fract(uv);float a=6.,b=6.;
 for(int j=-1;j<=1;j++)for(int k=-1;k<=1;k++){vec2 g=vec2(float(j),float(k));
 vec2 r=g+.16+.68*texture2D(grain,(i+g+.5)/256.).gb-f;float h=dot(r,r);b=min(b,max(a,h));a=min(a,h);}
 return sqrt(b)-sqrt(a);
}
vec3 finishStone(vec3 p,vec3 n,vec3 rd,float id,float t){
 bool soil=id<.5,glass=id>1.8&&id<2.1;
 vec2 uv=abs(n.y)>.62?p.xz:(abs(n.z)>abs(n.x)?p.xy:p.zy);
 vec2 shift=vec2(fb(uv*1.1),fb(uv*1.3+29.));
 float large=fb(uv*.78+shift),mid=fb(uv*6.+shift*2.),fine=N(uv*74.);
 float fracture=joints(uv*vec2(1.6,.89)+shift*.8+fb(uv*10.)*.085);
 float cleft=1.-smoothstep(.004,.038,fracture);
 float lamina=fb(uv*vec2(1.6,18.)+shift*4.);
 float grit=.70+.50*mid+.19*fine;
 vec3 basalt=mix(vec3(.055,.075,.082),vec3(.34,.345,.328),sat((large-.25)*2.1));
 basalt*=grit*(.75+.39*lamina)*(1.-.52*cleft);
 float moss=smoothstep(.56,.76,large+.25*(mid-.5)+.09*n.y-.07*max(0.,p.y-3.));
 vec3 lichen=mix(vec3(.11,.145,.082),vec3(.45,.46,.24),mid*.83+fine*.17);
 vec3 albedo=mix(basalt,lichen,moss*.90);
 if(soil){albedo=mix(vec3(.13,.135,.12),vec3(.31,.30,.24),large)*grit*(.70+.49*mid);albedo=mix(albedo,lichen,moss*.83);albedo*=1.-cleft*.25;}
 if(glass)albedo=vec3(.045,.061,.071)*(.45+mid+.23*sin(88.*large+uv.y*4.))*(1.-.6*cleft);
 float facet=rock(p*4.);float bump=(glass?.15:.32)*(1.-smoothstep(24.,85.,t));
 n=normalize(n+bump*vec3(N(uv*15.+shift)-.5,facet-.5,N(uv*15.+shift+12.)-.5));
 float sh=t<36.?shade(p,n):1.,diff=sat(dot(n,sun));
 float occ=1.;if(t<30.){occ=clamp(.42+.40*objects(p+n*.43).x/.43+.20*objects(p+n*1.15).x/1.15,.42,1.);}
 vec3 light=vec3(.44,.55,.63)*(.66+.34*max(0.,n.y))*occ+vec3(1.32,1.18,.88)*sh*diff;
 vec3 color=albedo*light;
 vec2 radial=p.xy-vec2(0,CY);
 float edge=length(vec2(length(radial)-AP,p.z));
 vec3 rimPoint=vec3(vec2(0,CY)+normalize(radial+.0001)*AP,0);
 float spill=ignition*exp(-edge*.75)*(.32+.68*sat(dot(n,normalize(rimPoint-p))));
 color+=vec3(.66,.34,.105)*spill*(glass?.86:.40);
 vec3 refl=reflect(rd,n);float fres=.042+.958*pow(1.-sat(dot(n,-rd)),5.);
 float wet=soil?(1.-smoothstep(.36,.52,large))*smoothstep(.89,.99,n.y):.22+.35*(1.-moss);
 vec3 env=horizon(refl,false)*(.32+.68*smoothstep(-.16,.19,refl.y));
 if(abs(refl.z)>.001){float tr=-p.z/refl.z;vec3 spot=p+refl*tr;float rr=length(spot.xy-vec2(0,CY));
 if(tr>.04&&rr<AP+.18){vec3 reflected=mix(vec3(.37,.23,.22),vec3(.95,.60,.36),smoothstep(-.06,.08,refl.y)+.07*(mid-.5));env=mix(env,reflected,(1.-smoothstep(AP-.24,AP+.18,rr))*ignition*.85);}}
 color=mix(color,env,glass?(.19+.76*fres):wet*fres*.85);
 color+=vec3(1.,.88,.65)*pow(sat(dot(normalize(sun-rd),n)),glass?100.:38.)*sh*(glass?.65:.12)*(.6+fine);
 // Incised paired grooves and worn radial tally cuts on the dressed face.
 if(id>=1.&&id<1.21&&abs(p.z)>.68&&abs(n.z)>.62){
 float r=length(radial),a=atan(radial.x,radial.y)/TAU;
 float cut=abs(r-3.63);cut=min(cut,abs(r-3.72));
 float ticks=abs(fract(a*175.+.5)-.5)*.14;cut=min(cut,max(ticks,abs(r-3.53)-.048));
 color*=.69+.31*smoothstep(.006,.026,cut+.014*(mid-.5));}
 float haze=1.-exp(-t*.0125-max(0.,t-25.)*.009);
 return mix(color,vec3(.54,.62,.65),haze);
}
void main(){
 vec3 cam=eye;cam.y=max(cam.y,ground(cam.xz)+1.55);
 vec2 finDelta=cam.xz-vec2(cam.x<0.?-6.45:6.93,cam.x<0.?-2.8:-4.12);
 cam.y=max(cam.y,(cam.x<0.?8.1:6.3)*(1.-smoothstep(.85,3.8,length(finDelta))));
 cam.y=max(cam.y,(2.75+3.8*smoothstep(17.,25.,length(cam.xz)))*smoothstep(8.7,12.,abs(cam.x))*(1.-smoothstep(26.,30.,length(cam.xz))));
 vec2 uv=(gl_FragCoord.xy-.5*res)/res.y;vec3 f=normalize(aim-cam),right=normalize(cross(f,vec3(0,1,0))),up=cross(right,f);
 vec3 d=normalize(f+(.72/max(.60,min(1.,res.x/res.y)))*(uv.x*right+uv.y*up));
 float t=landTrace(cam,d);vec2 st=stoneTrace(cam,d,min(t,155.));
 float id=0.;if(st.x<t){t=st.x;id=st.y;}
 float tp=abs(d.z)>.00001?-cam.z/d.z:300.;
 vec3 portal=cam+d*tp;vec2 q=portal.xy-vec2(0,CY);
 float reach=AP*(.014+.986*ignition);
 float gap=length(q)-reach;
 vec3 col;
 if(tp>.0&&tp<t&&gap<.0){
  float band=exp(gap*8.),ang=atan(q.y,q.x);
  vec3 ray=d;ray.xy+=normalize(q+.0001)*band*(.031+.013*sin(ang*19.+clock*1.5)+.013*N(q*9.+clock*.21));
  ray.z=-abs(ray.z);vec3 dest=vec3(portal.x,portal.y,0.);
  col=beyond(dest,normalize(ray));
  float curl=fb(q*9.+vec2(clock*.36,-clock*.2));
  col+=vec3(1.,.49,.16)*(band*.17+exp(gap*72.)*(.60+.81*curl));
 }else if(t<200.){
  vec3 p=cam+d*t;float e=.012+.0005*t;vec3 n=id>.5?stoneNormal(p,e):normalize(vec3(ground(p.xz-vec2(e,0))-ground(p.xz+vec2(e,0)),2.*e,ground(p.xz-vec2(0,e))-ground(p.xz+vec2(0,e))));
  col=finishStone(p,n,d,id,t);
 }else col=horizon(d,false);
 if(tp>0.&&tp<t+.8)col+=vec3(.95,.49,.20)*exp(-abs(gap)*9.)*.14*ignition;
 // Suspend motes in a finite shell, not a screen-space particle overlay.
 for(int i=0;i<42;i++){float k=float(i),v=hash(k+7.),a=k*2.39996+clock*(.027+.034*v);
 float r=AP+.18+.85*hash(k+56.)+.12*sin(clock*.5+k);vec3 m=vec3(cos(a)*r,CY+sin(a)*r,(hash(k+99.)-.5)*2.8+.22*sin(a*3.+clock*.3));
 vec3 w=m-cam;float z=dot(w,d);if(z>0.&&z<min(t,tp>0.&&gap<0.?tp:t)){
 float dd=length(w-d*z),size=.011+.017*v+z/res.y*.25;col+=vec3(.93,.68,.38)*exp(-dd*dd/(size*size))*(.21+.53*v)*ignition;}}
 vec2 screen=gl_FragCoord.xy/res-.5;
 col*=1.08-.26*dot(screen,screen);
 col=pow(max(vec3(0),col),vec3(.85));
 col+=.012*(texture2D(grain,gl_FragCoord.xy/256.).b-.5);
 gl_FragColor=vec4(clamp(col,0.,1.),1.);
}
</script>
<script>
(() => {
 'use strict';
 const canvas=document.querySelector('#scene'), notice=document.querySelector('#notice'), hint=document.querySelector('#hint');
 const gl=canvas.getContext('webgl',{alpha:false,antialias:false,depth:false,stencil:false,powerPreference:'high-performance'});
 if(!gl){notice.textContent='This scene needs WebGL. Enable hardware acceleration or open it in a WebGL-capable browser.';return;}
 const start=performance.now(),reduce=matchMedia('(prefers-reduced-motion: reduce)');
 let targetYaw=.175,yaw=targetYaw,targetPitch=.045,pitch=targetPitch,targetDistance=17.7,distance=targetDistance;
 let last=start,lastInput=-10000,lastSize=0,frames=0,elapsed=0,quality=1,time=0;
 const clamp=(n,lo,hi)=>Math.max(lo,Math.min(hi,n));
 function shader(type,src){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));
  return s;
 }
 try{
  const program=gl.createProgram();
  gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec2 point;void main(){gl_Position=vec4(point,0.,1.);}'));
  gl.attachShader(program,shader(gl.FRAGMENT_SHADER,['landscape','masonry','photography'].map(id=>document.getElementById(id).textContent).join('\n')));

})();
