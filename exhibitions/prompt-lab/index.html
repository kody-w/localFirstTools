<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Lab has moved</title>
<meta name="description" content="Prompt Lab now lives at airaptr.github.io/prompt-lab: flip through every build of every prompt.">
<link rel="canonical" href="https://airaptr.github.io/prompt-lab/">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07070d;color:#f4f4f8;font:17px/1.5 -apple-system,'Segoe UI',sans-serif;text-align:center;padding:16px}
a.btn{display:inline-block;margin-top:18px;padding:14px 26px;border-radius:999px;background:#ff3d6e;color:#fff;font-weight:700;text-decoration:none}
small{display:block;margin-top:22px;color:rgba(244,244,248,.6)}small a{color:inherit}</style>
</head>
<body>
<div>
<h1>Prompt Lab has a new home</h1>
<p>Same prompt, three AIs. Flip through every build without changing pages.</p>
<a class="btn" id="go" href="https://airaptr.github.io/prompt-lab/">Open Prompt Lab</a>
<small>The old episode pages here still work, for example <a href="ep29-ferrofluid/">EP 29</a>. Data: <a href="episodes.json">episodes.json</a>.</small>
</div>
<script>
// carry a deep link along: ?ep=29 or #ep29 goes straight to that prompt
var m = (location.hash + location.search).match(/ep=?(\d+)/);
var to = 'https://airaptr.github.io/prompt-lab/' + (m ? '#ep' + ('0' + m[1]).slice(-2) : '');
document.getElementById('go').href = to;
setTimeout(function () { location.replace(to); }, 1500);
</script>
</body>
</html>
