<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Starship on Mars — pastel on toned paper</title>
<style>
  html,body{margin:0;height:100%;background:#111014;}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{max-width:100vw;max-height:100vh;width:auto;height:auto;box-shadow:0 0 40px #000;}
</style>
</head>
<body>
<canvas id="c" width="3840" height="2160"></canvas>
<script id="art">
/*ART-BEGIN*/
function createArt(W, H, seed) {
  const k = W / 3840, N = W * H;
  const CR = new Float32Array(N), CG = new Float32Array(N), CB = new Float32Array(N);
  const tooth = new Float32Array(N), fill = new Float32Array(N);
  const sid = new Int32Array(N), scov = new Float32Array(N), spk = new Uint8Array(N);
  let SID = 0;

  // ---------- randomness & noise ----------
  let st = seed >>> 0;
  function rnd() { st = (st + 0x6D2B79F5) | 0; let t = st; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  const R = (a, b) => a + (b - a) * rnd();
  const gauss = () => (rnd() + rnd() + rnd() + rnd() - 2) * 1.732;
  const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  function hash2(x, y, s) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
  function vn(x, y, s = 0) {
    const ix = Math.floor(x), iy = Math.floor(y); let fx = x - ix, fy = y - iy;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    const a = hash2(ix, iy, s), b = hash2(ix + 1, iy, s), c = hash2(ix, iy + 1, s), d = hash2(ix + 1, iy + 1, s);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  }
  function fbm(x, y, o = 4, s = 0) { let v = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < o; i++) { v += a * vn(x * f, y * f, s + i * 17); n += a; a *= 0.5; f *= 2.03; } return v / n; }

  // ---------- colour ----------
  function hex(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16) / 255, parseInt(h.slice(2, 4), 16) / 255, parseInt(h.slice(4, 6), 16) / 255]; }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function ramp(stops, t) {
    t = clamp(t);
    for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) { const a = stops[i - 1], b = stops[i]; return mix(a[1], b[1], (t - a[0]) / ((b[0] - a[0]) || 1)); }
    return stops[stops.length - 1][1];
  }
  function jit(c, amt) { const l = (rnd() - 0.5) * amt; return [clamp(c[0] + l + (rnd() - 0.5) * amt * 0.7), clamp(c[1] + l + (rnd() - 0.5) * amt * 0.7), clamp(c[2] + l + (rnd() - 0.5) * amt * 0.7)]; }
  function angMix(a, b, t) { const x = lerp(Math.cos(2 * a), Math.cos(2 * b), t), y = lerp(Math.sin(2 * a), Math.sin(2 * b), t); return Math.atan2(y, x) / 2; }

  // ---------- paper: dark plum Mi-Teintes-like sheet with honeycomb tooth ----------
  const PAPER = hex('#30243f');
  function makePaper() {
    const cs = 6.5 * k + 1.2, m1 = 2.0 * k + 0.7, m2 = 70 * k;
    for (let y = 0; y < H; y++) {
      const gy = y / cs, iy = Math.floor(gy);
      for (let x = 0; x < W; x++) {
        const gx = x / cs, ix = Math.floor(gx);
        let f1 = 9;
        for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
          const cx = ix + ox, cy = iy + oy;
          const dx = cx + hash2(cx, cy, 11) - gx, dy = (cy + hash2(cx, cy, 12) - gy) * 1.2;
          const d = dx * dx + dy * dy; if (d < f1) f1 = d;
        }
        const bump = 1 - Math.min(1, Math.sqrt(f1) * 1.3);
        const i = y * W + x;
        tooth[i] = 0.42 * bump + 0.3 * vn(x / m1, y / m1, 7) + 0.06 * hash2(x, y, 5) + 0.22 * vn(x / m2, y / m2, 9);
        spk[i] = (hash2(x, y, 21) * 255) | 0;
      }
    }
    // fibres pressed into the sheet
    const nf = Math.floor(9000 * k * k) + 200;
    for (let f = 0; f < nf; f++) {
      let x = R(0, W), y = R(0, H), a = R(0, Math.PI * 2); const len = R(8, 45) * k + 3, dv = R(-0.16, 0.14);
      for (let s = 0; s < len; s++) { a += R(-0.15, 0.15); x += Math.cos(a); y += Math.sin(a); const xi = x | 0, yi = y | 0; if (xi >= 0 && yi >= 0 && xi < W && yi < H) tooth[yi * W + xi] += dv; }
    }
    // equalise tooth to a uniform 0..1 distribution
    const S = 200000, smp = new Float32Array(S);
    for (let s = 0; s < S; s++) smp[s] = tooth[(rnd() * N) | 0];
    smp.sort(); const Q = 1024, q = new Float32Array(Q + 1);
    for (let j = 0; j <= Q; j++) q[j] = smp[Math.min(S - 1, Math.floor(j / Q * (S - 1)))];
    for (let i = 0; i < N; i++) {
      const v = tooth[i]; let lo = 0, hi = Q;
      while (hi - lo > 1) { const md = (lo + hi) >> 1; if (q[md] <= v) lo = md; else hi = md; }
      tooth[i] = lo / Q;
    }
    // paper colour: mottled, darker in the valleys, a few coloured fibres
    const mt = 300 * k;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x, m = fbm(x / mt, y / mt, 3, 40), h = vn(x / mt * 1.7, y / mt * 1.7, 44);
      const v = 0.86 + 0.22 * m + (tooth[i] - 0.5) * 0.18;
      CR[i] = PAPER[0] * v * (0.95 + 0.1 * h); CG[i] = PAPER[1] * v; CB[i] = PAPER[2] * v * (1.05 - 0.1 * h);
    }
    const fc = [hex('#7d5a8c'), hex('#4a3f78'), hex('#8a4a5a'), hex('#5c6aa0')];
    for (let f = 0; f < 1600 * k * k + 40; f++) {
      let x = R(0, W), y = R(0, H), a = R(0, 6.3); const len = R(6, 26) * k + 2, c = fc[(rnd() * 4) | 0];
      for (let s = 0; s < len; s++) { a += R(-0.2, 0.2); x += Math.cos(a); y += Math.sin(a); const xi = x | 0, yi = y | 0; if (xi >= 0 && yi >= 0 && xi < W && yi < H) { const i = yi * W + xi; CR[i] = lerp(CR[i], c[0], 0.5); CG[i] = lerp(CG[i], c[1], 0.5); CB[i] = lerp(CB[i], c[2], 0.5); } }
    }
  }

  // ---------- dry media ----------
  // bite: how deep into the tooth a given pressure reaches; soft: grain edge; slip: less grip on loaded paper
  const TOOLS = {
    pastel:   { bite: 1.00, soft: 0.22, opacity: 0.93, load: 0.32, slip: 0.30, lift: 0.55, streak: 0.55, rough: 0.40, speck: 0.14 },
    pencil:   { bite: 0.92, soft: 0.16, opacity: 0.96, load: 0.18, slip: 0.15, lift: 0.40, streak: 0.00, rough: 0.18, speck: 0.07 },
    charcoal: { bite: 0.86, soft: 0.14, opacity: 0.92, load: 0.30, slip: 0.20, lift: 0.30, streak: 0.45, rough: 0.45, speck: 0.22 },
    rub:      { bite: 1.75, soft: 0.55, opacity: 0.62, load: 0.22, slip: 0.08, lift: 0.3, streak: 0.35, rough: 0.6, speck: 0.05 },
    chalk:    { bite: 0.84, soft: 0.18, opacity: 0.97, load: 0.22, slip: 0.25, lift: 0.50, streak: 0.30, rough: 0.35, speck: 0.10 },
  };
  const prof = new Float32Array(66);

  function seg(A, B, col, T) {
    const x0 = A[0], y0 = A[1], w0 = A[2] * 0.5, p0 = A[3], x1 = B[0], y1 = B[1], w1 = B[2] * 0.5, p1 = B[3];
    const rm = Math.max(w0, w1) * (1 + T.rough * 0.5) + 1.5;
    const xa = Math.max(0, Math.floor(Math.min(x0, x1) - rm)), xb = Math.min(W - 1, Math.ceil(Math.max(x0, x1) + rm));
    const ya = Math.max(0, Math.floor(Math.min(y0, y1) - rm)), yb = Math.min(H - 1, Math.ceil(Math.max(y0, y1) + rm));
    if (xa > xb || ya > yb) return;
    const dx = x1 - x0, dy = y1 - y0, L2 = dx * dx + dy * dy, L = Math.sqrt(L2) || 1e-6, nx = -dy / L, ny = dx / L;
    const cr = col[0], cg = col[1], cb = col[2];
    const rough = T.rough, bite = T.bite, isoft = 1 / T.soft, op = T.opacity, slip = T.slip, lift = T.lift, load = T.load, sp = T.speck / 255, useP = T.streak > 0;
    for (let y = ya; y <= yb; y++) {
      const py = y + 0.5 - y0; let i = y * W + xa;
      for (let x = xa; x <= xb; x++, i++) {
        const px = x + 0.5 - x0;
        let t = L2 > 0 ? (px * dx + py * dy) / L2 : 0; if (t < 0) t = 0; else if (t > 1) t = 1;
        const ex = px - t * dx, ey = py - t * dy, d = Math.sqrt(ex * ex + ey * ey);
        const r = w0 + (w1 - w0) * t, tv = tooth[i];
        const re = r * (1 - rough * 0.5 + rough * tv) + 0.35;
        if (d >= re) continue;
        let a = (p0 + (p1 - p0) * t) * Math.min(1, (re - d) / (0.7 + r * 0.3));
        if (useP && r > 1.5) { let u = ((ex * nx + ey * ny) / re + 1) * 32; u = u < 0 ? 0 : u > 65 ? 65 : u; a *= prof[u | 0]; }
        const fl = fill[i];
        let c = (tv + fl * lift - 1 + a * bite) * isoft + 0.5;
        if (c <= 0) continue; if (c > 1) c = 1;
        const al = c * op * (1 - fl * slip);
        if (sid[i] !== SID) { sid[i] = SID; scov[i] = 0; }
        const pv = scov[i]; if (al <= pv) continue;
        const da = (al - pv) / (1 - pv + 1e-4); scov[i] = al;
        const sv = 1 + (spk[i] - 127.5) * sp;
        CR[i] += (cr * sv - CR[i]) * da; CG[i] += (cg * sv - CG[i]) * da; CB[i] += (cb * sv - CB[i]) * da;
        fill[i] = fl + (1 - fl) * da * load;
      }
    }
  }
  function drawStroke(P, col, T) {
    SID++;
    const ph = rnd() * 500;
    for (let j = 0; j < 66; j++) prof[j] = (1 - T.streak) + T.streak * 1.55 * Math.pow(vn(j * 0.33 + ph, 7.7), 1.3);
    for (let i = 0; i < P.length - 1; i++) seg(P[i], P[i + 1], col, T);
  }
  // a hand-made path: curvature, slow wander, fast tremor, pressure envelope
  function mkPath(x, y, ang, len, w, p, o) {
    o = o || {};
    const curv = o.curv || 0, trem = o.trem == null ? 1 : o.trem, taper = o.taper == null ? 1 : o.taper;
    const step = Math.max(1.4, Math.min(w * 0.45, 18)), n = Math.max(2, Math.ceil(len / step)), ds = len / n;
    const ph = rnd() * 1000, ph2 = rnd() * 1000, ph3 = rnd() * 1000;
    const a0 = 0.03 + rnd() * 0.14, a1 = 0.62 + rnd() * 0.33;
    const wob = len * 0.022 * trem, tr = (0.45 + w * 0.035) * trem;
    const pts = new Array(n + 1);
    let cx = x, cy = y;
    for (let i = 0; i <= n; i++) {
      const s = i / n, a = ang + curv * (s - 0.5);
      if (i > 0) { cx += Math.cos(a) * ds; cy += Math.sin(a) * ds; }
      const off = (vn(ph + s * len / 28, 0.5) - 0.5) * 2 * tr + (vn(ph2 + s * len / 170, 1.5) - 0.5) * 2 * wob;
      const env = sstep(0, a0, s) * (1 - taper * 0.85 * sstep(a1, 1, s));
      const pv = p * (0.3 + 0.7 * env) * (0.78 + 0.44 * vn(ph3 + s * len / 45, 2.5));
      const wv = w * (0.62 + 0.38 * env) * (0.88 + 0.24 * vn(ph3 + s * len / 90, 3.5));
      pts[i] = [cx - Math.sin(a) * off, cy + Math.cos(a) * off, wv, Math.min(1, pv)];
    }
    return pts;
  }
  function toPx(P) { for (const q of P) { q[0] *= k; q[1] *= k; q[2] = Math.max(0.9, q[2] * k); } return P; }
  // centred stroke in design space (3840x2160)
  function S(x, y, ang, len, w, p, col, tool, o) {
    const c = Math.cos(ang), s = Math.sin(ang), cv = (o && o.curv) || 0;
    drawStroke(toPx(mkPath(x - c * len / 2 + s * cv * len * 0.06, y - s * len / 2 - c * cv * len * 0.06, ang, len, w, p, o)), col, TOOLS[tool]);
  }
  // stroke along an arbitrary design-space polyline (pts [x,y]), still with tremor & pressure
  function SL(line, w, p, col, tool, o) {
    o = o || {}; const trem = o.trem == null ? 1 : o.trem, ph = rnd() * 900, taper = o.taper == null ? 1 : o.taper;
    let tot = 0; const cum = [0];
    for (let i = 1; i < line.length; i++) { tot += Math.hypot(line[i][0] - line[i - 1][0], line[i][1] - line[i - 1][1]); cum.push(tot); }
    if (tot < 0.5) return;
    const a0 = 0.03 + rnd() * 0.12, a1 = 0.65 + rnd() * 0.3, P = [];
    for (let i = 0; i < line.length; i++) {
      const s = cum[i] / tot, j = Math.min(line.length - 1, i + 1), jj = Math.max(0, i - 1);
      let tx = line[j][0] - line[jj][0], ty = line[j][1] - line[jj][1]; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      const off = (vn(ph + cum[i] / 26, 0.5) - 0.5) * 2 * (0.45 + w * 0.03) * trem;
      const env = sstep(0, a0, s) * (1 - taper * 0.8 * sstep(a1, 1, s));
      P.push([line[i][0] - ty * off, line[i][1] + tx * off, w * (0.65 + 0.35 * env), Math.min(1, p * (0.35 + 0.65 * env) * (0.8 + 0.4 * vn(ph + cum[i] / 40, 4.5)))]);
    }
    drawStroke(toPx(P), col, TOOLS[tool]);
  }
  // finger / stump blending: drags pigment along a path and presses it into the tooth
  function smudge(x, y, ang, len, w, str, o) {
    const c0 = Math.cos(ang), s0 = Math.sin(ang);
    const P = toPx(mkPath(x - c0 * len / 2, y - s0 * len / 2, ang, len, w, 1, o || { trem: 0.6 }));
    let car = null;
    for (const q of P) {
      const cx = q[0], cy = q[1], r = Math.max(1.5, q[2] * 0.5), f0 = str * q[3];
      const xa = Math.max(0, Math.floor(cx - r)), xb = Math.min(W - 1, Math.ceil(cx + r)), ya = Math.max(0, Math.floor(cy - r)), yb = Math.min(H - 1, Math.ceil(cy + r));
      let sr = 0, sg = 0, sb = 0, sw = 0;
      for (let yy = ya; yy <= yb; yy++) for (let xx = xa; xx <= xb; xx++) {
        const d = Math.hypot(xx + 0.5 - cx, yy + 0.5 - cy) / r; if (d >= 1) continue;
        const i = yy * W + xx, f = f0 * (1 - d) * (0.6 + 0.4 * tooth[i]);
        if (car) { CR[i] += (car[0] - CR[i]) * f * 0.55; CG[i] += (car[1] - CG[i]) * f * 0.55; CB[i] += (car[2] - CB[i]) * f * 0.55; fill[i] = Math.min(1, fill[i] + f * 0.06); }
        sr += CR[i] * (1 - d); sg += CG[i] * (1 - d); sb += CB[i] * (1 - d); sw += 1 - d;
      }
      if (sw > 0) { const av = [sr / sw, sg / sw, sb / sw]; car = car ? mix(car, av, 0.28) : av; }
    }
  }
  function dot(x, y, w, p, col, tool) { S(x, y, R(0, 6.28), Math.max(0.6, w * R(0.2, 0.9)), w, p, col, tool || 'chalk', { trem: 0.3, taper: 0.3 }); }
  function sample(x, y) { const i = (Math.min(H - 1, Math.max(0, (y * k) | 0))) * W + Math.min(W - 1, Math.max(0, (x * k) | 0)); return [CR[i], CG[i], CB[i]]; }

  // ================= SCENE =================
  const HOR = 1500, F = 2742, HC = 2.0, CXc = 1920;
  const proj = (X, Y, Z) => [CXc + F * X / Z, HOR - F * (Y - HC) / Z];
  const SX = 24.3, SZ = 121, SY0 = 8.8;            // ship base: 8.8 m above the ground, first seconds of lift-off
  const GP = proj(SX, 0, SZ);                      // where the plume hits the ground
  const SUN = { x: 600, y: 1492 };                 // the sun has just set behind the far rim
  const gaussR = (x, c, w) => Math.exp(-((x - c) / w) * ((x - c) / w));
  function ridgeFar(x) {
    return HOR - 26 - 64 * fbm(x / 520, 3.3, 4, 31) - 118 * gaussR(x, 1300, 470) - 60 * gaussR(x, 230, 260) - 46 * gaussR(x, 3480, 650) + 30 * gaussR(x, 600, 150);
  }
  function ridgeNear(x) {
    const mesa = 92 * sstep(2930, 3070, x) * (1 - 0.35 * sstep(3550, 3900, x)) * (0.9 + 0.2 * fbm(x / 90, 2.2, 3, 77));
    return HOR - 6 - mesa - 54 * gaussR(x, 180, 330) - 22 * gaussR(x, 1750, 300) - 14 * fbm(x / 140, 9.1, 3, 52);
  }
  const SKY = [[0, hex('#ffc287')], [0.07, hex('#ffa08c')], [0.19, hex('#f57ca6')], [0.36, hex('#bf62c6')], [0.56, hex('#7a52c8')], [0.78, hex('#4a3cb0')], [1, hex('#2e2d92')]];
  const HALO = [[0, hex('#fdfff2')], [0.03, hex('#dcfcff')], [0.08, hex('#96f2f2')], [0.16, hex('#52cbee')], [0.26, hex('#3f95e4')], [0.4, hex('#5470d2')]];
  function skyCol(x, y) {
    const alt = clamp((HOR - y) / HOR);
    let c = ramp(SKY, Math.pow(alt, 0.85) + (fbm(x / 900, y / 500, 3, 61) - 0.5) * 0.09);
    const dx = (x - SUN.x) / 3840, dy = (y - SUN.y) / 3840 * 1.3, d = Math.sqrt(dx * dx + dy * dy);
    c = mix(c, ramp(HALO, d * 0.85), Math.exp(-Math.pow(d / 0.31, 1.45)));
    const gx = (x - GP[0]) / 3840, gy = (y - GP[1]) / 3840 * 1.5, gd = Math.sqrt(gx * gx + gy * gy);
    c = mix(c, hex('#ffd99c'), 0.6 * Math.exp(-Math.pow(gd / 0.14, 1.3)));
    return c;
  }
  function skyAng(x, y) {
    const t = Math.atan2(y - SUN.y, x - SUN.x) + Math.PI / 2;
    return angMix(t, -0.1 + 0.15 * (fbm(x / 700, y / 700, 2, 63) - 0.5), sstep(500, 2600, Math.hypot(x - SUN.x, (y - SUN.y) * 1.3)));
  }
  const IRI = ['#ffc4e8', '#ffd6a2', '#f8f6ae', '#b4f6cf', '#9ee5f8', '#cdb8ff'].map(hex);
  function iri(v) { v = ((v % 1) + 1) % 1 * 6; const i = Math.floor(v), f = v - i; return mix(IRI[i % 6], IRI[(i + 1) % 6], f); }

  function sceneCol(x, y) {
    if (y < ridgeFar(x)) return skyCol(x, y);
    if (y < ridgeNear(x)) return mix(hex('#8a62b0'), hex('#3a3888'), Math.exp(-Math.abs(x - SUN.x) / 800));
    return groundCol(x, y);
  }
  function toneGround() {
    for (let pass = 0; pass < 2; pass++) for (let i = 0; i < 520; i++) {
      const x = R(-200, 4040), y = R(-150, 2300), sky = y < HOR;
      S(x, y, sky ? skyAng(x, y) + gauss() * 0.15 : gauss() * 0.08, R(400, 900), R(160, 320), R(0.55, 0.85), jit(sceneCol(x, y), 0.04), 'rub', { curv: R(-0.3, 0.3), trem: 1.5 });
    }
  }
  function paintSky() {
    const inSky = (x, y) => y < ridgeFar(x) + 40;
    for (let i = 0; i < 1100; i++) {
      const x = R(-150, 3990), y = R(-80, HOR + 40); if (!inSky(x, y)) continue;
      S(x, y, skyAng(x, y) + gauss() * 0.1, R(260, 700), R(70, 150), R(0.4, 0.65), jit(skyCol(x, y), 0.05), 'pastel', { curv: R(-0.25, 0.25) });
    }
    for (let i = 0; i < 900; i++) {
      const x = R(-100, 3940), y = R(-60, HOR); if (!inSky(x, y)) continue;
      smudge(x, y, skyAng(x, y) + gauss() * 0.15, R(200, 480), R(60, 130), R(0.5, 0.85));
    }
    for (let i = 0; i < 12000; i++) {
      const x = R(-60, 3900), y = R(-40, HOR + 20); if (!inSky(x, y)) continue;
      S(x, y, skyAng(x, y) + gauss() * 0.1, R(90, 260), R(16, 40), R(0.5, 0.85), jit(skyCol(x, y), 0.07), 'pastel', { curv: R(-0.3, 0.3) });
    }
    for (let i = 0; i < 30000; i++) {
      const x = R(-20, 3860), y = R(-20, HOR + 10); if (!inSky(x, y)) continue;

    }
  }
  function paintShip() {
    paintFlap(-2.25, AFT, true);
    paintFlap(-2.2, FWD, true);
    paintBody();
    paintTiles();
    paintSteelDetail();
    paintFlap(WIND + Math.PI / 2, AFT, false);
    paintFlap(WIND + Math.PI / 2 + 0.2, FWD, false);
    // silhouettes: charcoal on the shadow side, light where the world touches the steel
    const left = [], right = [];
    for (let h = 0; h <= SLEN; h += 0.5) { left.push(sp(-Math.PI / 2 + 0.01, h)); right.push(sp(Math.PI / 2 - 0.01, h)); }
    for (let k2 = 0; k2 < 2; k2++) {
      const a = R(0, 8) | 0;
      SL(left.slice(a, left.length - R(0, 6) | 0), 2.6, 0.85, hex('#0d0b1a'), 'charcoal');
      SL(right.slice(a, right.length - R(0, 4) | 0), 2.4, 0.8, hex('#1a1230'), 'charcoal');
    }
    SL(left.slice(2, 74).map(p => [p[0] - 2.5, p[1]]), 3.2, 0.95, hex('#a8f6ff'), 'chalk');
    SL(left.slice(70, 104).map(p => [p[0] - 2, p[1]]), 2.6, 0.8, hex('#d0c0ff'), 'chalk');
    SL(right.slice(0, 40).map(p => [p[0] + 1.5, p[1]]), 2.4, 0.85, hex('#ffc070'), 'chalk');
    const nose = []; for (let th = -1.5; th <= 1.5; th += 0.1) nose.push(sp(th, SLEN - 0.3));
    dot(nose[15][0], nose[15][1] - 2, 5, 1, hex('#fff2e0'), 'chalk');
    const base = []; for (let th = -1.55; th <= 1.55; th += 0.06) base.push(sp(th, 0));
    SL(base, 3.4, 0.95, hex('#ffcf80'), 'chalk');
  }
  // ---------- the hand: construction, light, crumbs, smudges ----------
  const GRAPH = hex('#8a7fb0');
  function construction(onTop) {
    const p = onTop ? 0.32 : 0.55, c = onTop ? mix(GRAPH, hex('#ffffff'), 0.2) : GRAPH;
    const axTop = sp(0, SLEN + 6), axBot = proj(SX, -1, SZ);
    if (onTop) {
      SL([[axTop[0] - 1, axTop[1] - 70], [axTop[0], axTop[1] + 40]], 2, p, c, 'pencil');
      SL([[R(-20, 40), HOR + 1], [900, HOR + 2], [1500, HOR], [2100, HOR + 1]], 1.8, p * 0.8, c, 'pencil');
      SL([[3240, HOR + 1], [3900, HOR + 3]], 1.8, p * 0.8, c, 'pencil');
      const e = []; for (let a = 2.6; a < 6.0; a += 0.08) e.push([GP[0] + Math.cos(a) * 1450, GP[1] + 8 + Math.sin(a) * 70]);
      SL(e, 1.8, p * 0.7, c, 'pencil');
      SL([[3150, 120], [3420, 180]], 1.6, p, c, 'pencil'); SL([[3160, 150], [3400, 120]], 1.6, p * 0.8, c, 'pencil');
      return;
    }
    SL([[axTop[0], 20], [axBot[0], axBot[1] + 60]], 2.2, p, c, 'pencil');
    SL([[-10, HOR], [3850, HOR + 2]], 2, p, c, 'pencil');
    for (const h of [0, 12, 35, SLEN]) { const L = []; for (let th = -1.7; th <= 1.7; th += 0.1) L.push(sp(th, h, SR * 1.1)); SL(L, 1.8, p, c, 'pencil'); }
    SL([[sp(-1.57, 0)[0] - 40, 1380], [sp(-1.57, 0)[0] - 40, 150]], 1.6, p * 0.7, c, 'pencil');
    for (let i = 0; i < 6; i++) { const a = R(-2.9, -0.2); SL([[GP[0], GP[1]], [GP[0] + Math.cos(a) * 1800, GP[1] + Math.sin(a) * 900]], 1.4, p * 0.6, c, 'pencil'); }
  }
  function dustVeil() {
    for (let i = 0; i < 900; i++) {
      const psi = R(0, Math.PI * 2), rho = R(20, 95), X = SX + rho * Math.cos(psi), Z = SZ + rho * Math.sin(psi) * 0.9;
      const [x, y] = proj(X, R(0, 5), Z); if (Math.abs(x - GP[0]) < 220) continue;
      const c = mix(sample(x, y), sample(x + R(-80, 80), y - R(40, 160)), 0.5);
      S(x, y, gauss() * 0.15, R(80, 260), R(16, 46), R(0.35, 0.6), jit(c, 0.03), 'rub', { curv: R(-0.3, 0.3) });
    }
  }
  function plumeGlow() {
    const top = proj(SX, SY0 - 2.6, SZ)[1], gy = GP[1], cx = GP[0];
    // light scattered in the dust around the engines
    for (let i = 0; i < 2600; i++) {
      const a = R(0, Math.PI * 2), d = 40 + Math.pow(rnd(), 1.6) * 520;
      const x = cx + Math.cos(a) * d * 1.5, y = (top + gy) / 2 + 10 + Math.sin(a) * d * 0.5;
      if (Math.abs(x - cx) < 120 && y < 1352) continue;
      const g = 1 - d / 560, c = ramp(DUSTW, 0.45 + g * 0.6);
      S(x, y, a + Math.PI / 2 + gauss() * 0.3, R(14, 50), R(3, 9), R(0.25, 0.6) * g + 0.1, jit(mix(sample(x, y), c, 0.6 + 0.3 * g), 0.03), 'pastel', { curv: R(-0.6, 0.6) });
    }
    // the column itself, burning through
    for (let i = 0; i < 2200; i++) {
      const y = R(top - 2, gy - 6), t = clamp((y - top) / (gy - top)), hw = 100 + 170 * Math.pow(t, 1.5), u = clamp(gauss() * 0.3, -0.85, 0.85);
      const c = ramp([[0, hex('#fffff8')], [0.35, hex('#fff3c4')], [0.6, hex('#ffd890')], [0.85, hex('#ffa6d0')]], Math.abs(u));
      S(cx + u * hw, y, Math.PI / 2 + u * 0.3 * t + gauss() * 0.03, R(20, 80), R(4, 14), R(0.5, 0.95), jit(c, 0.02), Math.abs(u) < 0.3 ? 'chalk' : 'pastel', { trem: 0.5 });
    }
    // white-hot crest where the surge rolls over the fire
    for (let i = 0; i < 900; i++) {
      const dx = gauss() * 300, y = gy - 18 + Math.abs(dx) * 0.035 + gauss() * 10, g = Math.exp(-Math.abs(dx) / 380);
      S(cx + dx, y, gauss() * 0.12 + (dx > 0 ? 0.05 : -0.05), R(30, 140) * (0.5 + g), R(3, 10), R(0.5, 1) * (0.4 + 0.6 * g), jit(ramp(DUSTW, 0.55 + 0.45 * g), 0.03), g > 0.5 ? 'chalk' : 'pastel', { curv: R(-0.3, 0.3) });
    }
  }
  function glitterPaths() {
    // two roads of light running across the ripples to whoever is looking
    const paths = [
      { x0: GP[0], x1: GP[0] - 260, w0: 80, w1: 1100, cols: ['#fff4d0', '#ffd87a', '#ffb050', '#ff9060', '#ffc8a0'], n: 4200, p: 0.85 },
    ];
    for (const P of paths) for (let i = 0; i < P.n; i++) {
      const y = HOR + 8 + Math.pow(rnd(), 0.8) * 660, t = clamp((y - HOR) / 660);
      const cxp = lerp(P.x0, P.x1, t), wp = lerp(P.w0, P.w1, Math.pow(t, 0.9)), x = cxp + gauss() * wp * 0.45;
      const g = Math.exp(-Math.pow((x - cxp) / wp, 2) * 1.6);
      if (rnd() > g * P.p) continue;
      const c = hex(P.cols[(rnd() * P.cols.length) | 0]);
      const [X, Z] = toWorld(x, y), ang = 0.35 * Math.cos(X / 1.8 + Z * 1.3) * (0.3 + t);
      if (rnd() < 0.3) { dot(x, y, R(1.5, 3) + 4 * t, R(0.6, 1), jit(c, 0.04), 'chalk'); continue; }
      S(x, y, ang + gauss() * 0.1, R(5, 16) + 55 * t * R(0.3, 1), R(1.5, 2.6) + 3.5 * t, R(0.5, 0.95) * (0.45 + 0.55 * g), jit(c, 0.03), rnd() < 0.5 ? 'chalk' : 'pencil', { trem: 0.8, curv: R(0.6, 1.6) * (rnd() < 0.5 ? 1 : -1) });
    }
  }
  function lightRays() {
    // joy leaking out of the moment: fans of warm hatching from the plume
    for (let i = 0; i < 700; i++) {
      const a = -Math.PI / 2 + gauss() * 0.9, d = R(150, 1100) * Math.pow(rnd(), 0.8) + 180;
      const x = GP[0] + Math.cos(a) * d, y = GP[1] - 40 + Math.sin(a) * d * 0.55;
      if (y > HOR + 60) continue;
      const c = mix(sample(x, y), rnd() < 0.5 ? hex('#ffe3a0') : hex('#ffb8d8'), R(0.4, 0.7));
      if (Math.abs(x - GP[0]) < 150 && y < 1360) continue;
      S(x, y, a + gauss() * 0.04, R(30, 110), R(2, 4.5), R(0.2, 0.42) * (1 - d / 1400), c, 'pastel', { trem: 0.7, curv: R(-0.2, 0.2) });
    }
  }
  function sparkles() {
    // sand and sugar: grains catching the fire
    for (let i = 0; i < 5200; i++) {
      const x = R(0, 3840), y = R(HOR - 700, 2160);
      let g;
      if (y > HOR) { const [X, Z] = toWorld(x, y); g = glowAt(X, Z); } else g = Math.exp(-Math.hypot(x - GP[0], (y - GP[1]) * 1.4) / 700);
      if (rnd() > g * 1.4 + 0.05) continue;
      if (Math.abs(x - GP[0]) < 170 && y < 1420) continue;
      const c = rnd() < 0.15 ? hex('#a8f4ff') : rnd() < 0.3 ? hex('#ffc0e0') : mix(hex('#fff6d0'), hex('#ffd070'), rnd());
      dot(x, y, R(1.6, 4.5) * (y > HOR ? 0.6 + (y - HOR) / 500 : 1), R(0.7, 1), c, 'chalk');
    }
  }
  function crumbs() {
    for (let i = 0; i < 600; i++) {
      const x = R(0, 3840), y = R(0, 2160), sx = x + gauss() * 30, sy = y + R(0, 60);
      if (Math.abs(x - GP[0]) < 200 && y < 1420) continue;
      dot(x, y, R(1.5, 3.5), R(0.4, 0.7), jit(mix(sample(sx, sy), hex('#ffffff'), 0.15), 0.06), 'pastel');
    }
  }
  function handSmudges() {
    // heel of the hand resting at the lower right, a thumb pass in the plume, edge drags
    for (let i = 0; i < 26; i++) smudge(3260 + R(-260, 420), 1980 + R(-120, 160), Math.PI * 0.85 + gauss() * 0.1, R(160, 360), R(60, 120), R(0.25, 0.45));
    for (let i = 0; i < 10; i++) smudge(GP[0] + gauss() * 120, GP[1] - R(20, 100), R(-0.4, 0.4), R(80, 200), R(30, 60), R(0.3, 0.5));
    for (let i = 0; i < 14; i++) smudge(R(0, 3840), R(2080, 2170), gauss() * 0.1, R(120, 300), R(30, 70), R(0.3, 0.5));
    for (let i = 0; i < 40; i++) smudge(R(1500, 3800), R(900, 1450), R(-0.3, 0.3), R(100, 240), R(40, 80), R(0.2, 0.4));
  }
  function emboss() {
    for (let i = 0; i < N; i++) {
      const v = 1 + (tooth[i] - 0.5) * 0.11 * (1 - fill[i] * 0.55);
      CR[i] *= v; CG[i] *= v; CB[i] *= v;
    }
  }

  function render(log) {
    log = log || (() => {});
    const T0 = Date.now(), t = (n) => log(n + ' ' + ((Date.now() - T0) / 1000).toFixed(1) + 's');
    makePaper(); t('paper');
    construction(false);
    toneGround(); t('tone');
    paintSky(); t('sky');
    paintClouds(); paintStarsMoons(); t('clouds');
    paintRidges(); t('ridges');
    paintGround(); paintRipples(); paintGrains(); t('ground');
    paintDune(); paintRocks(); t('rocks');
    buildPuffs();
    for (const P of puffs) if (P.Z >= SZ) drawPuff(P);
    t('dust back');
    const eng = paintEngines(true);
    paintPlume(eng);
    paintShip(); paintEngines(); t('ship');
    for (const P of puffs) if (P.Z < SZ) drawPuff(P);
    dustVeil();
    t('dust front');
    plumeGlow(); glitterPaths(); lightRays(); sparkles(); t('light');
    construction(true);
    handSmudges(); crumbs(); emboss(); t('finish');
  }
  function toRGBA(out) {
    out = out || new Uint8ClampedArray(N * 4);
    for (let i = 0, j = 0; i < N; i++, j += 4) { out[j] = CR[i] * 255; out[j + 1] = CG[i] * 255; out[j + 2] = CB[i] * 255; out[j + 3] = 255; }
    return out;
  }
  function toRGB() {
    const out = new Uint8Array(N * 3);
    for (let i = 0, j = 0; i < N; i++, j += 3) { out[j] = Math.max(0, Math.min(255, Math.round(CR[i] * 255))); out[j + 1] = Math.max(0, Math.min(255, Math.round(CG[i] * 255))); out[j + 2] = Math.max(0, Math.min(255, Math.round(CB[i] * 255))); }
    return out;
  }
  return { render, toRGBA, toRGB, W, H };
}
/*ART-END*/
</script>

  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  ctx.fillStyle = '#30243f'; ctx.fillRect(0, 0, cv.width, cv.height);
  setTimeout(() => {
    const art = createArt(cv.width, cv.height, 20261127);
    art.render(m => console.log(m));
    const img = ctx.createImageData(cv.width, cv.height);

</script>
