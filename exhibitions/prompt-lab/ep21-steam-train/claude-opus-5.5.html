<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>

<body>
<div id="load">raising steam&hellip;</div>

<div id="hint">drag to orbit &middot; scroll to zoom &middot; the camera returns when idle</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------------------------------------------------------------- constants
const V2 = THREE.Vector2, V3 = THREE.Vector3;
const R = 260;                       // track ring radius
const SPEED = 13;                    // m/s
const CIRC = 2 * Math.PI * R;
const LOOP = CIRC / SPEED;           // seconds per seamless loop
const RAIL_Y = 0.195;
const DR = R / 274;                  // driver radius: integer turns per loop -> seamless rods
const SR = 0.5;                      // small wheels (R/SR = 520)
const CR = R / 565;                  // coach wheels
const SUN = new V3(-1, 0.17, 0.42).normalize();
const FOG_COL = new THREE.Color(0.80, 0.70, 0.62);
const FOG_DENS = 0.0021;
const WIND = { x: -1.6, z: 1.1 };

// ---------------------------------------------------------------- utils
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash2(i,j){let h=(Math.imul(i,374761393)+Math.imul(j,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function vnoise(x,y){const i=Math.floor(x),j=Math.floor(y);let fx=x-i,fy=y-j;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);const a=hash2(i,j),b=hash2(i+1,j),c=hash2(i,j+1),d=hash2(i+1,j+1);return (a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy)*2-1;}
function fbm(x,y,o=5){let s=0,a=0.5,f=1;for(let k=0;k<o;k++){s+=a*vnoise(x*f,y*f);f*=2.03;a*=0.5;}return s;}
function pnoise(x,y,P){const i=Math.floor(x),j=Math.floor(y);let fx=x-i,fy=y-j;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);const m=n=>((n%P)+P)%P;const a=hash2(m(i),m(j)),b=hash2(m(i+1),m(j)),c=hash2(m(i),m(j+1)),d=hash2(m(i+1),m(j+1));return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy;}
function pfbm(u,v,P,o){let s=0,a=.5,f=1,n=0;for(let k=0;k<o;k++){s+=a*pnoise(u*f,v*f,P*f);n+=a;f*=2;a*=.5;}return s/n;}
const smooth=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=mulberry(1234);

// ---------------------------------------------------------------- terrain function
const riverZ = x => 25 * Math.sin(x * 0.006);
function ground(x, z){
  const r = Math.hypot(x, z), dr = Math.abs(r - R);
  const zr = z - riverZ(x), az = Math.abs(zr);
  const valley = 62 * Math.exp(-(zr*zr)/(95*95));
  const vf = smooth(20, 120, az);
  const hills = (fbm(x*0.0035+3.1, z*0.0035-7.2, 5)*55 + fbm(x*0.02, z*0.02, 3)*6) * smooth(10, 70, dr);
  let m = 0;
  if (r > 380){ const rid = 1 - Math.abs(fbm(x*0.0022+11, z*0.0022+5, 5)); m = smooth(380, 1100, r) * (rid*rid*320 + 40); }
  return -1.5 + hills*vf + m*smooth(40, 220, az) - valley;
}
const ringPt = (th, y=0) => new V3(R*Math.cos(th), y, R*Math.sin(th));
const yawAt = th => Math.atan2(-Math.cos(th), -Math.sin(th));

// ---------------------------------------------------------------- golden-hour fog + valley mist (patched into every material)
const SUNV = `vec3(${SUN.x.toFixed(5)},${SUN.y.toFixed(5)},${SUN.z.toFixed(5)})`;
const FOGFN = `
vec3 applyFog(vec3 col, vec3 rel, vec3 fcol, float dens){
  float d = length(rel); vec3 dir = rel / max(d, 1e-4);
  float wy = cameraPosition.y + rel.y;
  float f = 1.0 - exp(-dens*dens*d*d);
  float m = (1.0 - exp(-d*0.016)) * smoothstep(-18.0, -62.0, wy) * 0.85;
  f = 1.0 - (1.0 - f) * (1.0 - m);
  float sf = pow(max(dot(dir, ${SUNV}), 0.0), 5.0);
  vec3 fc = mix(fcol, vec3(1.35, 0.9, 0.58), sf);
  return mix(col, fc, f);
}`;
THREE.ShaderChunk.fog_pars_vertex = `#ifdef USE_FOG
varying float vFogDepth; varying vec3 vFogView;
#endif`;
THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG
vFogDepth = -mvPosition.z; vFogView = mvPosition.xyz;
#endif`;
THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG
uniform vec3 fogColor; varying float vFogDepth; varying vec3 vFogView;
#ifdef FOG_EXP2
uniform float fogDensity;
#else
uniform float fogNear; uniform float fogFar;
#endif
${FOGFN}
#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
#ifdef FOG_EXP2
gl_FragColor.rgb = applyFog(gl_FragColor.rgb, (vec4(vFogView,0.0)*viewMatrix).xyz, fogColor, fogDensity);
#endif
#endif`;

// ---------------------------------------------------------------- renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(FOG_COL, FOG_DENS);
const camera = new THREE.PerspectiveCamera(36, innerWidth/innerHeight, 0.3, 9000);

// ---------------------------------------------------------------- sky
const skyMat = new THREE.ShaderMaterial({
  uniforms: { sunDir: { value: SUN } },
  side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
  uniform vec3 sunDir; varying vec3 vDir;
  float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
  float fb(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*n2(p);p*=2.03;a*=.5;}return s;}
  void main(){
    vec3 d = normalize(vDir); float h = d.y;
    float s = max(dot(d, sunDir), 0.0);
    vec3 zen = vec3(0.16,0.25,0.42), hor = vec3(0.86,0.72,0.60);
    vec3 col = mix(hor, zen, pow(clamp(h,0.,1.), 0.55));
    col = mix(col, vec3(0.80,0.70,0.62), smoothstep(0.02,-0.08,h));
    col += vec3(1.0,0.55,0.25)*pow(s,6.)*0.55*(1.-clamp(h,0.,1.));
    vec2 cp = d.xz/(max(h,0.0)+0.12)*1.4 + vec2(3.,1.);
    float c = smoothstep(0.48,0.85, fb(cp*vec2(0.6,2.4))) * smoothstep(0.0,0.22,h);
    vec3 cc = mix(vec3(0.95,0.86,0.82), vec3(1.6,1.0,0.6), pow(s,4.));
    col = mix(col, cc, c*0.55);
    col += vec3(1.0,0.78,0.5)*pow(s,48.)*1.4;
    col += vec3(1.0,0.9,0.7)*smoothstep(0.9993,0.9997,s)*25.;
    gl_FragColor = vec4(col,1.0);
  }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(4000, 48, 24), skyMat);
sky.frustumCulled = false; sky.renderOrder = -10;
scene.add(sky);

const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), skyMat));
scene.environment = pmrem.fromScene(envScene, 0.02, 0.1, 200).texture;
scene.environmentIntensity = 0.8;

// ---------------------------------------------------------------- lights
const sun = new THREE.DirectionalLight(new THREE.Color(1.0, 0.78, 0.55), 5.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -75, right: 75, top: 75, bottom: -75, near: 1, far: 900 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.06;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0x9fb3d6, 0xd9cfc4, 1.2));

// ================================================================ procedural textures
function canv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function tex(c,srgb=true){const t=new THREE.CanvasTexture(c);if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t;}

function snowTextures(){
  const S=256,c=canv(S,S),g=c.getContext('2d'),im=g.createImageData(S,S);
  const b=canv(S,S),bg=b.getContext('2d'),bi=bg.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const n=pfbm(x/S*8,y/S*8,8,5), i=(y*S+x)*4;
    const sp=hash2(x*7+1,y*13+5)>0.992?18:0;
    const v=232+n*22+sp;
    im.data[i]=Math.min(255,v-5);im.data[i+1]=Math.min(255,v-1);im.data[i+2]=255;im.data[i+3]=255;
    const bv=n*255;bi.data[i]=bi.data[i+1]=bi.data[i+2]=bv;bi.data[i+3]=255;
  }
  g.putImageData(im,0,0);bg.putImageData(bi,0,0);
  return [tex(c),tex(b,false)];
}

function stoneTextures(){
  const S=512,c=canv(S,S),g=c.getContext('2d'),b=canv(S,S),bg=b.getContext('2d');
  const r=mulberry(77);
  g.fillStyle='#9a948a';g.fillRect(0,0,S,S);
  bg.fillStyle='#1a1a1a';bg.fillRect(0,0,S,S);
  const rows=12,rh=S/rows;
  for(let row=0;row<rows;row++){
    let x=-r()*60;
    while(x<S){
      const w=rh*(1.3+r()*1.7), v=r();
      const cr=112+v*48+r()*10, cg=106+v*42, cb=96+v*36;
      for(const ox of [-S,0,S]){
        g.fillStyle=`rgb(${cr|0},${cg|0},${cb|0})`;
        g.fillRect(x+ox+2,row*rh+2,w-4,rh-4);
        g.fillStyle=`rgba(255,240,220,${0.06+r()*0.05})`;
        g.fillRect(x+ox+3,row*rh+3,w-6,3);
        g.fillStyle='rgba(0,0,0,0.12)';
        g.fillRect(x+ox+3,row*rh+rh-6,w-6,3);
        const gv=170+r()*70|0;bg.fillStyle=`rgb(${gv},${gv},${gv})`;
        bg.fillRect(x+ox+2,row*rh+2,w-4,rh-4);
      }
      x+=w;
    }
  }
  for(let i=0;i<26000;i++){
    const x=r()*S,y=r()*S,a=r()*0.18;
    g.fillStyle=r()<0.5?`rgba(0,0,0,${a})`:`rgba(255,250,240,${a*0.7})`;g.fillRect(x,y,1.5,1.5);
    bg.fillStyle=`rgba(0,0,0,${a})`;bg.fillRect(x,y,1.5,1.5);
  }
  // lichen / weathering streaks
  for(let i=0;i<60;i++){const x=r()*S,y=r()*S;g.fillStyle=`rgba(${60+r()*30},${70+r()*30},${50},${0.05+r()*0.06})`;g.fillRect(x,y,2+r()*4,10+r()*50);}
  return [tex(c),tex(b,false)];
}

function ballastTexture(){
  const S=128,c=canv(S,S),g=c.getContext('2d'),im=g.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const i=(y*S+x)*4, n=pfbm(x/S*4,y/S*4,4,4), cell=hash2(x>>2,y>>2);
    let v=70+cell*60+n*20, snow=pfbm(x/S*2+7,y/S*2,2,4);
    if(snow>0.55){v=225+n*25;im.data[i]=v-4;im.data[i+1]=v-1;im.data[i+2]=Math.min(255,v+4);}
    else{im.data[i]=v+6;im.data[i+1]=v;im.data[i+2]=v-8;}
    im.data[i+3]=255;
  }
  g.putImageData(im,0,0);return tex(c);
}

function puffAtlas(){
  const S=256,c=canv(S,S),g=c.getContext('2d'),r=mulberry(5);
  for(let k=0;k<4;k++){
    const cx=(k%2)*128+64, cy=Math.floor(k/2)*128+64;
    for(let i=0;i<20;i++){
      const a=r()*Math.PI*2,d=r()*28,x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d,rad=16+r()*22;
      const gr=g.createRadialGradient(x,y,0,x,y,rad);
      gr.addColorStop(0,'rgba(255,255,255,0.42)');gr.addColorStop(0.6,'rgba(255,255,255,0.18)');gr.addColorStop(1,'rgba(255,255,255,0)');
      g.fillStyle=gr;g.fillRect(x-rad,y-rad,rad*2,rad*2);
    }
  }
  const im=g.getImageData(0,0,S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const i=(y*S+x)*4,lx=(x%128)/128-0.5,ly=(y%128)/128-0.5,rr=Math.hypot(lx,ly);
    const n=pfbm(x/S*16,y/S*16,16,4);
    const a=im.data[i+3]/255*smooth(0.5,0.32,rr)*(0.55+0.7*n);
    const sh=(0.55+0.45*n)*255;
    im.data[i]=im.data[i+1]=im.data[i+2]=sh;im.data[i+3]=Math.min(255,a*255*1.25);
  }
  g.putImageData(im,0,0);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.NoColorSpace;return t;
}

function coachTextures(){
  const W=1024,H=164,c=canv(W,H),g=c.getContext('2d'),e=canv(W,H),ge=e.getContext('2d'),r=mulberry(21);
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#74401c');gr.addColorStop(1,'#4b240d');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  ge.fillStyle='#000';ge.fillRect(0,0,W,H);
  for(let x=0;x<W;x+=11){g.fillStyle=`rgba(20,8,0,${0.18+r()*0.15})`;g.fillRect(x,96,1.2,58);}
  for(let i=0;i<1400;i++){g.fillStyle=`rgba(${r()<.5?20:150},${r()<.5?8:80},0,${0.04+r()*0.06})`;g.fillRect(r()*W,r()*H,8+r()*40,1);}
  const gold='#d6ad62';
  const rr=(cx,x,y,w,h,rad)=>{cx.beginPath();cx.moveTo(x+rad,y);cx.arcTo(x+w,y,x+w,y+h,rad);cx.arcTo(x+w,y+h,x,y+h,rad);cx.arcTo(x,y+h,x,y,rad);cx.arcTo(x,y,x+w,y,rad);cx.closePath();};
  const glass=(x,y,w,h,people)=>{
    for(const cx of [g,ge]){
      const wg=cx.createLinearGradient(0,y,0,y+h);wg.addColorStop(0,'#ffe2a8');wg.addColorStop(1,'#f09a45');
      cx.fillStyle=wg;rr(cx,x,y,w,h,7);cx.fill();
      if(people){
        const n=1+Math.floor(r()*2.4);
        for(let k=0;k<n;k++){
          const px=x+10+r()*(w-20),py=y+h-16;
          cx.fillStyle=cx===g?'rgba(45,22,8,0.85)':'rgba(30,12,2,0.9)';
          cx.beginPath();cx.ellipse(px,py,8,10,0,0,Math.PI*2);cx.fill();
          cx.beginPath();cx.ellipse(px,y+h+4,15,12,0,Math.PI,Math.PI*2);cx.fill();
        }
        cx.fillStyle='rgba(80,30,10,0.35)';cx.fillRect(x,y,w,6); // curtain pelmet
      }
    }
    g.strokeStyle=gold;g.lineWidth=2.5;rr(g,x-3,y-3,w+6,h+6,9);g.stroke();
  };
  // doors
  for(const dx of [14,W-60]){
    g.strokeStyle=gold;g.lineWidth=2;g.strokeRect(dx,14,46,140);
    glass(dx+9,26,28,48,false);
    g.strokeRect(dx+6,96,34,50);
    g.fillStyle=gold;g.font='bold 22px Georgia';g.textAlign='center';g.fillText('1',dx+23,130);
    g.fillStyle='#c9c9c9';g.fillRect(dx+38,84,4,12);
  }
  const n=8,x0=88,span=(W-176)/n;
  for(let k=0;k<n;k++){const x=x0+k*span+12;glass(x,26,span-24,58,true);}
  g.strokeStyle=gold;g.lineWidth=1.5;g.strokeRect(76,16,W-152,76);g.strokeRect(76,98,W-152,52);
  for(let k=1;k<n;k++){const x=x0+k*span;g.beginPath();g.moveTo(x,100);g.lineTo(x,148);g.stroke();}
  g.font='italic bold 17px Georgia';g.textAlign='center';g.fillStyle='#e2bb72';
  g.fillText('N O R T H E R N   ·   W I N T E R   ·   E X P R E S S',W/2,129);
  g.fillStyle='#160a03';g.fillRect(0,H-8,W,8);g.fillRect(0,0,W,4);
  return [tex(c),tex(e)];
}

const [snowMap, snowBump] = snowTextures();
const [stoneMap, stoneBump] = stoneTextures();
const ballastMap = ballastTexture();
const puffTex = puffAtlas();
const snowMat = new THREE.MeshStandardMaterial({ color: 0xf2f6ff, roughness: 0.8 });

// ================================================================ terrain
{
  const TS=3400, TN=400;
  const tg=new THREE.PlaneGeometry(TS,TS,TN,TN); tg.rotateX(-Math.PI/2);
  const p=tg.attributes.position;
  for(let i=0;i<p.count;i++) p.setY(i, ground(p.getX(i), p.getZ(i)));
  tg.computeVertexNormals();
  const nrm=tg.attributes.normal, col=new Float32Array(p.count*3);
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), z=p.getZ(i), y=p.getY(i);
    const rock=(1-smooth(0.6,0.86, nrm.getY(i)+fbm(x*0.05,z*0.05,2)*0.1))*0.9;
    const n=fbm(x*0.01,z*0.01,3)*0.04;
    let sr=0.93+n, sg=0.95+n, sb=1.0;
    const dr=Math.abs(Math.hypot(x,z)-R);
    if(dr<6 && y>-4){ const t=(1-dr/6)*0.25; sr-=t; sg-=t; sb-=t*0.9; }
    col[i*3]=lerp(sr,0.22,rock); col[i*3+1]=lerp(sg,0.2,rock); col[i*3+2]=lerp(sb,0.19,rock);
  }
  tg.setAttribute('color', new THREE.BufferAttribute(col,3));
  snowMap.repeat.set(300,300); snowBump.repeat.set(300,300);
  const terrain=new THREE.Mesh(tg, new THREE.MeshStandardMaterial({ vertexColors:true, map:snowMap, bumpMap:snowBump, bumpScale:1.0, roughness:0.86 }));
  terrain.receiveShadow=true;
  scene.add(terrain);

  // frozen river
  const rg=new THREE.PlaneGeometry(3200,26,400,1); rg.rotateX(-Math.PI/2);
  const rp=rg.attributes.position;
  for(let i=0;i<rp.count;i++){ rp.setZ(i, rp.getZ(i)+riverZ(rp.getX(i))); rp.setY(i,-62.9); }
  rg.computeVertexNormals();
  const ice=new THREE.Mesh(rg, new THREE.MeshStandardMaterial({ color:0xb9cfdc, roughness:0.18, metalness:0.0 }));
  ice.receiveShadow=true; scene.add(ice);
}

// ================================================================ track
function boxUV(g, sc){
  const p=g.attributes.position, n=g.attributes.normal, uv=new Float32Array(p.count*2);
  for(let i=0;i<p.count;i++){

class Puffs{
  constructor(cap,order){
    this.cap=cap; this.list=[];
    const q=new THREE.PlaneGeometry(1,1), g=new THREE.InstancedBufferGeometry();
    g.index=q.index; g.setAttribute('position',q.attributes.position);
    this.off=new THREE.InstancedBufferAttribute(new Float32Array(cap*3),3).setUsage(THREE.DynamicDrawUsage);
    this.dat=new THREE.InstancedBufferAttribute(new Float32Array(cap*4),4).setUsage(THREE.DynamicDrawUsage);
    this.vr=new THREE.InstancedBufferAttribute(new Float32Array(cap),1).setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('offset',this.off); g.setAttribute('data',this.dat); g.setAttribute('variant',this.vr);
    g.instanceCount=0; this.geo=g;
    this.mesh=new THREE.Mesh(g,puffMat); this.mesh.frustumCulled=false; this.mesh.renderOrder=order;
    scene.add(this.mesh);
  }
  add(p){ if(this.list.length<this.cap) this.list.push(p); }
  update(dt){
    const L=this.list;
    for(let i=L.length-1;i>=0;i--){
      const p=L[i]; if(p.fixed) continue;
      p.age+=dt; if(p.age>=p.life){ L[i]=L[L.length-1]; L.pop(); continue; }
      const k=1-Math.exp(-p.drag*dt);
      p.vx+=(WIND.x-p.vx)*k; p.vy+=(p.buoy-p.vy)*k; p.vz+=(WIND.z-p.vz)*k;
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt; p.rot+=p.rv*dt;
    }
  }
  upload(cam){
    const L=this.list, cx=cam.position.x, cy=cam.position.y, cz=cam.position.z, fw=cam.getWorldDirection(_fw);
    for(const p of L) p.d=(p.x-cx)*fw.x+(p.y-cy)*fw.y+(p.z-cz)*fw.z;
    L.sort((a,b)=>b.d-a.d);
    const o=this.off.array, d=this.dat.array, v=this.vr.array; let n=0;
    for(const p of L){
      let size,a,sh;
      if(p.fixed){ size=p.s1; a=p.a; sh=p.sh1; }
      else{
        const t=p.age/p.life;
        size=p.s0+(p.s1-p.s0)*(1-Math.exp(-p.age/p.grow))+p.age*0.25;
        a=p.a*smooth(0,p.fin,t)*(1-smooth(p.fout,1,t));
        sh=p.sh0+(p.sh1-p.sh0)*smooth(0,0.4,t);
      }
      if(p.d<-size) continue;
      o[n*3]=p.x; o[n*3+1]=p.y; o[n*3+2]=p.z;
      d[n*4]=size; d[n*4+1]=a; d[n*4+2]=p.rot; d[n*4+3]=sh; v[n]=p.v; n++;
    }
    this.geo.instanceCount=n;
    this.off.needsUpdate=this.dat.needsUpdate=this.vr.needsUpdate=true;
  }
}

function autoCam(s,outPos,outTgt){
  const th=s/R;
  let d=((th-VC)%Math.PI+Math.PI)%Math.PI; if(d>Math.PI/2) d-=Math.PI;
  const c2=Math.cos(d)**2, v=c2**5, w=Math.exp(-((d/0.55)**2));
  const az=-Math.PI/2+Math.PI*w+0.35*Math.sin(4*th+0.7)*(1-v);
  const sA=Math.sin(az), cA=Math.cos(az);
  const dist=30+78*v+5*Math.sin(3*th);
  let h=4.5+3.5*Math.sin(5*th+1.0); h+=v*(-36*sA*sA+6*cA*cA);
  const fth=(s-FOCUS_BACK)/R;
  const P=ringPt(fth), Tx=-Math.sin(fth), Tz=Math.cos(fth), Nx=Math.cos(fth), Nz=Math.sin(fth);
  outPos.set(P.x+Tx*cA*dist+Nx*sA*dist, h, P.z+Tz*cA*dist+Nz*sA*dist);
  const gy=ground(outPos.x,outPos.z)+3; if(outPos.y<gy) outPos.y=gy;
  outTgt.copy(ringPt((s-FOCUS_BACK+12*cA)/R)); outTgt.y=2.5-7*v*sA*sA;
}

const anchor=new V3(), prevAnchor=new V3(), dA=new V3();
let wallClock=0;
controls.addEventListener('start',()=>{
  if(mode!=='user'){ controls.target.copy(curTgt); mode='user'; }
  dragging=true; lastInput=wallClock;
});
controls.addEventListener('end',()=>{ dragging=false; lastInput=wallClock; });
const IDLE=4.5, BLEND=3.5;

// ================================================================ resize / letterbox
const barT=document.getElementById('barT'), barB=document.getElementById('barB');
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h); composer.setSize(w,h); composer.setPixelRatio(renderer.getPixelRatio());
  camera.aspect=w/h; camera.updateProjectionMatrix();
  const bar=Math.min(h*0.12,Math.max(0,(h-w/2.2)/2));
  barT.style.height=barB.style.height=bar+'px';
  snowMatP.uniforms.uScale.value=h*renderer.getPixelRatio()*0.5*camera.projectionMatrix.elements[5];
}
addEventListener('resize',resize); resize();

// ================================================================ simulation & loop
let elapsed=0;
function trainS(){ return SPEED*(((elapsed%LOOP)+LOOP)%LOOP); }
function simulate(dt){
  const s=trainS();
  placeTrain(s); emit(dt,s); smoke.update(dt);
  return s;
}
// start just before the first viaduct and pre-roll so a smoke trail already hangs in the air
elapsed=((((VC-0.85)*R+FOCUS_BACK)%CIRC+CIRC)%CIRC)/SPEED - 14;
for(let i=0;i<14*30;i++){ elapsed+=1/30; simulate(1/30); }
{ const s=trainS(); autoCam(s,autoPos,autoTgt); camera.position.copy(autoPos); curTgt.copy(autoTgt); camera.lookAt(curTgt); controls.target.copy(curTgt); anchorOf(s,prevAnchor); }

const ease=t=>t*t*(3-2*t);
let last=performance.now(), first=true;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  wallClock+=dt; elapsed+=dt;
  const s=simulate(dt);
  autoCam(s,autoPos,autoTgt);
  anchorOf(s,anchor); dA.subVectors(anchor,prevAnchor); prevAnchor.copy(anchor);

  if(mode==='auto'){
    camera.position.copy(autoPos); curTgt.copy(autoTgt); camera.lookAt(curTgt);
  }else if(mode==='user'){
    camera.position.add(dA); controls.target.add(dA); controls.update(); curTgt.copy(controls.target);
    if(!dragging && wallClock-lastInput>IDLE){ mode='return'; blendStart=wallClock; userPos.copy(camera.position); userTgt.copy(controls.target); }
  }else{
    userPos.add(dA); userTgt.add(dA);
    const k=ease(Math.min(1,(wallClock-blendStart)/BLEND));
    camera.position.lerpVectors(userPos,autoPos,k); curTgt.lerpVectors(userTgt,autoTgt,k); camera.lookAt(curTgt);
    if(k>=1) mode='auto';
  }
  const gy=ground(camera.position.x,camera.position.z)+1.5; if(camera.position.y<gy) camera.position.y=gy;

  // mist drift
  for(const p of mist.list){ p.x=p.bx+Math.sin(wallClock*0.03+p.ph)*14; p.z=p.bz+Math.cos(wallClock*0.021+p.ph)*8; p.rot=p.ph+wallClock*0.01; }
  mist.upload(camera); smoke.upload(camera);

  sky.position.copy(camera.position);
  sun.target.position.copy(anchor); sun.position.copy(anchor).addScaledVector(SUN,400);
  snowMatP.uniforms.uTime.value=wallClock;
  grade.uniforms.uTime.value=wallClock;
  composer.render();

  if(first){ first=false;
    const l=document.getElementById('load'); l.style.opacity=0; setTimeout(()=>l.remove(),2000);
    document.getElementById('title').style.opacity=1; document.getElementById('hint').style.opacity=1;
    setTimeout(()=>document.getElementById('title').style.opacity=0,9000);
  }
}
requestAnimationFrame(frame);
</script>
</body>
