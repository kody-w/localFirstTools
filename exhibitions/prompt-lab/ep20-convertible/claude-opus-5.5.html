<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ======================= Renderer / scene / lights =======================
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const HAZE = new THREE.Color(0xd8d2bf);
scene.background = HAZE.clone();
scene.fog = new THREE.Fog(HAZE, 80, 560);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2500);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const SUN_DIR = new THREE.Vector3(0.62, 0.48, -0.62).normalize();
const sun = new THREE.DirectionalLight(0xffd9a8, 3.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
{ const c = sun.shadow.camera; c.left = -55; c.right = 55; c.top = 55; c.bottom = -55; c.near = 1; c.far = 320; }
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xc6dcff, 0x6b6a3c, 1.15));

// Sky dome with gradient, sun glow and procedural clouds
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { sunDir: { value: SUN_DIR }, top: { value: new THREE.Color(0x3d78c8) }, horizon: { value: HAZE.clone() } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform vec3 sunDir, top, horizon; varying vec3 vDir;
    float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float n2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y); }
    float fbm(vec2 p){ float v=0.0, a=0.5; for(int k=0;k<5;k++){ v+=a*n2(p); p*=2.03; a*=0.5; } return v; }
    void main(){
      vec3 d = normalize(vDir);
      float h = max(d.y, 0.0);
      vec3 col = mix(horizon, top, pow(h, 0.5));
      float s = max(dot(d, sunDir), 0.0);
      col += vec3(1.0,0.8,0.55) * pow(s, 6.0) * 0.28;
      if (d.y > 0.0) {
        vec2 uv = d.xz / (d.y + 0.12) * 1.4;
        float c = smoothstep(0.5, 0.82, fbm(uv + vec2(3.0, 1.0)));
        c *= smoothstep(0.0, 0.22, d.y);
        vec3 cc = vec3(0.96,0.93,0.88) + vec3(1.0,0.82,0.55) * pow(s, 4.0) * 0.5;
        col = mix(col, cc, c * 0.78);
      }
      col += vec3(1.0,0.93,0.8) * smoothstep(0.9993, 0.9998, s) * 4.0;
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1800, 32, 16), skyMat);
sky.renderOrder = -1;
scene.add(sky);

// ======================= Utilities / noise =======================
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function hash2(x, y) { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  const ab = a + (b - a) * u, cd = c + (d - c) * u;
  return ab + (cd - ab) * v;
}
function fbm(x, y) { return vnoise(x, y) * 0.55 + vnoise(x * 2.07 + 5.2, y * 2.07 + 1.3) * 0.3 + vnoise(x * 4.3 + 9.1, y * 4.3 + 7.7) * 0.15; }

// ======================= Road path (endless, procedural) =======================
const DS = 2, CH_N = 40, CH_LEN = DS * CH_N, ROAD_HW = 4.2;
const PX = [0], PZ = [0], PA = [0], PH = [];
function curv(s) { const r = smooth(60, 320, s); return r * (0.0040 * Math.sin(s * 0.0037 + 0.4) + 0.0020 * Math.sin(s * 0.0109 + 2.1) + 0.0008 * Math.sin(s * 0.027)); }
function hgt(s) { const r = smooth(30, 260, s); return r * (8 * Math.sin(s * 0.0047) + 3.2 * Math.sin(s * 0.0131 + 1.0) + 1.1 * Math.sin(s * 0.033 + 0.3)); }
PH[0] = hgt(0);
function ensurePath(n) {
  while (PX.length <= n) {
    const i = PX.length, a = PA[i - 1] + curv((i - 0.5) * DS) * DS;
    PA.push(a); PX.push(PX[i - 1] + Math.sin(a) * DS); PZ.push(PZ[i - 1] + Math.cos(a) * DS); PH.push(hgt(i * DS));
  }
}
function pathAt(s) {
  const f = Math.max(0, s / DS), i = Math.floor(f), t = f - i; ensurePath(i + 2);
  return { x: PX[i] + (PX[i + 1] - PX[i]) * t, z: PZ[i] + (PZ[i + 1] - PZ[i]) * t, h: PH[i] + (PH[i + 1] - PH[i]) * t, a: PA[i] + (PA[i + 1] - PA[i]) * t };
}
// d > 0 is the left side of the road (relative to driving direction +s)
function worldAt(s, d) { const p = pathAt(s); return { x: p.x + Math.cos(p.a) * d, z: p.z - Math.sin(p.a) * d, h: p.h, a: p.a }; }

function groundOff(d, x, z) {
  const a = Math.abs(d);
  if (a < 4.6) return -0.06;
  let y = -0.06 - 0.6 * smooth(4.8, 7.2, a) * (1 - smooth(8.2, 10.8, a)); // drainage ditch
  const hill = smooth(11, 55, a);
  if (hill > 0) y += hill * ((fbm(x * 0.007, z * 0.007) - 0.45) * 24 + (vnoise(x * 0.045, z * 0.045) - 0.5) * 2.2);
  y += (vnoise(x * 0.35, z * 0.35) - 0.5) * 0.18 * smooth(5, 8, a);
  return y;
}
function terrainY(s, d, pads) {
  const w = worldAt(s, d); let y = w.h + groundOff(d, w.x, w.z);
  if (pads) for (const p of pads) { const r = Math.hypot(w.x - p.x, w.z - p.z); const k = 1 - smooth(p.r0, p.r1, r); if (k > 0) y = lerp(y, p.y, k); }
  return y;
}
function segProj(j, x, z) {
  const ax = PX[j], az = PZ[j], bx = PX[j + 1] - ax, bz = PZ[j + 1] - az;
  const t = clamp(((x - ax) * bx + (z - az) * bz) / (bx * bx + bz * bz), 0, 1);
  const px = ax + bx * t, pz = az + bz * t;
  return { t, px, pz, bx, bz, d2: (x - px) ** 2 + (z - pz) ** 2 };
}
// Nearest point on the road centreline (local search from a hint index)
function project(x, z, hint) {
  let i = Math.max(0, hint | 0); ensurePath(i + 3);
  const dist = k => (x - PX[k]) ** 2 + (z - PZ[k]) ** 2;
  let cur = dist(i);
  for (let g = 0; g < 600; g++) { ensurePath(i + 3); const f = dist(i + 1); if (f < cur) { i++; cur = f; } else break; }
  for (let g = 0; g < 600 && i > 0; g++) { const b = dist(i - 1); if (b < cur) { i--; cur = b; } else break; }
  let best = segProj(i, x, z), bj = i;
  if (i > 0) { const p = segProj(i - 1, x, z); if (p.d2 < best.d2) { best = p; bj = i - 1; } }
  const len = Math.hypot(best.bx, best.bz);
  const d = ((x - best.px) * best.bz - (z - best.pz) * best.bx) / len;
  return { i: bj, s: (bj + best.t) * DS, d, h: PH[bj] + (PH[bj + 1] - PH[bj]) * best.t, a: Math.atan2(best.bx, best.bz) };
}

// ======================= Procedural textures =======================
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();
function makeRoadTexture() {
  const W = 512, H = 2048, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), R = mulberry32(42), ppm = W / (ROAD_HW * 2);
  g.fillStyle = '#4b4b4d'; g.fillRect(0, 0, W, H);
  const wrap = fn => { for (const o of [-H, 0, H]) { g.save(); g.translate(0, o); fn(); g.restore(); } };
  // large soft blotches (worn / oily / faded areas)
  const blotches = [];
  for (let k = 0; k < 70; k++) blotches.push([R() * W, R() * H, 30 + R() * 140, R() < 0.5 ? '0,0,0' : '255,255,255', 0.03 + R() * 0.07]);
  wrap(() => { for (const [x, y, r, col, a] of blotches) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(1, `rgba(${col},0)`); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); } });
  // darker wheel paths
  for (const cx of [0.27, 0.73]) { const gr = g.createLinearGradient(cx * W - 60, 0, cx * W + 60, 0); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.5, 'rgba(0,0,0,0.09)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(cx * W - 60, 0, 120, H); }
  // aggregate grain
  const img = g.getImageData(0, 0, W, H), dt = img.data;
  for (let k = 0; k < dt.length; k += 4) { const n = (R() - 0.5) * 38 + (R() < 0.02 ? 30 : 0); dt[k] += n; dt[k + 1] += n; dt[k + 2] += n * 1.04; }
  g.putImageData(img, 0, 0);
  // repair patches
  const patches = [];
  for (let k = 0; k < 6; k++) patches.push([R() * W * 0.8, R() * H, 40 + R() * 120, 60 + R() * 200]);
  wrap(() => { for (const [x, y, w, h] of patches) { g.fillStyle = 'rgba(34,34,36,0.55)'; g.beginPath(); g.moveTo(x, y); g.lineTo(x + w, y + R() * 8); g.lineTo(x + w - R() * 8, y + h); g.lineTo(x + R() * 8, y + h); g.closePath(); g.fill(); g.strokeStyle = 'rgba(20,20,20,0.5)'; g.lineWidth = 2; g.stroke(); } });
  // painted lines (worn)
  function paint(cx, w, color) {
    g.fillStyle = color; g.fillRect(cx - w / 2, 0, w, H);
    for (let k = 0; k < 2200; k++) { g.fillStyle = `rgba(72,72,74,${R() * 0.7})`; g.fillRect(cx - w / 2 + R() * w - 1, R() * H, 1 + R() * 2.5, 1 + R() * 4); }
  }
  paint(W / 2 - ppm * 0.11, ppm * 0.1, '#e0b22a');
  paint(W / 2 + ppm * 0.11, ppm * 0.1, '#e0b22a');
  paint(W / 2 - ppm * 3.6, ppm * 0.12, '#e8e6df');
  paint(W / 2 + ppm * 3.6, ppm * 0.12, '#e8e6df');
  // crumbling edges
  for (let k = 0; k < 900; k++) { const side = R() < 0.5 ? 0 : W; const w = R() * 14; g.fillStyle = `rgba(30,30,30,${0.2 + R() * 0.4})`; g.fillRect(side === 0 ? 0 : W - w, R() * H, w, 2 + R() * 6); }
  // cracks
  const cracks = [];
  function crack(seed, x, y, len, ang, w, tar) { cracks.push({ seed, x, y, len, ang, w, tar }); }
  for (let k = 0; k < 9; k++) crack(R() * 1e6, R() * 40, R() * H, 30 + R() * 50, (R() - 0.5) * 0.6, 1.1 + R() * 1.1, R() < 0.4); // transverse
  for (let k = 0; k < 6; k++) crack(R() * 1e6, R() * W, R() * H, 50 + R() * 100, Math.PI / 2 + (R() - 0.5) * 0.3, 1.0 + R() * 1.0, R() < 0.5); // longitudinal
  for (let k = 0; k < 3; k++) { const cx = R() * W, cy = R() * H; for (let j = 0; j < 18; j++) crack(R() * 1e6, cx + (R() - 0.5) * 90, cy + (R() - 0.5) * 140, 3 + R() * 5, R() * Math.PI * 2, 0.9, false); } // alligator
  function drawCrack(cr) {
    const r = mulberry32(cr.seed | 0);
    const walk = (x, y, len, ang, w, depth) => {
      g.lineWidth = w; g.beginPath(); g.moveTo(x, y);
      for (let k = 0; k < len; k++) {
        ang += (r() - 0.5) * 0.9; x += Math.cos(ang) * 6; y += Math.sin(ang) * 6; g.lineTo(x, y);
        if (depth < 2 && r() < 0.07) { g.stroke(); walk(x, y, (len * 0.35) | 0, ang + (r() < 0.5 ? 1 : -1) * (0.7 + r() * 0.7), w * 0.65, depth + 1); g.lineWidth = w; g.beginPath(); g.moveTo(x, y); }
      }
      g.stroke();
    };
    g.lineCap = 'round'; g.lineJoin = 'round';
    if (cr.tar) { g.strokeStyle = 'rgba(24,24,26,0.35)'; walk(cr.x, cr.y, cr.len, cr.ang, cr.w * 3.2, 2); }
    g.strokeStyle = 'rgba(20,20,20,0.7)'; walk(cr.x, cr.y, cr.len, cr.ang, cr.w, 0);
  }
  wrap(() => cracks.forEach(drawCrack));
  const t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.ClampToEdgeWrapping; t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = MAX_ANISO;
  return t;
}
const ROAD_TEX_LEN = 32;
const roadTex = makeRoadTexture();

function makeSignTexture(lines) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#0c6a3b'; g.fillRect(0, 0, 512, 256);
  g.strokeStyle = '#f3f3ee'; g.lineWidth = 8;
  g.beginPath(); g.roundRect(12, 12, 488, 232, 18); g.stroke();
  g.fillStyle = '#f3f3ee'; g.textBaseline = 'middle';
  const n = lines.length;
  lines.forEach((ln, k) => {
    const y = 128 + (k - (n - 1) / 2) * (n > 2 ? 64 : 82);
    const fs = n > 2 ? 46 : 58;
    g.font = `bold ${fs}px "Arial Narrow", "Helvetica Neue", Arial, sans-serif`;
    if (Array.isArray(ln)) { g.textAlign = 'left'; g.fillText(ln[0], 40, y); g.textAlign = 'right'; g.fillText(ln[1], 472, y); }
    else { g.textAlign = 'center'; g.fillText(ln, 256, y); }
  });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = MAX_ANISO; return t;
}
const SIGN_TEXTS = [
  [['Millbrook', '12'], ['Cedar Falls', '27']],
  ['SCENIC ROUTE 9', 'NORTH'],
  [['Harlow Creek', '3'], ['Elk Valley', '18'], ['Pine Ridge', '34']],
  ['Willow Bend', 'NEXT RIGHT'],
  [['Oak Hollow', '6'], ['Sunnyvale', '41']],
  ['Maple Grove', 'Farm Market 2 mi'],
];
const signMats = SIGN_TEXTS.map(l => new THREE.MeshLambertMaterial({ map: makeSignTexture(l) }));

function makePlankTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256; const g = c.getContext('2d'), R = mulberry32(9);
  g.fillStyle = '#a3231a'; g.fillRect(0, 0, 256, 256);
  for (let x = 0; x < 256; x += 32) {
    g.fillStyle = `rgba(${R() < 0.5 ? '0,0,0' : '255,220,200'},${0.03 + R() * 0.06})`; g.fillRect(x, 0, 32, 256);
    g.fillStyle = 'rgba(40,6,4,0.65)'; g.fillRect(x, 0, 3, 256);
  }
  for (let k = 0; k < 600; k++) { g.fillStyle = `rgba(${R() < 0.6 ? '60,10,5' : '230,200,180'},${R() * 0.12})`; g.fillRect(R() * 256, R() * 256, 1 + R() * 2, 6 + R() * 30); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(0.3, 0.3); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = MAX_ANISO; return t;
}
const plankTex = makePlankTexture();

// ======================= Shared scenery geometry & materials =======================
function hash3(x, y, z, s) { const h = Math.sin(Math.round(x * 1000) * 0.01299 + Math.round(y * 1000) * 0.07823 + Math.round(z * 1000) * 0.03771 + s) * 43758.5453; return h - Math.floor(h); }
function lumpy(geo, amt, seed) {

  for (let k = 0; k < p.count; k++) { const x = p.getX(k), y = p.getY(k), z = p.getZ(k); const f = 1 + (hash3(x, y, z, seed) - 0.5) * amt; p.setXYZ(k, x * f, y * f, z * f); }

}
function blobGeo(seed, n, spread, r, detail = 1) {
  const R = mulberry32(seed), parts = [];
  for (let k = 0; k < n; k++) {
    const g = lumpy(new THREE.IcosahedronGeometry(r * (0.65 + R() * 0.45), detail), 0.35, seed + k);
    g.translate((R() - 0.5) * spread, (R() - 0.35) * spread * 0.7, (R() - 0.5) * spread);
    parts.push(g);
  }
  const m = mergeGeometries(parts); m.computeVertexNormals(); return m;
}
const G = {
  trunk: new THREE.CylinderGeometry(0.12, 0.2, 1, 7).translate(0, 0.5, 0),
  leafA: blobGeo(11, 6, 1.3, 0.75),
  leafB: blobGeo(23, 4, 1.0, 0.85),
  conifer: (() => { const parts = [[1, 1.5, 0.75], [0.8, 1.3, 1.6], [0.58, 1.1, 2.35], [0.34, 0.8, 2.95]].map(([r, h, y]) => new THREE.ConeGeometry(r, h, 8, 1).translate(0, y, 0)); const m = mergeGeometries(parts); m.computeVertexNormals(); return m; })(),
  bush: blobGeo(37, 4, 1.1, 0.55),
  tuft: (() => {
    const pos = [], col = [], nor = [], R = mulberry32(5);
    for (let k = 0; k < 10; k++) {
      const a = R() * Math.PI * 2, r = R() * 0.13, h = 0.3 + R() * 0.35, w = 0.035;
      const bx = Math.cos(a) * r, bz = Math.sin(a) * r, lean = 0.12 + R() * 0.2;
      const tx = bx + Math.cos(a) * lean, tz = bz + Math.sin(a) * lean, px = -Math.sin(a) * w, pz = Math.cos(a) * w;
      pos.push(bx - px, 0, bz - pz, bx + px, 0, bz + pz, tx, h, tz);
      col.push(0.35, 0.45, 0.25, 0.35, 0.45, 0.25, 1, 1, 0.85);
      nor.push(0, 1, 0, 0, 1, 0, 0, 1, 0);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    return g;
  })(),

  const rollT = clamp(-(vF * yawRate) * 0.0075 - vR * 0.01, -0.11, 0.11);
  const pitchT = clamp(accel * 0.006, -0.07, 0.07);
  car.rollV += ((rollT - car.roll) * 90 - car.rollV * 11) * dt; car.roll += car.rollV * dt;
  car.pitchV += ((pitchT - car.pitch) * 80 - car.pitchV * 10) * dt; car.pitch += car.pitchV * dt;
  car.spin += (vF / WHEEL_R) * dt;
  car.rearSpin = (car.rearSpin || 0) + ((vF + wheelspin * 18) / WHEEL_R) * dt;
  // ground following from 4 contact points
  const fx2 = Math.sin(car.yaw), fz2 = Math.cos(car.yaw), rx2 = -Math.cos(car.yaw), rz2 = Math.sin(car.yaw);
  const h = wheels.map(w => surfaceY(car.x + fx2 * w.z - rx2 * w.x, car.z + fz2 * w.z - rz2 * w.x));
  const ty = (h[0] + h[1] + h[2] + h[3]) / 4;
  car.y += (ty - car.y) * Math.min(1, dt * 18);
  car.slopeP = Math.atan2((h[0] + h[1]) / 2 - (h[2] + h[3]) / 2, WB);
  car.slopeR = Math.atan2((h[0] + h[2]) / 2 - (h[1] + h[3]) / 2, TRACK * 2);
  car.rev = vF < -0.5;
  // tyre smoke & skids
  const slip = Math.abs(vR), speed = Math.abs(vF);
  const skidAmt = Math.max(clamp((slip - 2.0) / 4, 0, 1), braking && speed > 14 ? 0.6 : 0, hb && speed > 5 ? 0.9 : 0, wheelspin * 0.9);
  for (let k = 0; k < 2; k++) {
    const w = wheels[2 + k], wx = car.x + fx2 * w.z - rx2 * w.x, wz = car.z + fz2 * w.z - rz2 * w.x;
    if (car.onRoad && skidAmt > 0.05) {
      addSkid(k, wx, wz, h[2 + k] + 0.02, rx2, rz2);
      emitAcc[k] += dt * 55 * skidAmt;
      while (emitAcc[k] > 1) { emitAcc[k]--; emitSmoke(wx, h[2 + k], wz, car.vx, car.vz, 0.5 * skidAmt + 0.15, 0xebe9e4); }
    } else {
      trails[k] = null;
      if (!car.onRoad && speed > 6) { emitAcc[k] += dt * speed * 0.9; while (emitAcc[k] > 1) { emitAcc[k]--; emitSmoke(wx, h[2 + k], wz, car.vx, car.vz, 0.3, 0xb59c76); } }
    }
  }
  return { vF, up: up ? 1 : 0 };
}

// ======================= Camera =======================
let camYaw = 0;
const camPos = new THREE.Vector3(), camOff = new THREE.Vector3(), camLook = new THREE.Vector3();
function updateCamera(dt, vF, snap) {
  let target = car.yaw; if (vF < -2) target = car.yaw; // keep behind even when reversing
  let dy = target - camYaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  camYaw += dy * (snap ? 1 : Math.min(1, dt * 3.2));
  const sp = Math.abs(vF), back = 7.0 + sp * 0.04, up = 2.6 + sp * 0.012;
  const desired = new THREE.Vector3(car.x - Math.sin(camYaw) * back, car.y + up, car.z - Math.cos(camYaw) * back);
  const gy = surfaceY(desired.x, desired.z) + 1.2; if (desired.y < gy) desired.y = gy;
  const carP = new THREE.Vector3(car.x, car.y, car.z), off = desired.sub(carP);
  if (snap) camOff.copy(off); else camOff.lerp(off, Math.min(1, dt * 6));
  camPos.copy(carP).add(camOff);
  const gy2 = surfaceY(camPos.x, camPos.z) + 1.0; if (camPos.y < gy2) camPos.y = gy2;
  camera.position.copy(camPos);
  camLook.set(car.x + Math.sin(car.yaw) * 4, car.y + 1.1, car.z + Math.cos(car.yaw) * 4);
  camera.lookAt(camLook);
  const fov = 58 + Math.min(sp, 60) * 0.22;
  if (Math.abs(camera.fov - fov) > 0.05) { camera.fov += (fov - camera.fov) * Math.min(1, dt * 3); camera.updateProjectionMatrix(); }
}

// ======================= HUD: speedometer & minimap =======================
const spdC = document.getElementById('speedo'), spdG = spdC.getContext('2d');
const mapC = document.getElementById('minimap'), mapG = mapC.getContext('2d');
function sizeHud() { const dpr = Math.min(devicePixelRatio, 2); for (const c of [spdC, mapC]) { c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr; } }
sizeHud();
function drawSpeedo(mph, rev) {
  const g = spdG, k = spdC.width / 220; g.setTransform(k, 0, 0, k, 0, 0); g.clearRect(0, 0, 220, 220);
  const cx = 110, cy = 110, MAX = 140, a0 = Math.PI * 0.75, a1 = Math.PI * 2.25, ang = v => a0 + (v / MAX) * (a1 - a0);
  const bg = g.createRadialGradient(cx, cy, 20, cx, cy, 104); bg.addColorStop(0, 'rgba(30,30,32,0.82)'); bg.addColorStop(1, 'rgba(12,12,14,0.82)');
  g.fillStyle = bg; g.beginPath(); g.arc(cx, cy, 104, 0, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(220,220,220,0.55)'; g.lineWidth = 3; g.stroke();
  g.strokeStyle = 'rgba(230,50,40,0.85)'; g.lineWidth = 6; g.beginPath(); g.arc(cx, cy, 90, ang(110), ang(140)); g.stroke();
  g.strokeStyle = '#e8a33a'; g.lineWidth = 4; g.beginPath(); g.arc(cx, cy, 96, a0, ang(Math.min(mph, MAX))); g.stroke();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let v = 0; v <= MAX; v += 5) {
    const a = ang(v), major = v % 20 === 0, r1 = 90, r0 = major ? 76 : (v % 10 === 0 ? 82 : 86);
    g.strokeStyle = major ? '#fff' : 'rgba(255,255,255,0.6)'; g.lineWidth = major ? 2.5 : 1.2;
    g.beginPath(); g.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); g.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); g.stroke();
    if (major) { g.fillStyle = '#f3f3f3'; g.font = '600 13px system-ui, sans-serif'; g.fillText(v, cx + Math.cos(a) * 63, cy + Math.sin(a) * 63); }
  }
  const na = ang(clamp(mph, 0, MAX));
  g.strokeStyle = '#ff3b2f'; g.lineWidth = 3.5; g.lineCap = 'round';
  g.beginPath(); g.moveTo(cx - Math.cos(na) * 14, cy - Math.sin(na) * 14); g.lineTo(cx + Math.cos(na) * 84, cy + Math.sin(na) * 84); g.stroke();
  g.fillStyle = '#ddd'; g.beginPath(); g.arc(cx, cy, 7, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.font = '700 30px system-ui, sans-serif'; g.fillText(Math.round(mph), cx, cy + 48);
  g.fillStyle = 'rgba(255,255,255,0.7)'; g.font = '600 11px system-ui, sans-serif'; g.fillText(rev ? 'MPH  ·  R' : 'MPH', cx, cy + 70);
}
function drawMinimap() {
  const g = mapG, k = mapC.width / 210; g.setTransform(k, 0, 0, k, 0, 0); g.clearRect(0, 0, 210, 210);
  const cx = 105, cy = 105, R = 100, sc = 0.34;
  const fx = Math.sin(car.yaw), fz = Math.cos(car.yaw), rx = -Math.cos(car.yaw), rz = Math.sin(car.yaw);
  const tp = (x, z) => { const dx = x - car.x, dz = z - car.z; return [cx + (dx * rx + dz * rz) * sc, cy - (dx * fx + dz * fz) * sc]; };
  g.save(); g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.clip();
  g.fillStyle = 'rgba(70,98,52,0.85)'; g.fillRect(0, 0, 210, 210);
  const i0 = Math.max(0, car.idx - 260), i1 = car.idx + 360; ensurePath(i1);
  for (const [w, col] of [[9, '#2d2d2f'], [5.5, '#5a5a5c'], [1.2, '#e0b22a']]) {
    g.strokeStyle = col; g.lineWidth = w; g.lineJoin = 'round'; g.beginPath();
    for (let i = i0; i <= i1; i += 3) { const [x, y] = tp(PX[i], PZ[i]); i === i0 ? g.moveTo(x, y) : g.lineTo(x, y); }
    g.stroke();
  }
  for (const ch of chunks.values()) {
    for (const b of ch.info.barns) { const [x, y] = tp(b.x, b.z); g.fillStyle = '#c0281d'; g.fillRect(x - 5, y - 5, 10, 10); g.strokeStyle = '#fff'; g.lineWidth = 1.2; g.strokeRect(x - 5, y - 5, 10, 10); }
    for (const s of ch.info.signs) { const [x, y] = tp(s.x, s.z); g.fillStyle = '#19a35a'; g.beginPath(); g.arc(x, y, 3.5, 0, Math.PI * 2); g.fill(); }
  }
  g.restore();
  g.fillStyle = '#ff3b2f'; g.strokeStyle = '#fff'; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(cx, cy - 9); g.lineTo(cx + 6.5, cy + 7); g.lineTo(cx, cy + 3.5); g.lineTo(cx - 6.5, cy + 7); g.closePath(); g.fill(); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,0.75)'; g.lineWidth = 3; g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.stroke();
}

// ======================= Visual sync & main loop =======================
function syncCarVisual(dt, t) {
  carRoot.position.set(car.x, car.y, car.z);
  carRoot.rotation.set(-car.slopeP, car.yaw, car.slopeR);
  body.rotation.set(-car.pitch, 0, car.roll);
  body.position.y = Math.sin(t * 13) * 0.004 * Math.min(1, Math.hypot(car.vx, car.vz) / 10);
  for (const w of wheels) { w.spin.rotation.x = w.front ? car.spin : car.rearSpin; if (w.front) w.outer.rotation.y = -car.steer; }
  steerWheel.rotation.z = car.steer * 4;
  // passenger: both arms raised, waving
  for (const a of rider.arms) {
    a.sh.rotation.set(-2.85 + Math.sin(t * 5.5 + a.s) * 0.12, 0, a.s * (0.35 + Math.sin(t * 6 + a.s * 1.3) * 0.18));
    a.el.rotation.set(-0.25 + Math.sin(t * 6 + a.s) * 0.2, 0, 0);
  }
  rider.head.rotation.set(-0.1, Math.sin(t * 0.7) * 0.35, Math.sin(t * 1.3) * 0.08);
  if (rider.pony) rider.pony.rotation.set(-0.6 - Math.min(1, Math.hypot(car.vx, car.vz) / 30) * 0.8 + Math.sin(t * 9) * 0.12, 0, Math.sin(t * 7) * 0.2);
  driver.head.rotation.y = -car.steer * 0.6;
}

const clock = new THREE.Clock();
let frameN = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  let res;
  const sub = 2; for (let k = 0; k < sub; k++) res = physics(dt / sub);
  updateChunks(car.s, 1);
  syncCarVisual(dt, t);
  updateSmoke(dt);
  if (skDirty) { skGeo.attributes.position.needsUpdate = true; skDirty = false; }
  updateCamera(dt, res.vF, false);
  const fwd = new THREE.Vector3(Math.sin(car.yaw), 0, Math.cos(car.yaw));
  sun.target.position.set(car.x + fwd.x * 25, car.y, car.z + fwd.z * 25);
  sun.position.copy(sun.target.position).addScaledVector(SUN_DIR, 150);
  sky.position.copy(camera.position);
  const speed = Math.hypot(car.vx, car.vz);
  drawSpeedo(speed * 2.23694, car.rev);
  if (frameN++ % 2 === 0) drawMinimap();
  updateAudio(speed, res.up);
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); sizeHud();
});

// ---- start ----
resetCar(14);
updateChunks(car.s, 99);
camYaw = car.yaw; physics(0.001); updateCamera(0.016, 0, true);
const ld = document.getElementById('loading'); ld.style.opacity = 0; setTimeout(() => ld.remove(), 800);
frame();
</script>
