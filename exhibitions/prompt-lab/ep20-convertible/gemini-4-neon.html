<script type="module">
import * as THREE from 'three';

// ============================================================================
// 1. RENDERER, SCENE, LIGHTING & WARM AFTERNOON ATMOSPHERE
// ============================================================================
const canvas = document.getElementById('webgl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const FOG_COLOR = new THREE.Color(0xf2d1a8);
scene.background = FOG_COLOR;
scene.fog = new THREE.FogExp2(0xf2d1a8, 0.0024);

const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.25, 950);

// Warm afternoon sun + hemisphere bounce
const hemiLight = new THREE.HemisphereLight(0xffe9c8, 0x5c6b3a, 0.82);
scene.add(hemiLight);

const sunDir = new THREE.Vector3(0.62, 0.42, -0.66).normalize();
const sunLight = new THREE.DirectionalLight(0xffdfb0, 2.35);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near = 10;
sunLight.shadow.camera.far = 260;
const shadowBound = 68;
sunLight.shadow.camera.left = -shadowBound;
sunLight.shadow.camera.right = shadowBound;
sunLight.shadow.camera.top = shadowBound;
sunLight.shadow.camera.bottom = -shadowBound;
sunLight.shadow.bias = -0.00045;
sunLight.shadow.normalBias = 0.035;
scene.add(sunLight);
scene.add(sunLight.target);

// Procedural Sky Dome with warm afternoon gradient + sun disc + soft clouds
function createSkyDome() {
  const skyGeo = new THREE.SphereGeometry(780, 32, 20);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: {
      uSunDir: { value: sunDir.clone() },
      uZenith: { value: new THREE.Color(0x4b86c6) },
      uMidSky: { value: new THREE.Color(0x9bc4df) },
      uHorizon: { value: new THREE.Color(0xf5d4a6) },
      uSunColor: { value: new THREE.Color(0xfff5d6) },
      uTime: { value: 0 }
    },
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 uSunDir;
      uniform vec3 uZenith;
      uniform vec3 uMidSky;
      uniform vec3 uHorizon;
      uniform vec3 uSunColor;
      uniform float uTime;
      varying vec3 vDir;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }
      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float a = hash(i);
        float b = hash(i + vec2(1.0, 0.0));
        float c = hash(i + vec2(0.0, 1.0));
        float d = hash(i + vec2(1.0, 1.0));
        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
      }
      float fbm(vec2 p) {
        float v = 0.0;
        float a = 0.5;
        for (int i = 0; i < 4; i++) {
          v += a * noise(p);
          p = p * 2.05 + vec2(13.1, 7.7);
          a *= 0.5;
        }
        return v;
      }

      void main() {
        vec3 d = normalize(vDir);
        float h = clamp(d.y, 0.0, 1.0);
        vec3 col = mix(uHorizon, uMidSky, smoothstep(0.0, 0.28, h));
        col = mix(col, uZenith, smoothstep(0.22, 0.85, h));

        // Warm atmospheric glow around sun
        float sunAmt = max(dot(d, normalize(uSunDir)), 0.0);
        col += vec3(1.0, 0.78, 0.45) * pow(sunAmt, 6.0) * 0.36;
        col += uSunColor * pow(sunAmt, 90.0) * 0.9;
        col += uSunColor * smoothstep(0.9982, 0.9994, sunAmt) * 1.4;

        // Soft afternoon clouds
        if (d.y > 0.04) {
          vec2 uv = d.xz / (d.y + 0.16) * 1.35 + vec2(uTime * 0.004, uTime * 0.0015);
          float c = fbm(uv);
          float cloudMask = smoothstep(0.52, 0.78, c) * smoothstep(0.04, 0.22, d.y);
          vec3 cloudCol = mix(vec3(0.98, 0.93, 0.86), vec3(1.0, 0.98, 0.94), smoothstep(0.0, 0.6, sunAmt));
          col = mix(col, cloudCol, cloudMask * 0.52);
        }

        // Below horizon warm haze
        if (d.y < 0.0) {
          col = mix(uHorizon, vec3(0.82, 0.72, 0.55), clamp(-d.y * 4.0, 0.0, 1.0));
        }

        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  return new THREE.Mesh(skyGeo, skyMat);
}
const skyDome = createSkyDome();
scene.add(skyDome);

// ============================================================================
// 2. PROCEDURAL CANVAS TEXTURES (NO EXTERNAL ASSETS)
// ============================================================================
const maxAniso = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);

function createAsphaltTexture() {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 1024;
  const ctx = c.getContext('2d');

  // Base weathered asphalt
  ctx.fillStyle = '#3b3c40';
  ctx.fillRect(0, 0, c.width, c.height);

  // Subtle aggregate grain
  const img = ctx.getImageData(0, 0, c.width, c.height);
  const data = img.data;
  let seed = 1337;
  const rand = () => {
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
  };
  for (let i = 0; i < data.length; i += 4) {
    const n = (rand() - 0.5) * 26;
    const warm = rand() > 0.88 ? 6 : 0;
    data[i] = Math.max(0, Math.min(255, data[i] + n + warm));
    data[i + 1] = Math.max(0, Math.min(255, data[i + 1] + n + warm * 0.7));
    data[i + 2] = Math.max(0, Math.min(255, data[i + 2] + n));
  }
  ctx.putImageData(img, 0, 0);

  // Worn lighter tire tracks in both lanes
  const drawTrack = (x, w) => {
    const g = ctx.createLinearGradient(x - w, 0, x + w, 0);
    g.addColorStop(0, 'rgba(90,90,92,0)');
    g.addColorStop(0.5, 'rgba(92,90,86,0.16)');
    g.addColorStop(1, 'rgba(90,90,92,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - w, 0, w * 2, c.height);
  };
  drawTrack(115, 24);
  drawTrack(180, 24);
  drawTrack(332, 24);
  drawTrack(397, 24);

  // Subtle shoulder dust edges
  const leftDust = ctx.createLinearGradient(0, 0, 44, 0);
  leftDust.addColorStop(0, 'rgba(138, 122, 95, 0.55)');
  leftDust.addColorStop(1, 'rgba(138, 122, 95, 0)');
  ctx.fillStyle = leftDust;
  ctx.fillRect(0, 0, 44, c.height);

  const rightDust = ctx.createLinearGradient(c.width, 0, c.width - 44, 0);
  rightDust.addColorStop(0, 'rgba(138, 122, 95, 0.55)');
  rightDust.addColorStop(1, 'rgba(138, 122, 95, 0)');
  ctx.fillStyle = rightDust;
  ctx.fillRect(c.width - 44, 0, 44, c.height);

  // Cracked asphalt: dark branching cracks + tar seals
  const drawCrack = (x0, y0, len, angle, depth) => {
    if (depth <= 0 || len < 8) return;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    let x = x0, y = y0, a = angle;
    const steps = Math.max(4, Math.floor(len / 12));
    for (let s = 0; s < steps; s++) {
      a += (rand() - 0.5) * 0.72;
      x += Math.cos(a) * (len / steps);
      y += Math.sin(a) * (len / steps);
      ctx.lineTo(x, y);
      if (depth > 1 && rand() > 0.74) {
        drawCrack(x, y, len * 0.55, a + (rand() > 0.5 ? 0.65 : -0.65), depth - 1);
      }
    }
    ctx.strokeStyle = depth === 2 ? 'rgba(18, 18, 20, 0.72)' : 'rgba(24, 24, 26, 0.45)';
    ctx.lineWidth = depth === 2 ? 2.2 : 1.1;
    ctx.stroke();
  };

  for (let i = 0; i < 26; i++) {
    const x = 35 + rand() * (c.width - 70);
    const y = rand() * c.height;
    drawCrack(x, y, 55 + rand() * 110, rand() * Math.PI * 2, 2);
  }

  // White solid edge lines
  ctx.fillStyle = 'rgba(238, 234, 224, 0.86)';
  ctx.fillRect(36, 0, 10, c.height);
  ctx.fillRect(c.width - 46, 0, 10, c.height);

  // Double yellow centre line
  ctx.fillStyle = '#e2ae2c';
  ctx.fillRect(c.width / 2 - 12, 0, 8, c.height);
  ctx.fillRect(c.width / 2 + 4, 0, 8, c.height);

  // Slight weathering over painted lines
  for (let i = 0; i < 160; i++) {
    ctx.fillStyle = 'rgba(58, 58, 62, 0.32)';
    const rx = (rand() > 0.35 ? c.width / 2 - 14 + rand() * 28 : (rand() > 0.5 ? 34 : c.width - 48) + rand() * 14);
    ctx.fillRect(rx, rand() * c.height, 2 + rand() * 5, 3 + rand() * 9);
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = maxAniso;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createGrassTexture() {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#6c8d3b';
  ctx.fillRect(0, 0, 512, 512);

  let seed = 4242;
  const rand = () => {
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
  };

  // Mottled sunlit meadow patches
  for (let i = 0; i < 240; i++) {
    const x = rand() * 512;
    const y = rand() * 512;
    const r = 14 + rand() * 44;
    const g = ctx.createRadialGradient(x, y, 2, x, y, r);
    const warm = rand() > 0.55;
    g.addColorStop(0, warm ? 'rgba(136, 152, 62, 0.25)' : 'rgba(74, 108, 42, 0.24)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Fine grass strokes
  for (let i = 0; i < 4500; i++) {
    const x = rand() * 512;
    const y = rand() * 512;
    ctx.strokeStyle = rand() > 0.5 ? 'rgba(162, 178, 78, 0.35)' : 'rgba(54, 84, 30, 0.32)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + (rand() - 0.5) * 4, y - 4 - rand() * 6);
    ctx.stroke();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = maxAniso;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createBarnWoodTexture() {
  const c = document.createElement('canvas');
  c.width = 256;
  c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#9c2520';
  ctx.fillRect(0, 0, 256, 256);
  for (let x = 0; x < 256; x += 16) {
    ctx.fillStyle = (x / 16) % 2 === 0 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.05)';
    ctx.fillRect(x, 0, 16, 256);
    ctx.fillStyle = 'rgba(35, 6, 4, 0.45)';
    ctx.fillRect(x, 0, 2, 256);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createSmokeTexture() {
  const c = document.createElement('canvas');
  c.width = 128;
  c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 6, 64, 64, 60);
  g.addColorStop(0, 'rgba(248, 245, 240, 0.9)');
  g.addColorStop(0.45, 'rgba(230, 226, 220, 0.48)');
  g.addColorStop(1, 'rgba(220, 215, 210, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const HIGHWAY_SIGNS_DATA = [
  { line1: 'VALLEY RD', line2: 'NEXT RIGHT', route: '14' },
  { line1: 'SUNSET RIDGE', line2: '6 MILES', route: '9' },
  { line1: 'SCENIC OVERLOOK', line2: '2 MILES', route: '27' },
  { line1: 'MEADOW CREEK', line2: '11 MILES', route: '14' },
  { line1: 'RED BARN FARM', line2: 'AHEAD', route: '6' },
  { line1: 'OAKWOOD VALLEY', line2: '15 MILES', route: '9' }
];

const highwaySignTextures = HIGHWAY_SIGNS_DATA.map((info) => {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 256;
  const ctx = c.getContext('2d');
  // Highway green
  ctx.fillStyle = '#0b6a41';
  ctx.fillRect(0, 0, 512, 256);
  // Rounded white border
  ctx.strokeStyle = '#f5f7f4';
  ctx.lineWidth = 10;
  ctx.strokeRect(12, 12, 488, 232);
  // Route badge
  ctx.fillStyle = '#f5f7f4';
  ctx.fillRect(36, 36, 74, 58);
  ctx.fillStyle = '#0b6a41';
  ctx.font = 'bold 34px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(info.route, 73, 66);
  // Main destination text
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'left';
  ctx.font = 'bold 40px sans-serif';
  ctx.fillText(info.line1, 130, 74);
  ctx.font = '600 32px sans-serif';
  ctx.fillStyle = '#e7f4ec';
  ctx.fillText(info.line2, 130, 152);
  // Arrow
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 46px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('↗', 474, 198);

  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = maxAniso;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
});

const asphaltTex = createAsphaltTexture();
const grassTex = createGrassTexture();
const barnWoodTex = createBarnWoodTexture();
const smokeTex = createSmokeTexture();

// Placeholder markers for subsequent modular sections
// ============================================================================
// 3. ANALYTIC ENDLESS ROAD & TERRAIN MATH
// ============================================================================
const ROAD_HALF_WIDTH = 5.0; // 10m wide two-lane road

function mulberry32(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function getRoadCenter(s) {
  // Gentle sweeping curves and rolling country hills
  const x = 36 * Math.sin(s * 0.0062)
          + 20 * Math.sin(s * 0.0148 + 1.15)
          + 10 * Math.cos(s * 0.0031);
  const dx = 36 * 0.0062 * Math.cos(s * 0.0062)
           + 20 * 0.0148 * Math.cos(s * 0.0148 + 1.15)
           - 10 * 0.0031 * Math.sin(s * 0.0031);

  const y = 3.8 * Math.sin(s * 0.0078)
          + 2.1 * Math.sin(s * 0.0185 + 0.65)
          + 1.0 * Math.cos(s * 0.0042);
  const dy = 3.8 * 0.0078 * Math.cos(s * 0.0078)
           + 2.1 * 0.0185 * Math.cos(s * 0.0185 + 0.65)
           - 1.0 * 0.0042 * Math.sin(s * 0.0042);

  // Horizontal right vector perpendicular to forward (dx, 0, -1)
  const invLen = 1 / Math.hypot(1, dx);
  const rx = invLen;
  const rz = dx * invLen;

  return { x, y, z: -s, dx, dy, rx, rz, heading: Math.atan2(-dx, 1) };
}

function smoothstep(edge0, edge1, x) {
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

function hillNoise(x, z) {
  return 4.8 * Math.sin(x * 0.018 + z * 0.011)
       + 3.1 * Math.cos(x * 0.031 - z * 0.023 + 1.4)
       + 1.4 * Math.sin(x * 0.065 + z * 0.052 + 0.5);
}

function getTerrainHeight(x, z) {
  const s = -z;
  const rc = getRoadCenter(s);
  const lateral = (x - rc.x) * rc.rx; // signed perpendicular distance from road center
  const absLat = Math.abs(lateral);

  if (absLat <= ROAD_HALF_WIDTH + 1.1) {
    return rc.y - 0.04;
  }

  // Gentle roadside drainage dip then rolling hills rising on both sides
  const dip = -0.35 * Math.sin(Math.min(1, (absLat - 6.1) / 5.5) * Math.PI);
  const blend = smoothstep(ROAD_HALF_WIDTH + 1.1, ROAD_HALF_WIDTH + 22.0, absLat);
  const outerLift = Math.max(0, absLat - 18) * 0.14;
  const hills = hillNoise(x, z) + outerLift;
  return rc.y - 0.04 + dip * (1 - blend * 0.6) + hills * blend;
}

function getRoadSurfaceHeight(x, z) {
  const s = -z;
  const rc = getRoadCenter(s);
  const lateral = (x - rc.x) * rc.rx;
  if (Math.abs(lateral) <= ROAD_HALF_WIDTH + 0.3) {
    return rc.y;
  }
  return getTerrainHeight(x, z);
}

// ============================================================================
// 4. RED CONVERTIBLE SPORTS CAR + TWO PASSENGERS (ONE WITH ARMS RAISED)
// ============================================================================
function createConvertibleCar() {
  const carGroup = new THREE.Group();
  const chassisGroup = new THREE.Group();
  carGroup.add(chassisGroup);

  // Materials
  const redPaint = new THREE.MeshPhysicalMaterial({
    color: 0xcc141b,
    metalness: 0.38,
    roughness: 0.22,
    clearcoat: 1.0,
    clearcoatRoughness: 0.08
  });
  const darkTrim = new THREE.MeshStandardMaterial({ color: 0x1b1c1f, roughness: 0.65, metalness: 0.2 });
  const chromeMat = new THREE.MeshStandardMaterial({ color: 0xebebef, metalness: 0.92, roughness: 0.14 });
  const leatherMat = new THREE.MeshStandardMaterial({ color: 0x8f562e, roughness: 0.72, metalness: 0.05 });
  const darkLeatherMat = new THREE.MeshStandardMaterial({ color: 0x422818, roughness: 0.8 });
  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0xaad4f5,
    transparent: true,
    opacity: 0.36,
    roughness: 0.06,
    metalness: 0.1,

    carGroup.add(pivot);

    if (spec.front) frontWheelPivots.push(pivot);
  }

function createRedBarn() {
  const barn = new THREE.Group();

  // Main red barn body
  const body = new THREE.Mesh(new THREE.BoxGeometry(10.5, 5.6, 13.5), barnRedMat);
  body.position.y = 2.8;

  body.receiveShadow = true;

  // Gambrel roof (lower steep slopes + upper gentler slopes + gable end triangles)
  const roofLowerL = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.24, 14.2), barnRoofMat);
  roofLowerL.position.set(-4.1, 6.75, 0);
  roofLowerL.rotation.z = 0.96;
  roofLowerL.castShadow = true;
  barn.add(roofLowerL);

  const roofLowerR = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.24, 14.2), barnRoofMat);
  roofLowerR.position.set(4.1, 6.75, 0);
  roofLowerR.rotation.z = -0.96;
  roofLowerR.castShadow = true;
  barn.add(roofLowerR);

  const roofUpperL = new THREE.Mesh(new THREE.BoxGeometry(3.55, 0.24, 14.2), barnRoofMat);
  roofUpperL.position.set(-1.62, 8.78, 0);
  roofUpperL.rotation.z = 0.34;
  roofUpperL.castShadow = true;
  barn.add(roofUpperL);

  const roofUpperR = new THREE.Mesh(new THREE.BoxGeometry(3.55, 0.24, 14.2), barnRoofMat);
  roofUpperR.position.set(1.62, 8.78, 0);
  roofUpperR.rotation.z = -0.34;
  roofUpperR.castShadow = true;
  barn.add(roofUpperR);

  // Gable end fill (extruded gambrel profile)
  const gableShape = new THREE.Shape();
  gableShape.moveTo(-5.25, 5.55);
  gableShape.lineTo(-3.15, 8.2);
  gableShape.lineTo(0, 9.35);
  gableShape.lineTo(3.15, 8.2);
  gableShape.lineTo(5.25, 5.55);
  gableShape.closePath();
  const gableGeo = new THREE.ExtrudeGeometry(gableShape, { depth: 13.46, bevelEnabled: false });
  gableGeo.translate(0, 0, -6.73);
  const gableMesh = new THREE.Mesh(gableGeo, barnRedMat);
  gableMesh.castShadow = true;
  gableMesh.receiveShadow = true;
  barn.add(gableMesh);

  // White corner trim posts
  for (const sx of [-1, 1]) {
    for (const sz of [-1, 1]) {
      const corner = new THREE.Mesh(new THREE.BoxGeometry(0.24, 5.65, 0.24), barnWhiteMat);
      corner.position.set(sx * 5.24, 2.82, sz * 6.74);
      barn.add(corner);
    }
  }

  // Front double barn doors with classic white X-bracing (on +Z and -Z faces)
  for (const sz of [-1, 1]) {
    const faceZ = sz * 6.78;
    // Outer white frame
    const topBar = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.22, 0.14), barnWhiteMat);
    topBar.position.set(0, 4.05, faceZ);
    barn.add(topBar);
    const midBar = new THREE.Mesh(new THREE.BoxGeometry(0.18, 4.05, 0.14), barnWhiteMat);
    midBar.position.set(0, 2.02, faceZ);
    barn.add(midBar);
    for (const dx of [-1, 1]) {
      const sideBar = new THREE.Mesh(new THREE.BoxGeometry(0.18, 4.05, 0.14), barnWhiteMat);
      sideBar.position.set(dx * 2.05, 2.02, faceZ);
      barn.add(sideBar);
      // X-brace on each door leaf
      const diag1 = new THREE.Mesh(new THREE.BoxGeometry(0.14, 4.1, 0.12), barnWhiteMat);
      diag1.position.set(dx * 1.02, 2.02, faceZ);
      diag1.rotation.z = 0.46;
      barn.add(diag1);
      const diag2 = new THREE.Mesh(new THREE.BoxGeometry(0.14, 4.1, 0.12), barnWhiteMat);
      diag2.position.set(dx * 1.02, 2.02, faceZ);
      diag2.rotation.z = -0.46;
      barn.add(diag2);
    }
    // Hayloft window above
    const hayFrame = new THREE.Mesh(new THREE.BoxGeometry(1.9, 1.9, 0.14), barnWhiteMat);
    hayFrame.position.set(0, 6.7, faceZ);
    barn.add(hayFrame);
    const hayInner = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 0.16), barnRoofMat);
    hayInner.position.set(0, 6.7, faceZ);
    barn.add(hayInner);
  }

  // Side windows with white frames
  for (const sx of [-1, 1]) {
    for (const wz of [-3.6, 0, 3.6]) {
      const wf = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.25, 1.15), barnWhiteMat);
      wf.position.set(sx * 5.26, 3.2, wz);
      barn.add(wf);
      const wi = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.92, 0.85), barnRoofMat);
      wi.position.set(sx * 5.27, 3.2, wz);
      barn.add(wi);
    }
  }

  // Tall farm silo beside the barn
  const silo = new THREE.Mesh(new THREE.CylinderGeometry(2.05, 2.1, 11.2, 16), siloMat);
  silo.position.set(7.4, 5.6, -2.5);
  silo.castShadow = true;
  silo.receiveShadow = true;
  barn.add(silo);

  const siloDome = new THREE.Mesh(
    new THREE.SphereGeometry(2.08, 16, 10, 0, Math.PI * 2, 0, Math.PI * 0.5),
    siloDomeMat
  );
  siloDome.position.set(7.4, 11.15, -2.5);
  siloDome.castShadow = true;
  barn.add(siloDome);

  // Foundation plinth so barn sits solidly on sloped hillsides
  const basePad = new THREE.Mesh(new THREE.BoxGeometry(17.5, 3.0, 14.5), barnFoundationMat);
  basePad.position.set(2.2, -1.45, 0);
  barn.add(basePad);

  return barn;
}

// ============================================================================
// 7. CHUNK GENERATOR (ROAD, TERRAIN, POSTS, POLES+WIRES, SIGNS, FENCES, TREES, BARN)
// ============================================================================
const activeChunks = new Map();
const barnMarkers = new Map(); // chunkIdx -> { x, z } for minimap

function hasBarnInChunk(chunkIdx) {
  // Place first barn in chunk 1 (immediately visible down the road!) and every 5 chunks
  return chunkIdx >= 1 && (chunkIdx - 1) % 5 === 0;
}

function getPoleWorldPos(s) {
  const rc = getRoadCenter(s);
  const offset = 8.4;
  const x = rc.x + rc.rx * offset;
  const z = rc.z + rc.rz * offset;
  const y = getTerrainHeight(x, z);
  return { x, y, z, rc };
}

function buildChunk(chunkIdx) {
  const group = new THREE.Group();
  const sStart = chunkIdx * CHUNK_LEN;
  const sEnd = sStart + CHUNK_LEN;
  const rand = mulberry32((chunkIdx * 73856093) ^ 0x9e3779b9);

  // ---- A. Road Ribbon Mesh ----
  const roadSegs = 24;
  const rPositions = [];
  const rNormals = [];
  const rUvs = [];
  const rIndices = [];

  for (let i = 0; i <= roadSegs; i++) {
    const t = i / roadSegs;
    const s = sStart + t * CHUNK_LEN;
    const rc = getRoadCenter(s);

    const lx = rc.x - rc.rx * ROAD_HALF_WIDTH;
    const lz = rc.z - rc.rz * ROAD_HALF_WIDTH;
    const rx = rc.x + rc.rx * ROAD_HALF_WIDTH;
    const rz = rc.z + rc.rz * ROAD_HALF_WIDTH;

    rPositions.push(lx, rc.y, lz, rx, rc.y, rz);
    // Approximate road surface normal from slope dy/ds
    const ny = 1;
    const nz = rc.dy;
    const nLen = Math.hypot(ny, nz);
    rNormals.push(0, ny / nLen, nz / nLen, 0, ny / nLen, nz / nLen);

    const v = s / 16.0;
    rUvs.push(0, v, 1, v);

    if (i < roadSegs) {
      const base = i * 2;
      rIndices.push(base, base + 1, base + 2, base + 1, base + 3, base + 2);
    }
  }
  const roadGeo = new THREE.BufferGeometry();
  roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(rPositions, 3));
  roadGeo.setAttribute('normal', new THREE.Float32BufferAttribute(rNormals, 3));
  roadGeo.setAttribute('uv', new THREE.Float32BufferAttribute(rUvs, 2));
  roadGeo.setIndex(rIndices);
  const roadMesh = new THREE.Mesh(roadGeo, roadMat);
  roadMesh.receiveShadow = true;
  group.add(roadMesh);

  // ---- B. Terrain Mesh (seamlessly stitched across chunk boundaries) ----
  const latOffsets = [
    -128, -92, -64, -44, -30, -20, -13, -8.5, -6.2, -4.5, 0,
     4.5,  6.2,  8.5,  13,  20,  30,  44,  64,  92,  128
  ];
  const latCount = latOffsets.length;
  const tSegs = 20;
  const tPos = [];
  const tUvs = [];
  const tCols = [];
  const tIdx = [];

  const cVerge = new THREE.Color(0x9a8c62);
  const cLush = new THREE.Color(0x7ca146);
  const cWarm = new THREE.Color(0x9fb052);
  const cDeep = new THREE.Color(0x5b7f35);
  const tmpCol = new THREE.Color();

  for (let i = 0; i <= tSegs; i++) {
    const s = sStart + (i / tSegs) * CHUNK_LEN;
    const rc = getRoadCenter(s);
    for (let j = 0; j < latCount; j++) {
      const lat = latOffsets[j];
      const wx = rc.x + rc.rx * lat;
      const wz = rc.z + rc.rz * lat;
      const wy = getTerrainHeight(wx, wz);

      tPos.push(wx, wy, wz);
      tUvs.push(wx * 0.08, wz * 0.08);

      const absLat = Math.abs(lat);
      if (absLat < 7.2) {
        tmpCol.copy(cVerge);
      } else {
        const n = 0.5 + 0.5 * Math.sin(wx * 0.04 + wz * 0.035);
        tmpCol.copy(cLush).lerp(n > 0.55 ? cWarm : cDeep, Math.abs(n - 0.5) * 1.3);
        const vergeMix = 1 - smoothstep(6.5, 11.5, absLat);
        tmpCol.lerp(cVerge, vergeMix * 0.65);
      }
      tCols.push(tmpCol.r, tmpCol.g, tmpCol.b);
    }
    if (i < tSegs) {
      for (let j = 0; j < latCount - 1; j++) {
        const a = i * latCount + j;
        const b = a + 1;
        const c = a + latCount;
        const d = c + 1;
        tIdx.push(a, b, c, b, d, c);
      }
    }
  }
  const terrainGeo = new THREE.BufferGeometry();
  terrainGeo.setAttribute('position', new THREE.Float32BufferAttribute(tPos, 3));
  terrainGeo.setAttribute('uv', new THREE.Float32BufferAttribute(tUvs, 2));
  terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(tCols, 3));
  terrainGeo.setIndex(tIdx);
  terrainGeo.computeVertexNormals();
  const terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);
  terrainMesh.receiveShadow = true;
  group.add(terrainMesh);

  // ---- C. White Roadside Posts (Instanced) ----
  const postStep = 16;
  const postsPerSide = Math.floor(CHUNK_LEN / postStep);
  const postInst = new THREE.InstancedMesh(postGeo, whitePostMat, postsPerSide * 2);
  const reflInst = new THREE.InstancedMesh(reflectorGeo, reflectorMat, postsPerSide * 2);
  postInst.castShadow = true;
  const dummy = new THREE.Object3D();
  let pIdx = 0;
  for (let i = 0; i < postsPerSide; i++) {
    const s = sStart + i * postStep + 4;
    const rc = getRoadCenter(s);
    for (const side of [-1, 1]) {
      const wx = rc.x + rc.rx * (side * 5.6);
      const wz = rc.z + rc.rz * (side * 5.6);
      const wy = getTerrainHeight(wx, wz);
      dummy.position.set(wx, wy - 0.04, wz);
      dummy.rotation.set(0, rc.heading, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      postInst.setMatrixAt(pIdx, dummy.matrix);
      reflInst.setMatrixAt(pIdx, dummy.matrix);
      pIdx++;
    }
  }
  group.add(postInst, reflInst);

  // ---- D. Telephone Poles with Sagging Catenary Wires ----
  const poleSpacing = 40;
  const wireOffsets = [-0.85, 0, 0.85];
  for (let s = sStart; s < sEnd; s += poleSpacing) {
    const pA = getPoleWorldPos(s);
    const pB = getPoleWorldPos(s + poleSpacing);

    // Pole + crossarm + insulators
    const poleGroup = new THREE.Group();
    poleGroup.position.set(pA.x, pA.y - 0.15, pA.z);
    poleGroup.rotation.y = pA.rc.heading;

    const poleMesh = new THREE.Mesh(poleGeo, woodPoleMat);
    poleMesh.castShadow = true;
    poleGroup.add(poleMesh);

    const arm = new THREE.Mesh(crossArmGeo, woodPoleMat);
    arm.position.set(0, 8.45, 0);
    arm.castShadow = true;
    poleGroup.add(arm);

    for (const ox of wireOffsets) {
      const ins = new THREE.Mesh(insulatorGeo, insulatorMat);
      ins.position.set(ox, 8.58, 0);
      poleGroup.add(ins);
    }
    group.add(poleGroup);

    // 3 Sagging catenary wires to the next pole
    for (const ox of wireOffsets) {
      const ax = pA.x + pA.rc.rx * ox;
      const ay = pA.y + 8.48;
      const az = pA.z + pA.rc.rz * ox;
      const bx = pB.x + pB.rc.rx * ox;
      const by = pB.y + 8.48;
      const bz = pB.z + pB.rc.rz * ox;

      const pts = [];
      const sag = 1.45;
      const segs = 10;
      for (let k = 0; k <= segs; k++) {
        const u = k / segs;
        const drop = 4 * sag * u * (1 - u);
        pts.push(new THREE.Vector3(
          ax + (bx - ax) * u,
          ay + (by - ay) * u - drop,
          az + (bz - az) * u
        ));
      }
      const curve = new THREE.CatmullRomCurve3(pts);
      const wireGeo = new THREE.TubeGeometry(curve, 10, 0.028, 4, false);
      group.add(new THREE.Mesh(wireGeo, wireMat));
    }
  }

  // ---- E. Green Highway Signs ----
  if (chunkIdx >= 0 && (chunkIdx === 0 || chunkIdx % 2 === 1)) {
    const signS = chunkIdx === 0 ? 48 : sStart + 36;
    const rc = getRoadCenter(signS);
    const sx = rc.x + rc.rx * 7.2;
    const sz = rc.z + rc.rz * 7.2;
    const sy = getTerrainHeight(sx, sz);

    const signGroup = new THREE.Group();
    signGroup.position.set(sx, sy, sz);
    signGroup.rotation.y = rc.heading;

    const texIdx = Math.abs(chunkIdx) % highwaySignMats.length;
    const boardMats = [
      signBackMat, signBackMat, signBackMat, signBackMat,
      highwaySignMats[texIdx],
      signBackMat
    ];
    const board = new THREE.Mesh(new THREE.BoxGeometry(3.8, 1.9, 0.09), boardMats);
    board.position.set(0, 3.15, 0);
    board.castShadow = true;
    signGroup.add(board);

    for (const px of [-1.25, 1.25]) {
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.07, 3.4, 8), signPostMat);
      leg.position.set(px, 1.7, -0.02);
      leg.castShadow = true;
      signGroup.add(leg);
    }
    group.add(signGroup);
  }

  // ---- F. Red Barn (periodic scenic landmark, first one in chunk 1!) ----
  let barnInfo = null;
  if (hasBarnInChunk(chunkIdx)) {
    const barnSide = ((chunkIdx - 1) / 5) % 2 === 0 ? 1 : -1;
    const barnS = sStart + 36;
    const rc = getRoadCenter(barnS);
    const dist = 25;
    const bx = rc.x + rc.rx * (barnSide * dist);
    const bz = rc.z + rc.rz * (barnSide * dist);
    const by = getTerrainHeight(bx, bz);

    const barn = createRedBarn();
    barn.position.set(bx, by - 0.1, bz);
    barn.rotation.y = rc.heading + (barnSide > 0 ? -Math.PI * 0.42 : Math.PI * 0.42);
    group.add(barn);

    barnInfo = { x: bx, z: bz, radius: 18 };
    barnMarkers.set(chunkIdx, { x: bx, z: bz });
  }

  // ---- G. Wooden Split-Rail Fences along both sides ----
  const fencePosts = [];
  const fenceRails = [];
  const fenceStep = 4.0;
  for (const side of [-1, 1]) {
    if (rand() < 0.12 && chunkIdx > 1) continue; // occasional open meadow stretch
    let prevPt = null;
    for (let s = sStart; s <= sEnd; s += fenceStep) {
      const rc = getRoadCenter(s);
      const lat = side * 10.2;
      const fx = rc.x + rc.rx * lat;
      const fz = rc.z + rc.rz * lat;
      // Leave a driveway gap in front of barn
      if (barnInfo && Math.hypot(fx - barnInfo.x, fz - barnInfo.z) < 20) {
        prevPt = null;
        continue;
      }
      const fy = getTerrainHeight(fx, fz);
      fencePosts.push({ x: fx, y: fy, z: fz, rot: rc.heading });

      if (prevPt) {
        fenceRails.push({ a: prevPt, b: { x: fx, y: fy, z: fz } });
      }
      prevPt = { x: fx, y: fy, z: fz };
    }
  }
  if (fencePosts.length > 0) {
    const fPostInst = new THREE.InstancedMesh(fencePostGeo, fenceWoodMat, fencePosts.length);
    fPostInst.castShadow = true;
    fencePosts.forEach((p, idx) => {
      dummy.position.set(p.x, p.y - 0.08, p.z);
      dummy.rotation.set(0, p.rot, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      fPostInst.setMatrixAt(idx, dummy.matrix);
    });
    group.add(fPostInst);
  }
  if (fenceRails.length > 0) {
    const fRailInst = new THREE.InstancedMesh(fenceRailGeo, fenceWoodMat, fenceRails.length * 2);
    let rIdx = 0;
    const mid = new THREE.Vector3();
    const dir = new THREE.Vector3();
    const q = new THREE.Quaternion();
    const zAxis = new THREE.Vector3(0, 0, 1);
    for (const seg of fenceRails) {
      for (const h of [0.52, 0.95]) {
        const ax = seg.a.x, ay = seg.a.y + h, az = seg.a.z;
        const bx = seg.b.x, by = seg.b.y + h, bz = seg.b.z;
        mid.set((ax + bx) * 0.5, (ay + by) * 0.5, (az + bz) * 0.5);
        dir.set(bx - ax, by - ay, bz - az);
        const len = dir.length();
        dir.normalize();
        q.setFromUnitVectors(zAxis, dir);
        dummy.position.copy(mid);
        dummy.quaternion.copy(q);
        dummy.scale.set(1, 1, len);
        dummy.updateMatrix();
        fRailInst.setMatrixAt(rIdx++, dummy.matrix);
      }
    }
    group.add(fRailInst);
  }

  // ---- H. Dense Procedural Trees, Bushes & Grass Tufts (InstancedMesh) ----
  const decTrees = [];
  const pineTrees = [];
  const bushes = [];
  const grassClumps = [];

  const isClearOfBarn = (x, z, extra = 0) => {
    if (!barnInfo) return true;
    return Math.hypot(x - barnInfo.x, z - barnInfo.z) > barnInfo.radius + extra;
  };

  // Trees (dense forest & treeline along both sides)
  const treeAttempts = 105;
  for (let i = 0; i < treeAttempts; i++) {
    const s = sStart + rand() * CHUNK_LEN;
    const rc = getRoadCenter(s);
    const side = rand() > 0.5 ? 1 : -1;
    // Concentrate trees from 12m to 95m off the road
    const lat = side * (12.0 + Math.pow(rand(), 1.25) * 84.0);
    const wx = rc.x + rc.rx * lat;
    const wz = rc.z + rc.rz * lat;
    if (!isClearOfBarn(wx, wz, 2)) continue;
    const wy = getTerrainHeight(wx, wz);
    const scale = 0.78 + rand() * 0.85;
    if (rand() < 0.38) {
      pineTrees.push({ x: wx, y: wy, z: wz, scale, rot: rand() * Math.PI * 2 });
    } else {
      decTrees.push({ x: wx, y: wy, z: wz, scale, rot: rand() * Math.PI * 2 });
    }
  }

  // Bushes along roadside & tree bases
  const bushAttempts = 90;
  for (let i = 0; i < bushAttempts; i++) {
    const s = sStart + rand() * CHUNK_LEN;
    const rc = getRoadCenter(s);
    const side = rand() > 0.5 ? 1 : -1;
    const lat = side * (8.4 + Math.pow(rand(), 1.5) * 42.0);
    const wx = rc.x + rc.rx * lat;
    const wz = rc.z + rc.rz * lat;
    if (!isClearOfBarn(wx, wz, -2)) continue;
    const wy = getTerrainHeight(wx, wz);
    bushes.push({ x: wx, y: wy, z: wz, scale: 0.55 + rand() * 0.95, rot: rand() * Math.PI * 2 });
  }

  // Grass tufts near the road verge & meadows
  const grassCount = 220;
  for (let i = 0; i < grassCount; i++) {
    const s = sStart + rand() * CHUNK_LEN;
    const rc = getRoadCenter(s);
    const side = rand() > 0.5 ? 1 : -1;
    const lat = side * (6.3 + Math.pow(rand(), 1.6) * 26.0);
    const wx = rc.x + rc.rx * lat;
    const wz = rc.z + rc.rz * lat;
    if (!isClearOfBarn(wx, wz, -4)) continue;
    const wy = getTerrainHeight(wx, wz);
    grassClumps.push({ x: wx, y: wy, z: wz, scale: 0.7 + rand() * 0.85, rot: rand() * Math.PI });
  }

  const col = new THREE.Color();

  // Build deciduous trees (trunks + multi-lobe canopies)
  if (decTrees.length > 0) {
    const tInst = new THREE.InstancedMesh(trunkGeo, trunkMat, decTrees.length);
    const cInst = new THREE.InstancedMesh(canopyGeo, foliageMat, decTrees.length * 3);
    tInst.castShadow = true;
    cInst.castShadow = true;
    cInst.receiveShadow = true;

    let ci = 0;
    const foliagePalette = [0x4c822c, 0x5c9134, 0x6c9c38, 0x3d7024, 0x7ea13c, 0x8aa33b];
    for (let i = 0; i < decTrees.length; i++) {
      const tr = decTrees[i];
      dummy.position.set(tr.x, tr.y - 0.15, tr.z);
      dummy.rotation.set(0, tr.rot, 0);
      dummy.scale.set(tr.scale, tr.scale * 1.05, tr.scale);
      dummy.updateMatrix();
      tInst.setMatrixAt(i, dummy.matrix);

      const baseHex = foliagePalette[Math.floor(rand() * foliagePalette.length)];
      col.setHex(baseHex);

      // 3 overlapping foliage lobes for natural organic crown
      const lobes = [
        { ox: 0, oy: 4.5, oz: 0, sx: 1.12, sy: 0.96, sz: 1.12 },
        { ox: 0.85, oy: 3.85, oz: 0.45, sx: 0.82, sy: 0.76, sz: 0.82 },
        { ox: -0.78, oy: 3.95, oz: -0.42, sx: 0.84, sy: 0.78, sz: 0.84 }
      ];
      const cosR = Math.cos(tr.rot), sinR = Math.sin(tr.rot);
      for (const lb of lobes) {
        const lx = (lb.ox * cosR - lb.oz * sinR) * tr.scale;
        const lz = (lb.ox * sinR + lb.oz * cosR) * tr.scale;
        dummy.position.set(tr.x + lx, tr.y + lb.oy * tr.scale, tr.z + lz);
        dummy.rotation.set(rand() * 0.5, tr.rot + rand(), rand() * 0.5);
        dummy.scale.set(lb.sx * tr.scale, lb.sy * tr.scale, lb.sz * tr.scale);
        dummy.updateMatrix();
        cInst.setMatrixAt(ci, dummy.matrix);
        cInst.setColorAt(ci, col);
        ci++;
      }
    }
    group.add(tInst, cInst);
  }

  // Build pine trees
  if (pineTrees.length > 0) {
    const ptInst = new THREE.InstancedMesh(trunkGeo, trunkMat, pineTrees.length);
    const p1Inst = new THREE.InstancedMesh(pineGeo1, pineMat, pineTrees.length);
    const p2Inst = new THREE.InstancedMesh(pineGeo2, pineMat, pineTrees.length);
    p1Inst.castShadow = true;
    p2Inst.castShadow = true;
    const pinePalette = [0x2f5a27, 0x38662c, 0x2a4f24, 0x427031];
    for (let i = 0; i < pineTrees.length; i++) {
      const tr = pineTrees[i];
      dummy.position.set(tr.x, tr.y - 0.15, tr.z);
      dummy.rotation.set(0, tr.rot, 0);
      dummy.scale.set(tr.scale * 0.85, tr.scale * 0.7, tr.scale * 0.85);
      dummy.updateMatrix();
      ptInst.setMatrixAt(i, dummy.matrix);

      dummy.scale.set(tr.scale, tr.scale * 1.1, tr.scale);
      dummy.updateMatrix();
      p1Inst.setMatrixAt(i, dummy.matrix);
      p2Inst.setMatrixAt(i, dummy.matrix);

      col.setHex(pinePalette[Math.floor(rand() * pinePalette.length)]);
      p1Inst.setColorAt(i, col);
      p2Inst.setColorAt(i, col);
    }
    group.add(ptInst, p1Inst, p2Inst);
  }

  // Build bushes
  if (bushes.length > 0) {
    const bInst = new THREE.InstancedMesh(bushGeo, bushMat, bushes.length);
    bInst.castShadow = true;
    bInst.receiveShadow = true;
    const bushPalette = [0x4c7c2c, 0x5c8b34, 0x6f9638, 0x3f6d25];
    for (let i = 0; i < bushes.length; i++) {
      const b = bushes[i];
      dummy.position.set(b.x, b.y - 0.08, b.z);
      dummy.rotation.set(0, b.rot, 0);
      dummy.scale.set(b.scale, b.scale * 0.9, b.scale);
      dummy.updateMatrix();
      bInst.setMatrixAt(i, dummy.matrix);
      col.setHex(bushPalette[Math.floor(rand() * bushPalette.length)]);
      bInst.setColorAt(i, col);
    }
    group.add(bInst);
  }

  // Build grass tufts (2 crossed planes per tuft)
  if (grassClumps.length > 0) {
    const gInst = new THREE.InstancedMesh(grassBladeGeo, grassTuftMat, grassClumps.length * 2);
    const grassPalette = [0x789e3c, 0x8db044, 0x6b9134, 0xa8b54c];
    let gi = 0;
    for (let i = 0; i < grassClumps.length; i++) {
      const g = grassClumps[i];
      col.setHex(grassPalette[Math.floor(rand() * grassPalette.length)]);
      for (let k = 0; k < 2; k++) {
        dummy.position.set(g.x, g.y - 0.02, g.z);
        dummy.rotation.set(0, g.rot + k * Math.PI * 0.5, 0);
        dummy.scale.set(g.scale, g.scale, g.scale);
        dummy.updateMatrix();
        gInst.setMatrixAt(gi, dummy.matrix);
        gInst.setColorAt(gi, col);
        gi++;
      }
    }
    group.add(gInst);
  }

  scene.add(group);
  return { group, chunkIdx };
}

function disposeChunk(chunk) {
  scene.remove(chunk.group);
  chunk.group.traverse((obj) => {
    // Only dispose chunk-specific geometries (road, terrain, wires, barn gables)
    if (obj.isMesh && !obj.isInstancedMesh) {
      const g = obj.geometry;
      if (g && g !== poleGeo && g !== crossArmGeo && g !== insulatorGeo) {
        g.dispose();
      }
    }
  });
  barnMarkers.delete(chunk.chunkIdx);
}

let lastCenterChunk = -9999;
function updateWorldChunks(carZ) {
  const s = -carZ;
  const centerChunk = Math.floor(s / CHUNK_LEN);
  if (centerChunk === lastCenterChunk) return;
  lastCenterChunk = centerChunk;

  const minC = centerChunk - CHUNKS_BEHIND;
  const maxC = centerChunk + CHUNKS_AHEAD;

  for (const [idx, chunk] of activeChunks.entries()) {
    if (idx < minC || idx > maxC) {
      disposeChunk(chunk);
      activeChunks.delete(idx);
    }
  }
  for (let c = minC; c <= maxC; c++) {
    if (!activeChunks.has(c)) {
      activeChunks.set(c, buildChunk(c));
    }
  }
}

// 8. SKID MARKS (RING BUFFER MESH) & TYRE SMOKE (SPRITE POOL)

const MAX_SKID_QUADS = 440;
const skidPositions = new Float32Array(MAX_SKID_QUADS * 4 * 3);
const skidColors = new Float32Array(MAX_SKID_QUADS * 4 * 4);
const skidIndices = new Uint16Array(MAX_SKID_QUADS * 6);
for (let i = 0; i < MAX_SKID_QUADS; i++) {
  const v = i * 4;
  const idx = i * 6;
  skidIndices[idx] = v;
  skidIndices[idx + 1] = v + 1;
  skidIndices[idx + 2] = v + 2;
  skidIndices[idx + 3] = v + 1;
  skidIndices[idx + 4] = v + 3;
  skidIndices[idx + 5] = v + 2;
}
const skidGeo = new THREE.BufferGeometry();
const skidPosAttr = new THREE.BufferAttribute(skidPositions, 3);
skidPosAttr.setUsage(THREE.DynamicDrawUsage);
const skidColAttr = new THREE.BufferAttribute(skidColors, 4);
skidColAttr.setUsage(THREE.DynamicDrawUsage);
skidGeo.setAttribute('position', skidPosAttr);
skidGeo.setAttribute('color', skidColAttr);
skidGeo.setIndex(new THREE.BufferAttribute(skidIndices, 1));

const skidMat = new THREE.MeshBasicMaterial({
  vertexColors: true,
  transparent: true,
  depthWrite: false,
  side: THREE.DoubleSide,
  polygonOffset: true,
  polygonOffsetFactor: -2,
  polygonOffsetUnits: -2
});
const skidMesh = new THREE.Mesh(skidGeo, skidMat);
skidMesh.frustumCulled = false;
scene.add(skidMesh);

let skidWriteIdx = 0;
const prevRearWheelWorld = [null, null];

function addSkidSegment(p0, p1, rightVec, alpha, isDirt) {
  const halfW = 0.145;
  const baseV = skidWriteIdx * 4;
  const rx = rightVec.x * halfW;
  const rz = rightVec.z * halfW;
  const y0 = p0.y + 0.035;
  const y1 = p1.y + 0.035;

  const verts = [
    p0.x - rx, y0, p0.z - rz,
    p0.x + rx, y0, p0.z + rz,
    p1.x - rx, y1, p1.z - rz,
    p1.x + rx, y1, p1.z + rz
  ];
  for (let k = 0; k < 12; k++) {
    skidPositions[baseV * 3 + k] = verts[k];
  }
  const r = isDirt ? 0.28 : 0.07;
  const g = isDirt ? 0.22 : 0.07;
  const b = isDirt ? 0.14 : 0.08;
  for (let k = 0; k < 4; k++) {
    const ci = (baseV + k) * 4;
    skidColors[ci] = r;
    skidColors[ci + 1] = g;
    skidColors[ci + 2] = b;
    skidColors[ci + 3] = alpha;
  }
  skidWriteIdx = (skidWriteIdx + 1) % MAX_SKID_QUADS;
  skidPosAttr.needsUpdate = true;
  skidColAttr.needsUpdate = true;
}

// Tyre Smoke Particle Pool
const SMOKE_POOL_SIZE = 110;
const smokeParticles = [];
for (let i = 0; i < SMOKE_POOL_SIZE; i++) {
  const mat = new THREE.SpriteMaterial({
    map: smokeTex,
    color: 0xf4f0ea,
    transparent: true,
    opacity: 0,
    depthWrite: false
  });
  const sprite = new THREE.Sprite(mat);
  sprite.visible = false;
  scene.add(sprite);
  smokeParticles.push({
    sprite,
    mat,
    age: 999,
    life: 1,
    vx: 0, vy: 0, vz: 0,
    startScale: 0.5,
    endScale: 2.5,
    peakOpacity: 0.45
  });
}
let smokeCursor = 0;

function spawnSmoke(pos, carVelX, carVelZ, intensity, isDirt) {
  const p = smokeParticles[smokeCursor];
  smokeCursor = (smokeCursor + 1) % SMOKE_POOL_SIZE;
  p.age = 0;
  p.life = 0.65 + Math.random() * 0.55;
  p.sprite.position.set(
    pos.x + (Math.random() - 0.5) * 0.25,
    pos.y + 0.18 + Math.random() * 0.12,
    pos.z + (Math.random() - 0.5) * 0.25
  );
  p.vx = carVelX * 0.18 + (Math.random() - 0.5) * 1.4;
  p.vy = 0.85 + Math.random() * 0.9;
  p.vz = carVelZ * 0.18 + (Math.random() - 0.5) * 1.4;
  p.startScale = 0.42 + intensity * 0.25;
  p.endScale = 2.0 + intensity * 1.5;
  p.peakOpacity = Math.min(0.62, 0.26 + intensity * 0.36);
  p.mat.color.setHex(isDirt ? 0xc2ab84 : 0xf2efea);
  p.sprite.scale.setScalar(p.startScale);
  p.sprite.visible = true;
}

function updateSmoke(dt) {
  for (let i = 0; i < SMOKE_POOL_SIZE; i++) {
    const p = smokeParticles[i];
    if (p.age >= p.life) continue;
    p.age += dt;
    const t = p.age / p.life;
    if (t >= 1) {
      p.sprite.visible = false;
      p.mat.opacity = 0;
      continue;
    }
    p.sprite.position.x += p.vx * dt;
    p.sprite.position.y += p.vy * dt;
    p.sprite.position.z += p.vz * dt;
    p.vx *= 0.96;
    p.vz *= 0.96;
    p.vy *= 0.98;

    const sc = p.startScale + (p.endScale - p.startScale) * Math.pow(t, 0.72);
    p.sprite.scale.setScalar(sc);
    const fadeIn = Math.min(1, t * 5.0);
    const fadeOut = Math.pow(1 - t, 1.5);
    p.mat.opacity = p.peakOpacity * fadeIn * fadeOut;
  }
}

const keys = {

  down: false,
  left: false,
  right: false,
  handbrake: false
};
let hasDriven = false;
const controlsHintEl = document.getElementById('controls-hint');

function setKey(code, pressed) {
  switch (code) {
    case 'KeyW': case 'ArrowUp': keys.up = pressed; break;
    case 'KeyS': case 'ArrowDown': keys.down = pressed; break;
    case 'KeyA': case 'ArrowLeft': keys.left = pressed; break;
    case 'KeyD': case 'ArrowRight': keys.right = pressed; break;
    case 'Space': keys.handbrake = pressed; break;
    default: return false;
  }
  if (pressed && !hasDriven) {
    hasDriven = true;
    setTimeout(() => { controlsHintEl.style.opacity = '0.52'; }, 3500);
  }
  return true;
}

window.addEventListener('keydown', (e) => {
  if (setKey(e.code, true)) e.preventDefault();
});
window.addEventListener('keyup', (e) => {
  setKey(e.code, false);
});
window.addEventListener('blur', () => {

});

// Initialize car at s = 8 in the right-hand lane
const startRC = getRoadCenter(8);
const carState = {
  x: startRC.x + startRC.rx * 2.35,
  y: startRC.y,
  z: startRC.z + startRC.rz * 2.35,
  yaw: startRC.heading,
  speed: 0,       // m/s along car forward
  latVel: 0,      // m/s along car right (drift slip)
  steer: 0,       // current front wheel steer angle (rad)
  wheelSpin: 0,
  roll: 0,
  pitch: 0,
  pitchGround: 0,
  rollGround: 0,
  smokeTimer: 0
};

// Pre-build initial chunks around start
updateWorldChunks(carState.z);

// Chase camera state
const camPos = new THREE.Vector3();
const camLook = new THREE.Vector3();
{
  const fx = -Math.sin(carState.yaw);
  const fz = -Math.cos(carState.yaw);
  camPos.set(carState.x - fx * 7.8, carState.y + 3.2, carState.z - fz * 7.8);
  camLook.set(carState.x + fx * 4.0, carState.y + 1.2, carState.z + fz * 4.0);
  camera.position.copy(camPos);
  camera.lookAt(camLook);
}

const tmpVecA = new THREE.Vector3();
const tmpVecB = new THREE.Vector3();
const tmpRight = new THREE.Vector3();

function updateCarPhysics(dt, elapsed) {
  const throttle = keys.up ? 1 : 0;
  const brakeInput = keys.down ? 1 : 0;
  const steerInput = (keys.left ? 1 : 0) - (keys.right ? 1 : 0);
  const handbrake = keys.handbrake;

  // Check road proximity
  const rc = getRoadCenter(-carState.z);
  const lateralOffset = (carState.x - rc.x) * rc.rx;
  const offRoad = Math.abs(lateralOffset) > ROAD_HALF_WIDTH + 0.4;

  // Longitudinal acceleration / braking / reverse
  const maxFwdSpeed = offRoad ? 28.0 : 52.0; // ~116 mph on asphalt
  const maxRevSpeed = -14.0;
  let accel = 0;
  let isBraking = false;

  if (throttle) {
    const speedRatio = Math.max(0, carState.speed / maxFwdSpeed);
    accel += (19.5 * (1 - 0.58 * speedRatio));
  }
  if (brakeInput) {
    if (carState.speed > 0.8) {
      accel -= 32.0;
      isBraking = true;
    } else {
      accel -= 11.5;
    }
  }
  if (handbrake) {
    const sign = Math.sign(carState.speed);
    accel -= sign * 18.0;
    isBraking = true;
  }

  // Rolling resistance + aerodynamic drag + off-road grass drag
  const drag = (offRoad ? 0.95 : 0.22) * carState.speed + 0.0042 * carState.speed * Math.abs(carState.speed);
  accel -= drag;

  const prevSpeed = carState.speed;
  carState.speed += accel * dt;
  if (!throttle && !brakeInput && Math.abs(carState.speed) < 0.15) {
    carState.speed = 0;
  }
  carState.speed = Math.max(maxRevSpeed, Math.min(maxFwdSpeed, carState.speed));

  // Steering response (smoothly interpolated, speed-sensitive)
  const maxSteer = 0.44 / (1 + Math.abs(carState.speed) * 0.022);
  const targetSteer = steerInput * maxSteer;
  const steerRate = steerInput !== 0 ? 7.5 : 9.5;
  carState.steer += (targetSteer - carState.steer) * Math.min(1, steerRate * dt);

  // Yaw update (turning)
  const turnSign = carState.speed >= -0.1 ? 1 : -1;
  const speedFactor = Math.min(1, Math.abs(carState.speed) / 4.5);
  const driftBoost = handbrake ? 1.38 : 1.0;
  const yawRate = carState.steer * 2.55 * speedFactor * turnSign * driftBoost;
  carState.yaw += yawRate * dt;

  // Lateral velocity (arcade drift & grip)
  const lateralImpulse = carState.speed * yawRate * (handbrake ? 0.62 : 0.28);
  carState.latVel += lateralImpulse * dt;
  const grip = handbrake ? 2.3 : (offRoad ? 4.4 : 7.8);
  carState.latVel *= Math.exp(-grip * dt);

  // Move car in world XZ
  const fx = -Math.sin(carState.yaw);
  const fz = -Math.cos(carState.yaw);
  const rx = Math.cos(carState.yaw);
  const rz = -Math.sin(carState.yaw);

  const worldVx = fx * carState.speed + rx * carState.latVel;
  const worldVz = fz * carState.speed + rz * carState.latVel;

  carState.x += worldVx * dt;
  carState.z += worldVz * dt;

  // Soft roadside boundary so the player stays in the scenic corridor
  const newRC = getRoadCenter(-carState.z);
  const newLat = (carState.x - newRC.x) * newRC.rx;
  const maxLat = 16.5;
  if (Math.abs(newLat) > maxLat) {
    const excess = Math.sign(newLat) * (Math.abs(newLat) - maxLat);
    carState.x -= newRC.rx * excess;
    carState.z -= newRC.rz * excess;
    carState.latVel *= 0.4;
    carState.speed *= 0.94;
  }

  // Sample ground height at center, front/rear, left/right for hill pitch & roll
  const hCenter = getRoadSurfaceHeight(carState.x, carState.z);
  const hFront = getRoadSurfaceHeight(carState.x + fx * 1.4, carState.z + fz * 1.4);
  const hRear = getRoadSurfaceHeight(carState.x - fx * 1.4, carState.z - fz * 1.4);
  const hLeft = getRoadSurfaceHeight(carState.x - rx * 0.95, carState.z - rz * 0.95);
  const hRight = getRoadSurfaceHeight(carState.x + rx * 0.95, carState.z + rz * 0.95);

  carState.y = hCenter;
  const targetGroundPitch = Math.atan2(hFront - hRear, 2.8);
  const targetGroundRoll = Math.atan2(hLeft - hRight, 1.9);
  carState.pitchGround += (targetGroundPitch - carState.pitchGround) * Math.min(1, 14 * dt);
  carState.rollGround += (targetGroundRoll - carState.rollGround) * Math.min(1, 14 * dt);

  // Arcade body roll & pitch (suspension weight transfer)
  const latAccel = carState.speed * yawRate;
  const longAccel = (carState.speed - prevSpeed) / Math.max(dt, 0.001);
  const targetRoll = Math.max(-0.115, Math.min(0.115, -latAccel * 0.0095));
  const targetPitch = Math.max(-0.065, Math.min(0.065, longAccel * 0.0026));
  carState.roll += (targetRoll - carState.roll) * Math.min(1, 9.0 * dt);
  carState.pitch += (targetPitch - carState.pitch) * Math.min(1, 8.5 * dt);

  // Subtle road vibration & suspension bounce
  const bumpAmp = (offRoad ? 0.032 : 0.009) * Math.min(1, Math.abs(carState.speed) / 14);
  const bumpY = Math.sin(elapsed * 22 + carState.z * 0.6) * bumpAmp;

  // Apply transforms to car root & chassis
  car.root.position.set(carState.x, carState.y, carState.z);
  car.root.rotation.order = 'YXZ';
  car.root.rotation.set(carState.pitchGround, carState.yaw, carState.rollGround);

  car.chassis.position.y = bumpY;
  car.chassis.rotation.x = carState.pitch;
  car.chassis.rotation.z = carState.roll;

  // Wheel spin & front wheel steer
  const spinDelta = (carState.speed / car.wheelRadius) * dt;
  carState.wheelSpin -= spinDelta;
  for (let i = 0; i < car.wheels.length; i++) {
    car.wheels[i].rotation.x = carState.wheelSpin;
  }
  for (let i = 0; i < car.frontPivots.length; i++) {
    car.frontPivots[i].rotation.y = carState.steer * 1.15;
  }
  car.steeringWheel.rotation.z = carState.steer * 2.4;

  // Taillights brighten on brake
  car.taillightMat.emissiveIntensity = isBraking ? 2.6 : 0.65;

  // Animate passenger's raised arms & scarf in the wind
  const windFactor = Math.min(1.4, Math.abs(carState.speed) / 26);
  const sway = Math.sin(elapsed * (3.2 + windFactor * 3.8));
  const sway2 = Math.cos(elapsed * (2.7 + windFactor * 3.2) + 0.8);
  car.passenger.leftArm.rotation.z = sway * (0.10 + windFactor * 0.09) + carState.roll * 1.4;
  car.passenger.leftArm.rotation.x = -0.10 - windFactor * 0.14 + sway2 * 0.06;
  car.passenger.rightArm.rotation.z = sway2 * (0.10 + windFactor * 0.09) + carState.roll * 1.4;
  car.passenger.rightArm.rotation.x = -0.10 - windFactor * 0.14 - sway * 0.06;
  car.passenger.scarf.rotation.y = Math.sin(elapsed * (8 + windFactor * 14)) * (0.15 + windFactor * 0.25);
  car.passenger.scarf.rotation.x = 0.08 + windFactor * 0.22 + Math.cos(elapsed * 12) * 0.06;
  car.passenger.hairBack.rotation.x = Math.PI * (0.40 + windFactor * 0.08);

  // ---- TYRE SMOKE & SKID MARKS ----
  const absSpeed = Math.abs(carState.speed);
  const slipRatio = Math.abs(carState.latVel) / 3.4;
  const hardBrakeSlip = (isBraking && absSpeed > 9.5) ? 0.75 : 0;
  const burnoutSlip = (throttle && absSpeed > 0.5 && absSpeed < 7.0 && handbrake) ? 0.85 : 0;
  const slipIntensity = Math.min(1, Math.max(slipRatio, hardBrakeSlip, burnoutSlip));
  const isSkidding = (slipIntensity > 0.34 && absSpeed > 3.5) || (handbrake && absSpeed > 5.0);

  car.root.updateMatrixWorld();
  tmpRight.set(rx, 0, rz);

  if (isSkidding) {
    carState.smokeTimer += dt;
    const emitSmoke = carState.smokeTimer >= 0.028;
    if (emitSmoke) carState.smokeTimer = 0;

    for (let w = 0; w < 2; w++) {
      tmpVecA.copy(car.rearLocalOffsets[w]).applyMatrix4(car.root.matrixWorld);
      tmpVecA.y = getRoadSurfaceHeight(tmpVecA.x, tmpVecA.z);

      if (prevRearWheelWorld[w]) {
        const distSq = prevRearWheelWorld[w].distanceToSquared(tmpVecA);
        if (distSq > 0.04 && distSq < 18.0) {
          const alpha = Math.min(0.62, 0.22 + slipIntensity * 0.42);
          addSkidSegment(prevRearWheelWorld[w], tmpVecA, tmpRight, alpha, offRoad);
          prevRearWheelWorld[w].copy(tmpVecA);
        } else if (distSq >= 18.0) {
          prevRearWheelWorld[w].copy(tmpVecA);
        }
      } else {
        prevRearWheelWorld[w] = tmpVecA.clone();
      }

      if (emitSmoke) {
        spawnSmoke(tmpVecA, worldVx, worldVz, slipIntensity, offRoad);
      }
    }
  } else {
    prevRearWheelWorld[0] = null;
    prevRearWheelWorld[1] = null;
  }
}

// 10. THIRD-PERSON CHASE CAMERA
// ============================================================================
function updateChaseCamera(dt) {
  const fx = -Math.sin(carState.yaw);
  const fz = -Math.cos(carState.yaw);
  const speedRatio = Math.min(1, Math.abs(carState.speed) / 48);

  const dist = 7.4 + speedRatio * 1.45;
  const height = 2.95 + speedRatio * 0.25;

  const desiredPos = tmpVecA.set(
    carState.x - fx * dist,
    carState.y + height,
    carState.z - fz * dist
  );
  // Keep camera safely above hills behind the car
  const groundAtCam = getRoadSurfaceHeight(desiredPos.x, desiredPos.z);
  if (desiredPos.y < groundAtCam + 1.35) {
    desiredPos.y = groundAtCam + 1.35;
  }

  const posSmooth = 1 - Math.exp(-7.5 * dt);
  camPos.lerp(desiredPos, posSmooth);

  const desiredLook = tmpVecB.set(
    carState.x + fx * (4.2 + speedRatio * 2.5),
    carState.y + 1.35,
    carState.z + fz * (4.2 + speedRatio * 2.5)
  );
  const lookSmooth = 1 - Math.exp(-11.0 * dt);
  camLook.lerp(desiredLook, lookSmooth);

  camera.position.copy(camPos);
  camera.lookAt(camLook);

  // Subtle dynamic FOV kick with speed
  const targetFov = 56 + speedRatio * 11;
  if (Math.abs(camera.fov - targetFov) > 0.05) {
    camera.fov += (targetFov - camera.fov) * Math.min(1, 5 * dt);
    camera.updateProjectionMatrix();
  }

  // Keep sky dome & directional sun shadow frustum centered on the car
  skyDome.position.set(carState.x, carState.y, carState.z);
  sunLight.position.set(
    carState.x + sunDir.x * 95,
    carState.y + sunDir.y * 95,
    carState.z + sunDir.z * 95
  );
  sunLight.target.position.set(carState.x, carState.y, carState.z);
  sunLight.target.updateMatrixWorld();
}

// 11. HUD: SPEEDOMETER (MPH) & MINIMAP
// ============================================================================
const speedoCanvas = document.getElementById('speedo');
const speedoCtx = speedoCanvas.getContext('2d');
const minimapCanvas = document.getElementById('minimap');
const minimapCtx = minimapCanvas.getContext('2d');

function drawSpeedometer(speedMs) {
  const ctx = speedoCtx;
  const w = speedoCanvas.width;
  const h = speedoCanvas.height;
  const cx = w * 0.5;
  const cy = h * 0.5;
  const r = w * 0.43;

  ctx.clearRect(0, 0, w, h);

  const mph = Math.abs(speedMs) * 2.23694;
  const maxMph = 120;
  const startAng = Math.PI * 0.75; // 135 deg
  const endAng = Math.PI * 2.25;   // 405 deg
  const span = endAng - startAng;

  // Outer dial track
  ctx.beginPath();
  ctx.arc(cx, cy, r, startAng, endAng);
  ctx.strokeStyle = 'rgba(255, 240, 220, 0.16)';
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Redline zone (95-120 mph)
  const redStart = startAng + (95 / maxMph) * span;
  ctx.beginPath();
  ctx.arc(cx, cy, r, redStart, endAng);
  ctx.strokeStyle = 'rgba(226, 48, 42, 0.72)';
  ctx.lineWidth = 10;
  ctx.stroke();

  // Active speed arc
  const clamped = Math.min(maxMph, mph);
  const valAng = startAng + (clamped / maxMph) * span;
  if (clamped > 0.5) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, startAng, valAng);
    ctx.strokeStyle = clamped > 95 ? '#ff4638' : '#f7b944';
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // Ticks & labels
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let v = 0; v <= maxMph; v += 10) {
    const ang = startAng + (v / maxMph) * span;
    const isMajor = v % 20 === 0;
    const inner = r - (isMajor ? 22 : 14);
    const outer = r - 6;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang) * inner, cy + Math.sin(ang) * inner);
    ctx.lineTo(cx + Math.cos(ang) * outer, cy + Math.sin(ang) * outer);
    ctx.strokeStyle = v >= 100 ? '#ff6a5c' : 'rgba(255, 245, 232, 0.85)';
    ctx.lineWidth = isMajor ? 3 : 1.6;
    ctx.stroke();

    if (isMajor) {
      const lr = r - 40;
      ctx.font = '600 18px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillStyle = v >= 100 ? '#ff7c6e' : 'rgba(255, 245, 232, 0.86)';
      ctx.fillText(String(v), cx + Math.cos(ang) * lr, cy + Math.sin(ang) * lr);
    }
  }

  // Needle
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(valAng);
  ctx.beginPath();
  ctx.moveTo(-18, -4);
  ctx.lineTo(r - 18, 0);
  ctx.lineTo(-18, 4);
  ctx.closePath();
  ctx.fillStyle = '#eb2f28';
  ctx.fill();
  ctx.restore();

  // Center hub
  ctx.beginPath();
  ctx.arc(cx, cy, 12, 0, Math.PI * 2);
  ctx.fillStyle = '#e5ded4';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, 6, 0, Math.PI * 2);
  ctx.fillStyle = '#1c1a18';
  ctx.fill();

  // Digital MPH readout & gear
  ctx.font = '700 42px -apple-system, BlinkMacSystemFont, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(String(Math.round(mph)), cx, cy + 56);

  ctx.font = '700 15px -apple-system, BlinkMacSystemFont, sans-serif';
  ctx.fillStyle = 'rgba(255, 224, 180, 0.84)';
  ctx.fillText('MPH', cx, cy + 84);

  const gear = speedMs < -0.5 ? 'R' : (mph < 2 ? 'N' : String(Math.min(5, 1 + Math.floor(mph / 22))));
  ctx.font = '700 16px -apple-system, BlinkMacSystemFont, sans-serif';
  ctx.fillStyle = '#f7b944';
  ctx.fillText(gear, cx, cy - 42);
}

function drawMinimap() {
  const ctx = minimapCtx;
  const w = minimapCanvas.width;
  const h = minimapCanvas.height;
  const cx = w * 0.5;
  const cy = h * 0.62;
  const scale = 0.88; // pixels per meter

  ctx.clearRect(0, 0, w, h);

  // Subtle green countryside backdrop
  ctx.fillStyle = 'rgba(54, 78, 40, 0.36)';
  ctx.fillRect(0, 0, w, h);

  // Transform world -> car-heading-up minimap coordinates
  const cosY = Math.cos(carState.yaw);
  const sinY = Math.sin(carState.yaw);
  const toMap = (wx, wz) => {
    const dx = wx - carState.x;
    const dz = wz - carState.z;
    // Car forward is (-sinY, -cosY), car right is (cosY, -sinY)
    const localRight = dx * cosY - dz * sinY;
    const localFwd = -dx * sinY - dz * cosY;
    return [cx + localRight * scale, cy - localFwd * scale];
  };

  // Sample road centerline behind & ahead of the car
  const carS = -carState.z;
  const sMin = carS - 110;
  const sMax = carS + 260;
  const step = 6;

  // Road asphalt ribbon
  ctx.beginPath();
  let first = true;
  for (let s = sMin; s <= sMax; s += step) {
    const rc = getRoadCenter(s);
    const [mx, my] = toMap(rc.x, rc.z);
    if (first) { ctx.moveTo(mx, my); first = false; }
    else ctx.lineTo(mx, my);
  }
  ctx.strokeStyle = 'rgba(235, 228, 214, 0.85)';
  ctx.lineWidth = 14;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Dark asphalt fill
  ctx.strokeStyle = '#3b3c40';
  ctx.lineWidth = 10;
  ctx.stroke();

  // Yellow center line
  ctx.strokeStyle = '#e5b232';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Draw nearby red barns on minimap
  for (const b of barnMarkers.values()) {
    const [bx, by] = toMap(b.x, b.z);
    if (bx > -15 && bx < w + 15 && by > -15 && by < h + 15) {
      ctx.fillStyle = '#c82822';
      ctx.strokeStyle = '#fff5ea';
      ctx.lineWidth = 2;
      ctx.fillRect(bx - 6, by - 6, 12, 12);
      ctx.strokeRect(bx - 6, by - 6, 12, 12);
    }
  }

  // Car directional chevron in center
  ctx.save();
  ctx.translate(cx, cy);
  ctx.beginPath();
  ctx.moveTo(0, -13);
  ctx.lineTo(9, 10);
  ctx.lineTo(0, 5);
  ctx.lineTo(-9, 10);
  ctx.closePath();
  ctx.fillStyle = '#e62424';
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = '#ffffff';
  ctx.stroke();
  ctx.restore();
}

// ============================================================================
// 12. RESIZE HANDLER & MAIN ANIMATION LOOP
// ============================================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  elapsed += dt;

  skyDome.material.uniforms.uTime.value = elapsed;

  updateCarPhysics(dt, elapsed);
  updateWorldChunks(carState.z);
  updateSmoke(dt);
  updateChaseCamera(dt);

  drawSpeedometer(carState.speed);
  drawMinimap();

  renderer.render(scene, camera);
}

animate();
</script>
