<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>macOS Dock Fight — ChatGPT vs Claude</title>
<style>
  :root {
    --gpt-green: #10a37f;
    --gpt-glow: #34d399;
    --claude-coral: #d97757;
    --claude-warm: #f5c2a8;
    --glass-bg: rgba(28, 28, 36, 0.48);
    --glass-border: rgba(255, 255, 255, 0.22);
    --menubar-h: 28px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background: #0b1021;
    color: #fff;
  }

  /* macOS Wallpaper */
  #desktop {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
      radial-gradient(ellipse 85% 60% at 22% 18%, rgba(56, 189, 248, 0.28), transparent 60%),
      radial-gradient(ellipse 75% 65% at 78% 24%, rgba(217, 119, 87, 0.30), transparent 62%),
      radial-gradient(ellipse 90% 55% at 50% 88%, rgba(16, 163, 127, 0.24), transparent 65%),
      radial-gradient(ellipse 65% 50% at 55% 48%, rgba(139, 92, 246, 0.22), transparent 60%),
      linear-gradient(160deg, #0b1228 0%, #151835 38%, #1f1b38 68%, #10172a 100%);
  }

  /* Subtle stylized macOS mountain/aurora waves */
  .wallpaper-wave {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .wallpaper-wave svg {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 62%;
    opacity: 0.55;
  }

  /* macOS Menu Bar */
  #menubar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--menubar-h);
    padding: 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(18, 20, 32, 0.48);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 13px;
    font-weight: 500;
    z-index: 40;
    color: rgba(255, 255, 255, 0.92);
  }
  .menubar-left, .menubar-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .menubar-item {
    cursor: default;
    opacity: 0.88;
    letter-spacing: -0.01em;
  }
  .menubar-item.bold {
    font-weight: 700;
    opacity: 1;
  }
  .apple-logo {
    width: 13px;
    height: 15px;
    fill: currentColor;
    transform: translateY(-1px);
  }

  /* Fight HUD (HP Bars & Round Banner) */
  #hud {
    position: fixed;
    top: calc(var(--menubar-h) + 14px);
    left: 50%;
    transform: translateX(-50%) translateY(-120px);
    width: min(760px, 92vw);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 14px;
    z-index: 30;
    transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
    opacity: 0;
    pointer-events: none;
  }
  #hud.visible {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .fighter-hud {
    background: rgba(16, 18, 28, 0.62);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 14px;
    padding: 9px 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
  .fighter-hud-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .fighter-hud.right .fighter-hud-header {
    flex-direction: row-reverse;
  }
  .fighter-tag {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .fighter-hud.right .fighter-tag {
    flex-direction: row-reverse;
  }
  .fighter-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
  }
  .fighter-dot.gpt { background: var(--gpt-green); box-shadow: 0 0 10px var(--gpt-glow); }
  .fighter-dot.claude { background: var(--claude-coral); box-shadow: 0 0 10px var(--claude-coral); }

  .hp-track {
    position: relative;
    height: 11px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.11);
    overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
  }
  .hp-trail, .hp-fill {
    position: absolute;
    top: 0;
    bottom: 0;
    border-radius: 999px;
  }
  .fighter-hud.left .hp-trail,
  .fighter-hud.left .hp-fill { left: 0; }
  .fighter-hud.right .hp-trail,
  .fighter-hud.right .hp-fill { right: 0; }

  .hp-trail {
    background: rgba(255, 255, 255, 0.45);
    transition: width 0.55s ease;
  }
  .hp-fill.gpt {
    background: linear-gradient(90deg, #059669, #10a37f, #34d399);
    box-shadow: 0 0 12px rgba(16, 163, 127, 0.65);
    transition: width 0.16s ease-out;
  }
  .hp-fill.claude {
    background: linear-gradient(270deg, #c25e3e, #d97757, #f59e7a);
    box-shadow: 0 0 12px rgba(217, 119, 87, 0.65);
    transition: width 0.16s ease-out;
  }

  .vs-badge {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(16, 163, 127, 0.85), rgba(217, 119, 87, 0.85));
    border: 1px solid rgba(255, 255, 255, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 16px;
    letter-spacing: 0.04em;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }

  /* Center Announcement Banner */
  #banner {
    position: fixed;
    top: 34%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.7);
    z-index: 35;
    pointer-events: none;
    text-align: center;
    opacity: 0;
    transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
  }
  #banner.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
  #banner-title {
    font-size: clamp(32px, 5.4vw, 62px);
    font-weight: 900;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    text-shadow: 0 6px 32px rgba(0, 0, 0, 0.65), 0 2px 0 rgba(0, 0, 0, 0.45);
  }
  #banner-sub {
    margin-top: 6px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.82);
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7);
  }

  /* Floating Control Pill */
  #controls {
    position: fixed;
    top: calc(var(--menubar-h) + 14px);
    right: 16px;
    display: flex;
    gap: 8px;
    z-index: 36;
  }
  .ctrl-btn {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(20, 22, 34, 0.58);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: rgba(255, 255, 255, 0.92);
    font-size: 12px;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.14s ease, background 0.16s ease, border-color 0.16s ease;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
  }
  .ctrl-btn:hover {
    background: rgba(38, 42, 62, 0.78);
    border-color: rgba(255, 255, 255, 0.38);
    transform: translateY(-1px);
  }
  .ctrl-btn:active {
    transform: translateY(0) scale(0.97);
  }
  .ctrl-btn.active {
    background: rgba(255, 255, 255, 0.22);
    border-color: rgba(255, 255, 255, 0.55);
  }

  /* Hint pill */
  #hint {
    position: fixed;
    bottom: 108px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: rgba(255, 255, 255, 0.65);
    background: rgba(15, 18, 30, 0.45);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    pointer-events: none;
    z-index: 25;
    transition: opacity 0.5s ease;
  }

  /* Fight Canvas */
  #arena {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 20;
    cursor: crosshair;
  }

  /* macOS Dock */
  #dock-wrap {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 28;
    pointer-events: auto;
  }
  #dock {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 9px 14px 10px;
    background: rgba(30, 32, 46, 0.44);
    backdrop-filter: blur(26px) saturate(180%);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.24);
    border-radius: 22px;
    box-shadow:
      0 18px 46px rgba(0, 0, 0, 0.52),
      inset 0 1px 0 rgba(255, 255, 255, 0.24);
  }

  .dock-item {
    position: relative;
    width: 58px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), margin 0.18s ease;
    transform-origin: bottom center;
  }
  .dock-item:hover {
    transform: translateY(-10px) scale(1.18);
    margin: 0 5px;
  }
  .dock-item .tooltip {
    position: absolute;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(24, 26, 36, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #fff;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: 6px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.14s ease;
  }
  .dock-item:hover .tooltip {
    opacity: 1;
  }

  .dock-icon {
    width: 54px;
    height: 54px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.38), inset 0 1px 1px rgba(255, 255, 255, 0.35);
    transition: opacity 0.22s ease, transform 0.22s ease;
    overflow: hidden;
  }
  .dock-item.running::after {
    content: "";
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.85);
  }

  .dock-item.rattling .dock-icon {
    animation: dockRattle 0.12s infinite alternate;
  }
  @keyframes dockRattle {
    0% { transform: translate(-2px, 0) rotate(-4deg) scale(1.06); }
    100% { transform: translate(2px, -2px) rotate(4deg) scale(1.08); }
  }

  /* Empty glowing slot when icon jumps out */
  .dock-item.vacated .dock-icon {
    opacity: 0;
    transform: scale(0.2) translateY(-30px);
    pointer-events: none;
  }
  .dock-item.vacated::before {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 12px;
    border: 1.5px dashed rgba(255, 255, 255, 0.26);
    background: rgba(255, 255, 255, 0.05);
  }

  .dock-item.jiggle {
    animation: dockJiggle 0.36s ease;
  }
  @keyframes dockJiggle {
    0% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-9px) scale(0.95, 1.07); }
    65% { transform: translateY(2px) scale(1.04, 0.96); }
    100% { transform: translateY(0) scale(1); }
  }

  .dock-divider {
    width: 1px;
    height: 44px;
    background: rgba(255, 255, 255, 0.22);
    margin: 0 4px 5px;
  }

  @media (max-width: 720px) {
    .dock-item { width: 44px; height: 44px; }
    .dock-icon { width: 42px; height: 42px; border-radius: 10px; }
    #dock { gap: 6px; padding: 7px 10px; }
    #controls { top: auto; bottom: 86px; right: 10px; }
    #hint { display: none; }
  }
</style>
</head>

<div id="desktop">
  <div class="wallpaper-wave">
    <svg viewBox="0 0 1440 540" preserveAspectRatio="none">

      <span class="menubar-item bold">Finder</span>
      <span class="menubar-item">File</span>

      <span class="menubar-item">Arena</span>
      <span class="menubar-item">Window</span>
      <span class="menubar-item">Help</span>

    <div class="menubar-right">

  <!-- Fight HUD -->

      <div class="fighter-hud-header">

    <div class="vs-badge">VS</div>
    <div class="fighter-hud right">
      <div class="fighter-hud-header">
        <span class="fighter-tag"><span class="fighter-dot claude"></span>Claude</span>

      <div class="hp-track">
        <div class="hp-trail" id="claude-hp-trail" style="width: 100%"></div>
        <div class="hp-fill claude" id="claude-hp-fill" style="width: 100%"></div>

  <!-- Floating Controls -->
  <div id="controls">
    <button class="ctrl-btn" id="btn-rematch" title="Restart fight from the dock">Rematch</button>

      <!-- Terminal -->

      <!-- ChatGPT -->

<script>
(() => {
  'use strict';

  // ---------- DOM & Canvas Setup ----------
  const canvas = document.getElementById('arena');
  const ctx = canvas.getContext('2d');
  const hudEl = document.getElementById('hud');
  const bannerEl = document.getElementById('banner');
  const bannerTitle = document.getElementById('banner-title');
  const bannerSub = document.getElementById('banner-sub');
  const hintEl = document.getElementById('hint');
  const scoreReadout = document.getElementById('score-readout');
  const clockEl = document.getElementById('clock');
  const dockEl = document.getElementById('dock');
  const dockChatGPT = document.getElementById('dock-chatgpt');
  const dockClaude = document.getElementById('dock-claude');
  const allDockItems = Array.from(document.querySelectorAll('.dock-item'));

  const gptHpFill = document.getElementById('gpt-hp-fill');
  const gptHpTrail = document.getElementById('gpt-hp-trail');
  const gptHpText = document.getElementById('gpt-hp-text');
  const claudeHpFill = document.getElementById('claude-hp-fill');
  const claudeHpTrail = document.getElementById('claude-hp-trail');
  const claudeHpText = document.getElementById('claude-hp-text');

  const btnRematch = document.getElementById('btn-rematch');
  const btnSlowmo = document.getElementById('btn-slowmo');
  const btnSfx = document.getElementById('btn-sfx');

  let W = window.innerWidth;
  let H = window.innerHeight;
  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let FLOOR_Y = H - 102;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const dockRect = dockEl.getBoundingClientRect();
    FLOOR_Y = Math.max(H - 120, dockRect.top - 10);
  }
  window.addEventListener('resize', resize);
  resize();

  function updateClock() {
    const now = new Date();
    clockEl.textContent = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  updateClock();
  setInterval(updateClock, 15000);

  // ---------- Synthesized Web Audio SFX ----------
  const SFX = {
    enabled: true,
    ctx: null,
    ensure() {
      if (!this.enabled) return null;
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
      return this.ctx;
    },
    tone(freq, endFreq, dur, type = 'sine', gainVal = 0.14) {
      const ac = this.ensure();
      if (!ac) return;
      const t = ac.currentTime;
      const osc = ac.createOscillator();
      const g = ac.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), t + dur);
      g.gain.setValueAtTime(gainVal, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g);
      g.connect(ac.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    },
    noise(dur, freq = 900, gainVal = 0.16) {
      const ac = this.ensure();
      if (!ac) return;
      const t = ac.currentTime;
      const len = Math.floor(ac.sampleRate * dur);
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ac.createBufferSource();
      src.buffer = buf;
      const filt = ac.createBiquadFilter();
      filt.type = 'bandpass';
      filt.frequency.setValueAtTime(freq, t);
      const g = ac.createGain();
      g.gain.setValueAtTime(gainVal, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(filt);
      filt.connect(g);
      g.connect(ac.destination);
      src.start(t);
    },
    pop() { this.tone(240, 680, 0.14, 'triangle', 0.15); },
    whoosh() { this.noise(0.11, 1400, 0.09); this.tone(360, 140, 0.1, 'sine', 0.06); },
    hit(heavy = false) {
      this.noise(heavy ? 0.18 : 0.09, heavy ? 420 : 880, heavy ? 0.24 : 0.15);
      this.tone(heavy ? 160 : 210, 42, heavy ? 0.22 : 0.11, 'triangle', heavy ? 0.22 : 0.14);
    },
    block() {
      this.tone(920, 1480, 0.09, 'square', 0.08);
      this.tone(620, 420, 0.12, 'triangle', 0.09);
    },
    laser() {
      this.tone(760, 180, 0.34, 'sawtooth', 0.1);
      this.noise(0.28, 1900, 0.08);
    },
    slam() {
      this.tone(130, 34, 0.42, 'sine', 0.28);
      this.noise(0.32, 300, 0.24);
    },
    ko() {
      this.tone(220, 55, 0.7, 'sawtooth', 0.18);
      this.tone(440, 220, 0.65, 'triangle', 0.14);
      this.noise(0.45, 500, 0.22);
    }
  };

  // Unlock audio on first pointer interaction
  window.addEventListener('pointerdown', () => SFX.ensure(), { once: true });

  // ---------- Global Simulation & VFX State ----------
  const FX = {
    particles: [],
    rings: [],
    popups: [],
    beams: [],
    projectiles: [],
    speeches: [],
    shake: 0,
    hitstop: 0,
    flash: 0,
    flashColor: '#ffffff'
  };

  function addShake(amount) {
    FX.shake = Math.min(24, FX.shake + amount);
  }

  function spawnParticles(x, y, color, count = 14, speed = 280, size = 4) {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = speed * (0.3 + Math.random() * 0.9);
      FX.particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 60,
        life: 0.32 + Math.random() * 0.38,
        maxLife: 0.7,
        color,
        size: size * (0.5 + Math.random() * 0.9),
        gravity: 580
      });
    }
  }

  function spawnRing(x, y, color, maxR = 95, lineWidth = 4) {
    FX.rings.push({ x, y, r: 8, maxR, color, lineWidth, life: 0.36, maxLife: 0.36 });
  }

  function spawnPopup(x, y, text, color = '#fff', scale = 1) {
    FX.popups.push({
      x, y, vy: -72, text, color, scale,
      rot: (Math.random() - 0.5) * 0.26,
      life: 0.78, maxLife: 0.78
    });
  }

  function spawnSpeech(fighter, text, duration = 1.65) {
    FX.speeches = FX.speeches.filter(s => s.fighter !== fighter);
    FX.speeches.push({ fighter, text, life: duration, maxLife: duration });
  }

  function jiggleNearbyDockIcons(worldX) {
    allDockItems.forEach(item => {
      if (item.classList.contains('vacated')) return;
      const r = item.getBoundingClientRect();
      const cx = r.left + r.width * 0.5;
      if (Math.abs(cx - worldX) < 115) {
        item.classList.remove('jiggle');
        void item.offsetWidth;
        item.classList.add('jiggle');
      }
    });
  }

  function getDockCenter(el) {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width * 0.5, y: r.top + r.height * 0.5 };
  }

  function showBanner(title, sub, color = '#ffffff', dur = 1350) {
    bannerTitle.textContent = title;
    bannerTitle.style.color = color;
    bannerSub.textContent = sub;
    bannerEl.classList.add('show');
    clearTimeout(showBanner._t);
    if (dur > 0) {
      showBanner._t = setTimeout(() => bannerEl.classList.remove('show'), dur);
    }
  }

  // ---------- Fighter Drawing Helpers ----------
  function drawChatGPTHead(x, y, r, rot, morph, expr, facing) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);

    // Morph from squircle (morph=0) to circular badge head (morph=1)
    const half = r * (1.38 - 0.38 * morph);
    const corner = half * (0.46 + 0.54 * morph);
    const grad = ctx.createLinearGradient(-half, -half, half, half);
    grad.addColorStop(0, '#19c39a');
    grad.addColorStop(0.6, '#10a37f');
    grad.addColorStop(1, '#086c53');

    ctx.shadowColor = 'rgba(16, 163, 127, 0.7)';
    ctx.shadowBlur = 14;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(-half, -half, half * 2, half * 2, corner);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    // Stylized OpenAI hexagonal swirl
    ctx.save();
    ctx.globalAlpha = 0.85 - 0.35 * morph;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.1;
    for (let i = 0; i < 6; i++) {
      ctx.save();
      ctx.rotate((i * Math.PI) / 3);
      ctx.beginPath();
      ctx.arc(0, -half * 0.36, half * 0.34, 0.25, Math.PI * 1.25);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();

    if (morph > 0.35) {
      drawFace(facing, expr, half * 0.85, '#ffffff', '#052e22');
    }
    ctx.restore();
  }

  function drawClaudeHead(x, y, r, rot, morph, expr, facing) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);

    const half = r * (1.38 - 0.38 * morph);
    const corner = half * (0.46 + 0.54 * morph);
    const grad = ctx.createLinearGradient(-half, -half, half, half);
    grad.addColorStop(0, '#eb8f6d');
    grad.addColorStop(0.55, '#d97757');
    grad.addColorStop(1, '#b55436');

    ctx.shadowColor = 'rgba(217, 119, 87, 0.7)';
    ctx.shadowBlur = 14;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(-half, -half, half * 2, half * 2, corner);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = 'rgba(255,248,240,0.45)';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    // Stylized Claude starburst rays
    ctx.save();
    ctx.globalAlpha = 0.88 - 0.38 * morph;
    ctx.fillStyle = '#fff8f1';
    const rays = 11;
    for (let i = 0; i < rays; i++) {
      ctx.save();
      ctx.rotate((i * Math.PI * 2) / rays);
      ctx.beginPath();
      ctx.roundRect(-1.3, -half * 0.72, 2.6, half * 0.52, 1.3);
      ctx.fill();
      ctx.restore();
    }
    ctx.beginPath();
    ctx.arc(0, 0, half * 0.22, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (morph > 0.35) {
      drawFace(facing, expr, half * 0.85, '#fff8f1', '#3d150a');
    }
    ctx.restore();
  }

  function drawFace(facing, expr, scale, eyeColor, pupilColor) {
    ctx.save();
    const ox = facing * scale * 0.22;
    const eyeY = -scale * 0.06;
    const eyeDx = scale * 0.3;

    if (expr === 'ko') {
      // X eyes
      ctx.strokeStyle = eyeColor;
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      [-eyeDx, eyeDx].forEach(dx => {
        const ex = ox + dx;
        ctx.beginPath();
        ctx.moveTo(ex - 3.5, eyeY - 3.5);
        ctx.lineTo(ex + 3.5, eyeY + 3.5);
        ctx.moveTo(ex + 3.5, eyeY - 3.5);
        ctx.lineTo(ex - 3.5, eyeY + 3.5);
        ctx.stroke();
      });
    } else if (expr === 'hit') {
      // Wide shocked eyes
      [-eyeDx, eyeDx].forEach(dx => {
        ctx.fillStyle = eyeColor;
        ctx.beginPath();
        ctx.arc(ox + dx, eyeY, 4.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = pupilColor;
        ctx.beginPath();
        ctx.arc(ox + dx + facing * 0.8, eyeY, 1.8, 0, Math.PI * 2);
        ctx.fill();
      });
      // Open O mouth
      ctx.fillStyle = pupilColor;
      ctx.beginPath();
      ctx.ellipse(ox + facing * 1, scale * 0.36, 3.5, 4.4, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Determined / angry / smug eyes
      [-eyeDx, eyeDx].forEach((dx, idx) => {
        ctx.fillStyle = eyeColor;
        ctx.beginPath();
        ctx.ellipse(ox + dx, eyeY, 3.6, expr === 'victory' ? 2.5 : 4.1, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = pupilColor;
        ctx.beginPath();
        ctx.arc(ox + dx + facing * 1.2, eyeY, 1.8, 0, Math.PI * 2);
        ctx.fill();

        // Angry/determined eyebrows
        ctx.strokeStyle = pupilColor;
        ctx.lineWidth = 2.3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        if (expr === 'victory') {
          ctx.arc(ox + dx, eyeY - 5, 4, Math.PI * 1.1, Math.PI * 1.9);
        } else {
          const slant = (idx === 0 ? 2.4 : -2.4) * (expr === 'angry' ? 1.3 : 0.9);
          ctx.moveTo(ox + dx - 4.2, eyeY - 5.2 - slant * 0.5);
          ctx.lineTo(ox + dx + 4.2, eyeY - 5.2 + slant * 0.5);
        }
        ctx.stroke();
      });

      // Mouth
      ctx.strokeStyle = pupilColor;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      if (expr === 'victory') {
        ctx.arc(ox + facing * 1, scale * 0.28, 5, 0.15, Math.PI - 0.15);
      } else if (expr === 'angry') {
        ctx.moveTo(ox - 4, scale * 0.36);
        ctx.lineTo(ox + 4, scale * 0.32);
      } else {
        ctx.moveTo(ox - 3.5, scale * 0.34);
        ctx.quadraticCurveTo(ox, scale * 0.42, ox + 4, scale * 0.32);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---------- Stickman Fighter Class ----------
  class Fighter {
    constructor(id, name, color, glowColor, dockEl) {
      this.id = id;
      this.name = name;
      this.color = color;
      this.glowColor = glowColor;
      this.dockEl = dockEl;
      this.reset();
    }

    reset() {
      const c = getDockCenter(this.dockEl);
      this.x = c.x;
      this.y = c.y;
      this.vx = 0;
      this.vy = 0;
      this.facing = this.id === 'gpt' ? 1 : -1;
      this.hp = 100;
      this.maxHp = 100;
      this.state = 'docked'; // docked, popout, idle, run, punch, kick, uppercut, block, special1, special2, hit, ko, victory, returning
      this.stateTime = 0;
      this.stateDur = 0;
      this.morph = 0; // 0 = dock icon, 1 = full stickman
      this.onGround = false;
      this.hitDealt = false;
      this.comboCount = 0;
      this.afterimages = [];
      this.spearAlpha = 0;
      this.shieldAlpha = 0;
      this.thinkingRings = 0;
      this.weaponAngle = 0;
      this.returnStart = { x: 0, y: 0 };
      this.invuln = 0;
    }

    setState(next, dur = 0.45) {
      this.state = next;
      this.stateTime = 0;
      this.stateDur = dur;
      this.hitDealt = false;
    }

    getHeadPos() {
      const lean = this.state === 'run' ? this.facing * 12 : this.state === 'hit' ? -this.facing * 14 : 0;
      const crouch = this.state === 'block' ? 10 : this.state === 'ko' ? 54 : 0;
      return { x: this.x + lean, y: this.y - 78 * this.morph + crouch };
    }

    takeHit(dmg, knockX, knockY, heavy = false) {
      if (this.state === 'ko' || this.state === 'docked' || this.state === 'returning') return false;
      if (this.state === 'block') {
        const chip = Math.max(1, Math.round(dmg * 0.2));
        this.hp = Math.max(1, this.hp - chip);
        this.vx = knockX * 0.32;
        SFX.block();
        spawnParticles(this.x + this.facing * 16, this.y - 52, this.glowColor, 10, 220, 3.2);
        spawnPopup(this.x, this.y - 98, 'BLOCKED!', '#fde68a', 0.88);
        addShake(4);
        return false;
      }

      this.hp = Math.max(0, this.hp - dmg);
      this.vx = knockX;
      this.vy = knockY;
      this.onGround = false;
      SFX.hit(heavy);
      addShake(heavy ? 12 : 6);
      FX.hitstop = heavy ? 0.075 : 0.035;

      const hitX = this.x;
      const hitY = this.y - 54;
      spawnParticles(hitX, hitY, heavy ? '#ffffff' : this.glowColor, heavy ? 22 : 12, heavy ? 390 : 250, heavy ? 5 : 3.6);
      spawnRing(hitX, hitY, heavy ? '#ffffff' : this.glowColor, heavy ? 115 : 65, heavy ? 4.5 : 3);

      const words = heavy
        ? ['CRIT!', 'POW!', '429!', 'TOKEN LIMIT!', 'RATE LIMITED!']
        : ['WHACK!', 'BAM!', 'SLAP!', 'BOP!', 'PING!'];
      spawnPopup(hitX + (Math.random() - 0.5) * 24, hitY - 36, words[Math.floor(Math.random() * words.length)], heavy ? '#fef08a' : '#ffffff', heavy ? 1.25 : 0.92);

      if (this.hp <= 0) {
        this.setState('ko', 99);
        this.vx = knockX * 1.35;
        this.vy = -440;
        SFX.ko();
        addShake(20);
        FX.hitstop = 0.16;
        FX.flash = 0.55;
        FX.flashColor = this.id === 'gpt' ? '#d97757' : '#10a37f';
      } else {
        this.setState('hit', heavy ? 0.48 : 0.3);
      }
      return true;
    }

    update(dt, opp) {
      this.stateTime += dt;
      if (this.invuln > 0) this.invuln = Math.max(0, this.invuln - dt);

      // Update afterimages
      for (let i = this.afterimages.length - 1; i >= 0; i--) {
        this.afterimages[i].alpha -= dt * 3.8;
        if (this.afterimages[i].alpha <= 0) this.afterimages.splice(i, 1);
      }

      if (this.state === 'docked') return;

      if (this.state === 'popout') {
        const p = Math.min(1, this.stateTime / this.stateDur);
        // Elastic pop out from dock to fighting spot
        const c = getDockCenter(this.dockEl);
        const targetX = W * 0.5 + (this.id === 'gpt' ? -Math.min(180, W * 0.19) : Math.min(180, W * 0.19));
        const ease = 1 - Math.pow(1 - p, 3);
        this.x = c.x + (targetX - c.x) * ease;
        const arc = Math.sin(p * Math.PI) * 185;
        this.y = c.y + (FLOOR_Y - c.y) * ease - arc;
        this.morph = Math.min(1, Math.max(0, (p - 0.15) / 0.68));
        if (p >= 1) {
          this.y = FLOOR_Y;
          this.onGround = true;
          this.morph = 1;
          jiggleNearbyDockIcons(this.x);
          spawnRing(this.x, FLOOR_Y, this.glowColor, 72, 3);
          this.setState('idle', 0.4);
        }
        return;
      }

      if (this.state === 'returning') {
        const p = Math.min(1, this.stateTime / this.stateDur);
        const c = getDockCenter(this.dockEl);
        const ease = p * p * (3 - 2 * p);
        this.x = this.returnStart.x + (c.x - this.returnStart.x) * ease;
        this.y = this.returnStart.y + (c.y - this.returnStart.y) * ease - Math.sin(p * Math.PI) * 160;
        this.morph = Math.max(0, 1 - p * 1.25);
        if (p >= 1) {
          this.state = 'docked';
          this.morph = 0;
          this.dockEl.classList.remove('vacated');
          SFX.pop();
        }
        return;
      }

      // Fade special visuals
      this.shieldAlpha = this.state === 'block' ? Math.min(1, this.shieldAlpha + dt * 10) : Math.max(0, this.shieldAlpha - dt * 8);
      this.spearAlpha = (this.id === 'claude' && this.state === 'special1') ? Math.min(1, this.spearAlpha + dt * 10) : Math.max(0, this.spearAlpha - dt * 7);
      this.thinkingRings = (this.id === 'claude' && this.state === 'special2' && this.stateTime < 0.62) ? Math.min(1, this.thinkingRings + dt * 5) : Math.max(0, this.thinkingRings - dt * 5);

      // Special move behaviors
      if (this.state === 'punch' && !this.hitDealt && this.stateTime > 0.12) {
        this.hitDealt = true;
        SFX.whoosh();
        this.vx += this.facing * 170;
        if (Math.abs(opp.x - this.x) < 92 && Math.abs(opp.y - this.y) < 70) {
          opp.takeHit(7 + Math.floor(Math.random() * 4), this.facing * 240, -140, false);
        }
      }

      if (this.state === 'kick' && !this.hitDealt && this.stateTime > 0.16) {
        this.hitDealt = true;
        SFX.whoosh();
        this.vx += this.facing * 290;
        this.vy = -210;
        this.onGround = false;
        this.recordAfterimage();
        if (Math.abs(opp.x - this.x) < 115 && Math.abs(opp.y - this.y) < 85) {
          opp.takeHit(12 + Math.floor(Math.random() * 4), this.facing * 390, -240, true);
        }
      }

      if (this.state === 'uppercut' && !this.hitDealt && this.stateTime > 0.13) {
        this.hitDealt = true;
        SFX.whoosh();
        this.vy = -460;
        this.vx = this.facing * 150;
        this.onGround = false;
        this.recordAfterimage();
        if (Math.abs(opp.x - this.x) < 88 && Math.abs(opp.y - this.y) < 95) {
          opp.takeHit(14, this.facing * 230, -520, true);
        }
      }

      // ChatGPT Special 1: Swirl Boomerang
      if (this.id === 'gpt' && this.state === 'special1' && !this.hitDealt && this.stateTime > 0.18) {
        this.hitDealt = true;
        SFX.whoosh();
        FX.projectiles.push({
          owner: this,
          kind: 'swirl',
          x: this.x + this.facing * 28,
          y: this.y - 58,
          vx: this.facing * 560,
          vy: -20,
          r: 18,
          rot: 0,
          life: 1.55,
          returning: false,
          hitOnce: false
        });
        spawnSpeech(this, 'Token Boomerang!', 1.2);
      }

      // Claude Special 1: Artifact Starburst Spear Dash
      if (this.id === 'claude' && this.state === 'special1') {
        if (this.stateTime > 0.15 && this.stateTime < 0.42) {
          this.vx = this.facing * 620;
          if (Math.random() < 0.55) this.recordAfterimage();
          if (!this.hitDealt && Math.abs(opp.x - this.x) < 118 && Math.abs(opp.y - this.y) < 80) {
            this.hitDealt = true;
            opp.takeHit(16, this.facing * 440, -260, true);
            spawnPopup(opp.x, opp.y - 110, 'ARTIFACT SLASH!', '#f5c2a8', 1.15);
          }
        }
      }

      // ChatGPT Special 2: Prompt Laser Beam
      if (this.id === 'gpt' && this.state === 'special2') {
        this.vx *= 0.85;
        if (this.stateTime < 0.45) {
          if (Math.random() < 0.5) {
            spawnParticles(this.x + this.facing * 26, this.y - 58, '#34d399', 1, 90, 3);
          }
        } else if (!this.hitDealt) {
          this.hitDealt = true;
          SFX.laser();
          addShake(14);
          spawnSpeech(this, 'As an AI language model... FIRE!', 1.7);
          FX.beams.push({
            owner: this,
            x: this.x + this.facing * 28,
            y: this.y - 56,
            dir: this.facing,
            color: '#10a37f',
            core: '#d1fae5',
            life: 0.52,
            maxLife: 0.52,
            dealt: false
          });
        }
      }

      // Claude Special 2: Extended Thinking Meteor Slam
      if (this.id === 'claude' && this.state === 'special2') {
        if (this.stateTime < 0.56) {
          // Levitate upward while thinking
          this.vy = -210;
          this.vx = (opp.x - this.x) * 2.2;
          this.onGround = false;
        } else if (!this.hitDealt) {
          // Slam down!
          this.vy = 980;
          this.vx *= 0.5;
          if (Math.random() < 0.65) this.recordAfterimage();
          if (this.y >= FLOOR_Y - 6) {
            this.hitDealt = true;
            this.y = FLOOR_Y;
            this.vy = 0;
            this.onGround = true;
            SFX.slam();
            addShake(18);
            jiggleNearbyDockIcons(this.x);
            spawnRing(this.x, FLOOR_Y, '#d97757', 210, 6);
            spawnParticles(this.x, FLOOR_Y, '#f5c2a8', 26, 420, 5);
            spawnPopup(this.x, FLOOR_Y - 120, 'EXTENDED THINKING!', '#fed7aa', 1.2);
            if (Math.abs(opp.x - this.x) < 210) {
              const dir = opp.x >= this.x ? 1 : -1;
              opp.takeHit(19, dir * 480, -390, true);
            }
          }
        }
      }

      // Physics integration
      const gravity = (this.state === 'special2' && this.id === 'claude' && this.stateTime < 0.56) ? 0 : 1480;
      this.vy += gravity * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;

      // Ground collision
      if (this.y >= FLOOR_Y) {
        if (!this.onGround && this.vy > 240) {
          jiggleNearbyDockIcons(this.x);
          spawnParticles(this.x, FLOOR_Y, 'rgba(255,255,255,0.55)', 6, 120, 2.6);
        }
        this.y = FLOOR_Y;
        if (this.state === 'ko' && Math.abs(this.vy) > 150) {
          this.vy = -this.vy * 0.35;
          this.vx *= 0.72;
        } else {
          this.vy = 0;
          this.onGround = true;
        }
      }

      // Wall bounce
      const margin = 56;
      if (this.x < margin) {
        this.x = margin;
        this.vx = Math.abs(this.vx) * 0.55;
      } else if (this.x > W - margin) {
        this.x = W - margin;
        this.vx = -Math.abs(this.vx) * 0.55;
      }

      // Friction
      const drag = this.onGround ? (this.state === 'run' ? 0.92 : 0.82) : 0.97;
      this.vx *= Math.pow(drag, dt * 60);

      // End timed states
      if (this.state !== 'idle' && this.state !== 'run' && this.state !== 'ko' && this.state !== 'victory') {
        if (this.stateTime >= this.stateDur) {
          this.setState('idle', 0.25);
        }
      }
    }

    recordAfterimage() {
      this.afterimages.push({
        x: this.x,
        y: this.y,
        facing: this.facing,
        state: this.state,
        stateTime: this.stateTime,
        alpha: 0.42
      });
      if (this.afterimages.length > 6) this.afterimages.shift();
    }

    computePose(t = this.stateTime, st = this.state) {
      const f = this.facing;
      const m = this.morph;
      const hip = { x: 0, y: -38 * m };
      let neck = { x: 0, y: -64 * m };
      let headRot = 0;
      let expr = 'normal';

      // Default fighting stance limbs (relative to feet origin)
      const bob = Math.sin(t * 7.5) * 3;
      let lKnee = { x: -12 * f, y: -19 * m };
      let lFoot = { x: -18 * f, y: 0 };
      let rKnee = { x: 13 * f, y: -19 * m };
      let rFoot = { x: 18 * f, y: 0 };

      let lElbow = { x: -14 * f, y: -48 * m + bob };
      let lHand = { x: 8 * f, y: -56 * m + bob };
      let rElbow = { x: 14 * f, y: -48 * m + bob };
      let rHand = { x: 26 * f, y: -60 * m + bob };

      if (st === 'idle' || st === 'popout') {
        hip.y += bob * 0.5;
        neck.y += bob;
        neck.x = 3 * f;
      } else if (st === 'run') {
        const s = Math.sin(t * 16);
        const c = Math.cos(t * 16);
        neck.x = 12 * f;
        neck.y = -61 * m + Math.abs(s) * 4;
        hip.y = -37 * m + Math.abs(s) * 3;
        lKnee = { x: s * 16 * f, y: -19 * m - Math.max(0, c) * 6 };
        lFoot = { x: s * 24 * f - 4 * f, y: Math.min(0, -c * 14) };
        rKnee = { x: -s * 16 * f, y: -19 * m - Math.max(0, -c) * 6 };
        rFoot = { x: -s * 24 * f - 4 * f, y: Math.min(0, c * 14) };
        lElbow = { x: -s * 18 * f, y: -47 * m };
        lHand = { x: -s * 26 * f + 6 * f, y: -52 * m };
        rElbow = { x: s * 18 * f, y: -47 * m };
        rHand = { x: s * 26 * f + 6 * f, y: -52 * m };
      } else if (st === 'punch') {
        expr = 'angry';
        const ext = Math.sin(Math.min(1, t / 0.28) * Math.PI);
        neck.x = (6 + ext * 12) * f;
        rElbow = { x: (14 + ext * 16) * f, y: -57 * m };
        rHand = { x: (22 + ext * 38) * f, y: -59 * m };
        lElbow = { x: -16 * f, y: -50 * m };
        lHand = { x: -6 * f, y: -54 * m };
        rFoot.x = (22 + ext * 8) * f;
      } else if (st === 'kick') {
        expr = 'angry';
        const ext = Math.sin(Math.min(1, t / 0.36) * Math.PI);
        neck.x = -12 * ext * f;
        headRot = -0.22 * ext * f;
        rKnee = { x: (18 + ext * 18) * f, y: -44 * m };
        rFoot = { x: (24 + ext * 44) * f, y: (-20 - ext * 42) * m };
        lFoot = { x: -12 * f, y: 0 };
        lHand = { x: -24 * f, y: -52 * m };
        rHand = { x: 14 * f, y: -44 * m };
      } else if (st === 'uppercut') {
        expr = 'angry';
        const ext = Math.min(1, t / 0.25);
        neck.x = 6 * f;
        rElbow = { x: 18 * f, y: (-58 - ext * 18) * m };
        rHand = { x: 24 * f, y: (-76 - ext * 30) * m };
        lKnee = { x: -8 * f, y: -26 * m };
        lFoot = { x: -14 * f, y: -12 * m };
        rKnee = { x: 14 * f, y: -28 * m };
        rFoot = { x: 8 * f, y: -10 * m };
      } else if (st === 'block') {
        hip.y = -32 * m;
        neck.y = -56 * m;
        neck.x = -4 * f;
        lElbow = { x: 10 * f, y: -46 * m };
        lHand = { x: 20 * f, y: -62 * m };
        rElbow = { x: 15 * f, y: -44 * m };
        rHand = { x: 24 * f, y: -58 * m };
      } else if (st === 'special1') {
        expr = 'angry';
        neck.x = 16 * f;
        rElbow = { x: 26 * f, y: -58 * m };
        rHand = { x: 48 * f, y: -58 * m };
        lElbow = { x: -18 * f, y: -50 * m };
        lHand = { x: -30 * f, y: -44 * m };
      } else if (st === 'special2') {
        expr = 'angry';
        if (this.id === 'gpt') {
          neck.x = 8 * f;
          lElbow = { x: 16 * f, y: -54 * m };
          lHand = { x: 34 * f, y: -56 * m };
          rElbow = { x: 18 * f, y: -60 * m };
          rHand = { x: 34 * f, y: -56 * m };
        } else {
          // Levitate / slam pose
          neck.x = 0;
          lElbow = { x: -22 * f, y: -74 * m };
          lHand = { x: -30 * f, y: -90 * m };
          rElbow = { x: 22 * f, y: -74 * m };
          rHand = { x: 30 * f, y: -90 * m };
        }
      } else if (st === 'hit') {
        expr = 'hit';
        neck.x = -16 * f;
        headRot = -0.35 * f;
        lElbow = { x: -24 * f, y: -54 * m };
        lHand = { x: -36 * f, y: -66 * m };
        rElbow = { x: 12 * f, y: -48 * m };
        rHand = { x: 24 * f, y: -62 * m };
        lFoot = { x: -10 * f, y: -10 * m };
        rFoot = { x: 18 * f, y: -14 * m };
      } else if (st === 'ko') {
        expr = 'ko';
        hip.x = -12 * f;
        hip.y = -10 * m;
        neck.x = -38 * f;
        neck.y = -16 * m;
        headRot = -1.2 * f;
        lKnee = { x: 8 * f, y: -16 * m };
        lFoot = { x: 24 * f, y: -4 * m };
        rKnee = { x: 16 * f, y: -8 * m };
        rFoot = { x: 34 * f, y: -2 * m };
        lElbow = { x: -26 * f, y: -24 * m };
        lHand = { x: -16 * f, y: -32 * m };
        rElbow = { x: -46 * f, y: -6 * m };
        rHand = { x: -58 * f, y: -4 * m };
      } else if (st === 'victory') {
        expr = 'victory';
        const hop = Math.abs(Math.sin(t * 7)) * 18;
        hip.y -= hop;
        neck.y -= hop;
        lElbow = { x: -18 * f, y: -74 * m - hop };
        lHand = { x: -28 * f, y: -96 * m - hop };
        rElbow = { x: 18 * f, y: -74 * m - hop };
        rHand = { x: 28 * f, y: -96 * m - hop };
        lFoot.y = -hop * 0.7;
        rFoot.y = -hop * 0.7;
      }

      return { hip, neck, headRot, expr, lKnee, lFoot, rKnee, rFoot, lElbow, lHand, rElbow, rHand };
    }

    drawSkeleton(px, py, pose, alpha = 1, tintOnly = false) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(px, py);

      const m = this.morph;
      const limbW = 6.2 * m;

      if (m > 0.08) {
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        const drawSeg = (a, b, color, width) => {
          ctx.strokeStyle = color;
          ctx.lineWidth = width;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        };

        // Soft outer brand aura
        ctx.shadowColor = this.glowColor;
        ctx.shadowBlur = tintOnly ? 16 : 10;

        const bodyColor = tintOnly ? this.glowColor : '#f8fafc';
        const backColor = tintOnly ? this.glowColor : 'rgba(226, 232, 240, 0.82)';

        // Back limbs
        drawSeg(pose.hip, pose.lKnee, backColor, limbW);
        drawSeg(pose.lKnee, pose.lFoot, backColor, limbW);
        drawSeg(pose.neck, pose.lElbow, backColor, limbW * 0.92);
        drawSeg(pose.lElbow, pose.lHand, backColor, limbW * 0.92);

        // Torso
        drawSeg(pose.hip, pose.neck, bodyColor, limbW * 1.15);

        // Front limbs
        drawSeg(pose.hip, pose.rKnee, bodyColor, limbW);
        drawSeg(pose.rKnee, pose.rFoot, bodyColor, limbW);
        drawSeg(pose.neck, pose.rElbow, bodyColor, limbW * 0.95);
        drawSeg(pose.rElbow, pose.rHand, bodyColor, limbW * 0.95);

        // Colored glowing headband / scarf accent
        if (!tintOnly) {
          ctx.strokeStyle = this.color;
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.moveTo(pose.neck.x, pose.neck.y + 4);
          const tailWave = Math.sin(this.stateTime * 14) * 6;
          ctx.quadraticCurveTo(
            pose.neck.x - this.facing * 16,
            pose.neck.y + 8 + tailWave,
            pose.neck.x - this.facing * 30,
            pose.neck.y + 14 - tailWave
          );
          ctx.stroke();
        }
        ctx.shadowBlur = 0;
      }

      // Draw Head (Icon -> Stickman Head)
      if (!tintOnly) {
        const hx = pose.neck.x;
        const hy = pose.neck.y - 16 * m;
        if (this.id === 'gpt') {
          drawChatGPTHead(hx, hy, 19.5, pose.headRot, m, pose.expr, this.facing);
        } else {
          drawClaudeHead(hx, hy, 19.5, pose.headRot, m, pose.expr, this.facing);
        }

        // Dizzy stars when KO'd
        if (this.state === 'ko') {
          for (let i = 0; i < 3; i++) {
            const ang = this.stateTime * 4 + (i * Math.PI * 2) / 3;
            const sx = hx + Math.cos(ang) * 20;
            const sy = hy - 22 + Math.sin(ang) * 6;
            ctx.fillStyle = '#fde047';
            ctx.beginPath();
            ctx.arc(sx, sy, 3.2, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      ctx.restore();
    }

    draw() {
      if (this.state === 'docked') return;

      // Ground shadow
      const heightAboveFloor = Math.max(0, FLOOR_Y - this.y);
      const shadowScale = Math.max(0.25, 1 - heightAboveFloor / 360);
      ctx.save();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.36)';
      ctx.beginPath();
      ctx.ellipse(this.x, FLOOR_Y + 3, 28 * shadowScale * Math.max(0.5, this.morph), 6 * shadowScale, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Afterimages
      this.afterimages.forEach(a => {
        const p = this.computePose(a.stateTime, a.state);
        this.drawSkeleton(a.x, a.y, p, a.alpha, true);
      });

      const pose = this.computePose();

      // Claude Extended Thinking rings
      if (this.thinkingRings > 0.02) {
        ctx.save();
        ctx.translate(this.x, this.y - 54);
        ctx.globalAlpha = this.thinkingRings * 0.85;
        for (let i = 0; i < 3; i++) {
          const r = 34 + i * 16 + Math.sin(this.stateTime * 10 + i) * 4;
          ctx.strokeStyle = i % 2 === 0 ? '#f5c2a8' : '#d97757';
          ctx.lineWidth = 2.5;
          ctx.setLineDash([12, 8]);
          ctx.beginPath();
          ctx.arc(0, 0, r, this.stateTime * (i % 2 === 0 ? 3 : -3), this.stateTime * (i % 2 === 0 ? 3 : -3) + Math.PI * 1.5);
          ctx.stroke();
        }
        ctx.setLineDash([]);
        ctx.restore();
      }

      // Main stickman
      this.drawSkeleton(this.x, this.y, pose, 1, false);

      // Claude Artifact Starburst Spear
      if (this.spearAlpha > 0.02) {
        ctx.save();
        ctx.globalAlpha = this.spearAlpha;
        const hx = this.x + pose.rHand.x;
        const hy = this.y + pose.rHand.y;
        ctx.translate(hx, hy);
        ctx.strokeStyle = '#fff1e6';
        ctx.shadowColor = '#d97757';
        ctx.shadowBlur = 18;
        ctx.lineWidth = 4.5;
        ctx.beginPath();
        ctx.moveTo(-this.facing * 32, 0);
        ctx.lineTo(this.facing * 72, 0);
        ctx.stroke();
        // Glowing spear tip
        ctx.fillStyle = '#f5c2a8';
        ctx.beginPath();
        ctx.moveTo(this.facing * 92, 0);
        ctx.lineTo(this.facing * 64, -10);
        ctx.lineTo(this.facing * 64, 10);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Energy Block Shield
      if (this.shieldAlpha > 0.02) {
        ctx.save();
        ctx.globalAlpha = this.shieldAlpha * 0.85;
        ctx.translate(this.x + this.facing * 32, this.y - 52);
        ctx.strokeStyle = this.glowColor;
        ctx.fillStyle = this.id === 'gpt' ? 'rgba(16, 163, 127, 0.24)' : 'rgba(217, 119, 87, 0.24)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 34, -Math.PI * 0.42, Math.PI * 0.42, this.facing < 0);
        ctx.stroke();
        ctx.fill();
        ctx.restore();
      }
    }
  }

  // ---------- Fighters & Match State ----------
  const gpt = new Fighter('gpt', 'ChatGPT', '#10a37f', '#34d399', dockChatGPT);
  const claude = new Fighter('claude', 'Claude', '#d97757', '#f5c2a8', dockClaude);
  const fighters = [gpt, claude];

  const scores = { gpt: 0, claude: 0 };
  let slowMo = false;
  let phase = 'intro'; // intro, fight, ko, returning
  let phaseTimer = 0;
  let aiTimers = { gpt: 0.25, claude: 0.35 };
  let roundNumber = 1;
  let matchToken = 0;

  const QUIPS = {
    gpt: [
      'Hold my tokens!',
      'My context is infinite!',
      'Regenerating response...',
      '404: Mercy not found',
      'GPT-mode engaged!'
    ],
    claude: [
      'Let me think about that...',
      'Artifact deployed!',
      'Politely destroying you.',
      'Constitutional uppercut!',
      'More nuanced than you!'
    ]
  };

  function updateHud() {
    const g = Math.max(0, Math.round(gpt.hp));
    const c = Math.max(0, Math.round(claude.hp));
    gptHpFill.style.width = g + '%';
    gptHpTrail.style.width = g + '%';
    gptHpText.textContent = g + '%';
    claudeHpFill.style.width = c + '%';
    claudeHpTrail.style.width = c + '%';
    claudeHpText.textContent = c + '%';
    scoreReadout.textContent = `GPT ${scores.gpt} — ${scores.claude} Claude`;
  }

  function startMatch() {
    FX.particles.length = 0;
    FX.rings.length = 0;
    FX.popups.length = 0;
    FX.beams.length = 0;
    FX.projectiles.length = 0;
    FX.speeches.length = 0;
    FX.shake = 0;
    FX.hitstop = 0;
    FX.flash = 0;

    dockChatGPT.classList.remove('vacated', 'rattling');
    dockClaude.classList.remove('vacated', 'rattling');
    gpt.reset();
    claude.reset();
    updateHud();

    phase = 'intro';
    phaseTimer = 0;
    const token = ++matchToken;
    aiTimers.gpt = 0.35;
    aiTimers.claude = 0.45;
    hudEl.classList.remove('visible');

    // Step 1: Dock icons rattle angrily
    setTimeout(() => {
      if (token !== matchToken || phase !== 'intro') return;
      dockChatGPT.classList.add('rattling');
      dockClaude.classList.add('rattling');
      SFX.whoosh();
    }, 350);

    // Step 2: Icons pop out of dock and morph into stickmen!
    setTimeout(() => {
      if (token !== matchToken || phase !== 'intro') return;
      dockChatGPT.classList.remove('rattling');
      dockClaude.classList.remove('rattling');
      dockChatGPT.classList.add('vacated');
      dockClaude.classList.add('vacated');

      const c1 = getDockCenter(dockChatGPT);
      const c2 = getDockCenter(dockClaude);
      gpt.x = c1.x; gpt.y = c1.y;
      claude.x = c2.x; claude.y = c2.y;

      gpt.setState('popout', 0.68);
      claude.setState('popout', 0.68);
      SFX.pop();
      spawnParticles(c1.x, c1.y, '#34d399', 16, 260, 4);
      spawnParticles(c2.x, c2.y, '#f5c2a8', 16, 260, 4);
      addShake(6);
    }, 1050);

    // Step 3: Taunt & FIGHT!
    setTimeout(() => {
      if (token !== matchToken || phase !== 'intro') return;
      hudEl.classList.add('visible');
      spawnSpeech(gpt, QUIPS.gpt[Math.floor(Math.random() * QUIPS.gpt.length)], 1.6);
      spawnSpeech(claude, QUIPS.claude[Math.floor(Math.random() * QUIPS.claude.length)], 1.6);
      showBanner(`ROUND ${roundNumber}`, 'CHATGPT VS CLAUDE', '#ffffff', 1100);
    }, 1800);

    setTimeout(() => {
      if (token !== matchToken || phase !== 'intro') return;
      phase = 'fight';
      phaseTimer = 0;
      showBanner('FIGHT!', 'DOCK BRAWL', '#fde047', 850);
      SFX.slam();
    }, 2650);
  }

  function stepFighterAI(me, opp, dt) {
    if (me.state === 'hit' || me.state === 'ko' || me.state === 'popout' || me.state === 'returning' || me.state === 'victory') return;

    const dx = opp.x - me.x;
    const dist = Math.abs(dx);
    if (me.state === 'idle' || me.state === 'run') {
      me.facing = dx >= 0 ? 1 : -1;
    }

    aiTimers[me.id] -= dt;
    if (aiTimers[me.id] > 0) {
      if (me.state === 'run') {
        me.vx += me.facing * 980 * dt;
        if (Math.abs(me.vx) > 360) me.vx = Math.sign(me.vx) * 360;
        if (dist < 76) me.setState('idle', 0.15);
      }
      return;
    }

    // Decide next move
    if (me.state !== 'idle' && me.state !== 'run') {
      aiTimers[me.id] = 0.12;
      return;
    }

    // React to opponent attacking nearby with occasional block or jump-counter
    const oppAttacking = ['punch', 'kick', 'uppercut', 'special1', 'special2'].includes(opp.state);
    if (oppAttacking && dist < 130 && Math.random() < 0.36) {
      me.setState('block', 0.36);
      aiTimers[me.id] = 0.38;
      return;
    }

    const r = Math.random();
    if (dist > 140) {
      if (r < 0.22) {
        // Long range signature special!
        if (me.id === 'gpt' && Math.random() < 0.45) {
          me.setState('special2', 0.98);
          aiTimers[me.id] = 1.05;
        } else if (me.id === 'claude' && Math.random() < 0.48) {
          me.setState('special2', 1.12);
          spawnSpeech(me, 'Thinking...', 1.1);
          aiTimers[me.id] = 1.18;
        } else {
          me.setState('special1', 0.56);
          aiTimers[me.id] = 0.65;
        }
      } else if (r < 0.34 && me.onGround) {
        // Acrobatic leap in
        me.vy = -520;
        me.vx = me.facing * 350;
        me.onGround = false;
        me.setState('kick', 0.48);
        aiTimers[me.id] = 0.52;
      } else {
        me.setState('run', 0.55);
        aiTimers[me.id] = 0.22 + Math.random() * 0.2;
      }
    } else {
      // Close-quarters martial arts exchange
      if (r < 0.34) {
        me.setState('punch', 0.32);
        aiTimers[me.id] = 0.28 + Math.random() * 0.15;
      } else if (r < 0.62) {
        me.setState('kick', 0.44);
        aiTimers[me.id] = 0.42 + Math.random() * 0.18;
      } else if (r < 0.78) {
        me.setState('uppercut', 0.48);
        aiTimers[me.id] = 0.52;
      } else if (r < 0.9) {
        me.setState('special1', 0.55);
        aiTimers[me.id] = 0.62;
      } else {
        // Backflip / reposition
        me.vx = -me.facing * 320;
        me.vy = -340;
        me.onGround = false;
        me.setState('idle', 0.32);
        aiTimers[me.id] = 0.36;
      }
    }
  }

  // ---------- VFX Update & Render ----------
  function updateVFX(dt) {
    FX.shake = Math.max(0, FX.shake - dt * 36);
    FX.flash = Math.max(0, FX.flash - dt * 1.9);

    // Particles
    for (let i = FX.particles.length - 1; i >= 0; i--) {
      const p = FX.particles[i];
      p.life -= dt;
      if (p.life <= 0) { FX.particles.splice(i, 1); continue; }
      p.vy += p.gravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.y > FLOOR_Y) { p.y = FLOOR_Y; p.vy *= -0.45; p.vx *= 0.75; }
    }

    // Shockwave rings
    for (let i = FX.rings.length - 1; i >= 0; i--) {
      const r = FX.rings[i];
      r.life -= dt;
      if (r.life <= 0) { FX.rings.splice(i, 1); continue; }
      const p = 1 - r.life / r.maxLife;
      r.r = 8 + (r.maxR - 8) * (1 - Math.pow(1 - p, 3));
    }

    // Comic popups
    for (let i = FX.popups.length - 1; i >= 0; i--) {
      const p = FX.popups[i];
      p.life -= dt;
      if (p.life <= 0) { FX.popups.splice(i, 1); continue; }
      p.y += p.vy * dt;
      p.vy *= 0.92;
    }

    // Speech bubbles
    for (let i = FX.speeches.length - 1; i >= 0; i--) {
      FX.speeches[i].life -= dt;
      if (FX.speeches[i].life <= 0) FX.speeches.splice(i, 1);
    }

    // Projectiles (ChatGPT Swirl Boomerang)
    for (let i = FX.projectiles.length - 1; i >= 0; i--) {
      const pr = FX.projectiles[i];
      pr.life -= dt;
      pr.rot += dt * 18;
      if (pr.life < 0.85) pr.returning = true;
      if (pr.returning) {
        const dx = pr.owner.x - pr.x;
        const dy = (pr.owner.y - 56) - pr.y;
        pr.vx += dx * 7.5 * dt;
        pr.vy += dy * 7.5 * dt;
        if (Math.hypot(dx, dy) < 28) {
          FX.projectiles.splice(i, 1);
          continue;
        }
      }
      pr.x += pr.vx * dt;
      pr.y += pr.vy * dt;
      if (Math.random() < 0.5) {
        spawnParticles(pr.x, pr.y, '#34d399', 1, 60, 2.5);
      }

      const opp = pr.owner === gpt ? claude : gpt;
      if (!pr.hitOnce && Math.hypot(opp.x - pr.x, (opp.y - 52) - pr.y) < 38) {
        pr.hitOnce = true;
        opp.takeHit(13, Math.sign(pr.vx || pr.owner.facing) * 320, -200, true);
      }
      if (pr.life <= 0) FX.projectiles.splice(i, 1);
    }

    // Beams (ChatGPT Prompt Laser)
    for (let i = FX.beams.length - 1; i >= 0; i--) {
      const b = FX.beams[i];
      b.life -= dt;
      const opp = b.owner === gpt ? claude : gpt;
      if (!b.dealt) {
        const inFront = (opp.x - b.x) * b.dir > 0;
        if (inFront && Math.abs((opp.y - 52) - b.y) < 58) {
          b.dealt = true;
          opp.takeHit(18, b.dir * 520, -280, true);
        }
      }
      if (b.life <= 0) FX.beams.splice(i, 1);
    }
  }

  function drawVFX() {
    // Subtle stage reflection line above dock
    ctx.save();
    const grad = ctx.createLinearGradient(W * 0.15, FLOOR_Y, W * 0.85, FLOOR_Y);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(0.5, 'rgba(255,255,255,0.14)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(W * 0.15, FLOOR_Y + 4);
    ctx.lineTo(W * 0.85, FLOOR_Y + 4);
    ctx.stroke();
    ctx.restore();

    // Shockwave rings
    FX.rings.forEach(r => {
      const a = Math.max(0, r.life / r.maxLife);
      ctx.save();
      ctx.globalAlpha = a * 0.85;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = r.lineWidth * a;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    });

    // Beams
    FX.beams.forEach(b => {
      const a = Math.max(0, b.life / b.maxLife);
      const endX = b.dir > 0 ? W + 40 : -40;
      ctx.save();
      ctx.globalAlpha = Math.min(1, a * 1.4);
      ctx.lineCap = 'round';
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 28;
      ctx.strokeStyle = b.color;
      ctx.lineWidth = 34 * a;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(endX, b.y);
      ctx.stroke();

      ctx.strokeStyle = b.core;
      ctx.lineWidth = 14 * a;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(endX, b.y);
      ctx.stroke();
      ctx.restore();
    });

    // Projectiles
    FX.projectiles.forEach(pr => {
      ctx.save();
      ctx.translate(pr.x, pr.y);
      ctx.rotate(pr.rot);
      ctx.shadowColor = '#34d399';
      ctx.shadowBlur = 16;
      ctx.strokeStyle = '#ffffff';
      ctx.fillStyle = '#10a37f';
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.arc(0, 0, pr.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      for (let k = 0; k < 6; k++) {
        ctx.save();
        ctx.rotate((k * Math.PI) / 3);
        ctx.beginPath();
        ctx.arc(0, -6, 6, 0.2, Math.PI * 1.2);
        ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
    });

    // Particles
    FX.particles.forEach(p => {
      const a = Math.max(0, p.life / p.maxLife);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    // Comic popups
    FX.popups.forEach(p => {
      const a = Math.min(1, (p.life / p.maxLife) * 1.6);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.font = `900 ${Math.round(18 * p.scale)}px -apple-system, BlinkMacSystemFont, sans-serif`;
      ctx.textAlign = 'center';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(0,0,0,0.75)';
      ctx.strokeText(p.text, 0, 0);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, 0, 0);
      ctx.restore();
    });

    // Speech bubbles
    FX.speeches.forEach(s => {
      if (s.fighter.state === 'docked') return;
      const a = Math.min(1, s.life * 2.5);
      const head = s.fighter.getHeadPos();
      const bx = Math.max(110, Math.min(W - 110, head.x));
      const by = Math.max(84, head.y - 46);

      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = '600 12px -apple-system, BlinkMacSystemFont, sans-serif';
      const tw = ctx.measureText(s.text).width;
      const pw = tw + 20;
      const ph = 26;

      ctx.fillStyle = 'rgba(18, 20, 32, 0.86)';
      ctx.strokeStyle = s.fighter.glowColor;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.roundRect(bx - pw / 2, by - ph / 2, pw, ph, 13);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(s.text, bx, by + 0.5);
      ctx.restore();
    });

    // KO screen flash
    if (FX.flash > 0.01) {
      ctx.save();
      ctx.globalAlpha = FX.flash * 0.35;
      ctx.fillStyle = FX.flashColor;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }

  // ---------- Interactive Controls ----------
  canvas.addEventListener('pointerdown', e => {
    const x = e.clientX;
    const y = e.clientY;
    SFX.slam();
    addShake(10);
    spawnRing(x, y, '#a78bfa', 150, 4.5);
    spawnParticles(x, y, '#c4b5fd', 18, 320, 4);
    spawnPopup(x, y - 24, 'PROMPT DROP!', '#ddd6fe', 1.05);
    hintEl.style.opacity = '0';

    fighters.forEach(f => {
      if (f.state === 'docked' || f.state === 'ko' || f.state === 'returning') return;
      const dx = f.x - x;
      const dy = (f.y - 45) - y;
      const d = Math.hypot(dx, dy);
      if (d < 190) {
        const push = (1 - d / 190) * 520 + 180;
        const dir = dx >= 0 ? 1 : -1;
        f.vx += dir * push;
        f.vy -= 320;
        f.onGround = false;
      }
    });
  });

  dockChatGPT.addEventListener('click', () => {
    if (phase === 'fight') {
      gpt.setState('special2', 0.98);
    } else {
      startMatch();
    }
  });
  dockClaude.addEventListener('click', () => {
    if (phase === 'fight') {
      claude.setState('special2', 1.12);
      spawnSpeech(claude, 'Thinking...', 1.1);
    } else {
      startMatch();
    }
  });

  btnRematch.addEventListener('click', () => {
    roundNumber++;
    startMatch();
  });

  btnSlowmo.addEventListener('click', () => {
    slowMo = !slowMo;
    btnSlowmo.classList.toggle('active', slowMo);
    btnSlowmo.textContent = slowMo ? 'Slow-Mo: On' : 'Slow-Mo';
  });

  btnSfx.addEventListener('click', () => {
    SFX.enabled = !SFX.enabled;
    btnSfx.textContent = SFX.enabled ? 'SFX: On' : 'SFX: Off';
    btnSfx.classList.toggle('active', !SFX.enabled);
  });

  // ---------- Main Animation Loop ----------
  let lastTs = performance.now();

  function tick(ts) {
    const rawDt = Math.min(0.04, (ts - lastTs) / 1000);
    lastTs = ts;

    if (FX.hitstop > 0) {
      FX.hitstop = Math.max(0, FX.hitstop - rawDt);
    } else {
      const dt = rawDt * (slowMo ? 0.34 : 1);
      phaseTimer += dt;

      if (phase === 'fight') {
        stepFighterAI(gpt, claude, dt);
        stepFighterAI(claude, gpt, dt);
      }

      gpt.update(dt, claude);
      claude.update(dt, gpt);
      updateVFX(dt);
      updateHud();

      // Detect K.O.
      if (phase === 'fight' && (gpt.hp <= 0 || claude.hp <= 0)) {
        phase = 'ko';
        phaseTimer = 0;
        const winner = gpt.hp > 0 ? gpt : claude;
        const loser = winner === gpt ? claude : gpt;
        scores[winner.id]++;
        updateHud();
        winner.setState('victory', 99);
        spawnSpeech(winner, winner.id === 'gpt' ? 'Response complete!' : 'Happy to help!', 2.8);
        spawnSpeech(loser, 'Context limit reached...', 2.6);
        showBanner(`${winner.name} WINS!`, `K.O. • ROUND ${roundNumber}`, winner.glowColor, 2600);
      }

      // Return both icons to the dock, then auto-start next round
      if (phase === 'ko' && phaseTimer > 3.4) {
        phase = 'returning';
        phaseTimer = 0;
        hudEl.classList.remove('visible');
        [gpt, claude].forEach(f => {
          f.returnStart = { x: f.x, y: f.y };
          f.setState('returning', 0.72);
        });
      }

      if (phase === 'returning' && phaseTimer > 1.75) {
        roundNumber++;
        startMatch();
      }
    }

    // Render frame
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (FX.shake > 0.2) {
      const sx = (Math.random() - 0.5) * FX.shake;
      const sy = (Math.random() - 0.5) * FX.shake;
      ctx.translate(sx, sy);
    }
    drawVFX();
    gpt.draw();
    claude.draw();
    ctx.restore();

    requestAnimationFrame(tick);
  }

  startMatch();
  requestAnimationFrame(tick);
})();
</script>
</body>
