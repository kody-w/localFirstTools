import * as THREE from 'three';

// ---------------------------------------------------------------------------
// Shared GLSL: noise, sky, fog, seabed, caustics, water shading
// ---------------------------------------------------------------------------
const GLSL_COMMON = /* glsl */`
uniform float uTime;
uniform vec3 uSun;
uniform float uPeel;
uniform vec4 uIsl1;
uniform vec4 uIsl2;
uniform float uFogDen;

float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 hash22(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash12(i),hash12(i+vec2(1.,0.)),u.x), mix(hash12(i+vec2(0.,1.)),hash12(i+vec2(1.,1.)),u.x), u.y); }
const mat2 OCT = mat2(1.6,1.2,-1.2,1.6);
float fbm3(vec2 p){ float a=0.5,s=0.0; for(int i=0;i<3;i++){ s+=a*vnoise(p); p=OCT*p; a*=0.5; } return s/0.875; }
float fbm4(vec2 p){ float a=0.5,s=0.0; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=OCT*p; a*=0.5; } return s/0.9375; }

vec3 skyBase(vec3 d){
  float y=d.y; float h=max(y,0.0);
  vec3 zen=vec3(0.06,0.26,0.62);
  vec3 hor=vec3(0.64,0.78,0.85);
  vec3 c=mix(hor,zen,pow(h,0.5));
  float s=max(dot(d,uSun),0.0);
  c+=vec3(1.0,0.83,0.60)*(0.20*pow(s,5.0)+0.50*pow(s,40.0));
  if(y<0.0) c=mix(c,hor*0.96,min(-y*5.0,1.0));
  return c;
}
vec3 applyFog(vec3 col, vec3 wp){
  vec3 v=wp-cameraPosition; float d=length(v);
  float f=1.0-exp(-pow(d*uFogDen,2.0));
  f=max(f,(1.0-exp(-d*uFogDen*0.3))*0.3);
  vec3 fd=normalize(vec3(v.x,0.015,v.z));
  return mix(col,skyBase(fd),f);
}

float bedHeight(vec2 p, out float reef){
  float z=p.y;
  float base=mix(-10.0,-2.6,smoothstep(-110.0,-14.0,z));
  base=mix(base,-1.6,smoothstep(12.0,90.0,z));
  float n=fbm3(p*0.022+3.1);
  reef=smoothstep(0.50,0.72,n)*(1.0-0.6*smoothstep(150.0,400.0,z));
  float h=base+reef*1.25+(vnoise(p*0.15)-0.5)*0.35;
  float r1=length(p-uIsl1.xy)-uIsl1.z;
  float r2=length(p-uIsl2.xy)-uIsl2.z;
  h=max(h,1.0-min(r1,r2)*0.035);
  return h;
}
vec3 bedColor(vec2 p, float reef){
  float rip=sin(p.x*1.1+p.y*0.35+sin(p.y*0.4)*2.0)*0.5+0.5;
  vec3 sand=vec3(0.95,0.89,0.72)*(0.88+0.12*rip)*(0.9+0.2*vnoise(p*0.3));
  float m=vnoise(p*0.5+7.0);
  vec3 coral=mix(vec3(0.38,0.30,0.20),vec3(0.52,0.34,0.40),m);
  coral=mix(coral,vec3(0.20,0.38,0.30),smoothstep(0.6,0.9,vnoise(p*1.3)));
  coral*=0.5+0.65*vnoise(p*2.2);
  return mix(sand,coral,reef);
}
float voro(vec2 p, float t){
  vec2 i=floor(p), f=fract(p); float d1=8.0, d2=8.0;
  for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){
    vec2 g=vec2(float(x),float(y)); vec2 o=hash22(i+g); o=0.5+0.45*sin(t+6.2831*o);
    vec2 r=g+o-f; float d=dot(r,r);
    if(d<d1){ d2=d1; d1=d; } else if(d<d2){ d2=d; }
  }
  return sqrt(d2)-sqrt(d1);
}
float caustics(vec2 p, float t){
  p+=vec2(vnoise(p*0.25+t*0.15),vnoise(p*0.25-t*0.12+5.0))*1.6;
  float a=voro(p*0.62,t*1.1);
  float b=voro(p*1.05+4.3,t*1.35+1.0);
  return pow(1.0-smoothstep(0.0,0.30,a),3.0)+0.6*pow(1.0-smoothstep(0.0,0.24,b),3.0);
}
vec2 waterGrad(vec2 p, float t){
  vec2 g=vec2(0.0);
  vec2 d1=vec2(0.28,0.96); g+=d1*0.040*cos(dot(d1,p)*0.55-t*1.5);
  vec2 d2=vec2(-0.6,0.8);  g+=d2*0.030*cos(dot(d2,p)*0.9-t*2.0);
  vec2 d3=vec2(0.9,0.44);  g+=d3*0.022*cos(dot(d3,p)*1.6-t*2.7);
  vec2 q=p*1.3+vec2(t*0.35,t*0.2); float e=0.12;
  float n0=vnoise(q); g+=vec2(vnoise(q+vec2(e,0.))-n0, vnoise(q+vec2(0.,e))-n0)/e*0.07;
  vec2 q2=p*3.4-vec2(t*0.55,-t*0.3);
  float m0=vnoise(q2); g+=vec2(vnoise(q2+vec2(e,0.))-m0, vnoise(q2+vec2(0.,e))-m0)/e*0.035;
  return g;
}
vec3 detailN(vec3 Ng, vec2 p, float dist){
  float k=mix(1.0,0.25,clamp(dist/500.0,0.0,1.0));
  vec2 g=waterGrad(p,uTime)*k;
  return normalize(Ng+vec3(-g.x,0.0,-g.y));
}
vec3 shadeWater(vec3 wp, vec3 N, vec3 V, float dist, vec3 scatterTint, out float depth){
  vec3 r=refract(-V,N,0.75);
  float ty=max(-r.y,0.25);
  float dg=max(wp.y+2.4,0.3);
  vec2 bp=wp.xz+r.xz*(dg/ty)*0.85;
  float reef; float bh=bedHeight(bp,reef);
  depth=max(wp.y-bh,0.02);
  float path=depth*(1.0+1.0/ty);
  vec3 bed=bedColor(bp,reef);
  float sunI=max(uSun.y,0.0);
  float caus=0.0;
  if(dist<240.0) caus=caustics(bp,uTime)*pow(1.0-dist/240.0,1.5)*exp(-depth*0.14)*(1.0-smoothstep(0.2,1.6,wp.y));
  bed*=(0.55+0.6*sunI)+caus*0.6;
  vec3 T=exp(-vec3(0.42,0.085,0.105)*path*0.55);
  vec3 col=bed*T+scatterTint*(0.75+0.3*sunI)*(1.0-T);
  return col;
}
vec3 surfaceLight(vec3 col, vec3 N, vec3 V){
  float F=0.02+0.98*pow(1.0-max(dot(N,V),0.0),5.0);
  vec3 R=reflect(-V,N); R.y=abs(R.y);
  col=mix(col,skyBase(R),F);
  float sp=max(dot(R,uSun),0.0);
  col+=vec3(1.0,0.9,0.74)*(pow(sp,200.0)*2.5+pow(sp,1600.0)*28.0);
  return col;
}
float trailFoam(vec2 p){
  float s=p.x-uPeel;
  float behind=1.0-smoothstep(-8.0,2.0,s);
  if(behind<=0.0) return 0.0;
  float age=clamp(-s/170.0,0.0,1.0);
  float zone=smoothstep(-8.0,1.0,p.y)*(1.0-smoothstep(18.0+60.0*age,40.0+110.0*age,p.y));
  if(zone<=0.0) return 0.0;
  vec2 q=p+vec2(0.0,-uTime*0.6);
  float n=fbm3(q*0.09);
  float lace=1.0-abs(2.0*vnoise(q*0.42+uTime*0.05)-1.0);
  float thr=mix(0.60,0.90,age);
  float f=smoothstep(thr,thr+0.12,n*0.72+lace*0.42);
  return f*behind*zone*(0.85-age*0.5);
}
float shoreFoam(float depth, vec2 p){
  float m=1.0-smoothstep(0.05,0.9,depth);
  float n=vnoise(p*0.3+vec2(uTime*0.3,0.0));
  return m*smoothstep(0.3,0.7,n+0.3*sin(uTime*0.8+depth*9.0));
}

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.4, 7000);

const SUN = new THREE.Vector3(0.74, 0.34, -0.40).normalize();
const U = {
  uTime: { value: 0 }, uSun: { value: SUN }, uPeel: { value: 0 },
  uIsl1: { value: new THREE.Vector4() }, uIsl2: { value: new THREE.Vector4() },

// ---------------------------------------------------------------------------
// Helpers

const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);

// ---------------------------------------------------------------------------
// Wave: static shape in the "peel frame" (s = x - peelX), translated each frame.
// Each column is a 2D profile built by integrating a tangent angle along arc
// length: back slope -> crest -> outer lip -> (cusp) -> inner tube -> face -> trough.
// ---------------------------------------------------------------------------
const HMAX = 5.2;
const COLS = [];
{ let s = -150; while (s < -30) { COLS.push(s); s += 2; } while (s < 50) { COLS.push(s); s += 0.4; } while (s <= 262) { COLS.push(s); s += 2; } }
const NC = COLS.length;
const SEG_N = [6, 10, 10, 16, 20, 14, 8];
const B = [0]; for (const n of SEG_N) B.push(B[B.length - 1] + n);   // segment boundary indices
const NU = B[B.length - 1] + 1;
const CREST = B[3], TIP = B[4], FACE0 = B[5], FACE1 = B[6];

function waveParams(s) {
  let H;
  if (s >= 0) H = HMAX * (0.5 + 0.5 * Math.exp(-((s / 70) ** 2))) * (1 - sstep(150, 258, s));
  else H = HMAX * lerp(1, 0.45, sstep(-3, -18, s)) * (1 - sstep(-95, -148, s));
  const c = s >= 0 ? 1 - sstep(4, 30, s) : sstep(-11, -4, s);
  const closing = sstep(5, -4, s);

function zOffset(s) { return s > 0 ? -0.0005 * s * s : -0.06 * s; }

function profile(c, cl, sf) {

  const L4 = Math.max(0.015, 1.05 * c + cl * 0.55 * c);
  const t5s = t4e + 180;
  const L5 = Math.max(0.015, 0.95 * c + cl * 0.3 * c);
  const t6s = lerp(lerp(-58, -90, sstep(0.3, 1, c)), -30, sf) + 360;
  const t6e = 359;
  const segs = [
    [3.0, 0, 0, 0], [2.2, 0, a2, 1], [1.6, a2, t3e, 1],
    [L4, t3e, t4e, 0], [L5, t5s, 270, 0], [1, t6s, t6e, 1], [3.0, t6e, 360, 1],

  const avgSin = (seg) => { let a = 0; for (let k = 0; k < 64; k++) { const e = ease((k + 0.5) / 64, seg[3]); a += Math.sin((seg[1] + (seg[2] - seg[1]) * e) * D2R); } return a / 64; };

  let z = 0, y = 0;
  for (let si = 0; si < segs.length; si++) {
    const seg = segs[si];
    if (si === 5) {   // adapt face length so the trough lands back on y = 0
      const k6 = avgSin(seg), y7 = segs[6][0] * avgSin(segs[6]);

        z += Math.cos(th) * L / n / sub; y += Math.sin(th) * L / n / sub;

const WP = new Float32Array(NC * NU * 3);   // local positions

    else if (j > FACE0 && j <= FACE1) thin = 0.35 * (1 - (j - FACE0) / (FACE1 - FACE0));

}
{ // normals: cross(profile tangent, along-wave derivative)
  const T = new THREE.Vector3(), D = new THREE.Vector3(), N = new THREE.Vector3();

    const i0 = Math.max(0, i - 1), i1 = Math.min(NC - 1, i + 1);

waveGeo.setAttribute('position', new THREE.BufferAttribute(WP, 3));
waveGeo.setAttribute('normal', new THREE.BufferAttribute(WN, 3));
waveGeo.setAttribute('aW', new THREE.BufferAttribute(WA, 4));
{
  const idx = new Uint32Array((NC - 1) * (NU - 1) * 6); let q = 0;

// --- sampling helpers in peel frame ---
function colOf(s) {

  let lo = 0, hi = NC - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (COLS[m] <= s) lo = m; else hi = m; }

function vtx(i, j, out) { const o = (i * NU + j) * 3; out[0] = WP[o]; out[1] = WP[o + 1]; out[2] = WP[o + 2]; return out; }
// point on the wave face at local s with height y (searching up from the trough)
const _fa = [0, 0, 0], _fb = [0, 0, 0];
function facePoint(s, yT, outP, outN) {

    }

    res.push([lerp(_fb[0], _fa[0], t), lerp(_fb[1], _fa[1], t), lerp(_fb[2], _fa[2], t),
      lerp(WN[o1], WN[o0], t), lerp(WN[o1 + 1], WN[o0 + 1], t), lerp(WN[o1 + 2], WN[o0 + 2], t)]);
  }

  vtx(i0, j, _fa); vtx(i1, j, _fb);
  out.set(s, lerp(_fa[1], _fb[1], w), lerp(_fa[2], _fb[2], w));

uniform vec4 uWake[${WAKE_N}];

  for(int i=0;i<${WAKE_N - 1};i++){

function makeIsland(R, peak, seed, res) {
  const size = R * 2.5;
  const g = new THREE.PlaneGeometry(size, size, res, res).rotateX(-Math.PI / 2);
  const pos = g.attributes.position, col = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const r = Math.hypot(x, z), a = Math.atan2(z, x);
    const Rv = R * (0.86 + 0.22 * fbm(Math.cos(a) * 1.3 + seed, Math.sin(a) * 1.3 - seed, 3));
    const Rc = Rv - 38;
    const cone = Math.max(0, 1 - r / Rc);
    const ridge = 1 - Math.abs(2 * fbm(x * 0.006 + seed, z * 0.006, 4) - 1);
    const cone2 = Math.max(0, 1 - Math.hypot(x - R * 0.28, z + R * 0.12) / (Rc * 0.55));
    let h = 2.2 + peak * (0.55 * Math.pow(cone, 1.9) + 0.45 * Math.pow(cone2, 1.3)) * (0.6 + 0.7 * ridge) + 14 * cone * fbm(x * 0.03, z * 0.03 + seed, 3);
    h -= peak * 0.16 * Math.exp(-(((r - R * 0.04) / (R * 0.11)) ** 2));   // crater
    if (r > Rc) h = lerp(2.2, -1.4, sstep(Rc, Rv, r)) - Math.max(0, r - Rv) * 0.12;
    pos.setY(i, h);
    let c;
    const n = fbm(x * 0.02 + 9, z * 0.02, 3);
    if (h < 3.2 && r > Rc - 8) c = [0.92, 0.85, 0.66];                         // beach
    else if (h > peak * 0.82) c = [0.36, 0.34, 0.31];                          // bare rock
    else c = [lerp(0.05, 0.13, n), lerp(0.20, 0.33, n), lerp(0.06, 0.09, n)]; // jungle
    col.set(c, i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  // rock on steep slopes
  const nrm = g.attributes.normal;
  for (let i = 0; i < pos.count; i++) if (nrm.getY(i) < 0.62 && pos.getY(i) > 8) col.set([0.33, 0.31, 0.28], i * 3);
  const m = new THREE.Mesh(g, islandMat);
  m.frustumCulled = false;
  return m;
}

const PMAX = 9000;
const pPos = new Float32Array(PMAX * 3), pVel = new Float32Array(PMAX * 3);
const pAge = new Float32Array(PMAX).fill(1e9), pLife = new Float32Array(PMAX).fill(1);
const pAttr = new Float32Array(PMAX * 2);    // size, alpha
let pHead = 0;
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute('aSA', new THREE.BufferAttribute(pAttr, 2).setUsage(THREE.DynamicDrawUsage));
const pMat = new THREE.ShaderMaterial({
  uniforms: { ...U, uScale: { value: innerHeight * 0.5 } },
  transparent: true, depthWrite: false,
  vertexShader: `
uniform float uScale; attribute vec2 aSA; varying float vA; varying vec3 vWp;
void main(){
  vec4 wp=modelMatrix*vec4(position,1.0); vWp=wp.xyz;
  vec4 mv=viewMatrix*wp;
  gl_PointSize=min(aSA.x*uScale/max(-mv.z,0.1),160.0);
  vA=aSA.y;
  gl_Position=projectionMatrix*mv;
}`,
  fragmentShader: GLSL_COMMON + `
varying float vA; varying vec3 vWp;
void main(){
  vec2 c=gl_PointCoord*2.0-1.0; float r=dot(c,c);
  if(r>1.0||vA<=0.0) discard;
  float a=(1.0-r); a*=a;
  vec3 V=normalize(cameraPosition-vWp);
  float back=pow(max(dot(-V,uSun),0.0),4.0);
  vec3 col=vec3(0.88,0.94,0.95)*(0.85+0.25*uSun.y)+vec3(0.25,0.22,0.15)*back;
  col=applyFog(col,vWp);
  gl_FragColor=vec4(col,a*vA);

}`,
});

function emit(x, y, z, vx, vy, vz, life, size) {
  const i = pHead; pHead = (pHead + 1) % PMAX;
  pPos[i * 3] = x; pPos[i * 3 + 1] = y; pPos[i * 3 + 2] = z;
  pVel[i * 3] = vx; pVel[i * 3 + 1] = vy; pVel[i * 3 + 2] = vz;
  pAge[i] = 0; pLife[i] = life; pAttr[i * 2] = size;
}
const rnd = (a, b) => a + Math.random() * (b - a);
const _v = new THREE.Vector3();
const acc = { lip: 0, crash: 0, churn: 0, mist: 0, rider: 0 };
function spawnParticles(dt, peel, carve, boardPos, boardSide) {
  // spray thrown off the curling lip
  acc.lip += dt * 620;
  while (acc.lip >= 1) { acc.lip--; const s = rnd(-3, 18); const n = colTop(s, TIP - 1, _v);
    emit(_v.x + peel, _v.y, _v.z, n[0] * 1.5 + rnd(-0.6, 0.6), rnd(0.5, 2.5), n[2] * 1.5 - rnd(0.5, 2.5), rnd(0.6, 1.3), rnd(0.3, 0.8)); }
  // explosion where the lip lands
  acc.crash += dt * 520;
  while (acc.crash >= 1) { acc.crash--; const s = rnd(-9, 0.5); const j = Math.floor(rnd(FACE0 - 8, FACE1)); colTop(s, j, _v);
    emit(_v.x + peel + rnd(-0.5, 0.5), Math.max(_v.y, 0.2), _v.z + rnd(-1, 1), rnd(-1.5, 2.0), rnd(3, 8.5), rnd(-1.5, 3.5), rnd(1.0, 2.0), rnd(0.5, 1.4)); }
  // churning whitewater puffs
  acc.churn += dt * 220;
  while (acc.churn >= 1) { acc.churn--; const s = rnd(-55, -6); const j = Math.floor(rnd(CREST - 4, FACE1)); colTop(s, j, _v);
    emit(_v.x + peel, _v.y + 0.2, _v.z + rnd(-1, 2), rnd(-1, 1), rnd(0.8, 2.2), rnd(0, 2), rnd(0.9, 1.6), rnd(0.6, 1.6)); }
  // offshore wind mist peeling off the shoulder crest
  acc.mist += dt * 160;
  while (acc.mist >= 1) { acc.mist--; const s = rnd(14, 80); colTop(s, CREST, _v);
    emit(_v.x + peel, _v.y + 0.1, _v.z, rnd(-0.5, 0.5), rnd(1.0, 2.2), rnd(-3.2, -1.6), rnd(0.8, 1.5), rnd(0.2, 0.45)); }
  // rooster tail from the rail while carving
  acc.rider += dt * (120 + 520 * carve);
  while (acc.rider >= 1) { acc.rider--;
    emit(boardPos.x - rnd(0.3, 0.9), boardPos.y + 0.1, boardPos.z, rnd(-3, -0.5), rnd(1.5, 3.5) * (0.5 + carve), boardSide * rnd(0.5, 2.5), rnd(0.45, 0.9), rnd(0.18, 0.45)); }
}
function updateParticles(dt) {
  const drag = Math.exp(-dt * 0.9);
  for (let i = 0; i < PMAX; i++) {
    let a = pAge[i];
    if (a > pLife[i]) { pAttr[i * 2 + 1] = 0; continue; }
    a += dt; pAge[i] = a;
    const o = i * 3;
    pVel[o] *= drag; pVel[o + 2] *= drag; pVel[o + 1] = pVel[o + 1] * drag - 9.8 * dt * 0.75;
    pPos[o] += pVel[o] * dt; pPos[o + 1] += pVel[o + 1] * dt; pPos[o + 2] += pVel[o + 2] * dt;
    if (pPos[o + 1] < 0.05) { pPos[o + 1] = 0.05; pVel[o + 1] *= -0.1; }
    const t = a / pLife[i];
    pAttr[i * 2 + 1] = Math.min(1, t * 8) * (1 - t) * 0.6;
    pAttr[i * 2] *= 1 + dt * 0.5;
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.aSA.needsUpdate = true;
}

  px = e.clientX; py = e.clientY; lastInput = performance.now();
});
const endDrag = () => { dragging = false; el.classList.remove('drag'); lastInput = performance.now(); };
el.addEventListener('pointerup', endDrag); el.addEventListener('pointercancel', endDrag);
el.addEventListener('wheel', e => { e.preventDefault(); cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 6, 220); lastInput = performance.now(); }, { passive: false });

function autoCam(t) {
  return {
    az: Math.PI - 0.72 + 0.2 * Math.sin(0.045 * t),
    el: 0.3 + 0.06 * Math.sin(0.06 * t + 1.0),
    dist: 25 + 5 * Math.sin(0.037 * t + 0.5),
  };
}

function onResize() {
  renderer.setPixelRatio(pixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  const v = new THREE.Vector2(); renderer.getDrawingBufferSize(v);
  pMat.uniforms.uScale.value = v.y / (2 * Math.tan(camera.fov * D2R / 2));
}
addEventListener('resize', onResize); onResize();

function step(t, dt) {
  const peel = PEEL_SPEED * t;
  U.uTime.value = t; U.uPeel.value = peel;
  wave.position.x = peel;

  // --- surfer locked to the moving face ---
  const rs = riderState(t);
  facePoint(rs.s, rideHeight(rs.s, rs.hf), surfP, surfN);
  surfP.x += peel;
  if (dt > 0) { _v.copy(surfP).sub(prevSurf).divideScalar(dt); if (_v.length() < 40) vel.lerp(_v, 1 - Math.exp(-dt * 8)); }
  prevSurf.copy(surfP);
  const dh = (rs.hf - lastHf) / Math.max(dt, 1e-3); lastHf = rs.hf;
  carve = lerp(carve, clamp(Math.abs(dh) * 2.2, 0, 1), 1 - Math.exp(-dt * 4));

  upv.copy(surfN).addScaledVector(WORLD_UP, 0.55).normalize();
  faceUp.copy(WORLD_UP).addScaledVector(upv, -upv.y).normalize();
  fwd.copy(vel).addScaledVector(upv, -vel.dot(upv)).normalize().multiplyScalar(PEEL_SPEED);
  fwd.addScaledVector(faceUp, dh * 9).addScaledVector(upv, -fwd.dot(upv)).normalize();
  side.crossVectors(fwd, upv).normalize();
  upv.crossVectors(side, fwd).normalize();
  mBasis.makeBasis(fwd, upv, side);
  _q.setFromRotationMatrix(mBasis);
  qBoard.slerp(_q, 1 - Math.exp(-dt * 10));
  surfer.quaternion.copy(qBoard);
  surfer.position.copy(surfP).addScaledVector(surfN, 0.02);
  // keep the rider's body closer to vertical than the board
  _v.copy(WORLD_UP).applyQuaternion(_qi.copy(qBoard).invert());
  rider.rotation.x = Math.atan2(_v.z, _v.y) * 0.5;
  const R = rider.userData, crouch = 0.15 + 0.3 * carve + 0.08 * Math.sin(t * 3.1);
  R.hipF.rotation.z = 0.75 + crouch * 0.5; R.kneeF.rotation.z = -1.1 - crouch * 0.8;
  R.hipB.rotation.z = -0.55 + crouch * 0.3; R.kneeB.rotation.z = -0.35 - crouch * 0.7;
  R.torso.rotation.z = -0.35 - crouch * 0.4; R.torso.position.y = 0.95 - crouch * 0.18;
  R.hipF.position.y = R.hipB.position.y = 0.95 - crouch * 0.18;
  R.shF.rotation.x = -0.9 - 0.4 * Math.sin(t * 0.85); R.shB.rotation.x = 0.9 + 0.3 * Math.sin(t * 0.85 + 1);
  rider.rotation.y = -0.25 * Math.sin(0.85 * t);

  // --- wake trail (stored in world x + face height fraction, re-projected onto the face) ---
  wakeTimer += dt;
  if (wakeTimer > 0.08) { wakeTimer = 0; wakeHist.unshift({ x: surfP.x - 0.8, hf: rs.hf, t }); if (wakeHist.length > WAKE_N) wakeHist.pop(); }
  for (let i = 0; i < WAKE_N; i++) {
    const w = wakeU.value[i];
    if (i === 0) { w.set(surfP.x - 0.8, surfP.y, surfP.z, 0); continue; }
    const h = wakeHist[Math.min(i, wakeHist.length - 1)];
    if (!h) { w.set(0, -100, 0, 1); continue; }
    const s = h.x - peel;
    facePoint(s, rideHeight(s, h.hf), _p, _n);
    w.set(_p.x + peel, _p.y, _p.z, clamp((t - h.t) / 1.3, 0, 1));
  }

  // --- particles ---
  _p.copy(surfP).addScaledVector(fwd, -0.6);
  spawnParticles(dt, peel, carve, _p, Math.sign(dh) || 1);
  updateParticles(dt);

  // --- world anchors ---
  island1.position.set(peel + ISL1.dx, 0, ISL1.z);
  island2.position.set(peel + ISL2.dx, 0, ISL2.z);
  U.uIsl1.value.set(island1.position.x, ISL1.z, ISL1.R * 0.95, 0);
  U.uIsl2.value.set(island2.position.x, ISL2.z, ISL2.R * 0.95, 0);
  sunLight.position.copy(surfP).addScaledVector(SUN, 60); sunLight.target.position.copy(surfP);
}
const _q = new THREE.Quaternion(), _qi = new THREE.Quaternion(), _p = new THREE.Vector3(), _n = new THREE.Vector3();

function updateCamera(t, dt) {
  const tgt = _v.set(surfP.x + 3, 2.6, surfP.z * 0.6);
  camTarget.lerp(tgt, 1 - Math.exp(-dt * 3));
  const idle = (performance.now() - lastInput) / 1000;
  if (!dragging && idle > 3) {
    const a = autoCam(t), k = 1 - Math.exp(-dt * 0.7 * Math.min(1, (idle - 3) / 2));
    let d = a.az - cam.az; d = Math.atan2(Math.sin(d), Math.cos(d));
    cam.az += d * k; cam.el += (a.el - cam.el) * k; cam.dist += (a.dist - cam.dist) * k;
  }
  const ce = Math.cos(cam.el);
  camera.position.set(camTarget.x + cam.dist * ce * Math.cos(cam.az), camTarget.y + cam.dist * Math.sin(cam.el), camTarget.z + cam.dist * ce * Math.sin(cam.az));
  if (camera.position.y < 1.2) camera.position.y = 1.2;
  camera.lookAt(camTarget);
  lagoon.position.set(camera.position.x, 0, camera.position.z);
  sky.position.copy(camera.position);
}

// warm-up so spray and wake already exist on the first frame
let simT = 0;
const START = 12;
for (let i = 0; i < 150; i++) { simT = START + i / 60 - 2.5; step(simT, 1 / 60); }
simT = START;
{ const a = autoCam(simT); Object.assign(cam, a); camTarget.set(surfP.x + 3, 2.6, surfP.z * 0.6); }

// adaptive resolution to hold 60 fps
let perfAcc = 0, perfN = 0, perfClock = 0;
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  simT += dt;
  step(simT, dt);
  updateCamera(simT, dt);
  renderer.render(scene, camera);
  perfAcc += dt; perfN++; perfClock += dt;
  if (perfClock > 2.5) {
    const avg = perfAcc / perfN;
    if (avg > 1 / 50 && pixelRatio > 0.75) { pixelRatio = Math.max(0.75, pixelRatio - 0.25); onResize(); }
    perfAcc = perfN = perfClock = 0;
  }
});
setTimeout(() => { document.getElementById('hud').style.opacity = '0.35'; }, 7000);
</script>
</body>
