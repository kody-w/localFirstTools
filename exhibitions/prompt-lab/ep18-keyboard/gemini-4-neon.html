// ==================== WEB AUDIO MECHANICAL SWITCH SYNTH ====================
let audioCtx = null;
function playKeySound(isUp = false) {
  if (!state.soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const sw = SWITCHES[state.switchIdx];
    const now = audioCtx.currentTime;

    // Short filtered noise burst for keycap thock
    const bufLen = Math.floor(audioCtx.sampleRate * 0.045);
    const buf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < bufLen; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufLen * 0.22));
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buf;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = (isUp ? sw.freq * 1.45 : sw.freq) * (0.94 + Math.random() * 0.12);
    filter.Q.value = 1.8;

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(isUp ? 0.06 : 0.16, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start(now);

    // Clicky/tactile transient
    if (!isUp && sw.click > 0.1) {
      const osc = audioCtx.createOscillator();
      const og = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1900 + sw.click * 1400, now);
      osc.frequency.exponentialRampToValueAtTime(420, now + 0.014);
      og.gain.setValueAtTime(0.08 * sw.click, now);
      og.gain.exponentialRampToValueAtTime(0.001, now + 0.015);
      osc.connect(og);
      og.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.018);
    }
  } catch (_) {}
}

// ==================== KEY PRESS & CHARACTER MAPPING ====================
const CHAR_TO_CODE = {
  '`': 'Backquote', '~': 'Backquote', '1': 'Digit1', '!': 'Digit1', '2': 'Digit2', '@': 'Digit2',
  '3': 'Digit3', '#': 'Digit3', '4': 'Digit4', '$': 'Digit4', '5': 'Digit5', '%': 'Digit5',
  '6': 'Digit6', '^': 'Digit6', '7': 'Digit7', '&': 'Digit7', '8': 'Digit8', '*': 'Digit8',
  '9': 'Digit9', '(': 'Digit9', '0': 'Digit0', ')': 'Digit0', '-': 'Minus', '_': 'Minus',
  '=': 'Equal', '+': 'Equal', '[': 'BracketLeft', '{': 'BracketLeft', ']': 'BracketRight', '}': 'BracketRight',
  '\\': 'Backslash', '|': 'Backslash', ';': 'Semicolon', ':': 'Semicolon', "'": 'Quote', '"': 'Quote',
  ',': 'Comma', '<': 'Comma', '.': 'Period', '>': 'Period', '/': 'Slash', '?': 'Slash', ' ': 'Space'
};

function triggerKeyPress(key, fromTyping = false, nowSec = performance.now() * 0.001) {
  if (!key) return;
  const ks = keyState[key.idx];
  ks.down = true;
  ks.holdUntil = nowSec + 0.12;
  ks.flash = 1.0;
  playKeySound(false);
  if (fromTyping) {
    state.typedCount++;
    document.getElementById('typing-stat').textContent = `${state.typedCount} ${state.typedCount === 1 ? 'key' : 'keys'}`;
  }
  // Spawn RGB ripple at this key
  state.ripples.push({ x: key.x, z: key.z, t: 0, hue: (nowSec * 0.23 + key.idx * 0.07) % 1 });
  if (state.ripples.length > 8) state.ripples.shift();
}

function resolveKeyFromEvent(e) {
  if (KEY_BY_CODE.has(e.code)) return KEY_BY_CODE.get(e.code);
  const ch = e.key;
  if (ch && ch.length === 1) {
    const up = ch.toUpperCase();
    if (up >= 'A' && up <= 'Z') return KEY_BY_CODE.get('Key' + up);
    const mapped = CHAR_TO_CODE[ch];
    if (mapped) return KEY_BY_CODE.get(mapped);
  }
  return null;
}

// ==================== UI CONSTRUCTION & BINDINGS ====================
const toastEl = document.getElementById('toast');
let toastTimer = null;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

function buildUI() {
  // Colorway Swatches
  const cwWrap = document.getElementById('colorway-swatches');
  COLORWAYS.forEach((cw, i) => {
    const btn = document.createElement('button');
    btn.className = 'swatch' + (i === state.colorwayIdx ? ' active' : '');
    btn.title = cw.name;
    btn.innerHTML = `<div class="swatch-tri"><div class="top" style="background:${cw.alpha}"></div><div class="bot"><span style="background:${cw.mod}"></span><span style="background:${cw.accent}"></span></div></div>`;
    btn.addEventListener('click', () => selectColorway(i));
    cwWrap.appendChild(btn);
  });

  // Case Swatches
  const csWrap = document.getElementById('case-swatches');
  CASES.forEach((cs, i) => {
    const btn = document.createElement('button');
    btn.className = 'swatch' + (i === state.caseIdx ? ' active' : '');
    btn.title = cs.name;
    btn.innerHTML = `<div class="swatch-duo"><span style="background:${cs.top}"></span><span style="background:${cs.bot}"></span></div>`;
    btn.addEventListener('click', () => selectCase(i));
    csWrap.appendChild(btn);
  });

  // Switch Selector
  const swWrap = document.getElementById('switch-selector');
  SWITCHES.forEach((sw, i) => {
    const btn = document.createElement('button');
    btn.className = 'sw-btn' + (i === state.switchIdx ? ' active' : '');
    btn.innerHTML = `<span class="sw-dot" style="background:${sw.stem}"></span><span class="sw-meta"><span class="sw-name">${sw.name}</span><span class="sw-spec">${sw.spec}</span></span>`;
    btn.addEventListener('click', () => selectSwitch(i));
    swWrap.appendChild(btn);
  });

  // Explode Labels DOM
  const lblLayer = document.getElementById('labels-layer');
  EXPLODE_LAYERS.forEach((layer) => {
    const el = document.createElement('div');
    el.className = 'explode-label';
    el.innerHTML = `<span class="dot" style="background:${layer.color}"></span><span>${layer.name}</span><span class="sub">${layer.sub}</span>`;
    lblLayer.appendChild(el);
    layer.el = el;
  });

  // Toolbar buttons
  document.getElementById('btn-explode').addEventListener('click', toggleExplode);
  document.getElementById('btn-rgb').addEventListener('click', toggleRgb);
  document.getElementById('toggle-rgb').addEventListener('click', toggleRgb);
  document.getElementById('btn-sound').addEventListener('click', () => {
    state.soundOn = !state.soundOn;
    document.getElementById('btn-sound').classList.toggle('active', state.soundOn);
    if (state.soundOn) playKeySound(false);
  });
  document.getElementById('btn-reset').addEventListener('click', () => {
    cam.resetting = true;
    cam.velYaw = cam.velPitch = cam.velDist = 0;
  });
  document.getElementById('btn-share').addEventListener('click', shareConfig);

  // RGB mode segmented buttons
  document.querySelectorAll('#rgb-modes .seg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.rgbMode = btn.dataset.mode;
      if (!state.rgbOn) toggleRgb();
      updateRgbUI();
      if (state.rgbMode === 'ripple') {
        state.ripples.push({ x: 0, z: 0, t: 0, hue: Math.random() });
      }
    });
  });

  // Typing test field
  const typingInput = document.getElementById('typing-input');
  let lastInputLen = 0;
  typingInput.addEventListener('keydown', (e) => {
    const k = resolveKeyFromEvent(e);
    if (k) triggerKeyPress(k, true);
  });
  typingInput.addEventListener('keyup', (e) => {
    const k = resolveKeyFromEvent(e);
    if (k) {
      keyState[k.idx].down = false;
      playKeySound(true);
    }
  });
  // Fallback for mobile / IME / programmatic input
  typingInput.addEventListener('input', (e) => {
    const v = e.target.value;
    if (v.length > lastInputLen) {
      const ch = v[v.length - 1];
      const up = ch.toUpperCase();
      const code = (up >= 'A' && up <= 'Z') ? ('Key' + up) : CHAR_TO_CODE[ch];
      const k = code ? KEY_BY_CODE.get(code) : null;
      if (k && keyState[k.idx].press < 0.05) triggerKeyPress(k, true);
    }
    lastInputLen = v.length;
  });

  // Global keyboard support when not typing in input
  window.addEventListener('keydown', (e) => {
    if (document.activeElement === typingInput) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = resolveKeyFromEvent(e);
    if (k) triggerKeyPress(k, true);
  });
  window.addEventListener('keyup', (e) => {
    if (document.activeElement === typingInput) return;
    const k = resolveKeyFromEvent(e);
    if (k) {
      keyState[k.idx].down = false;
      playKeySound(true);
    }
  });

  // Orbit & zoom pointer controls
  canvas.addEventListener('pointerdown', (e) => {
    cam.dragging = true;
    cam.resetting = false;
    cam.lastX = e.clientX;
    cam.lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!cam.dragging) return;
    const dx = e.clientX - cam.lastX;
    const dy = e.clientY - cam.lastY;
    cam.lastX = e.clientX;
    cam.lastY = e.clientY;
    cam.velYaw -= dx * 0.0052;
    cam.velPitch += dy * 0.0046;
  });
  canvas.addEventListener('pointerup', (e) => {
    cam.dragging = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    cam.resetting = false;
    cam.velDist += e.deltaY * 0.012;
    state.knobVel += e.deltaY * 0.003;
  }, { passive: false });
  canvas.addEventListener('dblclick', () => { cam.resetting = true; });
}

function selectColorway(idx, silent = false) {
  if (idx === state.colorwayIdx && !silent) return;
  state.prevColorwayIdx = state.colorwayIdx;
  state.colorwayIdx = idx;
  state.colorwayRipple = silent ? 99 : 0;
  document.querySelectorAll('#colorway-swatches .swatch').forEach((el, i) => el.classList.toggle('active', i === idx));
  document.getElementById('val-colorway').textContent = COLORWAYS[idx].name;
}

function selectCase(idx, silent = false) {
  if (idx === state.caseIdx && !silent) return;
  state.prevCaseIdx = state.caseIdx;
  state.caseIdx = idx;
  state.caseRipple = silent ? 99 : 0;
  document.querySelectorAll('#case-swatches .swatch').forEach((el, i) => el.classList.toggle('active', i === idx));
  document.getElementById('val-case').textContent = CASES[idx].name;
}

function selectSwitch(idx, silent = false) {
  state.switchIdx = idx;
  if (!silent) state.switchWaveT = 0.0; // Trigger wave-lift to reveal new stems!
  document.querySelectorAll('#switch-selector .sw-btn').forEach((el, i) => el.classList.toggle('active', i === idx));
  const sw = SWITCHES[idx];
  document.getElementById('val-switch').textContent = sw.name;
  document.getElementById('chip-switch').textContent = `${sw.name.toUpperCase()} · ${sw.spec.split('·')[0].trim()}`;
}

function toggleExplode() {
  state.exploded = !state.exploded;
  document.getElementById('btn-explode').classList.toggle('active', state.exploded);
}

function toggleRgb() {
  state.rgbOn = !state.rgbOn;
  updateRgbUI();
}

function updateRgbUI() {
  document.getElementById('btn-rgb').classList.toggle('active', state.rgbOn);
  document.getElementById('toggle-rgb').classList.toggle('on', state.rgbOn);
  document.querySelectorAll('#rgb-modes .seg-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === state.rgbMode);
    btn.disabled = !state.rgbOn;
  });
}

function shareConfig() {
  const cfg = {
    cw: COLORWAYS[state.colorwayIdx].id,
    cs: CASES[state.caseIdx].id,
    sw: SWITCHES[state.switchIdx].id,
    rgb: state.rgbOn ? state.rgbMode : 'off',
    ex: state.exploded ? 1 : 0
  };
  const hash = '#cfg=' + encodeURIComponent(JSON.stringify(cfg));
  try { history.replaceState(null, '', hash); } catch (_) {}
  const url = window.location.href;
  const summary = `AXON-75 · ${COLORWAYS[state.colorwayIdx].name} / ${CASES[state.caseIdx].name} / ${SWITCHES[state.switchIdx].name}`;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(
      () => showToast(`Share link copied — ${summary}`),
      () => showToast(`Saved in URL — ${summary}`)
    );
  } else {
    showToast(`Saved in URL — ${summary}`);
  }
}

function restoreFromHash() {
  try {
    if (!location.hash.startsWith('#cfg=')) return;
    const cfg = JSON.parse(decodeURIComponent(location.hash.slice(5)));
    const ci = COLORWAYS.findIndex(c => c.id === cfg.cw);
    const ki = CASES.findIndex(c => c.id === cfg.cs);
    const si = SWITCHES.findIndex(s => s.id === cfg.sw);
    if (ci >= 0) selectColorway(ci, true);
    if (ki >= 0) selectCase(ki, true);
    if (si >= 0) selectSwitch(si, true);
    if (cfg.rgb === 'off') { state.rgbOn = false; state.rgbBlend = 0; }
    else if (['wave', 'breathe', 'ripple'].includes(cfg.rgb)) { state.rgbOn = true; state.rgbMode = cfg.rgb; }
    if (cfg.ex) { state.exploded = true; document.getElementById('btn-explode').classList.add('active'); }
    updateRgbUI();
  } catch (_) {}
}

// ==================== EXPLODE LABELS (COLLISION-FREE) ====================
const labelsSvg = document.getElementById('labels-svg');

function updateExplodeLabels(vp, cssW, cssH, boardBaseMat) {
  const vis = smoothstep(0.18, 0.55, state.explodeProgress);
  if (vis < 0.01) {
    labelsSvg.innerHTML = '';
    for (const l of EXPLODE_LAYERS) l.el.style.opacity = '0';
    return;
  }

  // Project each layer's right-front anchor point
  const items = [];
  for (let i = 0; i < EXPLODE_LAYERS.length; i++) {
    const l = EXPLODE_LAYERS[i];
    const localAnchor = [BOARD_W * 0.5 + 0.65, l.anchorY + state.layerY[i], 0.0];
    // Transform by boardBaseMat (6.5deg typing tilt)
    const m = boardBaseMat;
    const wx = m[0]*localAnchor[0] + m[4]*localAnchor[1] + m[8]*localAnchor[2] + m[12];
    const wy = m[1]*localAnchor[0] + m[5]*localAnchor[1] + m[9]*localAnchor[2] + m[13];
    const wz = m[2]*localAnchor[0] + m[6]*localAnchor[1] + m[10]*localAnchor[2] + m[14];
    const p = mat4.projectPoint([wx, wy, wz], vp, cssW, cssH);
    if (!p) continue;
    items.push({ layer: l, ax: p.x, ay: p.y, ly: p.y });
  }

  // Sort top-to-bottom in screen Y and enforce minimum 28px spacing (never overlaps!)
  items.sort((a, b) => a.ay - b.ay);
  const minGap = 28;
  const topBound = 76;
  const botBound = cssH - 86;

  // Iterative bidirectional relaxation
  for (let iter = 0; iter < 12; iter++) {
    for (let i = 1; i < items.length; i++) {
      const diff = items[i].ly - items[i - 1].ly;
      if (diff < minGap) {
        const push = (minGap - diff) * 0.5;
        items[i - 1].ly -= push;
        items[i].ly += push;
      }
    }
    if (items.length > 0 && items[0].ly < topBound) {
      items[0].ly = topBound;
    }
    for (let i = 1; i < items.length; i++) {
      if (items[i].ly < items[i - 1].ly + minGap) {
        items[i].ly = items[i - 1].ly + minGap;
      }
    }
    if (items.length > 0 && items[items.length - 1].ly > botBound) {
      items[items.length - 1].ly = botBound;
      for (let i = items.length - 2; i >= 0; i--) {
        if (items[i].ly > items[i + 1].ly - minGap) {
          items[i].ly = items[i + 1].ly - minGap;
        }
      }
    }
  }

  // Position labels neatly on left side of right config card (or left of board if narrow)
  const rightSafe = cssW - 322;
  const labelLeft = Math.max(24, Math.min(rightSafe - 190, cssW * 0.62));
  let svgParts = '';

  for (const it of items) {
    const el = it.layer.el;
    const lx = Math.min(labelLeft, Math.max(it.ax + 26, cssW * 0.54));
    const finalX = Math.min(lx, rightSafe - (el.offsetWidth || 180));
    el.style.left = `${Math.round(finalX)}px`;
    el.style.top = `${Math.round(it.ly)}px`;
    el.style.opacity = vis.toFixed(3);

    const elbowX = finalX - 14;
    svgParts += `<polyline points="${it.ax.toFixed(1)},${it.ay.toFixed(1)} ${elbowX.toFixed(1)},${it.ly.toFixed(1)} ${finalX.toFixed(1)},${it.ly.toFixed(1)}" fill="none" stroke="rgba(45,39,32,${(0.36 * vis).toFixed(2)})" stroke-width="1.25"/>`;
    svgParts += `<circle cx="${it.ax.toFixed(1)}" cy="${it.ay.toFixed(1)}" r="3" fill="${it.layer.color}" opacity="${vis.toFixed(2)}"/>`;
  }
  labelsSvg.innerHTML = svgParts;
}

// ==================== PER-KEY DATA TEXTURE UPDATE ====================
function getColorwayKeyColors(cw, group) {
  if (group === 1) return [hexToRgb(cw.mod), hexToRgb(cw.modLeg)];
  if (group === 2) return [hexToRgb(cw.accent), hexToRgb(cw.accentLeg)];
  return [hexToRgb(cw.alpha), hexToRgb(cw.alphaLeg)];
}

function updateKeyDataTexture(nowSec, dt) {
  const cwNew = COLORWAYS[state.colorwayIdx];
  const cwOld = COLORWAYS[state.prevColorwayIdx];
  const rgbModeInt = state.rgbMode === 'wave' ? 0 : (state.rgbMode === 'breathe' ? 1 : 2);

  // Advance ripples
  for (let i = state.ripples.length - 1; i >= 0; i--) {
    state.ripples[i].t += dt * 11.5;
    if (state.ripples[i].t > 24) state.ripples.splice(i, 1);
  }

  for (let i = 0; i < KEYS.length; i++) {
    const k = KEYS[i];
    const ks = keyState[i];

    // Release timed presses
    if (ks.down && ks.holdUntil > 0 && nowSec > ks.holdUntil) {
      ks.down = false;
      ks.holdUntil = 0;
    }

    // Crisp spring press physics
    const targetP = ks.down ? 0.21 : 0.0;
    ks.press += (targetP - ks.press) * Math.min(1, dt * 28);
    ks.flash = Math.max(0, ks.flash - dt * 2.8);

    // Switch-swap wave lift (keys lift in a wave to reveal stems, then drop back)
    let liftY = 0;
    if (state.switchWaveT < 2.2) {
      const waveDelay = (k.x + CENTER_X) * 0.030 + (k.z + CENTER_Z) * 0.012;
      const lt = state.switchWaveT - waveDelay;
      if (lt > 0 && lt < 1.25) {
        const up = smoothstep(0.0, 0.26, lt);
        const dn = 1.0 - smoothstep(0.78, 1.22, lt);
        liftY = up * dn * 1.15;
      }
    }

    // Colorway ripple recolor wave
    const distFromCenter = Math.hypot(k.x, k.z);
    const ripBlend = smoothstep(state.colorwayRipple + 1.4, state.colorwayRipple - 1.4, distFromCenter);
    const popY = Math.exp(-Math.pow((distFromCenter - state.colorwayRipple) * 0.9, 2)) * 0.14 * (state.colorwayRipple < 20 ? 1 : 0);

    const [capNew, legNew] = getColorwayKeyColors(cwNew, k.group);
    const [capOld, legOld] = getColorwayKeyColors(cwOld, k.group);

    const capR = lerp(capOld[0], capNew[0], ripBlend);
    const capG = lerp(capOld[1], capNew[1], ripBlend);
    const capB = lerp(capOld[2], capNew[2], ripBlend);
    const legR = lerp(legOld[0], legNew[0], ripBlend);
    const legG = lerp(legOld[1], legNew[1], ripBlend);
    const legB = lerp(legOld[2], legNew[2], ripBlend);

    // Per-key RGB effect
    let rgb = [0, 0, 0];
    if (state.rgbBlend > 0.005) {
      if (rgbModeInt === 0) {
        // Wave
        const hue = (k.x * 0.055 + k.z * 0.035 - nowSec * 0.34);
        rgb = hslToRgb(hue, 0.88, 0.56);
      } else if (rgbModeInt === 1) {
        // Breathe
        const pulse = 0.22 + 0.78 * (0.5 + 0.5 * Math.sin(nowSec * 1.9));
        const base = hslToRgb(nowSec * 0.06, 0.82, 0.54);
        rgb = [base[0] * pulse, base[1] * pulse, base[2] * pulse];
      } else {
        // Ripple from typed keys (with subtle ambient glow)
        const amb = hslToRgb(nowSec * 0.08 + k.x * 0.02, 0.65, 0.45);
        let rr = amb[0] * 0.22, rg = amb[1] * 0.22, rb = amb[2] * 0.22;
        for (const rp of state.ripples) {
          const d = Math.hypot(k.x - rp.x, k.z - rp.z);
          const ring = Math.exp(-Math.pow((d - rp.t) * 0.75, 2)) * Math.max(0, 1 - rp.t / 18);
          if (ring > 0.01) {
            const rc = hslToRgb(rp.hue + d * 0.03, 0.95, 0.58);
            rr += rc[0] * ring * 1.45;
            rg += rc[1] * ring * 1.45;
            rb += rc[2] * ring * 1.45;
          }
        }
        rgb = [Math.min(1.5, rr), Math.min(1.5, rg), Math.min(1.5, rb)];
      }
    }

    // Write 4 rows into keyDataArr
    const o0 = (0 * KEY_TEX_W + i) * 4;
    keyDataArr[o0]     = ks.press;
    keyDataArr[o0 + 1] = liftY;
    keyDataArr[o0 + 2] = popY;
    keyDataArr[o0 + 3] = 0;

    const o1 = (1 * KEY_TEX_W + i) * 4;
    keyDataArr[o1]     = capR;
    keyDataArr[o1 + 1] = capG;
    keyDataArr[o1 + 2] = capB;
    keyDataArr[o1 + 3] = 1.0;

    const o2 = (2 * KEY_TEX_W + i) * 4;
    keyDataArr[o2]     = legR;
    keyDataArr[o2 + 1] = legG;
    keyDataArr[o2 + 2] = legB;
    keyDataArr[o2 + 3] = state.rgbBlend;

    const o3 = (3 * KEY_TEX_W + i) * 4;
    keyDataArr[o3]     = rgb[0];
    keyDataArr[o3 + 1] = rgb[1];
    keyDataArr[o3 + 2] = rgb[2];
    keyDataArr[o3 + 3] = ks.flash;
  }

  gl.bindTexture(gl.TEXTURE_2D, keyDataTex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, KEY_TEX_W, KEY_TEX_H, gl.RGBA, gl.FLOAT, keyDataArr);
}

// ==================== DRAW HELPERS ====================
function drawPbr(mesh, modelMat, vp, camPos, color, opts = {}) {
  gl.useProgram(pbrProg);
  gl.uniformMatrix4fv(uPbr.uModel, false, modelMat);
  gl.uniformMatrix4fv(uPbr.uViewProj, false, vp);
  gl.uniform3fv(uPbr.uCamPos, camPos);
  gl.uniform3fv(uPbr.uColor, color);
  gl.uniform3fv(uPbr.uOldColor, opts.oldColor || color);
  gl.uniform1f(uPbr.uRippleRadius, opts.ripple !== undefined ? opts.ripple : 99.0);
  gl.uniform1f(uPbr.uMetallic, opts.metal ?? 0.1);
  gl.uniform1f(uPbr.uRoughness, opts.rough ?? 0.45);
  gl.uniform1f(uPbr.uPattern, opts.pattern ?? 0.0);
  gl.uniform3fv(uPbr.uEmissive, opts.emissive || [0, 0, 0]);
  gl.uniform1f(uPbr.uTime, opts.time || 0);
  gl.uniform1f(uPbr.uRgbOn, state.rgbBlend);
  gl.uniform1i(uPbr.uRgbMode, state.rgbMode === 'wave' ? 0 : (state.rgbMode === 'breathe' ? 1 : 2));

  gl.bindVertexArray(mesh.vao);
  gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_INT, 0);
}

// ==================== MAIN RENDER LOOP ====================
const projMat = mat4.create();
const viewMat = mat4.create();
const vpMat   = mat4.create();
const baseMat = mat4.create();
const tmpMat  = mat4.create();

let cssW = window.innerWidth, cssH = window.innerHeight;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cssW = window.innerWidth;
  cssH = window.innerHeight;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

buildUI();
restoreFromHash();
updateRgbUI();

let lastMs = performance.now();
function frame(nowMs) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (nowMs - lastMs) * 0.001);
  lastMs = nowMs;
  const nowSec = nowMs * 0.001;

  // 1. Camera inertia & reset
  if (cam.resetting) {
    const targetPitch = state.exploded ? 0.32 : 0.62;
    const targetDist = state.exploded ? 25.5 : 20.5;
    cam.yaw   = lerp(cam.yaw, 0.42, 1 - Math.exp(-dt * 6));
    cam.pitch = lerp(cam.pitch, targetPitch, 1 - Math.exp(-dt * 6));
    cam.dist  = lerp(cam.dist, targetDist, 1 - Math.exp(-dt * 6));
    if (Math.abs(cam.yaw - 0.42) < 0.002 && Math.abs(cam.pitch - targetPitch) < 0.002) cam.resetting = false;
  } else {
    cam.yaw   += cam.velYaw;
    cam.pitch = clamp(cam.pitch + cam.velPitch, -1.25, 1.42);
    cam.dist  = clamp(cam.dist + cam.velDist, 10.5, 36.0);
    const damp = Math.exp(-dt * 9.5);
    cam.velYaw *= damp;
    cam.velPitch *= damp;
    cam.velDist *= Math.exp(-dt * 11.0);
  }

  // Rotary knob inertia
  state.knobAngle += state.knobVel;
  state.knobVel *= Math.exp(-dt * 7.5);

  // 2. Staggered Explode Cascade
  const targetEx = state.exploded ? 1 : 0;
  state.explodeProgress += (targetEx - state.explodeProgress) * Math.min(1, dt * 4.2);
  for (let i = 0; i < EXPLODE_LAYERS.length; i++) {
    const l = EXPLODE_LAYERS[i];
    const p = state.exploded
      ? smoothstep(l.delay, l.delay + 0.55, state.explodeProgress)
      : smoothstep(0.40 - l.delay, 0.95 - l.delay, state.explodeProgress);
    const goalY = l.targetY * p;
    state.layerY[i] += (goalY - state.layerY[i]) * Math.min(1, dt * 10.5);
  }

  // Advance ripple & switch wave timers
  if (state.colorwayRipple < 24) state.colorwayRipple += dt * 22;
  if (state.caseRipple < 24) state.caseRipple += dt * 22;
  if (state.switchWaveT < 2.5) state.switchWaveT += dt * 1.15;
  state.rgbBlend += ((state.rgbOn ? 1 : 0) - state.rgbBlend) * Math.min(1, dt * 8);

  // 3. Camera matrices
  const eyeX = Math.sin(cam.yaw) * Math.cos(cam.pitch) * cam.dist;
  const eyeY = Math.sin(cam.pitch) * cam.dist + cam.targetY;
  const eyeZ = Math.cos(cam.yaw) * Math.cos(cam.pitch) * cam.dist;
  const camPos = [eyeX, eyeY, eyeZ];

  mat4.perspective(projMat, 36 * DEG, cssW / Math.max(1, cssH), 0.2, 120);
  mat4.lookAt(viewMat, camPos, [0, cam.targetY, 0.2], [0, 1, 0]);
  mat4.multiply(vpMat, projMat, viewMat);

  // Board base transform (6.5deg typing angle)
  mat4.identity(baseMat);
  mat4.rotateX(baseMat, baseMat, 6.5 * DEG);

  // Update per-key GPU texture
  updateKeyDataTexture(nowSec, dt);

  // 4. Render Scene
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);

  const cw = COLORWAYS[state.colorwayIdx];
  const cwOld = COLORWAYS[state.prevColorwayIdx];
  const cs = CASES[state.caseIdx];
  const csOld = CASES[state.prevCaseIdx];
  const sw = SWITCHES[state.switchIdx];

  const layerMat = (layerIdx) => {
    tmpMat.set(baseMat);
    mat4.translate(tmpMat, tmpMat, 0, state.layerY[layerIdx], 0);
    return tmpMat;
  };

  // Layer 0: Sculpted Cherry Keycaps (1 draw call for all 81 keys)
  gl.useProgram(keycapProg);
  gl.uniformMatrix4fv(uKeycap.uModel, false, layerMat(0));
  gl.uniformMatrix4fv(uKeycap.uViewProj, false, vpMat);
  gl.uniform3fv(uKeycap.uCamPos, camPos);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, keyDataTex);
  gl.uniform1i(uKeycap.uKeyData, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, legendTex);
  gl.uniform1i(uKeycap.uLegendAtlas, 1);
  gl.bindVertexArray(keycapsMesh.vao);
  gl.drawElements(gl.TRIANGLES, keycapsMesh.count, gl.UNSIGNED_INT, 0);

  // Layer 0: Artisan Esc (moves with Esc key press + wave lift)
  const escLift = keyDataArr[1] - keyDataArr[0] + keyDataArr[2];
  tmpMat.set(baseMat);
  mat4.translate(tmpMat, tmpMat, 0, state.layerY[0] + escLift, 0);
  drawPbr(artisanMesh.base, tmpMat, vpMat, camPos, hexToRgb(cw.artisanBase), {
    oldColor: hexToRgb(cwOld.artisanBase), ripple: state.colorwayRipple, metal: 0.25, rough: 0.18
  });
  const artGlow = state.rgbBlend > 0.05 ? hslToRgb(nowSec * 0.25, 0.85, 0.52).map(v => v * 0.35 * state.rgbBlend) : [0, 0, 0];
  drawPbr(artisanMesh.peak, tmpMat, vpMat, camPos, hexToRgb(cw.artisanPeak), {
    oldColor: hexToRgb(cwOld.artisanPeak), ripple: state.colorwayRipple, metal: 0.90, rough: 0.16, emissive: artGlow
  });

  // Layer 0: CNC Aluminum Rotary Knob
  tmpMat.set(baseMat);
  mat4.translate(tmpMat, tmpMat, KNOB_POS.x, state.layerY[0], KNOB_POS.z);
  mat4.rotateY(tmpMat, tmpMat, state.knobAngle);
  drawPbr(knobMesh, tmpMat, vpMat, camPos, hexToRgb(cs.top), {
    oldColor: hexToRgb(csOld.top), ripple: state.caseRipple, metal: 0.92, rough: 0.20
  });

  // Layer 1: CNC Top Case
  drawPbr(stackMeshes.topCase, layerMat(1), vpMat, camPos, hexToRgb(cs.top), {
    oldColor: hexToRgb(csOld.top), ripple: state.caseRipple, metal: cs.metal, rough: cs.rough
  });

  // Layer 2: Switches (Housings + Colored MX Stems + Stabilizers)
  gl.useProgram(switchProg);
  gl.uniformMatrix4fv(uSwitch.uModel, false, layerMat(2));
  gl.uniformMatrix4fv(uSwitch.uViewProj, false, vpMat);
  gl.uniform3fv(uSwitch.uCamPos, camPos);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, keyDataTex);
  gl.uniform1i(uSwitch.uKeyData, 0);

  // Housings (stationary)
  gl.uniform1f(uSwitch.uMoveWithPress, 0.0);
  gl.uniform3fv(uSwitch.uColor, hexToRgb(sw.housing));
  gl.uniform1f(uSwitch.uMetallic, 0.05);
  gl.uniform1f(uSwitch.uRoughness, 0.34);
  gl.bindVertexArray(switchMeshes.housing.vao);
  gl.drawElements(gl.TRIANGLES, switchMeshes.housing.count, gl.UNSIGNED_INT, 0);

  // Stems (move with key press!)
  gl.uniform1f(uSwitch.uMoveWithPress, 1.0);
  gl.uniform3fv(uSwitch.uColor, hexToRgb(sw.stem));
  gl.uniform1f(uSwitch.uMetallic, 0.08);
  gl.uniform1f(uSwitch.uRoughness, 0.30);
  gl.bindVertexArray(switchMeshes.stem.vao);
  gl.drawElements(gl.TRIANGLES, switchMeshes.stem.count, gl.UNSIGNED_INT, 0);

  // Stabilizer Housings & Steel Wires
  drawPbr(switchMeshes.stabHousing, layerMat(2), vpMat, camPos, [0.16, 0.16, 0.18], { metal: 0.05, rough: 0.42 });
  drawPbr(switchMeshes.stabWire,    layerMat(2), vpMat, camPos, [0.82, 0.83, 0.85], { metal: 0.95, rough: 0.16 });

  // Layer 3: Poron Gaskets
  drawPbr(stackMeshes.gaskets, layerMat(3), vpMat, camPos, [0.16, 0.16, 0.17], { metal: 0.0, rough: 0.88 });

  // Layer 4: Sandblasted Brass Plate
  drawPbr(stackMeshes.plate, layerMat(4), vpMat, camPos, [0.84, 0.67, 0.34], { metal: 0.92, rough: 0.24, pattern: 2.0 });

  // Layer 5: Plate Foam
  drawPbr(stackMeshes.plateFoam, layerMat(5), vpMat, camPos, [0.14, 0.14, 0.15], { metal: 0.0, rough: 0.92 });

  // Layer 6: Hot-Swap PCB + Gold Sockets + SMD Diodes
  drawPbr(stackMeshes.pcb,     layerMat(6), vpMat, camPos, [0.10, 0.14, 0.12], { metal: 0.15, rough: 0.42, pattern: 1.0 });
  drawPbr(stackMeshes.sockets, layerMat(6), vpMat, camPos, [0.86, 0.71, 0.32], { metal: 0.92, rough: 0.22 });
  drawPbr(stackMeshes.diodes,  layerMat(6), vpMat, camPos, [0.09, 0.09, 0.10], { metal: 0.10, rough: 0.35 });

  // Layer 7: Case Foam
  drawPbr(stackMeshes.caseFoam, layerMat(7), vpMat, camPos, [0.17, 0.16, 0.16], { metal: 0.0, rough: 0.90 });

  // Layer 8: Two-Tone CNC Bottom Case + Underglow Diffuser + Brass Weight + Feet
  drawPbr(stackMeshes.botCase, layerMat(8), vpMat, camPos, hexToRgb(cs.bot), {
    oldColor: hexToRgb(csOld.bot), ripple: state.caseRipple, metal: cs.metal, rough: cs.rough
  });
  drawPbr(stackMeshes.underglow, layerMat(8), vpMat, camPos, [0.88, 0.87, 0.84], {
    metal: 0.05, rough: 0.22, pattern: 3.0, time: nowSec
  });
  drawPbr(stackMeshes.weight, layerMat(8), vpMat, camPos, [0.85, 0.68, 0.33], { metal: 0.95, rough: 0.19, pattern: 2.0 });
  drawPbr(stackMeshes.feet,   layerMat(8), vpMat, camPos, [0.12, 0.12, 0.12], { metal: 0.0, rough: 0.85 });

  // Coiled USB-C Cable + GX16 Aviator Connector (attached to PCB/case rear, moves gently with PCB)
  const cableMat = layerMat(6);
  drawPbr(cableMeshes.coil, cableMat, vpMat, camPos, hexToRgb(cw.cableCoil), {
    oldColor: hexToRgb(cwOld.cableCoil), ripple: state.colorwayRipple, metal: 0.05, rough: 0.72
  });
  drawPbr(cableMeshes.host, cableMat, vpMat, camPos, hexToRgb(cw.cableHost), {
    oldColor: hexToRgb(cwOld.cableHost), ripple: state.colorwayRipple, metal: 0.05, rough: 0.74
  });
  drawPbr(cableMeshes.shrink, cableMat, vpMat, camPos, hexToRgb(cw.cableShrink), {
    oldColor: hexToRgb(cwOld.cableShrink), ripple: state.colorwayRipple, metal: 0.05, rough: 0.55
  });
  drawPbr(cableMeshes.metal, cableMat, vpMat, camPos, [0.78, 0.79, 0.81], { metal: 0.94, rough: 0.18 });

  // Studio Contact Shadow + RGB Desk Bounce (transparent pass)
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  gl.disable(gl.CULL_FACE);
  mat4.identity(tmpMat);
  mat4.translate(tmpMat, tmpMat, 0, -1.28 + state.layerY[8] * 0.45, 0);
  gl.useProgram(groundProg);
  gl.uniformMatrix4fv(uGround.uModel, false, tmpMat);
  gl.uniformMatrix4fv(uGround.uViewProj, false, vpMat);
  gl.uniform1f(uGround.uExplode, state.explodeProgress);
  gl.uniform1f(uGround.uRgbOn, state.rgbBlend);
  gl.uniform1f(uGround.uTime, nowSec);
  gl.uniform1i(uGround.uRgbMode, state.rgbMode === 'wave' ? 0 : (state.rgbMode === 'breathe' ? 1 : 2));
  gl.bindVertexArray(groundMesh.vao);
  gl.drawElements(gl.TRIANGLES, groundMesh.count, gl.UNSIGNED_INT, 0);
  gl.depthMask(true);
  gl.disable(gl.BLEND);

  // 5. Update collision-free Explode labels
  updateExplodeLabels(vpMat, cssW, cssH, baseMat);
}

requestAnimationFrame(frame);
</script>
