<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>webOS — A Desktop in Your Browser</title>
<meta name="description" content="A complete, self-contained desktop operating system that runs entirely in a browser tab: real window manager with snapping and spaces, virtual OPFS/IndexedDB filesystem, a piping terminal, Files, Text Editor, Settings, Task Manager, Calculator, Notes and more. Local-first, offline, with full JSON state export.">
<!-- os, desktop, window-manager, filesystem, terminal, productivity, spotlight, dock, virtual-desktops -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a84ff'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='monospace'%3E%3E_%3C/text%3E%3C/svg%3E">
<style>
/* ============================== RESET & TOKENS ============================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#0a84ff;
  --accent-rgb:10,132,255;
  --menubar-h:26px;
  --dock-size:58px;
  --radius-win:11px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
  --transition: 0.22s cubic-bezier(.32,.72,0,1);
}
html,body{height:100%;width:100%;overflow:hidden;font-family:var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;background:#000;color:#fff;user-select:none;-webkit-user-select:none;cursor:default}
body{position:fixed;inset:0}
img{-webkit-user-drag:none;user-drag:none}
button{font-family:inherit;cursor:default}

/* theme surfaces */
body.theme-dark{
  --text:#f5f5f7; --text-dim:rgba(235,235,245,.6); --text-faint:rgba(235,235,245,.3);
  --chrome:rgba(46,46,52,.72); --chrome-inactive:rgba(40,40,44,.62);
  --chrome-border:rgba(255,255,255,.12); --sep:rgba(255,255,255,.08);
  --panel:rgba(30,30,34,.82); --panel-solid:#1e1e22;
  --field:rgba(255,255,255,.07); --field-border:rgba(255,255,255,.1);
  --menubar-bg:rgba(30,30,34,.55); --hover:rgba(255,255,255,.09);
  --menu-bg:rgba(44,44,48,.8); --shadow-strong:0 22px 70px rgba(0,0,0,.55),0 6px 18px rgba(0,0,0,.4);
  --shadow-soft:0 12px 40px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.3);
  --content-bg:#242428;
}
body.theme-light{
  --text:#1d1d1f; --text-dim:rgba(60,60,67,.6); --text-faint:rgba(60,60,67,.3);
  --chrome:rgba(246,246,248,.72); --chrome-inactive:rgba(238,238,240,.7);
  --chrome-border:rgba(0,0,0,.1); --sep:rgba(0,0,0,.08);
  --panel:rgba(250,250,252,.8); --panel-solid:#fbfbfd;
  --field:rgba(0,0,0,.045); --field-border:rgba(0,0,0,.12);
  --menubar-bg:rgba(250,250,252,.6); --hover:rgba(0,0,0,.06);
  --menu-bg:rgba(250,250,252,.82); --shadow-strong:0 22px 70px rgba(0,0,0,.28),0 6px 18px rgba(0,0,0,.18);
  --shadow-soft:0 12px 40px rgba(0,0,0,.16),0 2px 8px rgba(0,0,0,.12);
  --content-bg:#ffffff;
}

/* ============================== DESKTOP ============================== */
#wallpaper{position:absolute;inset:0;z-index:0}
#wallpaper canvas{width:100%;height:100%;display:block}
#desktop-root{position:absolute;inset:0;z-index:1;overflow:hidden}

/* ============================== MENU BAR ============================== */
#menubar{position:absolute;top:0;left:0;right:0;height:var(--menubar-h);z-index:9000;
  display:flex;align-items:center;padding:0 8px;gap:2px;font-size:13px;color:var(--text);
  background:var(--menubar-bg);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);
  border-bottom:.5px solid var(--sep)}
#menubar .mb-item{padding:2px 9px;border-radius:5px;line-height:1;white-space:nowrap;position:relative}
#menubar .mb-item:hover,#menubar .mb-item.open{background:var(--accent);color:#fff}
#menubar .mb-logo{font-size:15px;padding:2px 9px}
#menubar .mb-app{font-weight:600}
#menubar .mb-spacer{flex:1}
#menubar .mb-status{padding:2px 7px;border-radius:5px;display:flex;align-items:center;gap:5px;font-size:12.5px}
#menubar .mb-status:hover{background:var(--hover)}
#menubar .mb-status svg{width:16px;height:16px;display:block}
#mb-clock{font-variant-numeric:tabular-nums;min-width:118px;text-align:right}

/* dropdown menus */
.dropdown{position:absolute;min-width:200px;padding:5px;border-radius:9px;background:var(--menu-bg);
  backdrop-filter:blur(34px) saturate(1.8);-webkit-backdrop-filter:blur(34px) saturate(1.8);
  box-shadow:var(--shadow-strong);border:.5px solid var(--chrome-border);z-index:12000;color:var(--text);
  font-size:13.5px;animation:menuIn .12s ease}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.dropdown .mi{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:5px 9px;border-radius:5px;white-space:nowrap}
.dropdown .mi:hover:not(.disabled){background:var(--accent);color:#fff}
.dropdown .mi.disabled{opacity:.35}
.dropdown .mi .sc{opacity:.55;font-size:12px}
.dropdown .sep{height:.5px;background:var(--sep);margin:5px 8px}
.dropdown .mi .check{width:14px}

/* ============================== WINDOWS ============================== */
#windows-layer{position:absolute;inset:0;z-index:100;pointer-events:none;overflow:hidden}
.window{position:absolute;pointer-events:auto;min-width:240px;min-height:150px;border-radius:var(--radius-win);
  background:var(--content-bg);box-shadow:var(--shadow-soft);border:.5px solid var(--chrome-border);
  display:flex;flex-direction:column;overflow:hidden;will-change:transform;
  transition:box-shadow .2s, opacity .2s}
.window.active{box-shadow:var(--shadow-strong)}
.window.animating{transition:transform var(--transition),opacity var(--transition),width var(--transition),height var(--transition)}
.window.minimizing{transition:transform .34s cubic-bezier(.4,0,.2,1),opacity .34s;opacity:0}
.window .titlebar{height:38px;flex:0 0 38px;display:flex;align-items:center;padding:0 12px;gap:8px;
  background:var(--chrome);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);
  border-bottom:.5px solid var(--sep);position:relative}
.window:not(.active) .titlebar{background:var(--chrome-inactive)}
.window:not(.active){opacity:.985}
.window:not(.active) .traffic i{background:#c9c9cc!important}
.traffic{display:flex;gap:8px;align-items:center}
.traffic i{width:12px;height:12px;border-radius:50%;display:block;position:relative;transition:filter .15s}
.traffic .tl-close{background:#ff5f57}.traffic .tl-min{background:#febc2e}.traffic .tl-max{background:#28c840}
.traffic:hover i::before{content:'';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:rgba(0,0,0,.55);line-height:12px;text-align:center}
.traffic:hover .tl-close::before{content:'\00d7';font-size:12px}
.traffic:hover .tl-min::before{content:'\2013'}
.traffic:hover .tl-max::before{content:'';width:6px;height:6px;border:1.5px solid rgba(0,0,0,.55);border-radius:1px;margin:auto;position:absolute;inset:0}
.window .title{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--text);opacity:.9;pointer-events:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.window:not(.active) .title{opacity:.5}
.window .tb-tools{display:flex;gap:6px;align-items:center;min-width:52px;justify-content:flex-end}
.window .content{flex:1;overflow:hidden;position:relative;background:var(--content-bg);color:var(--text)}
/* resize handles */
.rz{position:absolute;z-index:5}
.rz-n{top:-3px;left:8px;right:8px;height:6px;cursor:ns-resize}
.rz-s{bottom:-3px;left:8px;right:8px;height:6px;cursor:ns-resize}
.rz-e{right:-3px;top:8px;bottom:8px;width:6px;cursor:ew-resize}
.rz-w{left:-3px;top:8px;bottom:8px;width:6px;cursor:ew-resize}
.rz-ne{top:-3px;right:-3px;width:12px;height:12px;cursor:nesw-resize}
.rz-nw{top:-3px;left:-3px;width:12px;height:12px;cursor:nwse-resize}
.rz-se{bottom:-3px;right:-3px;width:12px;height:12px;cursor:nwse-resize}
.rz-sw{bottom:-3px;left:-3px;width:12px;height:12px;cursor:nesw-resize}

/* snap preview overlay */
#snap-preview{position:absolute;z-index:8000;background:rgba(var(--accent-rgb),.28);border:1.5px solid rgba(var(--accent-rgb),.7);
  border-radius:12px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);pointer-events:none;opacity:0;
  transition:all .16s cubic-bezier(.32,.72,0,1);display:none}

/* ============================== DOCK ============================== */
#dock-wrap{position:absolute;left:0;right:0;bottom:6px;z-index:9500;display:flex;justify-content:center;pointer-events:none}
#dock{pointer-events:auto;display:flex;align-items:flex-end;gap:6px;padding:6px 8px;border-radius:20px;
  background:var(--panel);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);
  border:.5px solid var(--chrome-border);box-shadow:var(--shadow-soft);max-width:96vw}
body.dock-left #dock-wrap,body.dock-right #dock-wrap{top:0;bottom:0;left:auto;right:auto;flex-direction:column;align-items:center}
body.dock-left #dock-wrap{left:6px;right:auto}
body.dock-right #dock-wrap{right:6px;left:auto}
body.dock-left #dock,body.dock-right #dock{flex-direction:column;align-items:center}
.dock-item{position:relative;width:var(--dock-size);height:var(--dock-size);border-radius:14px;display:flex;
  align-items:center;justify-content:center;transition:transform .16s cubic-bezier(.32,.72,0,1),margin .16s;
  transform-origin:bottom center;will-change:transform}
.dock-item .ico{width:100%;height:100%;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:30px;box-shadow:0 3px 8px rgba(0,0,0,.28);overflow:hidden;background-size:cover}
.dock-item:hover .tip{opacity:1;transform:translateX(-50%) translateY(-6px)}
.dock-item .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%) translateY(0);
  background:var(--menu-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--text);
  padding:3px 9px;border-radius:7px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:.14s;
  box-shadow:var(--shadow-soft);border:.5px solid var(--chrome-border)}
.dock-item .run-dot{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;
  background:var(--text);opacity:0;transition:.15s}
.dock-item.running .run-dot{opacity:.75}
.dock-sep{width:.5px;height:44px;background:var(--sep);margin:0 2px;align-self:center}
body.dock-left .dock-sep,body.dock-right .dock-sep{width:44px;height:.5px;margin:2px 0}

/* app icon gradients */
.g-term{background:linear-gradient(160deg,#3a3a3c,#1c1c1e)}
.g-files{background:linear-gradient(160deg,#3aa0ff,#0a63d6)}
.g-editor{background:linear-gradient(160deg,#ffd15c,#f7971e)}
.g-settings{background:linear-gradient(160deg,#8e8e93,#48484a)}
.g-task{background:linear-gradient(160deg,#30d158,#0a8a3a)}
.g-calc{background:linear-gradient(160deg,#5a5a5e,#2c2c2e)}
.g-notes{background:linear-gradient(160deg,#ffe27a,#ffb400)}
.g-image{background:linear-gradient(160deg,#ff6a9c,#c33764)}
.g-store{background:linear-gradient(160deg,#00c6ff,#0072ff)}
.g-egg{background:linear-gradient(160deg,#b06 bff 0%,#6a3093 100%);background:linear-gradient(160deg,#b06bff,#6a3093)}
.g-mission{background:linear-gradient(160deg,#5e5ce6,#3634a3)}

/* ============================== SPOTLIGHT ============================== */
#spotlight{position:absolute;inset:0;z-index:15000;display:none;align-items:flex-start;justify-content:center;
  padding-top:16vh;background:rgba(0,0,0,.18)}
#spotlight.on{display:flex}
#spot-box{width:min(640px,92vw);border-radius:14px;background:var(--panel);backdrop-filter:blur(40px) saturate(1.8);
  -webkit-backdrop-filter:blur(40px) saturate(1.8);box-shadow:var(--shadow-strong);border:.5px solid var(--chrome-border);
  overflow:hidden;animation:menuIn .13s ease}
#spot-input{width:100%;border:0;background:transparent;color:var(--text);font-size:22px;padding:16px 20px;outline:none;font-family:inherit}
#spot-results{max-height:min(52vh,440px);overflow-y:auto;border-top:.5px solid var(--sep)}
#spot-results:empty{display:none}
.spot-row{display:flex;align-items:center;gap:12px;padding:9px 16px;font-size:14px;color:var(--text)}
.spot-row.sel{background:var(--accent);color:#fff}
.spot-row .si{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 30px}
.spot-row .st{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spot-row .sk{font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:.4px}

/* ============================== CONTEXT MENU ============================== */
#ctx-menu{position:absolute;z-index:16000;min-width:190px;padding:5px;border-radius:9px;background:var(--menu-bg);
  backdrop-filter:blur(34px) saturate(1.8);-webkit-backdrop-filter:blur(34px) saturate(1.8);box-shadow:var(--shadow-strong);
  border:.5px solid var(--chrome-border);font-size:13.5px;color:var(--text);display:none;animation:menuIn .1s ease}
#ctx-menu .mi{display:flex;justify-content:space-between;gap:16px;padding:5px 9px;border-radius:5px;white-space:nowrap}
#ctx-menu .mi:hover:not(.disabled){background:var(--accent);color:#fff}
#ctx-menu .mi.disabled{opacity:.35}
#ctx-menu .sep{height:.5px;background:var(--sep);margin:5px 8px}

/* ============================== NOTIFICATIONS ============================== */
#toasts{position:absolute;top:calc(var(--menubar-h) + 8px);right:10px;z-index:14000;display:flex;flex-direction:column;gap:8px;width:340px;pointer-events:none}
.toast{pointer-events:auto;background:var(--panel);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);
  border:.5px solid var(--chrome-border);border-radius:14px;box-shadow:var(--shadow-soft);padding:11px 14px;color:var(--text);
  display:flex;gap:11px;align-items:flex-start;animation:toastIn .3s cubic-bezier(.32,.72,0,1)}
@keyframes toastIn{from{opacity:0;transform:translateX(30px) scale(.96)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .28s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(30px) scale(.95)}}
.toast .ti{width:30px;height:30px;border-radius:8px;flex:0 0 30px;display:flex;align-items:center;justify-content:center;font-size:17px}
.toast .tb{flex:1;min-width:0}
.toast .tt{font-weight:600;font-size:13px;margin-bottom:1px}
.toast .tm{font-size:12.5px;color:var(--text-dim);word-wrap:break-word}

/* notification center panel */
#noti-center{position:absolute;top:0;right:0;bottom:0;width:340px;z-index:13500;transform:translateX(110%);
  transition:transform var(--transition);background:var(--panel);backdrop-filter:blur(40px) saturate(1.8);
  -webkit-backdrop-filter:blur(40px) saturate(1.8);border-left:.5px solid var(--chrome-border);
  box-shadow:-10px 0 40px rgba(0,0,0,.3);padding:calc(var(--menubar-h) + 12px) 14px 14px;overflow-y:auto;color:var(--text)}
#noti-center.on{transform:none}
#noti-center h2{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
#noti-center h2 button{background:var(--field);border:0;color:var(--text);border-radius:6px;padding:3px 8px;font-size:11px}
.nc-item{background:var(--field);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:12.5px}
.nc-item .nt{font-weight:600;margin-bottom:2px}
.nc-item .ntime{font-size:10.5px;color:var(--text-faint);margin-top:3px}
.nc-empty{color:var(--text-faint);text-align:center;padding:30px 0;font-size:13px}

/* ============================== APP SWITCHER ============================== */
#app-switcher{position:absolute;inset:0;z-index:15500;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.28)}
#app-switcher.on{display:flex}
#switch-box{display:flex;gap:14px;padding:22px;border-radius:20px;background:var(--panel);backdrop-filter:blur(40px) saturate(1.8);
  -webkit-backdrop-filter:blur(40px) saturate(1.8);box-shadow:var(--shadow-strong);border:.5px solid var(--chrome-border);max-width:92vw;flex-wrap:wrap;justify-content:center}
.switch-item{width:88px;display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 6px;border-radius:14px}
.switch-item.sel{background:rgba(var(--accent-rgb),.28)}
.switch-item .si{width:64px;height:64px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.switch-item .sn{font-size:11.5px;color:var(--text);text-align:center;max-width:82px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============================== MISSION CONTROL / EXPOSE ============================== */
#mission{position:absolute;inset:0;z-index:14500;display:none;flex-direction:column;background:rgba(0,0,0,.35);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#mission.on{display:flex}
#mission-spaces{display:flex;gap:12px;justify-content:center;padding:16px 16px 6px;flex-wrap:wrap}
.ms-thumb{width:150px;height:92px;border-radius:9px;border:2px solid transparent;overflow:hidden;position:relative;
  background:var(--field);cursor:pointer;flex:0 0 auto}
.ms-thumb.active{border-color:var(--accent)}
.ms-thumb .ms-label{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:10px;color:#fff;text-shadow:0 1px 2px #000}
.ms-thumb .mini-win{position:absolute;background:rgba(255,255,255,.85);border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
#mission-windows{flex:1;position:relative;padding:10px}
.expose-win{position:absolute;border-radius:8px;overflow:hidden;box-shadow:var(--shadow-strong);cursor:pointer;
  transition:transform .28s cubic-bezier(.32,.72,0,1),opacity .28s;background:var(--content-bg);border:.5px solid var(--chrome-border)}
.expose-win:hover{outline:3px solid var(--accent)}
.expose-win .ew-title{position:absolute;top:0;left:0;right:0;height:22px;font-size:11px;display:flex;align-items:center;justify-content:center;background:var(--chrome);color:var(--text);font-weight:600}

/* ============================== BOOT & LOCK ============================== */
#boot{position:absolute;inset:0;z-index:20000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;color:#fff}
#boot .logo{font-size:78px;animation:pulseLogo 2s ease-in-out infinite}
@keyframes pulseLogo{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
#boot .bar{width:200px;height:5px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
#boot .bar i{display:block;height:100%;width:0;background:#fff;border-radius:3px;transition:width .1s linear}
#boot .msg{font-size:12px;color:rgba(255,255,255,.5);height:16px;font-family:var(--mono)}
#boot .skip{position:absolute;bottom:26px;font-size:12px;color:rgba(255,255,255,.4)}

#lock{position:absolute;inset:0;z-index:19000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;color:#fff}
#lock.on{display:flex}
#lock::before{content:'';position:absolute;inset:0;backdrop-filter:blur(30px) brightness(.7);-webkit-backdrop-filter:blur(30px) brightness(.7)}
#lock .lock-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:16px}
#lock .lclock{font-size:80px;font-weight:600;letter-spacing:-2px;text-shadow:0 2px 20px rgba(0,0,0,.4);font-variant-numeric:tabular-nums}
#lock .ldate{font-size:19px;opacity:.85;margin-top:-14px;text-shadow:0 2px 12px rgba(0,0,0,.4)}
#lock .avatar{width:84px;height:84px;border-radius:50%;background:linear-gradient(160deg,#5ac8fa,#0a84ff);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 6px 24px rgba(0,0,0,.4);margin-top:14px}
#lock .luser{font-size:17px;font-weight:600}
#lock .lfield{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.18);border-radius:20px;padding:6px 8px 6px 16px;backdrop-filter:blur(10px)}
#lock .lfield input{border:0;background:transparent;color:#fff;outline:none;font-size:14px;width:150px}
#lock .lfield input::placeholder{color:rgba(255,255,255,.6)}
#lock .lfield button{width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#000;font-size:15px}
#lock .lhint{font-size:12px;opacity:.6}

/* generic UI helpers used across apps */
.btn{border:.5px solid var(--field-border);background:var(--field);color:var(--text);border-radius:7px;padding:5px 12px;font-size:13px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.field{border:.5px solid var(--field-border);background:var(--field);color:var(--text);border-radius:7px;padding:6px 10px;font-size:13px;outline:none;font-family:inherit;width:100%}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.2)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.4);border-radius:6px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,.6);background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ---- App-specific styles ---- */
/* Terminal */
.term{height:100%;background:#1a1a1e;color:#e6e6e6;font-family:var(--mono);font-size:13px;padding:10px 12px;overflow-y:auto;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.term .prompt-line{display:flex;flex-wrap:wrap}
.term .ps1{color:#5ac8fa;flex:0 0 auto;margin-right:6px}
.term .cmd-in{flex:1;background:transparent;border:0;color:#e6e6e6;font-family:var(--mono);font-size:13px;outline:none;min-width:60px}
.term .out{white-space:pre-wrap}
.term .err{color:#ff6b6b}
.term .ok{color:#30d158}
.term .dir{color:#5ac8fa;font-weight:600}

/* Files */
.finder{display:flex;height:100%;font-size:13px}
.finder .sidebar{width:170px;flex:0 0 170px;background:var(--chrome);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:.5px solid var(--sep);padding:10px 8px;overflow-y:auto}
.finder .sb-group{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;margin:8px 6px 4px;font-weight:600}
.finder .sb-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;color:var(--text)}
.finder .sb-item:hover{background:var(--hover)}
.finder .sb-item.active{background:var(--accent);color:#fff}
.finder .main{flex:1;display:flex;flex-direction:column;min-width:0}
.finder .fbar{height:38px;flex:0 0 38px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:.5px solid var(--sep)}
.finder .crumbs{flex:1;display:flex;align-items:center;gap:3px;font-size:12.5px;color:var(--text-dim);overflow:hidden}
.finder .crumbs .cr{padding:2px 5px;border-radius:4px;cursor:pointer}
.finder .crumbs .cr:hover{background:var(--hover);color:var(--text)}
.finder .view-toggle{display:flex;gap:2px}
.finder .view-toggle button{width:28px;height:24px;border:0;background:transparent;color:var(--text-dim);border-radius:5px;font-size:14px}
.finder .view-toggle button.active{background:var(--hover);color:var(--text)}
.finder .listing{flex:1;overflow-y:auto;padding:10px}
.finder .listing.icons{display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px}
.f-icon{width:88px;padding:8px 4px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.f-icon:hover{background:var(--hover)}
.f-icon.sel{background:rgba(var(--accent-rgb),.25)}
.f-icon .em{font-size:38px;line-height:1}
.f-icon .nm{font-size:11.5px;color:var(--text);word-break:break-word;max-width:100%;line-height:1.2}
.finder .listing.list{display:block;padding:4px}
.f-row{display:flex;align-items:center;gap:10px;padding:5px 10px;border-radius:6px;font-size:13px}
.f-row:hover{background:var(--hover)}
.f-row.sel{background:rgba(var(--accent-rgb),.25)}
.f-row .em{font-size:18px;width:22px;text-align:center}
.f-row .nm{flex:1}
.f-row .meta{color:var(--text-faint);font-size:11.5px}

/* Text editor */
.editor{display:flex;flex-direction:column;height:100%}
.editor .tabs{display:flex;background:var(--chrome);border-bottom:.5px solid var(--sep);overflow-x:auto;min-height:32px}
.editor .etab{display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:12.5px;color:var(--text-dim);border-right:.5px solid var(--sep);white-space:nowrap;max-width:200px}
.editor .etab.active{background:var(--content-bg);color:var(--text)}
.editor .etab .x{opacity:.5;font-size:13px}.editor .etab .x:hover{opacity:1}
.editor .etab .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:none}
.editor .etab.dirty .dot{display:block}
.editor .etoolbar{display:flex;gap:6px;padding:5px 10px;border-bottom:.5px solid var(--sep);align-items:center;font-size:12px}
.editor .ebody{flex:1;position:relative;overflow:hidden;display:flex}
.editor .gutter{background:var(--chrome);color:var(--text-faint);text-align:right;padding:10px 6px;font-family:var(--mono);font-size:12.5px;line-height:1.55;user-select:none;overflow:hidden}
.editor .code-wrap{flex:1;position:relative;overflow:auto}
.editor textarea,.editor pre.hl{margin:0;border:0;padding:10px 12px;font-family:var(--mono);font-size:12.5px;line-height:1.55;
  white-space:pre;overflow-wrap:normal;tab-size:2}
.editor textarea{position:absolute;inset:0;width:100%;height:100%;background:transparent;color:transparent;caret-color:var(--text);resize:none;outline:none;z-index:2;overflow:auto}
.editor pre.hl{position:absolute;inset:0;color:var(--text);pointer-events:none;z-index:1;overflow:auto}
.tok-key{color:#ff7ab2}.tok-str{color:#7ee787}.tok-num{color:#79c0ff}.tok-com{color:#8b949e;font-style:italic}.tok-punc{color:var(--text-dim)}.tok-tag{color:#7ee787}.tok-attr{color:#ffa657}
.find-bar{display:none;gap:6px;padding:5px 10px;background:var(--chrome);border-bottom:.5px solid var(--sep);align-items:center}
.find-bar.on{display:flex}
.find-bar input{background:var(--field);border:.5px solid var(--field-border);border-radius:6px;padding:3px 8px;color:var(--text);font-size:12px;outline:none}

/* Settings */
.settings{display:flex;height:100%;font-size:13px}
.settings .snav{width:180px;flex:0 0 180px;background:var(--chrome);border-right:.5px solid var(--sep);padding:12px 8px;overflow-y:auto}
.settings .snav .si{display:flex;gap:9px;align-items:center;padding:7px 10px;border-radius:7px;color:var(--text)}
.settings .snav .si:hover{background:var(--hover)}
.settings .snav .si.active{background:var(--accent);color:#fff}
.settings .spane{flex:1;overflow-y:auto;padding:22px 26px}
.settings h2{font-size:20px;margin-bottom:16px}
.settings .row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:.5px solid var(--sep);gap:16px}
.settings .row .lbl{font-size:13.5px}.settings .row .sub{font-size:11.5px;color:var(--text-faint)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.swatch.sel{border-color:var(--text)}
.wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:8px}
.wp-item{aspect-ratio:16/10;border-radius:10px;overflow:hidden;border:2px solid transparent;cursor:pointer;position:relative}
.wp-item.sel{border-color:var(--accent)}
.wp-item canvas{width:100%;height:100%;display:block}
.seg{display:flex;background:var(--field);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;color:var(--text);padding:5px 14px;border-radius:6px;font-size:12.5px}
.seg button.active{background:var(--accent);color:#fff}
/* toggle */
.toggle{width:42px;height:25px;border-radius:13px;background:var(--field);position:relative;transition:.2s;flex:0 0 42px}
.toggle.on{background:var(--accent)}
.toggle i{position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle.on i{left:19px}

/* Task manager */
.taskmgr{display:flex;flex-direction:column;height:100%;font-size:13px}
.taskmgr .graph{height:80px;flex:0 0 80px;border-bottom:.5px solid var(--sep);position:relative;background:var(--chrome)}
.taskmgr .graph canvas{width:100%;height:100%;display:block}
.taskmgr .graph .glabel{position:absolute;top:6px;left:10px;font-size:11px;color:var(--text-dim)}
.taskmgr table{width:100%;border-collapse:collapse;font-size:12.5px}
.taskmgr thead th{text-align:left;padding:8px 12px;color:var(--text-dim);font-size:11px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;background:var(--content-bg);border-bottom:.5px solid var(--sep)}
.taskmgr tbody td{padding:7px 12px;border-bottom:.5px solid var(--sep)}
.taskmgr tbody tr:hover{background:var(--hover)}
.taskmgr .kill{background:#ff5f57;color:#fff;border:0;border-radius:5px;padding:3px 9px;font-size:11px}
.taskmgr .tbody-wrap{flex:1;overflow-y:auto}

/* Calculator */
.calc{display:flex;flex-direction:column;height:100%;background:var(--panel-solid);padding:8px}
.calc .disp{flex:0 0 auto;text-align:right;padding:14px 16px 8px;color:var(--text);overflow:hidden}
.calc .disp .expr{font-size:14px;color:var(--text-dim);min-height:18px;word-break:break-all}
.calc .disp .res{font-size:44px;font-weight:300;word-break:break-all;line-height:1.1}
.calc .keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px}
.calc .keys button{border:0;border-radius:50%;font-size:20px;color:var(--text);background:var(--field);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.calc .keys button:active{filter:brightness(1.3)}
.calc .keys button.op{background:var(--accent);color:#fff}
.calc .keys button.fn{background:rgba(160,160,170,.35)}
.calc .keys button.wide{grid-column:span 2;aspect-ratio:auto;border-radius:26px;justify-content:flex-start;padding-left:26px}

/* Notes */
.notes{display:flex;height:100%;font-size:13px}
.notes .nlist{width:190px;flex:0 0 190px;border-right:.5px solid var(--sep);background:var(--chrome);display:flex;flex-direction:column}
.notes .nlbar{padding:8px;display:flex;gap:6px;border-bottom:.5px solid var(--sep)}
.notes .nlbar input{flex:1}
.notes .nitems{flex:1;overflow-y:auto}
.notes .nitem{padding:10px 12px;border-bottom:.5px solid var(--sep)}
.notes .nitem:hover{background:var(--hover)}
.notes .nitem.active{background:rgba(var(--accent-rgb),.2)}
.notes .nitem .nti{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notes .nitem .npv{font-size:11.5px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notes .nmain{flex:1;display:flex;flex-direction:column;min-width:0}
.notes .nmbar{padding:6px 10px;border-bottom:.5px solid var(--sep);display:flex;gap:8px;align-items:center}
.notes .nsplit{flex:1;display:flex;overflow:hidden}
.notes textarea.nedit{flex:1;border:0;background:transparent;color:var(--text);padding:14px 16px;font-family:var(--mono);font-size:13px;resize:none;outline:none;line-height:1.55}
.notes .npreview{flex:1;padding:14px 18px;overflow-y:auto;border-left:.5px solid var(--sep);line-height:1.6}
.notes .npreview h1{font-size:22px;margin:.4em 0}.notes .npreview h2{font-size:18px;margin:.4em 0}.notes .npreview h3{font-size:15px;margin:.4em 0}
.notes .npreview p{margin:.5em 0}.notes .npreview code{background:var(--field);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:12px}
.notes .npreview pre{background:var(--field);padding:10px;border-radius:8px;overflow-x:auto;margin:.6em 0}
.notes .npreview ul,.notes .npreview ol{margin:.4em 0 .4em 1.4em}.notes .npreview a{color:var(--accent)}
.notes .npreview blockquote{border-left:3px solid var(--accent);padding-left:10px;color:var(--text-dim);margin:.5em 0}

/* Image viewer */
.imgview{height:100%;display:flex;flex-direction:column;background:#111}
.imgview .ivmain{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.imgview .ivmain img,.imgview .ivmain canvas{max-width:100%;max-height:100%;object-fit:contain}
.imgview .ivbar{height:36px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--chrome);color:var(--text);font-size:12px}

/* App store */
.store{height:100%;overflow-y:auto;padding:20px}
.store h2{font-size:22px;margin-bottom:4px}
.store .sub{color:var(--text-dim);font-size:13px;margin-bottom:18px}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.store-card{background:var(--field);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.store-card .sc-top{display:flex;gap:12px;align-items:center}
.store-card .sc-ico{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 52px}
.store-card .sc-name{font-weight:600;font-size:14px}
.store-card .sc-dev{font-size:11.5px;color:var(--text-faint)}
.store-card .sc-desc{font-size:12px;color:var(--text-dim);flex:1;line-height:1.4}
.store-card .sc-get{align-self:flex-start;background:var(--accent);color:#fff;border:0;border-radius:14px;padding:5px 18px;font-size:12.5px;font-weight:600}
.store-card .sc-get.got{background:var(--field);color:var(--text)}

/* iframe app */
.iframe-app{width:100%;height:100%;border:0;background:#fff}

/* Easter egg — starfield */
.egg{height:100%;position:relative;background:radial-gradient(ellipse at 50% 30%,#1a1040,#05010f);overflow:hidden}
.egg canvas{width:100%;height:100%;display:block}
.egg .egg-msg{position:absolute;left:0;right:0;bottom:26px;text-align:center;color:#fff;font-size:14px;opacity:.8;pointer-events:none;text-shadow:0 2px 10px #000}

/* generic centered placeholder */
.pad{padding:16px;color:var(--text);font-size:13px;line-height:1.6}
.center-msg{height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:13px;flex-direction:column;gap:8px}
</style>
</head>

<script>
"use strict";
/* ==================================================================
   webOS — a desktop operating system in a single HTML file.
   Architecture: kernel (Bus, State, FS, Proc, WM) + App SDK + apps.
   ================================================================== */

/* ------------------------------- utils ------------------------------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const el = (tag, props={}, kids=[]) => {
  const n = document.createElement(tag);
  for (const k in props){
    if (k === 'class') n.className = props[k];
    else if (k === 'html') n.innerHTML = props[k];
    else if (k === 'text') n.textContent = props[k];
    else if (k === 'style') n.style.cssText = props[k];
    else if (k.startsWith('on') && typeof props[k] === 'function') n.addEventListener(k.slice(2), props[k]);
    else if (k === 'dataset') Object.assign(n.dataset, props[k]);
    else if (props[k] != null) n.setAttribute(k, props[k]);
  }
  (Array.isArray(kids)?kids:[kids]).forEach(c=>{ if(c==null) return; n.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return n;
};
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const uid = ()=>Math.random().toString(36).slice(2,10);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const debounce = (fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};};
const nowISO = ()=>new Date().toISOString();
const fmtBytes = n => { if(n<1024) return n+' B'; if(n<1048576) return (n/1024).toFixed(1)+' KB'; return (n/1048576).toFixed(1)+' MB'; };
const fmtTime = ts => { const d=new Date(ts); return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); };

/* ------------------------------- event bus ------------------------------- */
const Bus = (()=>{
  const map = new Map();
  return {
    on(ev, fn){ (map.get(ev)||map.set(ev,new Set()).get(ev)).add(fn); return ()=>map.get(ev)?.delete(fn); },
    emit(ev, data){ map.get(ev)?.forEach(fn=>{ try{fn(data);}catch(e){console.error('bus',ev,e);} }); }
  };
})();

/* ------------------------------- persisted state ------------------------------- */
const DEFAULT_STATE = {
  version: 1,
  theme: 'dark',
  accent: '#0a84ff',
  wallpaper: 0,
  dockPos: 'bottom',
  dockSize: 58,
  dockMagnify: true,
  spaces: 2,
  currentSpace: 0,
  installedExternal: [],
  notifications: [],
  notes: [],
  user: 'User',
  firstBoot: true
};
const ACCENTS = {'#0a84ff':'10,132,255','#30d158':'48,209,88','#ff375f':'255,55,95','#ff9f0a':'255,159,10','#bf5af2':'191,90,242','#64d2ff':'100,210,255','#ff453a':'255,69,58','#ffd60a':'255,214,10'};

const State = (()=>{
  let s;
  try { s = JSON.parse(localStorage.getItem('webos.state')||'null'); } catch(e){ s=null; }
  s = Object.assign({}, DEFAULT_STATE, s||{});
  const save = debounce(()=>{ try{ localStorage.setItem('webos.state', JSON.stringify(s)); }catch(e){} }, 120);
  return {
    get:(k)=>s[k],
    set:(k,v)=>{ s[k]=v; save(); Bus.emit('state:'+k, v); Bus.emit('state', {k,v}); },
    all:()=>s,
    replace:(obj)=>{ s = Object.assign({}, DEFAULT_STATE, obj); save(); },
    saveNow:()=>{ try{ localStorage.setItem('webos.state', JSON.stringify(s)); }catch(e){} }
  };
})();

/* ------------------------------- virtual filesystem -------------------------------
   In-memory hierarchical tree persisted to OPFS (if available) and IndexedDB.
   Node: {type:'dir', children:{}} | {type:'file', content, mime, created, modified}
--------------------------------------------------------------------------------- */
const FS = (()=>{
  let root = null;
  let opfsRoot = null;   // OPFS directory handle for the backing file
  let usingOPFS = false;
  const FS_FILE = 'webos-fs.json';
  const IDB_DB = 'webos', IDB_STORE = 'kv', IDB_KEY = 'fs';

  function idb(){
    return new Promise((res,rej)=>{
      const r = indexedDB.open(IDB_DB, 1);
      r.onupgradeneeded = ()=>{ r.result.createObjectStore(IDB_STORE); };
      r.onsuccess = ()=>res(r.result);
      r.onerror = ()=>rej(r.error);
    });
  }
  async function idbGet(){
    try{ const db=await idb(); return await new Promise((res)=>{ const t=db.transaction(IDB_STORE); const rq=t.objectStore(IDB_STORE).get(IDB_KEY); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(null); }); }catch(e){ return null; }
  }
  async function idbSet(val){
    try{ const db=await idb(); await new Promise((res)=>{ const t=db.transaction(IDB_STORE,'readwrite'); t.objectStore(IDB_STORE).put(val, IDB_KEY); t.oncomplete=res; t.onerror=res; }); }catch(e){}
  }

  function seed(){
    const t = nowISO();
    const f = (content, mime='text/plain') => ({type:'file', content, mime, created:t, modified:t});
    const d = (children={}) => ({type:'dir', created:t, modified:t, children});
    return d({
      Users: d({ User: d({
        Desktop: d({
          'welcome.txt': f("Welcome to webOS!\n\nThis whole desktop runs inside one HTML file.\nTry the Terminal:  ls | grep txt | wc -l\n\nEverything you create here is saved to your browser's\nfilesystem (OPFS/IndexedDB) and survives a reload.")
        }),
        Documents: d({
          'readme.md': f("# webOS Notes\n\n- **Files** app browses this filesystem.\n- The **Terminal** supports pipes, redirection and tab-completion.\n- Use **Settings** to change wallpaper, theme and accent.\n\n> Tip: press ⌘Space for Spotlight.\n"),
          'todo.md': f("# To do\n\n- [ ] Try Mission Control (swipe up / F3 / dock icon)\n- [ ] Snap a window to the screen edge\n- [ ] Find the easter egg\n"),
          'sample.json': f('{\n  "app": "webOS",\n  "selfContained": true,\n  "apps": ["Terminal","Files","Editor","Notes"],\n  "answer": 42\n}', 'application/json'),
          'hello.js': f("// A little script you can open in the Text Editor\nfunction greet(name){\n  const msg = `Hello, ${name}!`;\n  console.log(msg);\n  return msg;\n}\ngreet('world');\n", 'text/javascript')
        }),
        Pictures: d({
          'logo.svg': f('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a84ff"/><stop offset="1" stop-color="#bf5af2"/></linearGradient></defs><rect width="200" height="200" rx="40" fill="url(#g)"/><text x="100" y="130" font-size="90" text-anchor="middle" fill="white" font-family="sans-serif"></text></svg>', 'image/svg+xml')
        }),
        Downloads: d({})
      })}),
      Applications: d({}),
      System: d({ 'about.txt': f('webOS 1.0 — a single-file desktop environment.') })
    });
  }

  const persist = debounce(async ()=>{
    const data = JSON.stringify(root);
    if (usingOPFS && opfsRoot){
      try{
        const fh = await opfsRoot.getFileHandle(FS_FILE, {create:true});
        const w = await fh.createWritable();
        await w.write(data); await w.close();
      }catch(e){ usingOPFS=false; }
    }
    idbSet(data); // always mirror to IndexedDB so state is durable even if OPFS is unavailable
  }, 300);

  return {
    usingOPFS:()=>usingOPFS,
    async init(){
      // Try OPFS
      try{
        if (navigator.storage && navigator.storage.getDirectory){
          opfsRoot = await navigator.storage.getDirectory();
          usingOPFS = true;
          try{
            const fh = await opfsRoot.getFileHandle(FS_FILE);
            const file = await fh.getFile();
            const txt = await file.text();
            root = JSON.parse(txt);
          }catch(e){ root = null; }
        }
      }catch(e){ usingOPFS=false; }
      if (!root){
        const saved = await idbGet();
        if (saved){ try{ root = JSON.parse(saved); }catch(e){ root=null; } }
      }
      if (!root){ root = seed(); persist(); }
      return usingOPFS ? 'OPFS' : 'IndexedDB';
    },
    _norm(p){
      if (!p || p==='.') p = '/';
      if (!p.startsWith('/')) p = '/'+p;
      const parts = [];
      for (const seg of p.split('/')){
        if (seg==='' || seg==='.') continue;
        if (seg==='..'){ parts.pop(); continue; }
        parts.push(seg);
      }
      return '/'+parts.join('/');
    },
    _node(p){
      p = this._norm(p);
      if (p==='/') return root;
      let cur = root;
      for (const seg of p.slice(1).split('/')){
        if (!cur || cur.type!=='dir' || !cur.children[seg]) return null;
        cur = cur.children[seg];
      }
      return cur;
    },
    _parent(p){ p=this._norm(p); const i=p.lastIndexOf('/'); return {dir:this._node(p.slice(0,i)||'/'), name:p.slice(i+1), path:p.slice(0,i)||'/'}; },
    exists(p){ return !!this._node(p); },
    isDir(p){ const n=this._node(p); return !!n && n.type==='dir'; },
    stat(p){ const n=this._node(p); if(!n) return null; return {type:n.type, size:n.type==='file'?(n.content||'').length:Object.keys(n.children||{}).length, mime:n.mime, created:n.created, modified:n.modified}; },
    list(p){
      const n=this._node(p);
      if (!n || n.type!=='dir') return null;
      return Object.entries(n.children).map(([name,c])=>({name, type:c.type, mime:c.mime, size:c.type==='file'?(c.content||'').length:Object.keys(c.children||{}).length, modified:c.modified})).sort((a,b)=> (a.type===b.type)? a.name.localeCompare(b.name) : (a.type==='dir'?-1:1));
    },
    read(p){ const n=this._node(p); if(!n||n.type!=='file') throw new Error('not a file: '+p); return n.content; },
    write(p, content, mime){
      const {dir,name} = this._parent(p);
      if (!dir || dir.type!=='dir') throw new Error('no such directory for '+p);
      const t = nowISO();
      const existing = dir.children[name];
      if (existing && existing.type==='dir') throw new Error('is a directory: '+p);
      dir.children[name] = {type:'file', content:String(content), mime: mime || (existing&&existing.mime) || guessMime(name), created: existing?existing.created:t, modified:t};
      dir.modified = t; persist(); Bus.emit('fs:change', p); return true;
    },
    mkdir(p, recursive=true){
      p=this._norm(p);
      if (this.exists(p)) { if(this.isDir(p)) return true; throw new Error('file exists: '+p); }
      const parts = p.slice(1).split('/');
      let cur = root, curPath='';
      for (let i=0;i<parts.length;i++){
        curPath += '/'+parts[i];
        if (!cur.children[parts[i]]){
          if (!recursive && i<parts.length-1) throw new Error('no such directory');
          cur.children[parts[i]] = {type:'dir', created:nowISO(), modified:nowISO(), children:{}};
        }
        if (cur.children[parts[i]].type!=='dir') throw new Error('not a directory: '+curPath);
        cur = cur.children[parts[i]];
      }
      persist(); Bus.emit('fs:change', p); return true;
    },
    rm(p, recursive=false){
      p=this._norm(p);
      if (p==='/') throw new Error('cannot remove root');
      const {dir,name}=this._parent(p);
      const n = dir && dir.children[name];
      if (!n) throw new Error('no such file: '+p);
      if (n.type==='dir' && Object.keys(n.children).length && !recursive) throw new Error('directory not empty: '+p+' (use -r)');
      delete dir.children[name]; dir.modified=nowISO(); persist(); Bus.emit('fs:change', p); return true;
    },
    mv(src, dst){
      src=this._norm(src); dst=this._norm(dst);
      const sn = this._node(src);
      if (!sn) throw new Error('no such file: '+src);
      if (this.isDir(dst)){ dst = this._norm(dst+'/'+src.split('/').pop()); }
      const {dir:sdir,name:sname}=this._parent(src);
      const {dir:ddir,name:dname}=this._parent(dst);
      if (!ddir || ddir.type!=='dir') throw new Error('no such directory for '+dst);
      ddir.children[dname] = sn; sn.modified=nowISO();
      delete sdir.children[sname];
      persist(); Bus.emit('fs:change', dst); return true;
    },
    cp(src, dst){
      src=this._norm(src); dst=this._norm(dst);
      const sn = this._node(src);
      if (!sn) throw new Error('no such file: '+src);
      if (this.isDir(dst)){ dst = this._norm(dst+'/'+src.split('/').pop()); }
      const clone = JSON.parse(JSON.stringify(sn)); clone.modified=nowISO();
      const {dir:ddir,name:dname}=this._parent(dst);
      if (!ddir || ddir.type!=='dir') throw new Error('no such directory for '+dst);
      ddir.children[dname]=clone; persist(); Bus.emit('fs:change', dst); return true;
    },
    tree(p='/', prefix=''){
      const n=this._node(p); if(!n) return '';
      let out='';
      const entries = this.list(p) || [];
      entries.forEach((e,i)=>{
        const last = i===entries.length-1;
        out += prefix + (last?'└── ':'├── ') + e.name + (e.type==='dir'?'/':'') + '\n';
        if (e.type==='dir') out += this.tree(this._norm(p+'/'+e.name), prefix+(last?'    ':'│   '));
      });
      return out;
    },
    export(){ return root; },
    import(tree){ root = tree; persist(); Bus.emit('fs:change','/'); }
  };
  function guessMime(name){
    const ext = name.split('.').pop().toLowerCase();
    return ({txt:'text/plain',md:'text/markdown',js:'text/javascript',json:'application/json',html:'text/html',css:'text/css',svg:'image/svg+xml',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp'})[ext] || 'text/plain';
  }
})();

/* ------------------------------- process model ------------------------------- */
const Proc = (()=>{
  let nextPid = 100;
  const table = new Map(); // pid -> {pid, appId, name, windows:Set, worker, startedAt, memBase}
  return {
    spawn(appId, name){
      const pid = nextPid++;
      const p = {pid, appId, name, windows:new Set(), worker:null, startedAt:Date.now(), memBase: 8+Math.random()*24};
      table.set(pid, p);
      Bus.emit('proc:change');
      return p;
    },
    get(pid){ return table.get(pid); },
    all(){ return [...table.values()]; },
    kill(pid){
      const p = table.get(pid); if(!p) return;
      [...p.windows].forEach(w=>WM.close(w.id, true));
      if (p.worker){ try{p.worker.terminate();}catch(e){} }
      table.delete(pid);
      Bus.emit('proc:change');
    },
    attachWindow(pid, win){ table.get(pid)?.windows.add(win); },
    detachWindow(pid, win){ const p=table.get(pid); if(p){ p.windows.delete(win); if(!p.windows.size) this.kill(pid); } }
  };
})();

/* ------------------------------- notifications ------------------------------- */
const Notify = (()=>{
  function render(){
    const list = $('#nc-list');
    const items = State.get('notifications');
    list.innerHTML='';
    if (!items.length){ list.appendChild(el('div',{class:'nc-empty',text:'No Notifications'})); return; }
    items.slice().reverse().forEach(n=>{
      list.appendChild(el('div',{class:'nc-item'},[
        el('div',{class:'nt',text:(n.icon?n.icon+' ':'')+n.title}),
        el('div',{class:'nm',text:n.body}),
        el('div',{class:'ntime',text:new Date(n.ts).toLocaleString()})
      ]));
    });
  }
  Bus.on('boot:done', render);
  return {
    push(title, body, icon='🔔'){
      const items = State.get('notifications');
      const n = {id:uid(), title, body, icon, ts:Date.now()};
      items.push(n); if (items.length>60) items.shift();
      State.set('notifications', items); render();
      // toast
      const t = el('div',{class:'toast'},[
        el('div',{class:'ti', style:'background:rgba(var(--accent-rgb),.25)'},icon),
        el('div',{class:'tb'},[ el('div',{class:'tt',text:title}), el('div',{class:'tm',text:body}) ])
      ]);
      $('#toasts').appendChild(t);
      const dismiss = ()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),300); };
      t.addEventListener('click', dismiss);
      setTimeout(dismiss, 4600);
      return n;
    },
    clear(){ State.set('notifications', []); render(); },
    render
  };
})();

/* ------------------------------- wallpapers (procedural, canvas) ------------------------------- */
const Wallpapers = [
  {name:'Aurora', draw(ctx,w,h){
    const g=ctx.createLinearGradient(0,0,w,h); g.addColorStop(0,'#1a2980');g.addColorStop(.5,'#26305e');g.addColorStop(1,'#0f2027');
    ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
    for(let i=0;i<5;i++){ const grd=ctx.createRadialGradient(w*(.2+i*.18),h*(.3+Math.sin(i)*.2),0,w*(.2+i*.18),h*(.3+Math.sin(i)*.2),w*.4);
      const hue=[ '#5ac8fa','#bf5af2','#30d158','#0a84ff','#64d2ff'][i];
      grd.addColorStop(0,hue+'55');grd.addColorStop(1,'#00000000'); ctx.fillStyle=grd; ctx.fillRect(0,0,w,h);} }},
  {name:'Sunset', draw(ctx,w,h){
    const g=ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,'#0d1b2a');g.addColorStop(.45,'#41295a');g.addColorStop(.75,'#c33764');g.addColorStop(1,'#ff9966');
    ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
    const sun=ctx.createRadialGradient(w*.5,h*.72,0,w*.5,h*.72,w*.25); sun.addColorStop(0,'#ffde9955');sun.addColorStop(1,'#00000000');ctx.fillStyle=sun;ctx.fillRect(0,0,w,h);}},
  {name:'Mesh', draw(ctx,w,h){
    ctx.fillStyle='#0b0f1a';ctx.fillRect(0,0,w,h);
    const pts=[['#0a84ff',.2,.25],['#bf5af2',.8,.3],['#30d158',.3,.8],['#ff375f',.75,.75],['#64d2ff',.5,.5]];
    pts.forEach(([c,x,y])=>{ const g=ctx.createRadialGradient(w*x,h*y,0,w*x,h*y,w*.45); g.addColorStop(0,c+'66');g.addColorStop(1,'#00000000');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);});}},
  {name:'Graphite', draw(ctx,w,h){
    const g=ctx.createLinearGradient(0,0,w,h); g.addColorStop(0,'#2c3e50');g.addColorStop(1,'#1a1a1d');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='rgba(255,255,255,.03)';ctx.lineWidth=1; for(let i=-h;i<w;i+=28){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+h,h);ctx.stroke();}}},
  {name:'Solar', draw(ctx,w,h){
    const g=ctx.createRadialGradient(w*.7,h*.3,0,w*.7,h*.3,w*.9); g.addColorStop(0,'#ff9f0a');g.addColorStop(.4,'#ff375f');g.addColorStop(1,'#1a0033');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);}},
  {name:'Emerald', draw(ctx,w,h){
    const g=ctx.createLinearGradient(0,0,w,h); g.addColorStop(0,'#0f2027');g.addColorStop(.5,'#203a43');g.addColorStop(1,'#2c5364');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
    const gg=ctx.createRadialGradient(w*.3,h*.7,0,w*.3,h*.7,w*.5);gg.addColorStop(0,'#30d15844');gg.addColorStop(1,'#00000000');ctx.fillStyle=gg;ctx.fillRect(0,0,w,h);}}
];
function drawWallpaper(canvas, idx){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const w = canvas.clientWidth||window.innerWidth, h = canvas.clientHeight||window.innerHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  (Wallpapers[idx]||Wallpapers[0]).draw(ctx, w, h);
}
function applyWallpaper(){ drawWallpaper($('#wp-canvas'), State.get('wallpaper')); }

/* ------------------------------- theme ------------------------------- */
function applyTheme(){
  const b = document.body;
  b.classList.toggle('theme-dark', State.get('theme')==='dark');
  b.classList.toggle('theme-light', State.get('theme')==='light');
  const acc = State.get('accent');
  document.documentElement.style.setProperty('--accent', acc);
  document.documentElement.style.setProperty('--accent-rgb', ACCENTS[acc]||'10,132,255');
  b.classList.remove('dock-left','dock-right','dock-bottom');
  b.classList.add('dock-'+State.get('dockPos'));
  document.documentElement.style.setProperty('--dock-size', State.get('dockSize')+'px');
}

/* ------------------------------- window manager ------------------------------- */
const WM = (()=>{
  const windows = new Map();
  let zTop = 100;
  let activeId = null;
  let spacesRow = null;

  function workArea(){
    const mb = 26; const top = mb + 6;
    const pos = State.get('dockPos');
    const dockGap = State.get('dockSize') + 22;
    return {
      x: pos==='left'? dockGap : 8,
      y: top,
      w: window.innerWidth - 16 - (pos==='left'||pos==='right'? dockGap : 0),
      h: window.innerHeight - top - 8 - (pos==='bottom'? dockGap : 0)
    };
  }

  function ensureSpaces(){
    spacesRow = $('#win-spaces-row');
    if (!spacesRow){
      spacesRow = el('div',{id:'win-spaces-row',style:'position:absolute;top:0;left:0;height:100%;display:flex;will-change:transform;transition:transform var(--transition)'});
      $('#windows-layer').appendChild(spacesRow);
    }
    const n = State.get('spaces');
    // (re)build wrappers
    [...spacesRow.children].forEach(c=>c.remove());
    for (let i=0;i<n;i++){
      spacesRow.appendChild(el('div',{class:'win-space','data-space':i,style:`position:relative;width:100vw;height:100%;flex:0 0 100vw;pointer-events:none`}));
    }
    layoutSpaces();
  }
  function spaceWrap(i){ return spacesRow.children[i]; }
  function layoutSpaces(){
    const cur = State.get('currentSpace');
    spacesRow.style.transform = `translateX(${-cur*window.innerWidth}px)`;
  }

  function applyGeom(win){
    const {x,y,w,h}=win.geom;
    const n=win.node;
    n.style.width=w+'px'; n.style.height=h+'px';
    n.style.transform=`translate3d(${x}px,${y}px,0)`;
  }

  function focus(id){
    const win = windows.get(id); if(!win || win.minimized) return;
    if (activeId===id){ return; }
    activeId = id;
    windows.forEach(w=>w.node.classList.toggle('active', w.id===id));
    win.z = ++zTop; win.node.style.zIndex = win.z;
    Bus.emit('wm:focus', win);
    Menus.setApp(win);
    Dock.update();
  }

  function create(opts){
    ensureSpacesIfNeeded();
    const wa = workArea();
    const dw = opts.width||640, dh = opts.height||440;
    const id = 'win-'+uid();
    const space = State.get('currentSpace');
    const geom = {
      x: opts.x!=null?opts.x: clamp(wa.x + 30 + (windows.size%6)*26, wa.x, wa.x+wa.w-dw),
      y: opts.y!=null?opts.y: clamp(wa.y + 24 + (windows.size%6)*24, wa.y, wa.y+wa.h-dh),
      w: dw, h: dh
    };
    const node = el('div',{class:'window animating','data-id':id,'data-app':opts.appId||''});
    const traffic = el('div',{class:'traffic'},[
      el('i',{class:'tl-close',title:'Close'}), el('i',{class:'tl-min',title:'Minimize'}), el('i',{class:'tl-max',title:'Zoom'})
    ]);
    const title = el('div',{class:'title',text:opts.title||'Untitled'});
    const tbTools = el('div',{class:'tb-tools'});
    const titlebar = el('div',{class:'titlebar'},[traffic, title, tbTools]);
    const content = el('div',{class:'content'});
    node.appendChild(titlebar); node.appendChild(content);
    ['n','s','e','w','ne','nw','se','sw'].forEach(d=> node.appendChild(el('div',{class:'rz rz-'+d,'data-dir':d})));

    const win = {id, node, content, titlebar, titleEl:title, tbTools, geom,
      min:{w:opts.minWidth||280, h:opts.minHeight||170}, space, state:'normal', prevGeom:null,
      z:++zTop, minimized:false, appId:opts.appId, pid:opts.pid, title:opts.title, api:null, menus:opts.menus||null,
      onClose:opts.onClose};
    node.style.zIndex = win.z;
    windows.set(id, win);
    spaceWrap(space).appendChild(node);
    applyGeom(win);

    // traffic actions
    traffic.children[0].addEventListener('click', e=>{ e.stopPropagation(); close(id); });
    traffic.children[1].addEventListener('click', e=>{ e.stopPropagation(); minimize(id); });
    traffic.children[2].addEventListener('click', e=>{ e.stopPropagation(); toggleMax(id); });
    title.addEventListener('dblclick', ()=>toggleMax(id));

    node.addEventListener('pointerdown', ()=>focus(id), true);
    setupDrag(win); setupResize(win);

    if (opts.pid) Proc.attachWindow(opts.pid, win);
    requestAnimationFrame(()=>{ node.classList.remove('animating'); });
    // open animation
    node.animate([{transform:`translate3d(${geom.x}px,${geom.y+8}px,0) scale(.96)`,opacity:0},{transform:`translate3d(${geom.x}px,${geom.y}px,0) scale(1)`,opacity:1}],{duration:200,easing:'cubic-bezier(.32,.72,0,1)'});
    focus(id);
    return win;
  }

  let spacesInited=false;
  function ensureSpacesIfNeeded(){ if(!spacesInited){ ensureSpaces(); spacesInited=true; } }

  function setTitle(id, t){ const w=windows.get(id); if(w){ w.title=t; w.titleEl.textContent=t; if(activeId===id) Menus.setApp(w);} }

  function close(id, silent){
    const win = windows.get(id); if(!win) return;
    if (win.onClose && !silent){ try{ if(win.onClose()===false) return; }catch(e){} }
    win.node.animate([{opacity:1,transform:win.node.style.transform+' scale(1)'},{opacity:0,transform:win.node.style.transform+' scale(.94)'}],{duration:160,easing:'ease'}).onfinish=()=>{
      win.node.remove();
    };
    windows.delete(id);
    if (win.pid) Proc.detachWindow(win.pid, win);
    if (activeId===id){ activeId=null; focusTopMost(); }
    Bus.emit('wm:change'); Dock.update();
  }
  function focusTopMost(){
    let top=null;
    windows.forEach(w=>{ if(!w.minimized && w.space===State.get('currentSpace') && (!top||w.z>top.z)) top=w; });
    if (top) focus(top.id); else { activeId=null; Menus.setApp(null); }
  }

  function minimize(id){
    const win = windows.get(id); if(!win||win.minimized) return;
    const dockIcon = Dock.iconFor(win.appId);
    let tx=window.innerWidth/2, ty=window.innerHeight;
    if (dockIcon){ const r=dockIcon.getBoundingClientRect(); tx=r.left+r.width/2; ty=r.top+r.height/2; }
    const r = win.node.getBoundingClientRect();
    const sx = (tx - r.left - r.width/2), sy=(ty - r.top - r.height/2);
    win.node.style.transformOrigin='center';
    const anim = win.node.animate([
      {transform:win.node.style.transform+' scale(1)',opacity:1},
      {transform:`translate3d(${win.geom.x+sx}px,${win.geom.y+sy}px,0) scale(.1)`,opacity:0}
    ],{duration:320,easing:'cubic-bezier(.4,0,.2,1)'});
    anim.onfinish=()=>{ win.node.style.display='none'; };
    win.minimized=true;
    if (activeId===id){ activeId=null; focusTopMost(); }
    Dock.update();
  }
  function restore(id){
    const win = windows.get(id); if(!win) return;
    if (win.minimized){
      win.minimized=false; win.node.style.display='';
      applyGeom(win);
      win.node.animate([{transform:`translate3d(${win.geom.x}px,${win.geom.y+40}px,0) scale(.4)`,opacity:0},{transform:`translate3d(${win.geom.x}px,${win.geom.y}px,0) scale(1)`,opacity:1}],{duration:300,easing:'cubic-bezier(.32,.72,0,1)'});
    }
    if (win.space!==State.get('currentSpace')) gotoSpace(win.space);
    focus(id);
  }

  function toggleMax(id){
    const win = windows.get(id); if(!win) return;
    const wa = workArea();
    if (win.state==='max' || win.state==='snap'){
      const g = win.prevGeom || {x:wa.x+40,y:wa.y+40,w:640,h:440};
      animateTo(win, g); win.state='normal'; win.prevGeom=null;
    } else {
      win.prevGeom={...win.geom};
      animateTo(win, {x:wa.x,y:wa.y,w:wa.w,h:wa.h}); win.state='max';
    }
  }
  function animateTo(win, g){
    win.node.classList.add('animating');
    win.geom = {...g}; applyGeom(win);
    setTimeout(()=>win.node.classList.remove('animating'), 260);
  }

  /* ---- dragging (transform + rAF) ---- */
  function setupDrag(win){
    const tb = win.titlebar;
    let dragging=false, startX,startY, ox,oy, raf=null, pending=null, snapZone=null;
    tb.addEventListener('pointerdown', e=>{
      if (e.target.closest('.traffic') || e.target.closest('.tb-tools')) return;
      if (e.button!==0) return;
      dragging=true; focus(win.id);
      if (win.state==='max'||win.state==='snap'){
        // un-maximize under cursor
        const ratio = (e.clientX - win.geom.x)/win.geom.w;
        const g = win.prevGeom || {w:640,h:440};
        win.state='normal'; win.prevGeom=null;
        win.geom={x:e.clientX - g.w*ratio, y:e.clientY-19, w:g.w, h:g.h}; applyGeom(win);
      }
      startX=e.clientX; startY=e.clientY; ox=win.geom.x; oy=win.geom.y;
      tb.setPointerCapture(e.pointerId);
      win.node.style.transition='none';
    });
    tb.addEventListener('pointermove', e=>{
      if(!dragging) return;
      pending={dx:e.clientX-startX, dy:e.clientY-startY, cx:e.clientX, cy:e.clientY};
      if(!raf) raf=requestAnimationFrame(()=>{
        raf=null; if(!pending) return;
        win.geom.x = ox+pending.dx; win.geom.y = Math.max(26, oy+pending.dy);
        win.node.style.transform=`translate3d(${win.geom.x}px,${win.geom.y}px,0)`;
        snapZone = detectSnap(pending.cx, pending.cy);
        showSnapPreview(snapZone);
      });
    });
    tb.addEventListener('pointerup', e=>{
      if(!dragging) return; dragging=false;
      tb.releasePointerCapture(e.pointerId);
      hideSnapPreview();
      if (snapZone){ applySnap(win, snapZone); snapZone=null; }
      else { win.state='normal'; }
    });
  }
  function detectSnap(x,y){
    const t=14;
    if (y < 30) return 'max';
    if (x < t) return 'left';
    if (x > window.innerWidth - t) return 'right';
    return null;
  }
  function snapRect(zone){
    const wa=workArea();
    if (zone==='max') return {x:wa.x,y:wa.y,w:wa.w,h:wa.h};
    if (zone==='left') return {x:wa.x,y:wa.y,w:Math.floor(wa.w/2)-4,h:wa.h};
    if (zone==='right') return {x:wa.x+Math.ceil(wa.w/2)+4,y:wa.y,w:Math.floor(wa.w/2)-4,h:wa.h};
    return null;
  }
  function showSnapPreview(zone){
    const p=$('#snap-preview');
    if(!zone){ p.style.opacity=0; p.style.display='none'; return; }
    const r=snapRect(zone);
    p.style.display='block'; p.style.left=r.x+'px'; p.style.top=r.y+'px'; p.style.width=r.w+'px'; p.style.height=r.h+'px';
    requestAnimationFrame(()=>p.style.opacity=1);
  }
  function hideSnapPreview(){ const p=$('#snap-preview'); p.style.opacity=0; setTimeout(()=>{p.style.display='none';},160); }
  function applySnap(win, zone){
    if (win.state==='normal') win.prevGeom={...win.geom};
    animateTo(win, snapRect(zone));
    win.state = zone==='max'?'max':'snap';
  }

  /* ---- resizing (8 handles) ---- */
  function setupResize(win){
    $$('.rz', win.node).forEach(handle=>{
      handle.addEventListener('pointerdown', e=>{
        e.preventDefault(); e.stopPropagation(); focus(win.id);
        const dir=handle.dataset.dir; const sx=e.clientX, sy=e.clientY; const g={...win.geom};
        let raf=null, pend=null;
        win.node.style.transition='none'; win.state='normal';
        handle.setPointerCapture(e.pointerId);
        const move=ev=>{ pend={dx:ev.clientX-sx, dy:ev.clientY-sy}; if(!raf) raf=requestAnimationFrame(()=>{ raf=null;
          let {x,y,w,h}=g;
          if(dir.includes('e')) w=g.w+pend.dx;
          if(dir.includes('s')) h=g.h+pend.dy;
          if(dir.includes('w')){ w=g.w-pend.dx; x=g.x+pend.dx; }
          if(dir.includes('n')){ h=g.h-pend.dy; y=g.y+pend.dy; }
          if(w<win.min.w){ if(dir.includes('w')) x=g.x+g.w-win.min.w; w=win.min.w; }
          if(h<win.min.h){ if(dir.includes('n')) y=g.y+g.h-win.min.h; h=win.min.h; }
          win.geom={x,y:Math.max(26,y),w,h}; applyGeom(win);
        }); };
        const up=ev=>{ handle.releasePointerCapture(e.pointerId); handle.removeEventListener('pointermove',move); handle.removeEventListener('pointerup',up); };
        handle.addEventListener('pointermove',move); handle.addEventListener('pointerup',up);
      });
    });
  }

  /* ---- spaces ---- */
  function gotoSpace(i){
    i = clamp(i, 0, State.get('spaces')-1);
    State.set('currentSpace', i);
    layoutSpaces();
    focusTopMost();
    Bus.emit('wm:space', i);
  }
  function rebuildSpaces(){
    // preserve windows: move any window whose space is now out of range into last space
    const n=State.get('spaces');
    windows.forEach(w=>{ if(w.space>=n){ w.space=n-1; } });
    const prevChildren = {};
    windows.forEach(w=>{ (prevChildren[w.space]=prevChildren[w.space]||[]).push(w); });
    ensureSpaces();
    windows.forEach(w=> spaceWrap(w.space).appendChild(w.node));
    if (State.get('currentSpace')>=n) gotoSpace(n-1); else layoutSpaces();
  }

  window.addEventListener('resize', ()=>{ layoutSpaces && spacesRow && layoutSpaces();
    windows.forEach(w=>{ if(w.state==='max') animateTo(w, workArea()); }); });

  return {windows, create, close, focus, minimize, restore, toggleMax, setTitle, gotoSpace, rebuildSpaces,
    workArea, focusTopMost,
    get activeId(){return activeId;}, getActive(){return windows.get(activeId);},
    list(){return [...windows.values()];},
    forSpace(i){ return [...windows.values()].filter(w=>w.space===i); },
    ensureSpaces, layoutSpaces, applyGeom, snapRect, applySnap: (id,z)=>applySnap(windows.get(id),z)};
})();

/* ------------------------------- App SDK ------------------------------- */
const Apps = new Map();
function registerApp(def){ Apps.set(def.id, def); }
function launchApp(id, arg){
  const def = Apps.get(id);
  if (!def){ Notify.push('App not found', id, '⚠️'); return; }
  if (def.singleton){
    const existing = WM.list().find(w=>w.appId===id);
    if (existing){ WM.restore(existing.id); if (existing.api && existing.api.onArg && arg!=null) existing.api.onArg(arg); return existing; }
  }
  const proc = Proc.spawn(id, def.name);
  const win = WM.create({appId:id, pid:proc.pid, title:def.name, width:def.width, height:def.height,
    minWidth:def.minWidth, minHeight:def.minHeight,
    onClose: ()=> win.api && win.api.onClose ? win.api.onClose() : true });
  const ctx = { win, proc, arg,
    setTitle:(t)=>WM.setTitle(win.id,t),
    setMenus:(m)=>{ win.menus=m; if (WM.activeId===win.id) Menus.setApp(win); },
    addToolbar:(node)=> win.tbTools.appendChild(node),
    close:()=>WM.close(win.id), launch:launchApp, notify:Notify.push, fs:FS };
  win.api = def.mount(win.content, ctx) || {};
  win.menus = win.api.menus || def.menus || null;
  Dock.update(); Bus.emit('wm:change');
  if (arg!=null && win.api.onArg) win.api.onArg(arg);
  return win;
}

/* ------------------------------- dock ------------------------------- */
const Dock = (()=>{
  const PINNED = ['files','terminal','editor','notes','calculator','imageviewer','store','settings','taskmgr'];
  const iconEls = new Map();
  const dock = () => $('#dock');

  function build(){
    const d = dock(); d.innerHTML=''; iconEls.clear();
    PINNED.forEach(id=> d.appendChild(makeItem(id)));
    d.appendChild(el('div',{class:'dock-sep'}));
    d.appendChild(makeItem('mission'));
    d.appendChild(makeItem('egg'));
    // running, non-pinned
    const running = new Set(WM.list().map(w=>w.appId));
    running.forEach(id=>{ if(!PINNED.includes(id) && !['mission','egg'].includes(id) && Apps.get(id)){ d.appendChild(makeItem(id)); } });
    update();
    setupMagnify();
  }
  function makeItem(id){
    const def = Apps.get(id) || (id==='mission'?{name:'Mission Control',icon:'🪟',iconClass:'g-mission'}:{name:id,icon:'📦'});
    const item = el('div',{class:'dock-item','data-app':id},[
      el('div',{class:'ico '+(def.iconClass||''),html:def.iconSVG||('<span>'+ (def.icon||'📦') +'</span>')}),
      el('div',{class:'tip',text:def.name}),
      el('div',{class:'run-dot'})
    ]);
    item.addEventListener('click', ()=>{
      if (id==='mission'){ Mission.toggle(); return; }
      const existing = WM.list().find(w=>w.appId===id);
      if (existing){ if(existing.minimized) WM.restore(existing.id); else if(WM.activeId===existing.id) WM.minimize(existing.id); else WM.restore(existing.id); }
      else launchApp(id);
    });
    item.addEventListener('contextmenu', e=>{ e.preventDefault(); dockCtx(e, id); });
    iconEls.set(id, item);
    return item;
  }
  function dockCtx(e, id){
    const running = WM.list().filter(w=>w.appId===id);
    const items = [];
    if (running.length){ items.push({label:'Show All Windows', do:()=>running.forEach(w=>WM.restore(w.id))}); items.push({label:'Quit', do:()=>running.forEach(w=>WM.close(w.id))}); items.push({type:'sep'}); }
    items.push({label:'Open', do:()=>launchApp(id)});
    Ctx.open(e.clientX, e.clientY, items);
  }
  function update(){
    const running = new Set(WM.list().map(w=>w.appId));
    iconEls.forEach((elm,id)=> elm.classList.toggle('running', running.has(id)));
  }
  function setupMagnify(){
    const d=dock();
    d.onpointermove = (e)=>{
      if (!State.get('dockMagnify') || State.get('dockPos')!=='bottom'){ return; }
      const items=$$('.dock-item',d);
      items.forEach(it=>{ const r=it.getBoundingClientRect(); const c=r.left+r.width/2; const dist=Math.abs(e.clientX-c);
        const s = Math.max(1, 1.55 - dist/170); it.style.transform=`scale(${s}) translateY(${-(s-1)*14}px)`; });
    };
    d.onpointerleave = ()=>{ $$('.dock-item',d).forEach(it=>it.style.transform=''); };
  }
  return {build, update, iconFor:(id)=>iconEls.get(id)};
})();

/* ------------------------------- spotlight ------------------------------- */
const Spotlight = (()=>{
  let sel=0, results=[];
  const box=$('#spotlight'), input=$('#spot-input'), out=$('#spot-results');
  function walk(path, acc){
    const list = FS.list(path); if(!list) return;
    list.forEach(e=>{ const p=(path==='/'?'':path)+'/'+e.name; if(e.type==='dir') walk(p, acc); else acc.push({name:e.name, path:p}); });
  }
  function fuzzy(q, s){ q=q.toLowerCase(); s=s.toLowerCase(); let i=0,score=0,streak=0; for(const ch of s){ if(q[i]===ch){ i++; streak++; score+=streak; } else streak=0; if(i>=q.length) break; } return i>=q.length? score+ (s.startsWith(q)?100:0) : -1; }
  function search(q){
    results=[];
    if(!q.trim()) { render(); return; }
    Apps.forEach(a=>{ const sc=fuzzy(q, a.name); if(sc>=0) results.push({type:'App', icon:a.icon, iconClass:a.iconClass, title:a.name, sc, do:()=>launchApp(a.id)}); });
    const settingsItems=[['Wallpaper','settings'],['Theme','settings'],['Accent Color','settings'],['Dock','settings'],['About This webOS','about']];
    settingsItems.forEach(([n,app])=>{ const sc=fuzzy(q,n); if(sc>=0) results.push({type:'Setting', icon:'⚙️', title:n, sc, do:()=>launchApp(app)}); });
    const files=[]; walk('/', files);
    files.forEach(f=>{ const sc=fuzzy(q, f.name); if(sc>=0) results.push({type:'File', icon:fileEmoji(f.name), title:f.name, subtitle:f.path, sc, do:()=>openPath(f.path)}); });
    results.sort((a,b)=>b.sc-a.sc); results=results.slice(0,9); sel=0; render();
  }
  function render(){
    out.innerHTML='';
    results.forEach((r,i)=>{
      const row=el('div',{class:'spot-row'+(i===sel?' sel':'')},[
        el('div',{class:'si '+(r.iconClass||''),text:r.iconClass?'':r.icon}),
        el('div',{class:'st',text:r.title}),
        el('div',{class:'sk',text:r.type})
      ]);
      row.addEventListener('click', ()=>{ activate(i); });
      out.appendChild(row);
    });
  }
  function activate(i){ const r=results[i]; if(r){ hide(); r.do(); } }
  function show(){ box.classList.add('on'); input.value=''; results=[]; out.innerHTML=''; setTimeout(()=>input.focus(),30); }
  function hide(){ box.classList.remove('on'); }
  function toggle(){ box.classList.contains('on')?hide():show(); }
  input.addEventListener('input', ()=>search(input.value));
  input.addEventListener('keydown', e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); sel=Math.min(sel+1,results.length-1); render(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(sel-1,0); render(); }
    else if(e.key==='Enter'){ e.preventDefault(); activate(sel); }
    else if(e.key==='Escape'){ hide(); }
  });
  box.addEventListener('click', e=>{ if(e.target===box) hide(); });
  return {show,hide,toggle};
})();

/* Open any FS path with the appropriate app */
function fileEmoji(name){
  const ext=name.split('.').pop().toLowerCase();
  if(['png','jpg','jpeg','gif','webp','svg'].includes(ext)) return '🖼️';
  if(['md','markdown'].includes(ext)) return '📝';
  if(['js','json','html','css'].includes(ext)) return '📜';
  if(ext==='txt') return '📄';
  return '📄';
}
function openPath(path){
  if (FS.isDir(path)){ launchApp('files', path); return; }
  const ext = path.split('.').pop().toLowerCase();
  if (['png','jpg','jpeg','gif','webp','svg'].includes(ext)) launchApp('imageviewer', path);
  else if (['md','markdown'].includes(ext)) launchApp('editor', path);
  else launchApp('editor', path);
}

/* ------------------------------- app switcher (Cmd/Alt+Tab) ------------------------------- */
const Switcher = (()=>{
  const box=$('#app-switcher'), inner=$('#switch-box');
  let apps=[], sel=0, active=false;
  function collect(){
    const seen=new Map();
    WM.list().forEach(w=>{ if(!seen.has(w.appId)) seen.set(w.appId, w); });
    return [...seen.values()];
  }
  function render(){
    inner.innerHTML='';
    apps.forEach((w,i)=>{
      const def=Apps.get(w.appId)||{name:w.title,icon:'📦'};
      inner.appendChild(el('div',{class:'switch-item'+(i===sel?' sel':'')},[
        el('div',{class:'si '+(def.iconClass||''),text:def.iconClass?'':(def.icon||'📦')}),
        el('div',{class:'sn',text:def.name})
      ]));
    });
  }
  function start(back){ apps=collect(); if(apps.length<2 && !active){ if(apps.length===1){ WM.restore(apps[0].id);} return; } if(!active){ active=true; sel=0; box.classList.add('on'); } cycle(back); }
  function cycle(back){ if(!apps.length) return; sel=(sel+(back?-1:1)+apps.length)%apps.length; render(); }
  function commit(){ if(!active) return; active=false; box.classList.remove('on'); const w=apps[sel]; if(w) WM.restore(w.id); }
  return {start, cycle, commit, isActive:()=>active};
})();

/* ------------------------------- mission control ------------------------------- */
const Mission = (()=>{
  const layer=$('#mission'), spacesEl=$('#mission-spaces'), winsEl=$('#mission-windows');
  let on=false;
  function toggle(){ on?hide():show(); }
  function show(){
    on=true; layer.classList.add('on');
    spacesEl.innerHTML=''; winsEl.innerHTML='';
    const nSpaces=State.get('spaces'), cur=State.get('currentSpace');
    for(let i=0;i<nSpaces;i++){
      const th=el('div',{class:'ms-thumb'+(i===cur?' active':'')});
      WM.forSpace(i).forEach(w=>{ if(w.minimized) return; const g=w.geom; const mini=el('div',{class:'mini-win',style:`left:${g.x/window.innerWidth*100}%;top:${g.y/window.innerHeight*100}%;width:${g.w/window.innerWidth*100}%;height:${g.h/window.innerHeight*100}%`}); th.appendChild(mini); });
      th.appendChild(el('div',{class:'ms-label',text:'Desktop '+(i+1)}));
      th.addEventListener('click', ()=>{ WM.gotoSpace(i); hide(); });
      spacesEl.appendChild(th);
    }
    // expose windows of current space
    const wins = WM.forSpace(cur).filter(w=>!w.minimized);
    const pad=16;
    const area={x:pad,y:pad,w:Math.max(1,winsEl.clientWidth-2*pad),h:Math.max(1,winsEl.clientHeight-2*pad)};
    const cols=Math.ceil(Math.sqrt(wins.length))||1, rows=Math.ceil(wins.length/cols)||1;
    const cw=area.w/cols, ch=area.h/rows;
    wins.forEach((w,i)=>{
      const col=i%cols, row=Math.floor(i/cols);
      const scale=Math.min((cw-24)/w.geom.w, (ch-24)/w.geom.h, 1);
      const tw=w.geom.w*scale, th2=w.geom.h*scale;
      const ex=area.x+col*cw+(cw-tw)/2, ey=area.y+row*ch+(ch-th2)/2;
      const clone=el('div',{class:'expose-win',style:`left:${ex}px;top:${ey}px;width:${tw}px;height:${th2}px`});
      const def=Apps.get(w.appId)||{};
      clone.appendChild(el('div',{class:'ew-title',text:(def.icon?def.icon+' ':'')+w.title}));
      const preview=el('div',{style:`position:absolute;inset:22px 0 0 0;background:var(--content-bg);opacity:.9`});
      clone.appendChild(preview);
      clone.addEventListener('click', ()=>{ hide(); WM.restore(w.id); });
      winsEl.appendChild(clone);
    });
    if(!wins.length) winsEl.appendChild(el('div',{class:'center-msg',style:'color:#fff',text:'No open windows in this space'}));
  }
  function hide(){ on=false; layer.classList.remove('on'); }
  layer.addEventListener('click', e=>{ if(e.target===layer||e.target===winsEl) hide(); });
  return {toggle, show, hide, isOn:()=>on};
})();
