registerApp({
  id:'terminal', name:'Terminal', icon:'>_', iconClass:'g-term', width:660, height:420, minWidth:360, minHeight:220,
  about:'A real shell with a tokenizing parser: pipes, redirection, history and tab-completion.',
  mount(root, ctx){
    let cwd='/Users/User';
    const history=[]; let hIndex=0;
    const term=el('div',{class:'term'});
    root.appendChild(term);
    const out=el('div',{class:'out'}); term.appendChild(out);
    const inputLine=el('div',{class:'prompt-line'});
    const ps1=el('span',{class:'ps1'});
    const input=el('input',{class:'cmd-in',spellcheck:'false',autocomplete:'off'});
    inputLine.appendChild(ps1); inputLine.appendChild(input); term.appendChild(inputLine);
    function ps(){ return (cwd.replace('/Users/User','~')||'/')+' $'; }
    function refreshPS(){ ps1.textContent=ps(); }
    function print(text, cls){ const d=el('div',{class:cls||''}); d.textContent=text; out.appendChild(d); }
    function printHTML(html){ const d=el('div'); d.innerHTML=html; out.appendChild(d); }
    function scroll(){ term.scrollTop=term.scrollHeight; }
    refreshPS();
    print('webOS Terminal — type "help". Pipes and redirection work: ls | grep md | wc -l','ok');

    const resolve = (p)=> FS._norm(!p ? cwd : (p.startsWith('/')? p : cwd+'/'+p));

    // ---- tokenizer with quote support ----
    function tokenize(line){
      const toks=[]; let cur='', q=null;
      for(let i=0;i<line.length;i++){ const c=line[i];
        if(q){ if(c===q){q=null;} else cur+=c; }
        else if(c==='"'||c==="'"){ q=c; }
        else if(c===' '||c==='\t'){ if(cur){toks.push(cur);cur='';} }
        else if(c==='|'||c==='>'){ if(cur){toks.push(cur);cur='';}
          if(c==='>'&&line[i+1]==='>'){ toks.push('>>'); i++; } else toks.push(c); }
        else cur+=c;
      }
      if(cur) toks.push(cur);
      return toks;
    }
    function splitPipes(toks){ const segs=[[]]; toks.forEach(t=>{ if(t==='|') segs.push([]); else segs[segs.length-1].push(t); }); return segs; }
    function extractRedirect(seg){ let redir=null; const args=[]; for(let i=0;i<seg.length;i++){ if(seg[i]==='>'||seg[i]==='>>'){ redir={mode:seg[i], file:seg[i+1]}; i++; } else args.push(seg[i]); } return {args, redir}; }

    // ---- commands ---- each: (args, stdin) => {out, err}
    const CMD = {
      help:()=>({out:'Commands: ls cd pwd cat echo mkdir touch rm mv cp grep wc head tail clear help ps kill open date whoami tree\nFeatures: pipes ( | ), redirection ( > , >> ), history (↑/↓), tab-completion.'}),
      pwd:()=>({out:cwd}),
      whoami:()=>({out:State.get('user').toLowerCase()}),
      date:()=>({out:new Date().toString()}),
      clear:()=>{ out.innerHTML=''; return {out:''}; },
      echo:(a)=>({out:a.join(' ')}),
      cd:(a)=>{ const t=resolve(a[0]||'/Users/User'); if(!FS.exists(t)) return {err:'cd: no such directory: '+(a[0]||'')}; if(!FS.isDir(t)) return {err:'cd: not a directory: '+a[0]}; cwd=t; refreshPS(); return {out:''}; },
      ls:(a)=>{ const flags=a.filter(x=>x.startsWith('-')).join(''); const paths=a.filter(x=>!x.startsWith('-')); const target=resolve(paths[0]);
        if(!FS.exists(target)) return {err:'ls: no such file or directory: '+(paths[0]||'')};
        if(FS.isDir(target)){ const list=FS.list(target); if(flags.includes('l')){ return {out:list.map(e=>`${e.type==='dir'?'d':'-'}  ${String(e.type==='dir'?'--':fmtBytes(e.size)).padStart(8)}  ${e.name}${e.type==='dir'?'/':''}`).join('\n')}; }
          return {out:list.map(e=>e.name+(e.type==='dir'?'/':'')).join(flags.includes('1')?'\n':'  ')}; }
        return {out:paths[0]}; },
      cat:(a, stdin)=>{ if(!a.length) return {out:stdin||''}; let o=[],e=[]; a.forEach(p=>{ const t=resolve(p); try{ if(FS.isDir(t)){e.push('cat: '+p+': is a directory');} else o.push(FS.read(t)); }catch(err){ e.push('cat: '+p+': no such file'); } }); return {out:o.join('\n'), err:e.join('\n')}; },
      mkdir:(a)=>{ if(!a.length) return {err:'mkdir: missing operand'}; let e=[]; a.filter(x=>!x.startsWith('-')).forEach(p=>{ try{FS.mkdir(resolve(p));}catch(err){e.push('mkdir: '+err.message);} }); return {out:'', err:e.join('\n')}; },
      touch:(a)=>{ let e=[]; a.forEach(p=>{ const t=resolve(p); try{ if(!FS.exists(t)) FS.write(t,''); else { const c=FS.read(t); FS.write(t,c);} }catch(err){e.push('touch: '+err.message);} }); return {out:'', err:e.join('\n')}; },
      rm:(a)=>{ const rec=a.some(x=>x.startsWith('-')&&x.includes('r')); const paths=a.filter(x=>!x.startsWith('-')); let e=[]; paths.forEach(p=>{ try{FS.rm(resolve(p), rec);}catch(err){e.push('rm: '+err.message);} }); return {out:'', err:e.join('\n')}; },
      mv:(a)=>{ const p=a.filter(x=>!x.startsWith('-')); if(p.length<2) return {err:'mv: usage: mv src dst'}; try{FS.mv(resolve(p[0]),resolve(p[1])); return {out:''};}catch(err){return {err:'mv: '+err.message};} },
      cp:(a)=>{ const p=a.filter(x=>!x.startsWith('-')); if(p.length<2) return {err:'cp: usage: cp src dst'}; try{FS.cp(resolve(p[0]),resolve(p[1])); return {out:''};}catch(err){return {err:'cp: '+err.message};} },
      grep:(a, stdin)=>{ const flags=a.filter(x=>x.startsWith('-')); const rest=a.filter(x=>!x.startsWith('-')); const pat=rest[0]||''; let text=stdin||''; if(rest[1]){ try{text=FS.read(resolve(rest[1]));}catch(e){return {err:'grep: '+rest[1]+': no such file'};} } const ci=flags.some(f=>f.includes('i')); let re; try{re=new RegExp(pat, ci?'i':'');}catch(e){re=null;} const lines=text.split('\n').filter(l=> re? re.test(l): l.includes(pat)); return {out:lines.join('\n')}; },
      wc:(a, stdin)=>{ const flags=a.filter(x=>x.startsWith('-')).join(''); const rest=a.filter(x=>!x.startsWith('-')); let text=stdin||''; if(rest[0]){ try{text=FS.read(resolve(rest[0]));}catch(e){return {err:'wc: '+rest[0]+': no such file'};} } const lines=text===''?0:text.split('\n').length; const words=text.trim()===''?0:text.trim().split(/\s+/).length; const chars=text.length; if(flags.includes('l')) return {out:String(lines)}; if(flags.includes('w')) return {out:String(words)}; if(flags.includes('c')) return {out:String(chars)}; return {out:`${lines} ${words} ${chars}`}; },
      head:(a, stdin)=>{ let n=10; const idx=a.indexOf('-n'); if(idx>=0){ n=parseInt(a[idx+1])||10; } const rest=a.filter((x,i)=>!x.startsWith('-')&&!(idx>=0&&i===idx+1)); let text=stdin||''; if(rest[0]){ try{text=FS.read(resolve(rest[0]));}catch(e){return {err:'head: '+rest[0]+': no such file'};} } return {out:text.split('\n').slice(0,n).join('\n')}; },
      tail:(a, stdin)=>{ let n=10; const idx=a.indexOf('-n'); if(idx>=0){ n=parseInt(a[idx+1])||10; } const rest=a.filter((x,i)=>!x.startsWith('-')&&!(idx>=0&&i===idx+1)); let text=stdin||''; if(rest[0]){ try{text=FS.read(resolve(rest[0]));}catch(e){return {err:'tail: '+rest[0]+': no such file'};} } return {out:text.split('\n').slice(-n).join('\n')}; },
      tree:(a)=>{ const t=resolve(a[0]); if(!FS.isDir(t)) return {err:'tree: not a directory'}; return {out:(a[0]||cwd)+'\n'+FS.tree(t)}; },
      ps:()=>{ const rows=Proc.all().map(p=>`${String(p.pid).padStart(5)}  ${(p.memBase).toFixed(1).padStart(6)}MB  ${p.name}`); return {out:'  PID     MEM  NAME\n'+rows.join('\n')}; },
      kill:(a)=>{ const pid=parseInt(a[0]); if(!pid) return {err:'kill: usage: kill <pid>'}; if(!Proc.get(pid)) return {err:'kill: ('+pid+') - no such process'}; Proc.kill(pid); return {out:''}; },
      open:(a)=>{ if(!a[0]) return {err:'open: usage: open <path|app>'}; const t=resolve(a[0]); if(FS.exists(t)){ openPath(t); return {out:'Opening '+a[0]+'…'}; } if(Apps.get(a[0])){ launchApp(a[0]); return {out:'Launching '+a[0]+'…'}; } return {err:'open: cannot find '+a[0]}; }
    };

    function runLine(line){
      const toks=tokenize(line);
      if(!toks.length) return;
      const segs=splitPipes(toks);
      let stdin='';
      for(let s=0;s<segs.length;s++){
        const {args, redir}=extractRedirect(segs[s]);
        const name=args[0]; const rest=args.slice(1);
        if(!name) continue;
        const fn=CMD[name];
        if(!fn){ print(name+': command not found','err'); return; }
        let res; try{ res=fn(rest, stdin)||{}; }catch(err){ print(name+': '+err.message,'err'); return; }
        if(res.err) print(res.err,'err');
        const output = res.out!=null?res.out:'';
        if(redir){ try{ const t=resolve(redir.file); const existing=(redir.mode==='>>'&&FS.exists(t))?FS.read(t)+'\n':''; FS.write(t, existing+output); }catch(err){ print('redirect: '+err.message,'err'); } stdin=''; }
        else stdin=output;
      }
      if(stdin!=='') print(stdin);
    }

    input.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ const line=input.value; print(ps()+' '+line,'ps-echo'); if(line.trim()){ history.push(line); hIndex=history.length; runLine(line); } input.value=''; scroll(); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); if(hIndex>0){ hIndex--; input.value=history[hIndex]||''; } }
      else if(e.key==='ArrowDown'){ e.preventDefault(); if(hIndex<history.length){ hIndex++; input.value=history[hIndex]||''; } }
      else if(e.key==='Tab'){ e.preventDefault(); tabComplete(); }
      else if((e.metaKey||e.ctrlKey)&&e.key==='l'){ e.preventDefault(); out.innerHTML=''; }
    });
    function tabComplete(){
      const parts=input.value.split(' '); const frag=parts[parts.length-1];
      const slash=frag.lastIndexOf('/');
      const dir=slash>=0? resolve(frag.slice(0,slash)||'/') : cwd;
      const base=slash>=0? frag.slice(slash+1) : frag;
      if(!FS.isDir(dir)) return;
      const matches=FS.list(dir).filter(e=>e.name.startsWith(base));
      if(matches.length===1){ const e=matches[0]; const completed=(slash>=0?frag.slice(0,slash+1):'')+e.name+(e.type==='dir'?'/':''); parts[parts.length-1]=completed; input.value=parts.join(' '); }
      else if(matches.length>1){ print(ps()+' '+input.value,'ps-echo'); print(matches.map(m=>m.name+(m.type==='dir'?'/':'')).join('  ')); scroll(); }
    }
    term.addEventListener('click', ()=>{ if(!window.getSelection().toString()) input.focus(); });
    setTimeout(()=>input.focus(),60);
    return { onArg:(p)=>{ if(FS.isDir(p)){ cwd=FS._norm(p); refreshPS(); } }, focusInput:()=>input.focus() };
  }
});

registerApp({
  id:'files', name:'Files', icon:'📁', iconClass:'g-files', width:760, height:500, minWidth:480, minHeight:300,
  about:'A Finder-style file browser for the virtual filesystem.',
  mount(root, ctx){
    let cwd='/Users/User'; let view='icons'; let sel=null;
    const wrap=el('div',{class:'finder'});
    const sidebar=el('div',{class:'sidebar'});
    const main=el('div',{class:'main'});
    wrap.appendChild(sidebar); wrap.appendChild(main);

    listBtn.onclick=()=>{ view='list'; listBtn.classList.add('active'); iconBtn.classList.remove('active'); render(); };

    const PLACES=[['🏠','Home','/Users/User'],['🖥️','Desktop','/Users/User/Desktop'],['📄','Documents','/Users/User/Documents'],['🖼️','Pictures','/Users/User/Pictures'],['⬇️','Downloads','/Users/User/Downloads'],['💾','System','/System'],['📦','Applications','/Applications']];
    function buildSidebar(){
      sidebar.innerHTML=''; sidebar.appendChild(el('div',{class:'sb-group',text:'Favorites'}));
      PLACES.forEach(([em,nm,pth])=>{
        const it=el('div',{class:'sb-item'+(cwd===pth?' active':''),onclick:()=>go(pth)},[el('span',{text:em}),el('span',{text:nm})]);
        it.addEventListener('dragover',e=>{e.preventDefault();it.style.background='var(--accent)';});
        it.addEventListener('dragleave',()=>it.style.background='');
        it.addEventListener('drop',e=>{ e.preventDefault(); it.style.background=''; const src=e.dataTransfer.getData('text/plain'); if(src) try{FS.mv(src, pth);}catch(err){ctx.notify('Move failed',err.message,'⚠️');} });
        sidebar.appendChild(it);
      });
    }
    function go(p){ cwd=FS._norm(p); sel=null; ctx.setTitle('Files — '+(cwd.split('/').pop()||'/')); buildSidebar(); render(); }
    function renderCrumbs(){
      crumbs.innerHTML=''; const parts=cwd.split('/').filter(Boolean); let acc='';
      crumbs.appendChild(el('span',{class:'cr',text:'/',onclick:()=>go('/')}));
      parts.forEach((p,i)=>{ acc+='/'+p; const path=acc; crumbs.appendChild(el('span',{class:'cr',text:p,onclick:()=>go(path)})); if(i<parts.length-1) crumbs.appendChild(el('span',{text:'›',style:'opacity:.4'})); });
    }
    function render(){
      renderCrumbs();
      listing.className='listing '+view;
      listing.innerHTML='';
      const items=FS.list(cwd)||[];
      if(!items.length){ listing.appendChild(el('div',{class:'center-msg',text:'Empty folder'})); return; }
      items.forEach(e=>{
        const emoji=e.type==='dir'?'📁':fileEmoji(e.name);
        const node = view==='icons'
          ? el('div',{class:'f-icon','data-name':e.name,draggable:'true'},[el('div',{class:'em',text:emoji}),el('div',{class:'nm',text:e.name})])
          : el('div',{class:'f-row','data-name':e.name,draggable:'true'},[el('div',{class:'em',text:emoji}),el('div',{class:'nm',text:e.name}),el('div',{class:'meta',text:e.type==='dir'?(e.size+' items'):fmtBytes(e.size)})]);
        const full=FS._norm(cwd+'/'+e.name);
        node.addEventListener('click', ev=>{ ev.stopPropagation(); listing.querySelectorAll('.sel').forEach(n=>n.classList.remove('sel')); node.classList.add('sel'); sel=e.name; });
        node.addEventListener('dblclick', ()=>{ if(e.type==='dir') go(full); else openPath(full); });
        node.addEventListener('contextmenu', ev=>{ ev.preventDefault(); ev.stopPropagation(); itemCtx(ev, e, full); });
        node.addEventListener('dragstart', ev=>{ ev.dataTransfer.setData('text/plain', full); ev.dataTransfer.effectAllowed='move'; });
        if(e.type==='dir'){ node.addEventListener('dragover',ev=>{ev.preventDefault();node.style.background='var(--accent)';}); node.addEventListener('dragleave',()=>node.style.background=''); node.addEventListener('drop',ev=>{ ev.preventDefault(); ev.stopPropagation(); node.style.background=''; const s=ev.dataTransfer.getData('text/plain'); if(s&&s!==full) try{FS.mv(s, full);}catch(err){ctx.notify('Move failed',err.message,'⚠️');} }); }
        listing.appendChild(node);
      });
    }
    function itemCtx(ev, e, full){
      Ctx.open(ev.clientX, ev.clientY, [
        {label:'Open', do:()=>{ if(e.type==='dir') go(full); else openPath(full); }},
        e.type==='file'?{label:'Open in Text Editor', do:()=>launchApp('editor', full)}:null,
        {type:'sep'},
        {label:'Rename…', do:()=>{ const nn=prompt('Rename to:', e.name); if(nn&&nn!==e.name){ try{FS.mv(full, FS._norm(cwd+'/'+nn));}catch(err){ctx.notify('Rename failed',err.message,'⚠️');} } }},
        {label:'Duplicate', do:()=>{ try{FS.cp(full, FS._norm(cwd+'/'+e.name.replace(/(\.[^.]+)?$/,' copy$1')));}catch(err){ctx.notify('Copy failed',err.message,'⚠️');} }},
        {label:'Move to Trash', do:()=>{ try{FS.rm(full, true);}catch(err){ctx.notify('Delete failed',err.message,'⚠️');} }},
        {type:'sep'},
        {label:'Get Info', do:()=>{ const st=FS.stat(full); ctx.notify(e.name, `${e.type} • ${e.type==='file'?fmtBytes(st.size):st.size+' items'} • ${st.mime||''}`, '📄'); }}
      ].filter(Boolean));
    }
    listing.addEventListener('click', ()=>{ listing.querySelectorAll('.sel').forEach(n=>n.classList.remove('sel')); sel=null; });
    listing.addEventListener('contextmenu', ev=>{ ev.preventDefault(); Ctx.open(ev.clientX, ev.clientY, [
      {label:'New Folder', do:()=>{ let n='untitled folder',i=1; while(FS.exists(FS._norm(cwd+'/'+n))){ n='untitled folder '+(++i); } FS.mkdir(FS._norm(cwd+'/'+n)); }},
      {label:'New File', do:()=>{ let n='untitled.txt',i=1; while(FS.exists(FS._norm(cwd+'/'+n))){ n='untitled '+(++i)+'.txt'; } FS.write(FS._norm(cwd+'/'+n),''); }},
      {type:'sep'},
      {label:'Open in Terminal', do:()=>launchApp('terminal', cwd)},
      {label:view==='icons'?'As List':'As Icons', do:()=>{ view=view==='icons'?'list':'icons'; (view==='icons'?iconBtn:listBtn).click(); }}
    ]); });
    // keyboard navigation
    wrap.tabIndex=0;
    wrap.addEventListener('keydown', e=>{
      const items=FS.list(cwd)||[]; if(!items.length) return;
      let idx=items.findIndex(i=>i.name===sel);
      if(e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); idx=Math.min(idx+1, items.length-1); }
      else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ e.preventDefault(); idx=Math.max(idx-1, 0); }
      else if(e.key==='Enter'){ if(sel){ const f=FS._norm(cwd+'/'+sel); FS.isDir(f)?go(f):openPath(f); } return; }
      else return;
      sel=items[Math.max(0,idx)].name; render(); const n=listing.querySelector(`[data-name="${CSS.escape(sel)}"]`); if(n){ n.classList.add('sel'); n.scrollIntoView({block:'nearest'}); }
    });
    const off=Bus.on('fs:change', ()=>render());
    buildSidebar(); render();
    return { onArg:(p)=>{ if(p) go(FS.isDir(p)?p:p.slice(0,p.lastIndexOf('/'))||'/'); }, onClose:()=>{ off(); return true; } };
  }
});

/* ------------------------------- Text Editor ------------------------------- */
function highlight(code, lang){
  const e=esc(code);
  if(lang==='json'||lang==='js'){
    return e
      .replace(/(\/\/[^\n]*)/g,'<span class="tok-com">$1</span>')
      .replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;|&#39;(?:[^&]|&(?!#39;))*?&#39;)/g,'<span class="tok-str">$1</span>')
      .replace(/\b(const|let|var|function|return|if|else|for|while|new|class|import|export|from|await|async|try|catch|throw|typeof|true|false|null|undefined|this)\b/g,'<span class="tok-key">$1</span>')
      .replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="tok-num">$1</span>');
  }
  if(lang==='html'||lang==='xml'||lang==='svg'){
    return e.replace(/(&lt;\/?[a-zA-Z0-9\-]+)/g,'<span class="tok-tag">$1</span>').replace(/([a-zA-Z\-]+)=(&quot;.*?&quot;)/g,'<span class="tok-attr">$1</span>=<span class="tok-str">$2</span>');
  }
  if(lang==='md'){
    return e.replace(/^(#{1,6} .*)$/gm,'<span class="tok-key">$1</span>').replace(/(\*\*[^*]+\*\*)/g,'<span class="tok-attr">$1</span>').replace(/(`[^`]+`)/g,'<span class="tok-str">$1</span>');
  }
  return e;
}
function langOf(name){ const ext=name.split('.').pop().toLowerCase(); return {js:'js',json:'json',md:'md',markdown:'md',html:'html',htm:'html',svg:'svg',xml:'xml',css:'css'}[ext]||'txt'; }

registerApp({
  id:'editor', name:'Text Editor', icon:'✎', iconClass:'g-editor', width:720, height:520, minWidth:420, minHeight:280,
  about:'Edit filesystem files with syntax highlighting, tabs and find/replace.',
  mount(root, ctx){
    const tabs=[]; let active=-1;
    const wrap=el('div',{class:'editor'});
    const tabbar=el('div',{class:'tabs'});
    const toolbar=el('div',{class:'etoolbar'});
    const findbar=el('div',{class:'find-bar'});
    const body=el('div',{class:'ebody'});
    const gutter=el('div',{class:'gutter'});

    const ta=el('textarea',{spellcheck:'false',wrap:'off'});
    codeWrap.appendChild(hl); codeWrap.appendChild(ta);
    body.appendChild(gutter); body.appendChild(codeWrap);
    const saveBtn=el('button',{class:'btn',text:'Save ⌘S'});
    const newBtn=el('button',{class:'btn',text:'New'});
    const openBtn=el('button',{class:'btn',text:'Open…'});
    const findBtn=el('button',{class:'btn',text:'Find ⌘F'});
    toolbar.append(saveBtn,newBtn,openBtn,findBtn);
    const fInput=el('input',{placeholder:'Find'}); const rInput=el('input',{placeholder:'Replace'});
    const fNext=el('button',{class:'btn',text:'Next'}); const fRep=el('button',{class:'btn',text:'Replace'}); const fAll=el('button',{class:'btn',text:'All'}); const fClose=el('button',{class:'btn',text:'✕'});
    findbar.append(fInput,fNext,rInput,fRep,fAll,fClose);
    wrap.append(tabbar,toolbar,findbar,body); root.appendChild(wrap);

    function cur(){ return tabs[active]; }
    function renderTabs(){
      tabbar.innerHTML='';
      tabs.forEach((t,i)=>{
        const tab=el('div',{class:'etab'+(i===active?' active':'')+(t.dirty?' dirty':'')},[
          el('span',{class:'dot'}), el('span',{text:t.name}), el('span',{class:'x',text:'✕'})
        ]);
        tab.addEventListener('click',()=>{ active=i; refresh(); });
        tab.querySelector('.x').addEventListener('click',ev=>{ ev.stopPropagation(); closeTab(i); });
        tabbar.appendChild(tab);
      });
    }
    function openFile(path){
      const existing=tabs.findIndex(t=>t.path===path);
      if(existing>=0){ active=existing; refresh(); return; }
      let content=''; try{ content=FS.read(path); }catch(e){ ctx.notify('Editor','Cannot open '+path,'⚠️'); return; }
      tabs.push({path, name:path.split('/').pop(), content, dirty:false, lang:langOf(path)});
      active=tabs.length-1; refresh();
    }
    function newFile(){ tabs.push({path:null, name:'untitled.txt', content:'', dirty:false, lang:'txt'}); active=tabs.length-1; refresh(); }
    function closeTab(i){ if(tabs[i].dirty && !confirm('Discard unsaved changes to '+tabs[i].name+'?')) return; tabs.splice(i,1); if(active>=tabs.length) active=tabs.length-1; if(!tabs.length) newFile(); else refresh(); }
    function save(){
      const t=cur(); if(!t) return;
      if(!t.path){ const name=prompt('Save as (path):', '/Users/User/Documents/'+t.name); if(!name) return; t.path=FS._norm(name); t.name=t.path.split('/').pop(); t.lang=langOf(t.name); }
      try{ FS.write(t.path, t.content); t.dirty=false; renderTabs(); ctx.notify('Saved', t.path, '💾'); }catch(e){ ctx.notify('Save failed', e.message, '⚠️'); }
    }
    function refresh(){
      renderTabs(); const t=cur(); if(!t){ ta.value=''; hl.innerHTML=''; gutter.textContent=''; return; }
      ctx.setTitle('Text Editor — '+t.name);
      ta.value=t.content; syncHL();
    }
    function syncHL(){ const t=cur(); if(!t) return; hl.innerHTML=highlight(ta.value, t.lang)+'\n'; const lines=ta.value.split('\n').length; gutter.textContent=Array.from({length:lines},(_,i)=>i+1).join('\n'); }
    ta.addEventListener('input',()=>{ const t=cur(); if(t){ t.content=ta.value; if(!t.dirty){ t.dirty=true; renderTabs(); } } syncHL(); });
    ta.addEventListener('scroll',()=>{ hl.scrollTop=ta.scrollTop; hl.scrollLeft=ta.scrollLeft; gutter.scrollTop=ta.scrollTop; });
    ta.addEventListener('keydown',e=>{
      if(e.key==='Tab'){ e.preventDefault(); const s=ta.selectionStart, en=ta.selectionEnd; ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(en); ta.selectionStart=ta.selectionEnd=s+2; ta.dispatchEvent(new Event('input')); }
      if((e.metaKey||e.ctrlKey)&&e.key==='s'){ e.preventDefault(); save(); }
      if((e.metaKey||e.ctrlKey)&&e.key==='f'){ e.preventDefault(); findbar.classList.add('on'); fInput.focus(); }
    });
    saveBtn.onclick=save; newBtn.onclick=newFile; findBtn.onclick=()=>{ findbar.classList.toggle('on'); if(findbar.classList.contains('on')) fInput.focus(); };
    openBtn.onclick=()=>{ const p=prompt('Open path:', '/Users/User/Documents/readme.md'); if(p) openFile(FS._norm(p)); };
    fClose.onclick=()=>findbar.classList.remove('on');
    fNext.onclick=()=>{ const q=fInput.value; if(!q) return; const from=ta.selectionEnd; let idx=ta.value.indexOf(q, from); if(idx<0) idx=ta.value.indexOf(q,0); if(idx>=0){ ta.focus(); ta.setSelectionRange(idx, idx+q.length); } };
    fRep.onclick=()=>{ const q=fInput.value; if(ta.value.substring(ta.selectionStart,ta.selectionEnd)===q){ const s=ta.selectionStart; ta.setRangeText(rInput.value, s, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); } fNext.onclick(); };
    fAll.onclick=()=>{ const q=fInput.value; if(!q) return; ta.value=ta.value.split(q).join(rInput.value); ta.dispatchEvent(new Event('input')); };
    newFile();
    return { onArg:(p)=>{ if(p) openFile(FS._norm(p)); },
      menus:{ File:[ {label:'New',sc:'⌘N',do:newFile},{label:'Open…',sc:'⌘O',do:openBtn.onclick},{label:'Save',sc:'⌘S',do:save},{type:'sep'},{label:'Close Tab',sc:'⌘W',do:()=>closeTab(active)} ],
              Edit:[ {label:'Find…',sc:'⌘F',do:()=>{findbar.classList.add('on');fInput.focus();}},{label:'Select All',sc:'⌘A',do:()=>ta.select()} ] } };
  }
});

/* ------------------------------- System export / import ------------------------------- */
function exportSystem(){
  return { webos:'1.0', exportedAt:nowISO(), state:State.all(), filesystem:FS.export() };
}
function importSystem(obj){
  if(!obj || obj.webos===undefined) throw new Error('Not a webOS backup file');
  if(obj.state) State.replace(obj.state);
  if(obj.filesystem) FS.import(obj.filesystem);
  applyTheme(); applyWallpaper();
}
function downloadJSON(name, obj){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const a=el('a',{href:URL.createObjectURL(blob),download:name}); document.body.appendChild(a); a.click(); a.remove();
}

registerApp({
  id:'taskmgr', name:'Task Manager', icon:'📊', iconClass:'g-task', singleton:true, width:560, height:460, minWidth:420, minHeight:300,
  about:'Live process list with memory, CPU-ish activity graph and kill buttons.',
  mount(root, ctx){
    const wrap=el('div',{class:'taskmgr'});
    const graph=el('div',{class:'graph'},[el('div',{class:'glabel',id:'tm-lbl',text:'Activity'})]);
    const canvas=el('canvas'); graph.appendChild(canvas);
    const tbodyWrap=el('div',{class:'tbody-wrap'});
    const table=el('table',{html:'<thead><tr><th>PID</th><th>Process</th><th>Memory</th><th>Time</th><th></th></tr></thead>'});
    const tbody=el('tbody'); table.appendChild(tbody); tbodyWrap.appendChild(table);
    wrap.append(graph,tbodyWrap); root.appendChild(wrap);
    const samples=new Array(80).fill(0);
    function renderTable(){
      tbody.innerHTML='';
      Proc.all().sort((a,b)=>a.pid-b.pid).forEach(p=>{
        const memLive=p.memBase + p.windows.size*3 + Math.sin(Date.now()/900+p.pid)*1.5;
        const tr=el('tr',{},[
          el('td',{text:p.pid}),
          el('td',{text:p.name}),
          el('td',{text:memLive.toFixed(1)+' MB'}),
          el('td',{text:Math.floor((Date.now()-p.startedAt)/1000)+'s'}),
          el('td',{})
        ]);
        const kill=el('button',{class:'kill',text:'Quit',onclick:()=>{ Proc.kill(p.pid); renderTable(); }});
        tr.lastChild.appendChild(kill); tbody.appendChild(tr);
      });
      if(!Proc.all().length) tbody.appendChild(el('tr',{},el('td',{colspan:'5',style:'text-align:center;color:var(--text-faint);padding:24px',text:'No running processes'})));
    }
    function draw(){
      const dpr=Math.min(devicePixelRatio||1,2); const w=canvas.clientWidth,h=canvas.clientHeight;
      canvas.width=w*dpr; canvas.height=h*dpr; const c=canvas.getContext('2d'); c.scale(dpr,dpr);
      const load = Math.min(1, (Proc.all().reduce((s,p)=>s+p.memBase+p.windows.size*3,0))/220 + Math.random()*0.06);
      samples.push(load); samples.shift();
      c.clearRect(0,0,w,h);
      const acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#0a84ff';
      c.beginPath(); c.moveTo(0,h);
      samples.forEach((s,i)=>{ const x=i/(samples.length-1)*w; const y=h-s*(h-8)-4; c.lineTo(x,y); });
      c.lineTo(w,h); c.closePath();
      const grad=c.createLinearGradient(0,0,0,h); grad.addColorStop(0,acc+'88'); grad.addColorStop(1,acc+'08'); c.fillStyle=grad; c.fill();
      c.beginPath(); samples.forEach((s,i)=>{ const x=i/(samples.length-1)*w; const y=h-s*(h-8)-4; i?c.lineTo(x,y):c.moveTo(x,y); }); c.strokeStyle=acc; c.lineWidth=1.5; c.stroke();
      const mem=(performance&&performance.memory)?fmtBytes(performance.memory.usedJSHeapSize):'—';
      $('#tm-lbl',graph).textContent='CPU '+Math.round(load*100)+'%   •   JS Heap '+mem+'   •   '+Proc.all().length+' processes';
    }
    renderTable(); draw();
    const t1=setInterval(()=>{ draw(); },700);
    const t2=setInterval(renderTable, 1500);
    const off=Bus.on('proc:change', renderTable);
    return { onClose:()=>{ clearInterval(t1); clearInterval(t2); off(); return true; } };
  }
});

/* ------------------------------- Calculator (recursive-descent parser) ------------------------------- */
function evalExpr(src){
  let i=0; const s=src.replace(/\s+/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  function peek(){ return s[i]; }
  function number(){
    let start=i;
    if(s[i]==='('){ i++; const v=expr(); if(s[i]===')') i++; return v; }
    if(s[i]==='-'){ i++; return -factor(); }
    while(i<s.length && /[0-9.]/.test(s[i])) i++;
    if(start===i) throw new Error('parse');
    return parseFloat(s.slice(start,i));
  }
  function factor(){ let v=number(); while(s[i]==='^'){ i++; v=Math.pow(v, factor()); } return v; }
  function term(){ let v=factor(); while(s[i]==='*'||s[i]==='/'||s[i]==='%'){ const op=s[i++]; const r=factor(); v= op==='*'?v*r: op==='/'?v/r: v%r; } return v; }
  function expr(){ let v=term(); while(s[i]==='+'||s[i]==='-'){ const op=s[i++]; const r=term(); v= op==='+'?v+r:v-r; } return v; }
  const result=expr(); if(i<s.length) throw new Error('unexpected '+s[i]); return result;
}
registerApp({
  id:'calculator', name:'Calculator', icon:'🖩', iconClass:'g-calc', singleton:true, width:280, height:420, minWidth:240, minHeight:360,
  about:'A calculator with a real recursive-descent expression parser (operator precedence, parentheses, power) — never eval.',
  mount(root, ctx){
    const wrap=el('div',{class:'calc'});
    const disp=el('div',{class:'disp'}); const exprEl=el('div',{class:'expr'}); const resEl=el('div',{class:'res',text:'0'});
    disp.append(exprEl,resEl);
    const keys=el('div',{class:'keys'}); wrap.append(disp,keys); root.appendChild(wrap);
    let cur='';
    const LAYOUT=[['AC','fn'],['( )','fn'],['%','fn'],['÷','op'],['7',''],['8',''],['9',''],['×','op'],['4',''],['5',''],['6',''],['−','op'],['1',''],['2',''],['3',''],['+','op'],['0','wide'],['.',''],['=','op']];
    function update(){ exprEl.textContent=cur; try{ resEl.textContent = cur? formatNum(evalExpr(cur)) : '0'; }catch(e){ resEl.textContent = cur||'0'; } }
    function formatNum(n){ if(!isFinite(n)) return 'Error'; return (Math.round(n*1e10)/1e10).toString(); }
    function press(k){
      if(k==='AC'){ cur=''; }
      else if(k==='='){ try{ cur=formatNum(evalExpr(cur)); }catch(e){ resEl.textContent='Error'; return; } }
      else if(k==='( )'){ const opens=(cur.match(/\(/g)||[]).length, closes=(cur.match(/\)/g)||[]).length; cur += (opens>closes && /[0-9)]/.test(cur.slice(-1)))?')':'('; }
      else cur+=k;
      update();
    }
    LAYOUT.forEach(([k,cls])=>{ keys.appendChild(el('button',{class:cls,text:k,onclick:()=>press(k)})); });
    root.tabIndex=0; root.addEventListener('keydown',e=>{
      const map={'*':'×','/':'÷','-':'−'};
      if(/[0-9.+%^()]/.test(e.key)) press(e.key);
      else if(map[e.key]) press(map[e.key]);
      else if(e.key==='Enter'||e.key==='=') press('=');
      else if(e.key==='Backspace'){ cur=cur.slice(0,-1); update(); }
      else if(e.key==='Escape') press('AC');
    });
    update();
    return {};
  }
});

/* ------------------------------- Notes ------------------------------- */
function mdToHTML(md){
  let h=esc(md);
  h=h.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
  h=h.replace(/^&gt; (.*)$/gm,'<blockquote>$1</blockquote>');
  h=h.replace(/```([\s\S]*?)```/g,(m,c)=>'<pre><code>'+c+'</code></pre>');
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>');
  h=h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  h=h.replace(/^\s*[-*] (.*)$/gm,'<li>$1</li>').replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>');
  h=h.split(/\n{2,}/).map(b=> /^\s*<(h\d|ul|pre|blockquote|li)/.test(b.trim())? b : (b.trim()?'<p>'+b.replace(/\n/g,'<br>')+'</p>':'')).join('\n');
  return h;
}

          el('div',{class:'npv',text:(n.body||'').replace(/[#*`>]/g,'').slice(0,40)})
        ]));
      });
      if(!notes.length) nitems.appendChild(el('div',{class:'center-msg',text:'No notes yet'}));
    }
    function cur(){ return notes.find(n=>n.id===active); }
    function load(){ const n=cur(); if(!n){ titleIn.value=''; edit.value=''; preview.innerHTML=''; return; } titleIn.value=n.title; edit.value=n.body; preview.innerHTML=mdToHTML(n.body); }
    addBtn.onclick=()=>{ const n={id:uid(),title:'New Note',body:'# New Note\n\n',created:Date.now()}; notes.unshift(n); active=n.id; save(); renderList(); load(); titleIn.focus(); };
    delBtn.onclick=()=>{ if(!active) return; notes=notes.filter(n=>n.id!==active); active=notes[0]?.id||null; save(); renderList(); load(); };
    edit.addEventListener('input',()=>{ const n=cur(); if(n){ n.body=edit.value; preview.innerHTML=mdToHTML(n.body); save(); renderList(); } });
    titleIn.addEventListener('input',()=>{ const n=cur(); if(n){ n.title=titleIn.value; save(); renderList(); } });
    search.addEventListener('input',renderList);
    if(notes.length){ active=notes[0].id; } renderList(); load();
    return { onClose:()=>{ State.set('notes',notes); return true; } };
  }
});

  mount(root, ctx){

    }
    return { onArg:(p)=>{ if(p) open(FS._norm(p)); } };

registerApp({
  id:'egg', name:'Hyperspace', icon:'🚀', iconClass:'g-egg', width:520, height:400, minWidth:280, minHeight:220,
  about:'You found it. Warp speed, engage. (Move the mouse to steer.)',
  mount(root, ctx){
    const cont=el('div',{class:'egg'}); const canvas=el('canvas'); cont.appendChild(canvas);
    cont.appendChild(el('div',{class:'egg-msg',text:'“Made entirely of HTML, CSS & JavaScript. Thanks for exploring.” — press any key for a boost'}));
    root.appendChild(cont);
    let stars=[], W,H,cx,cy, speed=1, raf;
    function resize(){ W=canvas.width=canvas.clientWidth; H=canvas.height=canvas.clientHeight; cx=W/2; cy=H/2; }
    function seed(){ stars=Array.from({length:320},()=>({x:(Math.random()-.5)*W,y:(Math.random()-.5)*H,z:Math.random()*W})); }
    const c=canvas.getContext('2d');
    function loop(){ c.fillStyle='rgba(5,1,15,.35)'; c.fillRect(0,0,W,H);
      for(const s of stars){ s.z-=4*speed; if(s.z<=0){ s.z=W; s.x=(Math.random()-.5)*W; s.y=(Math.random()-.5)*H; }
        const k=128/s.z, px=cx+s.x*k+(cx-cx), py=cy+s.y*k; const pz=128/(s.z+4*speed); const ox=cx+s.x*pz, oy=cy+s.y*pz;
        const r=(1-s.z/W)*2.4; const hue=200+ (1-s.z/W)*120;
        c.strokeStyle=`hsl(${hue},90%,${60+(1-s.z/W)*30}%)`; c.lineWidth=r; c.beginPath(); c.moveTo(ox,oy); c.lineTo(px,py); c.stroke();
      }
      speed+= (1-speed)*0.05; raf=requestAnimationFrame(loop);
    }
    cont.addEventListener('pointermove',e=>{ const r=cont.getBoundingClientRect(); cx=e.clientX-r.left; cy=e.clientY-r.top; });
    root.tabIndex=0; root.addEventListener('keydown',()=>{ speed=8; });
    setTimeout(()=>{ resize(); seed(); loop(); },30);
    const ro=new ResizeObserver(()=>{ resize(); seed(); }); ro.observe(cont);
    return { onClose:()=>{ cancelAnimationFrame(raf); ro.disconnect(); return true; } };
  }
});

    ]);

/* ---- global keyboard ---- */
function initKeyboard(){
  // Belt-and-braces: never let a focus-driven "scroll into view" move the desktop.
  // With #desktop-root / #windows-layer clipped this should never fire, but if any
  // structural container is ever scrolled, snap it back to origin. App content areas
  // (terminal, editor, finder, etc.) are left untouched so they scroll normally.
  const STRUCT = new Set(['desktop-root','windows-layer','win-spaces-row']);
  const resetScroll = t => { if(!t) return; if(t===document.scrollingElement||t===document.documentElement||t===document.body||(t.id&&STRUCT.has(t.id))){ if(t.scrollLeft) t.scrollLeft=0; if(t.scrollTop) t.scrollTop=0; } };
  window.addEventListener('scroll', e=>{ resetScroll(e.target===document?document.scrollingElement:e.target); resetScroll(document.scrollingElement); }, true);
  document.addEventListener('focusin', ()=>{ resetScroll(document.scrollingElement); const dr=$('#desktop-root'), wl=$('#windows-layer'); resetScroll(dr); resetScroll(wl); }, true);
  let konami=[], KON=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
  window.addEventListener('keydown', e=>{
    const cmd=e.metaKey||e.ctrlKey;
    // konami
    konami.push(e.key); if(konami.length>KON.length) konami.shift();
    if(KON.every((k,i)=>konami[i]===k)){ konami=[]; launchApp('egg'); Notify.push('🎉 Cheat unlocked','Warp drive online','🚀'); return; }

    if(cmd && e.code==='Space'){ e.preventDefault(); Spotlight.toggle(); return; }
    if(e.key==='Escape'){ Spotlight.hide(); if(Mission.isOn()) Mission.hide(); Menus.closeDropdown(); Ctx.close(); return; }
    // app switcher
    if(e.key==='Tab' && (e.altKey||e.ctrlKey||e.metaKey)){ e.preventDefault(); Switcher.start(e.shiftKey); return; }
    if(e.key==='F3'){ e.preventDefault(); Mission.toggle(); return; }
    // space switching
    if(e.ctrlKey && e.key==='ArrowRight'){ e.preventDefault(); WM.gotoSpace(State.get('currentSpace')+1); return; }
    if(e.ctrlKey && e.key==='ArrowLeft'){ e.preventDefault(); WM.gotoSpace(State.get('currentSpace')-1); return; }
    if(Switcher.isActive() && e.key==='Tab'){ e.preventDefault(); Switcher.cycle(e.shiftKey); return; }

    const inField = e.target && (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.isContentEditable);
    if(cmd && e.key.toLowerCase()==='w'){ if(inField && e.target.closest('.window .content')) {} const a=WM.getActive(); if(a){ e.preventDefault(); WM.close(a.id); } return; }
    if(cmd && e.key.toLowerCase()==='q'){ const a=WM.getActive(); if(a){ e.preventDefault(); WM.close(a.id); } return; }
    if(cmd && e.key.toLowerCase()==='m'){ const a=WM.getActive(); if(a){ e.preventDefault(); WM.minimize(a.id); } return; }
    if(cmd && e.key===','){ e.preventDefault(); launchApp('settings'); return; }
    if(cmd && e.key.toLowerCase()==='n' && !inField){ e.preventDefault(); const a=WM.getActive(); if(a) launchApp(a.appId); return; }
  });
  window.addEventListener('keyup', e=>{ if(Switcher.isActive() && (e.key==='Meta'||e.key==='Control'||e.key==='Alt')) Switcher.commit(); });
}

/* ---- boot & init ---- */
function boot(){
  const bar=$('#boot-bar'), msg=$('#boot-msg'), scr=$('#boot');
  const steps=[[0,'Loading kernel…'],[20,'Mounting filesystem…'],[45,'Starting window server…'],[65,'Launching services…'],[85,'Preparing desktop…'],[100,'Welcome']];
  let i=0, done=false;
  function finish(){ if(done) return; done=true; scr.style.transition='opacity .5s'; scr.style.opacity='0'; setTimeout(()=>{ scr.style.display='none'; if(State.get('firstBoot')){ Lock.lock(); State.set('firstBoot',false); } },500); }
  scr.addEventListener('click', finish);
  const iv=setInterval(()=>{ if(i>=steps.length){ clearInterval(iv); finish(); return; } const [p,m]=steps[i++]; bar.style.width=p+'%'; msg.textContent=m; },320);
}

async function init(){
  applyTheme();
  const storage = await FS.init();
  // restore installed external apps
  (State.get('installedExternal')||[]).forEach(a=>{ const cat=STORE_CATALOG.find(c=>c.id===a.id); if(cat) registerExternalApp(cat); });
  WM.ensureSpaces();
  applyWallpaper();
  Dock.build();
  Menus.init(); Menus.setApp(null);
  initStatus(); initDesktopMenu(); initKeyboard();
  renderDesktopIcons(); Notify.render();
  window.addEventListener('resize', debounce(()=>{ applyWallpaper(); WM.layoutSpaces(); }, 120));
  Bus.on('proc:change', ()=>Dock.update());
  Bus.on('wm:change', ()=>Dock.build());
  Bus.emit('boot:done');
  boot();
  // gentle welcome
  setTimeout(()=>Notify.push('webOS', 'Filesystem mounted on '+storage+'. Press ⌘Space to search.', ''), 2400);
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
